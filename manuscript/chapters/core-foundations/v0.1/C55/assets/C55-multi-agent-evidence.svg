<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">图 55-4 分工结果按原始目标合并</title><desc id="desc">协调者按同一任务契约将接口、性能、发布三个只读核查交给独立分支。每个分支返回证据、版本和缺口。合并者去重、处理冲突并核对验收条件，再形成有依据的交付，不能仅按返回数量判断完成。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#496d87"/></marker></defs><rect width="1000" height="630" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#131313"><text x="40" y="45" font-size="28" font-weight="bold">分支完成不自动等于总任务完成</text><g stroke="#657c8d" stroke-width="1.5" fill="#e7eff5"><rect x="285" y="80" width="430" height="70" rx="5"/><rect x="45" y="233" width="265" height="99" rx="5"/><rect x="368" y="233" width="265" height="99" rx="5"/><rect x="690" y="233" width="265" height="99" rx="5"/><rect x="180" y="420" width="640" height="90" rx="5"/></g><g font-size="23" text-anchor="middle"><text x="500" y="123">原始目标 范围 版本与验收条件</text><text x="177" y="273">接口核查</text><text x="177" y="307" font-size="20">来源 版本 结论与缺口</text><text x="500" y="273">性能核查</text><text x="500" y="307" font-size="20">来源 版本 结论与缺口</text><text x="822" y="273">发布核查</text><text x="822" y="307" font-size="20">来源 版本 结论与缺口</text><text x="500" y="457">合并 去重 核对冲突</text><text x="500" y="491" font-size="21">逐项对照原始验收条件 保留未确认事项</text></g><g stroke="#496d87" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M380 151L177 226"/><path d="M500 151V226"/><path d="M620 151L822 226"/><path d="M177 333L330 413"/><path d="M500 333V413"/><path d="M822 333L670 413"/></g><text x="40" y="568" font-size="22">重复引用同一来源不构成独立证据；外部动作仍需统一效果核查</text><text x="40" y="608" font-size="20">原创只读核查示意，不表示运行过的产品架构或测量结果</text></g></svg>
