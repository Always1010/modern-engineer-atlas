<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">图 5-3 伪共享与 NUMA 路径</title><desc id="desc">上半图表示线程 A 与 B 修改同一缓存行内的不同计数。下半图表示节点 0 的核心访问本地内存与节点 1 的远端内存经过不同路径。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426986"/></marker></defs><rect width="1000" height="720" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#171717"><text x="40" y="45" font-size="28" font-weight="bold">两种成本 需要分别定位</text><text x="40" y="96" font-size="23" font-weight="bold">伪共享  不同字段落在同一行</text><g stroke="#607284" stroke-width="1.5"><rect x="80" y="126" width="215" height="63" fill="#e6eef5"/><rect x="705" y="126" width="215" height="63" fill="#e6eef5"/><rect x="265" y="255" width="470" height="69" fill="#f2f4f6"/><path d="M500 255V324"/><path d="M190 190L370 254" stroke="#426986" stroke-width="3" marker-end="url(#arr)"/><path d="M812 190L630 254" stroke="#426986" stroke-width="3" marker-end="url(#arr)"/></g><g font-size="23" text-anchor="middle"><text x="187" y="167">线程 A</text><text x="812" y="167">线程 B</text><text x="382" y="299">计数 A</text><text x="617" y="299">计数 B</text><text x="500" y="224">写入各自字段</text><text x="500" y="360" font-size="21">一致性按整条行协调；安全的独立变量也可能有共同成本</text></g><path d="M40 391H960" stroke="#ccd3db"/><text x="40" y="432" font-size="23" font-weight="bold">NUMA  数据位置影响访存路径</text><g stroke="#607284" stroke-width="1.5"><rect x="60" y="458" width="365" height="160" rx="7" fill="#f2f5f7"/><rect x="575" y="458" width="365" height="160" rx="7" fill="#f2f5f7"/><rect x="85" y="516" width="120" height="54" fill="#e6eef5"/></g><g font-size="22" text-anchor="middle"><text x="242" y="493">节点 0</text><text x="757" y="493">节点 1</text><text x="140" y="555">核心</text><text x="337" y="555">本地内存</text><text x="760" y="555">远端内存</text></g><g stroke="#426986" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M192 547H276"/><path d="M142 577V596H762V578"/></g><text x="206" y="532" font-size="18">本地路径</text><text x="468" y="585" font-size="18">跨节点路径</text><text x="40" y="666" font-size="21">固定线程位置与安排页面位置是两项不同约束</text></g></svg>
