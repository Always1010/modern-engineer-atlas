<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">图 5-1 流水线重叠与数据依赖</title><desc id="desc">三个独立操作在不同时间格进入三阶段流水线。另一个依赖链必须等前一操作提供结果后才能进行下一次计算。</desc><rect width="1000" height="530" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#151515"><text x="40" y="45" font-size="28" font-weight="bold">独立操作可以重叠 真实依赖仍需等待</text><text x="40" y="82" font-size="20">三阶段教学模型；每格一个示意时间单位，不对应真实 CPU 周期</text><g font-size="20" text-anchor="middle"><text x="235" y="133">时刻 1</text><text x="370" y="133">时刻 2</text><text x="505" y="133">时刻 3</text><text x="640" y="133">时刻 4</text><text x="775" y="133">时刻 5</text></g><g font-size="22"><text x="40" y="183">操作 A</text><text x="40" y="253">操作 B</text><text x="40" y="323">操作 C</text></g><g stroke="#607284" stroke-width="1.5"><path d="M168 146h134v52H168z M303 216h134v52H303z M438 286h134v52H438z" fill="#e5edf4"/><path d="M303 146h134v52H303z M438 216h134v52H438z M573 286h134v52H573z" fill="#c6dbec"/><path d="M438 146h134v52H438z M573 216h134v52H573z M708 286h134v52H708z" fill="#d6e9de"/></g><g font-size="22" text-anchor="middle"><text x="235" y="181">取入</text><text x="370" y="181">计算</text><text x="505" y="181">提交</text><text x="370" y="251">取入</text><text x="505" y="251">计算</text><text x="640" y="251">提交</text><text x="505" y="321">取入</text><text x="640" y="321">计算</text><text x="775" y="321">提交</text></g><path d="M40 365H960" stroke="#ccd3db"/><text x="40" y="412" font-size="23" font-weight="bold">真实依赖链</text><g font-size="22" text-anchor="middle"><rect x="235" y="382" width="160" height="50" rx="4" fill="#e5edf4"/><text x="315" y="415">得到 a</text><text x="435" y="415">→</text><rect x="475" y="382" width="160" height="50" rx="4" fill="#e5edf4"/><text x="555" y="415">用 a 算 b</text><text x="675" y="415">→</text><rect x="715" y="382" width="200" height="50" rx="4" fill="#e5edf4"/><text x="815" y="415">用 b 算 c</text></g><text x="40" y="481" font-size="22">更多执行单元不会自动消除前一步结果尚未产生的等待</text></g></svg>
