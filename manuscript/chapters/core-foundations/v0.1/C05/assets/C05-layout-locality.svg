<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">图 5-2 数据布局与访问模式</title><desc id="desc">结构数组按每条记录的 x y z 排列，数组结构按所有 x、所有 y、所有 z 排列。只读取 x 时，两种布局涉及的示意缓存行数不同。</desc><rect width="1000" height="500" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#171717"><text x="40" y="45" font-size="28" font-weight="bold">只扫描 x 字段时 有用数据的密度不同</text><text x="40" y="82" font-size="20">每三个字段为一条示意缓存行；仅表达布局，不是具体 ABI</text><text x="40" y="134" font-size="23" font-weight="bold">结构数组 AoS</text><g stroke="#5d7084" stroke-width="2"><rect x="40" y="154" width="210" height="64" fill="#f2f3f5"/><rect x="285" y="154" width="210" height="64" fill="#f2f3f5"/><rect x="530" y="154" width="210" height="64" fill="#f2f3f5"/><rect x="775" y="154" width="180" height="64" fill="#f2f3f5"/></g><g fill="#c6dff2"><rect x="41" y="155" width="68" height="62"/><rect x="286" y="155" width="68" height="62"/><rect x="531" y="155" width="68" height="62"/><rect x="776" y="155" width="59" height="62"/></g><g font-size="23" text-anchor="middle"><text x="75" y="195">x₀</text><text x="145" y="195">y₀</text><text x="215" y="195">z₀</text><text x="320" y="195">x₁</text><text x="390" y="195">y₁</text><text x="460" y="195">z₁</text><text x="565" y="195">x₂</text><text x="635" y="195">y₂</text><text x="705" y="195">z₂</text><text x="805" y="195">x₃</text><text x="865" y="195">y₃</text><text x="925" y="195">z₃</text></g><text x="40" y="256" font-size="21">访问整条记录方便；单列扫描会同时取入暂时不用的字段</text><text x="40" y="314" font-size="23" font-weight="bold">数组结构 SoA</text><g stroke="#5d7084" stroke-width="2"><rect x="40" y="334" width="210" height="64" fill="#c6dff2"/><rect x="285" y="334" width="210" height="64" fill="#f2f3f5"/><rect x="530" y="334" width="210" height="64" fill="#f2f3f5"/></g><g font-size="23" text-anchor="middle"><text x="75" y="375">x₀</text><text x="145" y="375">x₁</text><text x="215" y="375">x₂</text><text x="320" y="375">y₀</text><text x="390" y="375">y₁</text><text x="460" y="375">y₂</text><text x="565" y="375">z₀</text><text x="635" y="375">z₁</text><text x="705" y="375">z₂</text><text x="825" y="375">更多元素 …</text></g><text x="40" y="449" font-size="21">同一字段集中；更新完整对象、排序与关联维护仍有额外取舍</text></g></svg>
