<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">对象释放与页面归还是不同层次</title><desc id="desc">应用对象由分配器块承载，块来自操作系统映射，页面在访问时准备。对象释放后块可能被缓存，因此驻留页面不会必然减少。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">对象释放与页面归还是不同层次</text><rect x="45" y="120" width="330" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="210.0" y="155" text-anchor="middle" class="label">应用对象</text><text x="210.0" y="186" text-anchor="middle" class="small">元素、节点、缓冲区</text><rect x="435" y="120" width="330" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="600.0" y="155" text-anchor="middle" class="label">分配器中的块</text><text x="600.0" y="186" text-anchor="middle" class="small">尺寸等级、空闲缓存</text><rect x="825" y="120" width="330" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="990.0" y="155" text-anchor="middle" class="label">操作系统映射</text><text x="990.0" y="186" text-anchor="middle" class="small">连续虚拟地址范围</text><path class="arrow" d="M375 165 H435"/><path class="arrow" d="M765 165 H825"/><rect x="825" y="325" width="330" height="95" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="990.0" y="360" text-anchor="middle" class="label">物理页面</text><text x="990.0" y="391" text-anchor="middle" class="small">触碰后分配或装入</text><path class="arrow" d="M990 210 V325"/><text class="small" x="1005" y="273">实际访问</text><rect x="45" y="325" width="330" height="95" rx="12" fill="#fff0e8" stroke="#7a98ac" stroke-width="2"/><text x="210.0" y="360" text-anchor="middle" class="label">对象释放</text><text x="210.0" y="391" text-anchor="middle" class="small">生命周期结束</text><rect x="435" y="325" width="330" height="95" rx="12" fill="#fff0e8" stroke="#7a98ac" stroke-width="2"/><text x="600.0" y="360" text-anchor="middle" class="label">块回到分配器</text><text x="600.0" y="391" text-anchor="middle" class="small">可能继续保留复用</text><path class="arrow" d="M210 210 V325"/><path class="arrow" d="M375 373 H435"/><path d="M765 373 H810" stroke="#486477" stroke-width="3" stroke-dasharray="7 6"/><text class="small" x="45" y="495">释放一个对象，不要求撤销所在页面</text><text class="small" x="45" y="536">整页仍有活对象、线程缓存或碎片时，RSS 可以保持不变</text><text class="small" x="45" y="577">诊断需分开：活跃对象量、分配器保留量、映射量、驻留量</text></svg>