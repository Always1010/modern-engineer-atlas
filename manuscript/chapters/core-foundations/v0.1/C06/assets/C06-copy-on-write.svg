<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">写时复制把私有化成本推迟到写入</title><desc id="desc">左侧父子进程的只读映射指向同一物理页，右侧子进程写入触发分离，父进程仍引用原页，子进程引用修改后的私有副本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">写时复制把私有化成本推迟到写入</text><text class="label" x="60" y="120">写入之前</text><text class="label" x="660" y="120">子进程写入之后</text><rect x="45" y="160" width="200" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="145.0" y="195" text-anchor="middle" class="label">父进程映射</text><text x="145.0" y="226" text-anchor="middle" class="small">只读状态</text><rect x="45" y="370" width="200" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="145.0" y="405" text-anchor="middle" class="label">子进程映射</text><text x="145.0" y="436" text-anchor="middle" class="small">只读状态</text><rect x="350" y="265" width="200" height="95" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="450.0" y="300" text-anchor="middle" class="label">共享页面</text><text x="450.0" y="331" text-anchor="middle" class="small">原内容 A</text><path class="arrow" d="M245 205 H295 V295 H350"/><path class="arrow" d="M245 415 H295 V330 H350"/><rect x="660" y="160" width="210" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="765.0" y="195" text-anchor="middle" class="label">父进程映射</text><text x="765.0" y="226" text-anchor="middle" class="small">仍见原内容</text><rect x="945" y="160" width="210" height="90" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="1050.0" y="195" text-anchor="middle" class="label">原页面</text><text x="1050.0" y="226" text-anchor="middle" class="small">内容 A</text><rect x="660" y="370" width="210" height="90" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="765.0" y="405" text-anchor="middle" class="label">子进程映射</text><text x="765.0" y="436" text-anchor="middle" class="small">私有可写</text><rect x="945" y="370" width="210" height="90" rx="12" fill="#fff0e8" stroke="#7a98ac" stroke-width="2"/><text x="1050.0" y="405" text-anchor="middle" class="label">私有副本</text><text x="1050.0" y="436" text-anchor="middle" class="small">修改后内容 B</text><path class="arrow" d="M870 205 H945"/><path class="arrow" d="M870 415 H945"/><path d="M600 120 V485" stroke="#aac0cc" stroke-width="2" stroke-dasharray="8 6"/><text class="small" x="55" y="550">典型路径：写入受控异常 → 准备私有副本 → 更新映射 → 重试写入</text><text class="small" x="55" y="584">共享的是底层页面；父子进程仍拥有不同地址空间</text></svg>