<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">地址转换与缺页处理</title><desc id="desc">程序虚拟地址先查转换缓存；未命中后查页表。有效转换进入物理地址访问，异常条件由内核区分可恢复与不可完成。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">地址转换与缺页处理</text><rect x="45" y="115" width="220" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="155.0" y="150" text-anchor="middle" class="label">虚拟地址</text><text x="155.0" y="181" text-anchor="middle" class="small">当前地址空间</text><rect x="340" y="115" width="210" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="445.0" y="150" text-anchor="middle" class="label">TLB 查询</text><text x="445.0" y="181" text-anchor="middle" class="small">转换与权限</text><rect x="650" y="115" width="210" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="755.0" y="150" text-anchor="middle" class="label">物理地址</text><text x="755.0" y="181" text-anchor="middle" class="small">页框 ＋ 偏移</text><rect x="945" y="115" width="210" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="1050.0" y="150" text-anchor="middle" class="label">访问数据</text><text x="1050.0" y="181" text-anchor="middle" class="small">缓存或内存</text><path class="arrow" d="M265 167 H340"/><path class="arrow" d="M550 167 H650"/><text class="small" x="573" y="151">命中</text><path class="arrow" d="M860 167 H945"/><rect x="340" y="325" width="260" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="470.0" y="360" text-anchor="middle" class="label">查找页表</text><text x="470.0" y="391" text-anchor="middle" class="small">有效映射可直接继续</text><path class="arrow" d="M445 220 V325"/><text class="small" x="461" y="274">未命中</text><path class="arrow" d="M600 377 H755 V220"/><text class="small" x="625" y="360">找到转换</text><rect x="45" y="485" width="350" height="90" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="220.0" y="520" text-anchor="middle" class="label">可恢复的缺页</text><text x="220.0" y="551" text-anchor="middle" class="small">分配、装入或写时复制</text><rect x="730" y="485" width="420" height="90" rx="12" fill="#fff0e8" stroke="#7a98ac" stroke-width="2"/><text x="940.0" y="520" text-anchor="middle" class="label">不能完成的访问</text><text x="940.0" y="551" text-anchor="middle" class="small">按操作系统规则交付故障</text><path class="arrow" d="M415 430 V459 H225 V485"/><path class="arrow" d="M530 430 V459 H940 V485"/><text class="small" x="45" y="278">TLB 未命中 ≠ 页面缺失</text><text class="small" x="45" y="308">页面有效 ≠ C++ 对象有效</text></svg>