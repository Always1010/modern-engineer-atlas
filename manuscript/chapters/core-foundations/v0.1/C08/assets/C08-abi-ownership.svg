<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">二进制入口同时约定表示与所有权</title><desc id="desc">调用方通过带版本、长度和状态码的准确ABI使用库。内部对象通过不透明句柄引用，由原库提供配对销毁，借用缓冲区须在调用期间有效。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">二进制入口同时约定表示与所有权</text><rect x="45" y="140" width="300" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="195.0" y="175" text-anchor="middle" class="label">调用方</text><text x="195.0" y="206" text-anchor="middle" class="small">提供输入与输出缓冲区</text><text x="195.0" y="237" text-anchor="middle" class="small">维持借用期间有效</text><rect x="445" y="140" width="310" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="600.0" y="175" text-anchor="middle" class="label">稳定 ABI 入口</text><text x="600.0" y="206" text-anchor="middle" class="small">版本、长度、状态码</text><text x="600.0" y="237" text-anchor="middle" class="small">准确的调用约定</text><rect x="845" y="140" width="310" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="1000.0" y="175" text-anchor="middle" class="label">库内部</text><text x="1000.0" y="206" text-anchor="middle" class="small">私有对象和实现布局</text><text x="1000.0" y="237" text-anchor="middle" class="small">边界内转换异常</text><path class="arrow" d="M345 197 H445"/><path class="arrow" d="M755 197 H845"/><rect x="45" y="365" width="300" height="95" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="195.0" y="400" text-anchor="middle" class="label">使用不透明句柄</text><text x="195.0" y="431" text-anchor="middle" class="small">不能猜测内部结构</text><rect x="845" y="365" width="310" height="95" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="1000.0" y="400" text-anchor="middle" class="label">创建并拥有对象</text><text x="1000.0" y="431" text-anchor="middle" class="small">提供配对销毁入口</text><path class="arrow" d="M845 407 H345"/><text class="small" x="507" y="390">返回有效句柄</text><path class="arrow" d="M195 460 V520 H1000 V460"/><text class="small" x="420" y="508">使用结束后调用原库的销毁函数</text><text class="small" x="45" y="586">缓冲区、句柄、回调、在途调用全部结束后，才讨论卸载库</text></svg>