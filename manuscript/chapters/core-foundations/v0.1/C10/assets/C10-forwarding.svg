<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 10-2 完美转发依赖推导结果</title><desc id="desc">左值实参推导为左值引用，右值实参推导为非引用类型；参数名都是左值，forward按T转交。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 10-2 完美转发依赖推导结果</text><text x="40" y="104" font-size="20">调用方表达式</text><text x="405" y="104" font-size="20">模板推导与引用折叠</text><text x="845" y="104" font-size="20">向目标转交</text><rect x="40" y="135" width="250" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="165.0" y="167" text-anchor="middle" font-size="21">int n = 7;</text><text x="165.0" y="197" text-anchor="middle" font-size="21">relay(n)</text><rect x="385" y="135" width="355" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="562.5" y="167" text-anchor="middle" font-size="21">T = int&amp;</text><text x="562.5" y="197" text-anchor="middle" font-size="21">T&amp;&amp; 折叠为 int&amp;</text><rect x="835" y="135" width="280" height="100" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="975.0" y="167" text-anchor="middle" font-size="21">forward&lt;T&gt;(value)</text><text x="975.0" y="197" text-anchor="middle" font-size="21">结果为左值</text><path d="M290 185 L380 185" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 185 L830 185" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="295" width="250" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="165.0" y="327" text-anchor="middle" font-size="21">临时整数</text><text x="165.0" y="357" text-anchor="middle" font-size="21">relay(7)</text><rect x="385" y="295" width="355" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="562.5" y="327" text-anchor="middle" font-size="21">T = int</text><text x="562.5" y="357" text-anchor="middle" font-size="21">T&amp;&amp; 为 int&amp;&amp;</text><rect x="835" y="295" width="280" height="100" rx="12" fill="#fff1dc" stroke="#8296aa"/><text x="975.0" y="327" text-anchor="middle" font-size="21">forward&lt;T&gt;(value)</text><text x="975.0" y="357" text-anchor="middle" font-size="21">结果为右值</text><path d="M290 345 L380 345" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 345 L830 345" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="90" y="464" font-size="20">两条路径中，参数名字 value 本身都是左值表达式</text><text x="90" y="507" font-size="20">forward 保留传递意图，不保活对象，也不保证目标实际移动</text></g></svg>