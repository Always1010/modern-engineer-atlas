<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">图 13-1 vector 的使用关系</title><desc id="desc">vector 是可变长度的序列容器。图从其他容器选择、使用者操作、容器管理连续存储、访问形式和修改后果组织知识；已有元素与预留空间有别，复制与借用有别。不是实现布局图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42596a"/></marker></defs><rect width="1000" height="455" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="18" y="36" font-size="26" font-weight="bold">图 13-1  vector 的使用关系</text><text x="18" y="78" font-size="20">编译期定长可看 array；长度可变、按位置组织可看 vector；按键组织可看关联容器。</text><rect x="18" y="115" width="240" height="126" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="138" y="151" font-size="24" text-anchor="middle" font-weight="bold">使用者的操作</text><text x="138" y="190" font-size="22" text-anchor="middle">按位置读取  遍历</text><text x="138" y="223" font-size="22" text-anchor="middle">追加  插入  删除</text><rect x="329" y="109" width="353" height="138" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="505" y="145" font-size="26" text-anchor="middle" font-weight="bold">vector</text><text x="505" y="181" font-size="23" text-anchor="middle">管理一段连续存储</text><text x="505" y="219" font-size="22" text-anchor="middle">已有元素  ＋  预留空间</text><path d="M260 177H321" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="753" y="115" width="229" height="126" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="867" y="151" font-size="24" text-anchor="middle" font-weight="bold">访问元素的方式</text><text x="867" y="190" font-size="21" text-anchor="middle">复制  得到独立值</text><text x="867" y="223" font-size="21" text-anchor="middle">借用  仍依赖原元素</text><path d="M684 177H746" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><path d="M505 249V283" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="289" y="290" width="433" height="60" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="505" y="329" font-size="22" text-anchor="middle">修改可能改变数量 顺序 存储位置</text><path d="M289 321H138V370" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><path d="M724 321H867V370" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="377" width="430" height="58" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="233" y="414" font-size="23" text-anchor="middle">有效期  原来的访问还能否使用</text><rect x="552" y="377" width="430" height="58" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="767" y="414" font-size="23" text-anchor="middle">成本  创建 迁移 遍历与占用空间</text></g></svg>