<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">图 13-4 PMR 资源关系与退出顺序</title><desc id="desc">容器经多态分配器向资源申请存储。资源首先使用已有缓冲区，需要时请求上游。退出时先销毁依赖存储的容器及对象，再释放资源，最后结束缓冲区生命。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45677e"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#141414"><text x="40" y="45" font-size="28" font-weight="bold">资源提供存储 容器管理其中的对象</text><g stroke="#677b8d" stroke-width="1.5" fill="#e7eff5"><rect x="40" y="91" width="260" height="86" rx="4"/><rect x="395" y="91" width="265" height="86" rx="4"/><rect x="395" y="258" width="265" height="75" rx="4"/><rect x="755" y="258" width="210" height="75" rx="4"/></g><g font-size="22" text-anchor="middle"><text x="170" y="127">pmr::vector</text><text x="170" y="159">经多态分配器请求</text><text x="527" y="127">内存资源 arena</text><text x="527" y="159">取得和归还字节</text><text x="527" y="305">已有缓冲区</text><text x="860" y="305">上游资源</text></g><g stroke="#45677e" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M301 134H389"/><path d="M527 178V252"/><path d="M663 133H860V252"/></g><text x="548" y="218" font-size="20">优先使用</text><text x="754" y="215" font-size="20">必要时请求</text><text x="40" y="380" font-size="21">null_memory_resource 作为上游时，无法满足的分配会失败</text><path d="M40 416H965" stroke="#cbd3d9"/><text x="40" y="462" font-size="23" font-weight="bold">退出顺序</text><g font-size="21"><text x="210" y="462">销毁容器及元素</text><text x="417" y="462">→</text><text x="463" y="462">释放资源</text><text x="608" y="462">→</text><text x="658" y="462">结束缓冲区生命</text></g><text x="40" y="523" font-size="21">release 不负责调用业务对象的析构函数</text><text x="40" y="561" font-size="20">示意单调资源；不表示具体类的内部字段布局或执行耗时</text></g></svg>
