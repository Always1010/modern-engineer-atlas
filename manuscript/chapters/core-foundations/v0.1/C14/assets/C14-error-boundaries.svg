<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 14-2 失败分类与恢复责任</title><desc id="desc">外部输入、操作失败和不变量错误有不同责任；处理策略要根据上下文决定。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 14-2 失败分类与恢复责任</text><rect x="410" y="110" width="340" height="80" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="580.0" y="142" text-anchor="middle" font-size="21">操作不能完成</text><text x="580.0" y="172" text-anchor="middle" font-size="21">先保留原因与发生阶段</text><rect x="45" y="280" width="315" height="105" rx="12" fill="#fff1dc" stroke="#8296aa"/><text x="202.5" y="312" text-anchor="middle" font-size="21">边界输入无效</text><text x="202.5" y="342" text-anchor="middle" font-size="21">明确拒绝与定位</text><text x="202.5" y="372" text-anchor="middle" font-size="21">不靠可关闭断言</text><rect x="425" y="280" width="315" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="582.5" y="312" text-anchor="middle" font-size="21">资源 / 外部操作失败</text><text x="582.5" y="342" text-anchor="middle" font-size="21">传播到有上下文的层</text><text x="582.5" y="372" text-anchor="middle" font-size="21">判断幂等与总预算</text><rect x="805" y="280" width="315" height="105" rx="12" fill="#f8e7e7" stroke="#8296aa"/><text x="962.5" y="312" text-anchor="middle" font-size="21">不变量被破坏</text><text x="962.5" y="342" text-anchor="middle" font-size="21">保全证据并限制继续使用</text><text x="962.5" y="372" text-anchor="middle" font-size="21">策略由系统后果决定</text><path d="M440 190 L200 275" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M580 190 L580 275" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M725 190 L960 275" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="65" y="450" font-size="20">恢复选择：重试 / 降级 / 返回错误 / 终止，均不能抹掉已发生的副作用</text><text x="65" y="493" font-size="20">传播机制：异常、错误码、expected；机制本身不会选择恢复策略</text><text x="65" y="535" font-size="20">释放资源、恢复不变量、向用户解释，是不同责任</text></g></svg>