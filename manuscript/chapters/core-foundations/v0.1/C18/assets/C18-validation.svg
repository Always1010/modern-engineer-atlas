<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="t d"><title id="t">无锁结构需要一条完整证据链</title><desc id="d">从顺序规格和线性化开始，检查内存和回收，再检查进展资源，最后比较性能。</desc><metadata>作者原创教学示意；2026-10-03；非运行记录；语义见正文来源。</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="580" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">无锁结构需要一条完整证据链</text><rect x="40" y="155" width="184" height="114" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="132.0" y="186" font-size="20" text-anchor="middle">1 顺序规格</text><text x="132.0" y="215" font-size="20" text-anchor="middle">FIFO 与失败</text><path d="M230 210 L245 210" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="251" y="155" width="184" height="114" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="343.0" y="186" font-size="20" text-anchor="middle">2 线性化</text><text x="343.0" y="215" font-size="20" text-anchor="middle">每个返回的</text><path d="M441 210 L456 210" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="462" y="155" width="184" height="114" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="554.0" y="186" font-size="20" text-anchor="middle">3 内存与回收</text><text x="554.0" y="215" font-size="20" text-anchor="middle">发布与访问</text><path d="M652 210 L667 210" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="673" y="155" width="184" height="114" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="765.0" y="186" font-size="20" text-anchor="middle">4 进展与资源</text><text x="765.0" y="215" font-size="20" text-anchor="middle">暂停与分配</text><path d="M863 210 L878 210" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="884" y="155" width="184" height="114" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="976.0" y="186" font-size="20" text-anchor="middle">5 对等性能实验</text><text x="976.0" y="215" font-size="20" text-anchor="middle">吞吐与尾延迟</text><rect x="80" y="330" width="940" height="115" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="550.0" y="361" font-size="20" text-anchor="middle">历史测试、检测器、模型检查与受控交错提供不同证据</text><text x="550.0" y="390" font-size="20" text-anchor="middle">有限模型通过不等于任意部署证明；没有报告不等于没有错误</text><text x="50" y="515" font-size="21" text-anchor="start">先检查语义等价，再比较 mutex、分片、SPSC 与 MPMC 方案。</text><text x="132" y="244" font-size="20" text-anchor="middle">关闭语义</text><text x="343" y="244" font-size="20" text-anchor="middle">顺序解释</text><text x="554" y="244" font-size="20" text-anchor="middle">对象生命期</text><text x="765" y="244" font-size="20" text-anchor="middle">积压空间</text><text x="976" y="244" font-size="20" text-anchor="middle">保留内存</text></g></svg>