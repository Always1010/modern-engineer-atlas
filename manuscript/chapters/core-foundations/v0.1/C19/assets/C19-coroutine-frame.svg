<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">协程帧保存状态 不自动拥有所有外部资源</title><desc id="d">帧保存promise和局部状态，外部借用与事件句柄另需生命周期协议。</desc><metadata>作者原创教学示意；2026-10-03；非真实事件轨迹；来源见正文。</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="600" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">协程帧保存状态 不自动拥有所有外部资源</text><rect x="50" y="115" width="525" height="335" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="312.5" y="147" font-size="20" text-anchor="middle">协程帧</text><text x="312.5" y="176" font-size="20" text-anchor="middle">promise 对象</text><text x="312.5" y="205" font-size="20" text-anchor="middle">按规则保存的参数</text><text x="312.5" y="234" font-size="20" text-anchor="middle">跨挂起仍活跃的局部对象</text><text x="312.5" y="263" font-size="20" text-anchor="middle">当前恢复位置与库所需状态</text><rect x="735" y="115" width="315" height="100" rx="10" fill="#f8f1e5" stroke="#7893ab" stroke-width="2"/><text x="892.5" y="147" font-size="20" text-anchor="middle">外部缓冲区 / this</text><text x="892.5" y="176" font-size="20" text-anchor="middle">引用不会自动保活</text><rect x="735" y="330" width="315" height="120" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="892.5" y="362" font-size="20" text-anchor="middle">事件队列中的句柄</text><text x="892.5" y="391" font-size="20" text-anchor="middle">非拥有入口</text><text x="892.5" y="420" font-size="20" text-anchor="middle">不能恢复已销毁帧</text><path d="M583 170 L719 170" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><text x="599" y="150" font-size="18" text-anchor="start">借用</text><path d="M726 390 L589 390" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><text x="609" y="370" font-size="18" text-anchor="start">恢复入口</text><text x="48" y="513" font-size="20" text-anchor="start">挂起保存状态；最终挂起、业务完成、外部操作结束和 destroy 不是同一事件。</text><text x="48" y="554" font-size="21" text-anchor="start">所有权必须覆盖最后一次访问，取消请求不能直接替代完成确认。</text></g></svg>