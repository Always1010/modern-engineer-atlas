<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">就绪与完成的不同交接点</title><desc id="d">epoll等就绪再读，IOCP先提交带缓冲的读再取完成结果。</desc><metadata>作者原创教学示意；2026-10-03；非真实事件轨迹；来源见正文。</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="600" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">就绪与完成的不同交接点</text><text x="50" y="110" font-size="23" text-anchor="start">epoll：就绪模型</text><rect x="40" y="150" width="260" height="105" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="170.0" y="182" font-size="20" text-anchor="middle">注册关注</text><text x="170.0" y="211" font-size="20" text-anchor="middle">等待可读事件</text><path d="M310 200 L400 200" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="415" y="150" width="260" height="105" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="545.0" y="182" font-size="20" text-anchor="middle">事件到达后</text><text x="545.0" y="211" font-size="20" text-anchor="middle">应用尝试非阻塞读</text><path d="M685 200 L780 200" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="797" y="150" width="263" height="105" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="928.5" y="182" font-size="20" text-anchor="middle">处理实际返回</text><text x="928.5" y="211" font-size="20" text-anchor="middle">字节、EOF 或错误</text><text x="50" y="321" font-size="23" text-anchor="start">IOCP：完成模型</text><rect x="40" y="360" width="260" height="105" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="170.0" y="392" font-size="20" text-anchor="middle">准备操作状态与缓冲</text><text x="170.0" y="421" font-size="20" text-anchor="middle">先提交具体读操作</text><path d="M310 410 L400 410" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="415" y="360" width="260" height="105" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="545.0" y="392" font-size="20" text-anchor="middle">操作在途</text><text x="545.0" y="421" font-size="20" text-anchor="middle">状态与缓冲保持有效</text><path d="M685 410 L780 410" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="797" y="360" width="263" height="105" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="928.5" y="392" font-size="20" text-anchor="middle">取得完成包</text><text x="928.5" y="421" font-size="20" text-anchor="middle">消费字节数与错误</text><text x="47" y="542" font-size="21" text-anchor="start">就绪不等于某次读取成功；本地操作完成不等于远端业务确认。</text></g></svg>