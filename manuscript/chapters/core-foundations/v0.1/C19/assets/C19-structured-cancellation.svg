<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="665" viewBox="0 0 1100 665" role="img" aria-labelledby="t d"><title id="t">取消向下传播 完成向上汇合</title><desc id="d">父任务请求子任务取消，等待所有子任务终态后才释放仍可能被借用的共享状态。</desc><metadata>作者原创教学示意；2026-10-03；非真实事件轨迹；来源见正文。</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="665" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">取消向下传播 完成向上汇合</text><rect x="355" y="105" width="390" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="550.0" y="137" font-size="20" text-anchor="middle">父作用域</text><text x="550.0" y="166" font-size="20" text-anchor="middle">拥有结果状态与共享资源</text><rect x="80" y="280" width="350" height="110" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="255.0" y="312" font-size="20" text-anchor="middle">子任务一</text><text x="255.0" y="341" font-size="20" text-anchor="middle">成功 / 失败 / 停止</text><text x="255.0" y="370" font-size="20" text-anchor="middle">终态只交付一次</text><rect x="670" y="280" width="350" height="110" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="845.0" y="312" font-size="20" text-anchor="middle">子任务二</text><text x="845.0" y="341" font-size="20" text-anchor="middle">成功 / 失败 / 停止</text><text x="845.0" y="370" font-size="20" text-anchor="middle">迟到完成仍需清理</text><path d="M415 205 L265 265" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><path d="M685 205 L845 265" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><text x="180" y="225" font-size="18" text-anchor="start">取消请求向下传播</text><text x="860" y="230" font-size="18" text-anchor="start">取消请求向下传播</text><path d="M255 400 L440 465" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><path d="M845 400 L660 465" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><rect x="340" y="477" width="420" height="92" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="550.0" y="509" font-size="20" text-anchor="middle">全部子任务责任已结束</text><text x="550.0" y="538" font-size="20" text-anchor="middle">父状态才可安全回收</text><text x="46" y="621" font-size="20" text-anchor="start">允许先交付业务结果的接口，必须另设拥有者承接仍在途的清理责任。</text></g></svg>