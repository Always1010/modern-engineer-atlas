<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">逻辑顺序与存储布局</title><desc id="desc">对比数组连续布局、链表分散节点和环形缓冲的回绕位置。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#506579"/></marker></defs><rect width="1120" height="640" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" fill="#192a3a"><text x="42" y="50" font-size="28" fill="#192a3a" text-anchor="start">同样保存一串数据，下一项的位置可以不同</text><text x="42" y="115" font-size="25" fill="#192a3a" text-anchor="start">数组</text><rect x="260" y="80" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="330.0" y="120.5" font-size="23" fill="#192a3a" text-anchor="middle">A</text><rect x="405" y="80" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="475.0" y="120.5" font-size="23" fill="#192a3a" text-anchor="middle">B</text><rect x="550" y="80" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="620.0" y="120.5" font-size="23" fill="#192a3a" text-anchor="middle">C</text><rect x="695" y="80" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="765.0" y="120.5" font-size="23" fill="#192a3a" text-anchor="middle">D</text><text x="260" y="176" font-size="21" fill="#192a3a" text-anchor="start">元素连续，下标计算位置</text><text x="42" y="258" font-size="25" fill="#192a3a" text-anchor="start">链表</text><rect x="260" y="216" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="330.0" y="256.5" font-size="23" fill="#192a3a" text-anchor="middle">A</text><rect x="695" y="216" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="765.0" y="256.5" font-size="23" fill="#192a3a" text-anchor="middle">B</text><rect x="465" y="321" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="535.0" y="361.5" font-size="23" fill="#192a3a" text-anchor="middle">C</text><rect x="885" y="321" width="140" height="65" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="955.0" y="361.5" font-size="23" fill="#192a3a" text-anchor="middle">D</text><path d="M400,246 L685,246" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M765,281 L765,302 L535,302 L535,312" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M605,354 L875,354" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="260" y="416" font-size="21" fill="#192a3a" text-anchor="start">逻辑顺序 A → B → C → D，节点不要求相邻</text><text x="42" y="500" font-size="25" fill="#192a3a" text-anchor="start">环形缓冲</text><rect x="260" y="456" width="89" height="56" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="304.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">D</text><text x="304" y="542" font-size="18" fill="#192a3a" text-anchor="middle">0</text><rect x="355" y="456" width="89" height="56" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="399.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">空</text><text x="399" y="542" font-size="18" fill="#192a3a" text-anchor="middle">1</text><rect x="450" y="456" width="89" height="56" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="494.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">空</text><text x="494" y="542" font-size="18" fill="#192a3a" text-anchor="middle">2</text><rect x="545" y="456" width="89" height="56" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="589.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">空</text><text x="589" y="542" font-size="18" fill="#192a3a" text-anchor="middle">3</text><rect x="640" y="456" width="89" height="56" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="684.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">空</text><text x="684" y="542" font-size="18" fill="#192a3a" text-anchor="middle">4</text><rect x="735" y="456" width="89" height="56" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="779.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">A</text><text x="779" y="542" font-size="18" fill="#192a3a" text-anchor="middle">5</text><rect x="830" y="456" width="89" height="56" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="874.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">B</text><text x="874" y="542" font-size="18" fill="#192a3a" text-anchor="middle">6</text><rect x="925" y="456" width="89" height="56" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="969.5" y="492.0" font-size="23" fill="#192a3a" text-anchor="middle">C</text><text x="969" y="542" font-size="18" fill="#192a3a" text-anchor="middle">7</text><text x="260" y="590" font-size="22" fill="#192a3a" text-anchor="start">head = 5    tail = 1    count = 4    capacity = 8</text><text x="260" y="622" font-size="20" fill="#192a3a" text-anchor="start">读取次序：5 → 6 → 7 → 0</text></g></svg>