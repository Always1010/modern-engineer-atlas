<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">火焰图展示聚合调用栈的包含关系</title><desc id="d">人工权重解析20转换50输出30，转换内查找30计算15自身5，说明包含成本与非时间横轴。</desc><metadata>作者原创人工数据图；2026-10-03；没有实测数据；数值和演算见正文。</metadata><rect width="1100" height="620" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">火焰图展示聚合调用栈的包含关系</text><text x="45" y="100" font-size="20" text-anchor="start">人工聚合权重，总计 100；宽度表示权重，横向位置不是时间</text><rect x="50" y="410" width="1000" height="65" fill="#dfab74" stroke="white"/><text x="550" y="451" font-size="22" text-anchor="middle">请求处理 100</text><rect x="50" y="340" width="200" height="65" fill="#b4c8d5" stroke="white"/><text x="150" y="381" font-size="21" text-anchor="middle">解析 20</text><rect x="250" y="340" width="500" height="65" fill="#92b6a4" stroke="white"/><text x="500" y="381" font-size="21" text-anchor="middle">转换 50</text><rect x="750" y="340" width="300" height="65" fill="#d7be8e" stroke="white"/><text x="900" y="381" font-size="21" text-anchor="middle">输出 30</text><rect x="250" y="270" width="300" height="65" fill="#67988e" stroke="white"/><text x="400" y="311" font-size="21" text-anchor="middle">查找 30</text><rect x="550" y="270" width="150" height="65" fill="#bad4b7" stroke="white"/><text x="625" y="311" font-size="21" text-anchor="middle">计算 15</text><line x1="724" y1="271" x2="850" y2="217" stroke="#486078" stroke-width="2"/><text x="735" y="197" font-size="20" text-anchor="start">转换自身权重 5</text><text x="48" y="535" font-size="20" text-anchor="start">查找 30 已包含在转换 50 中，不能再次相加。图高表示调用深度。</text><text x="48" y="578" font-size="20" text-anchor="start">真实图须注明 CPU 样本、等待时间或分配字节等权重来源。</text></g></svg>