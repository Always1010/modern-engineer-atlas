<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">依赖图的就绪前沿</title><desc id="desc">A与B初始就绪，D等待A和B，E等待C和D。假定资源充足，最早完成于时刻十。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#506579"/></marker></defs><rect width="1120" height="720" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" fill="#192a3a"><text x="42" y="50" font-size="28" fill="#192a3a" text-anchor="start">依赖满足以后才能就绪，执行资源还需另行安排</text><rect x="70" y="135" width="180" height="70" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="160.0" y="178.0" font-size="23" fill="#192a3a" text-anchor="middle">A  耗时 2</text><rect x="70" y="360" width="180" height="70" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="160.0" y="403.0" font-size="23" fill="#192a3a" text-anchor="middle">B  耗时 3</text><rect x="340" y="135" width="180" height="70" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="430.0" y="178.0" font-size="23" fill="#192a3a" text-anchor="middle">C  耗时 5</text><rect x="340" y="360" width="180" height="70" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="430.0" y="403.0" font-size="23" fill="#192a3a" text-anchor="middle">D  耗时 4</text><rect x="620" y="245" width="180" height="70" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="710.0" y="288.0" font-size="23" fill="#192a3a" text-anchor="middle">E  耗时 2</text><rect x="885" y="245" width="180" height="70" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="975.0" y="288.0" font-size="23" fill="#192a3a" text-anchor="middle">F  耗时 1</text><path d="M250,170 L330,170" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250,190 L330,370" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250,395 L330,395" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520,170 L610,260" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520,395 L610,302" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800,280 L875,280" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="487" font-size="23" fill="#192a3a" text-anchor="start">初始就绪：A、B</text><text x="65" y="529" font-size="23" fill="#192a3a" text-anchor="start">D 需要 A 与 B 都完成；E 需要 C 与 D 都完成</text><text x="65" y="585" font-size="24" fill="#192a3a" text-anchor="start">资源充足时的执行区间</text><text x="65" y="628" font-size="22" fill="#192a3a" text-anchor="start">A [0,2)    B [0,3)    C [2,7)    D [3,7)</text><text x="65" y="667" font-size="22" fill="#192a3a" text-anchor="start">E [7,9)    F [9,10)    最早完工时刻 10</text></g></svg>