<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">LRU 的索引与访问次序</title><desc id="desc">哈希索引定位节点，双向链表维护最近性。容量三，依次访问ABCAD，最终D A C而B被淘汰。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#506579"/></marker></defs><rect width="1120" height="760" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" fill="#192a3a"><text x="42" y="50" font-size="28" fill="#192a3a" text-anchor="start">精确 LRU：索引负责找到，链表负责排列</text><rect x="45" y="100" width="250" height="63" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="170.0" y="139.5" font-size="25" fill="#192a3a" text-anchor="middle">访问键 A</text><rect x="385" y="100" width="350" height="63" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="560.0" y="139.5" font-size="25" fill="#192a3a" text-anchor="middle">键索引 → 链表节点</text><path d="M295,131 L375,131" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="225" font-size="23" fill="#192a3a" text-anchor="start">访问 A 之前</text><rect x="330" y="188" width="170" height="64" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="415.0" y="228.0" font-size="26" fill="#192a3a" text-anchor="middle">C</text><rect x="565" y="188" width="170" height="64" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="650.0" y="228.0" font-size="26" fill="#192a3a" text-anchor="middle">B</text><rect x="800" y="188" width="170" height="64" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="885.0" y="228.0" font-size="26" fill="#192a3a" text-anchor="middle">A</text><path d="M500,220 L555,220" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M735,220 L790,220" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="330" y="285" font-size="20" fill="#192a3a" text-anchor="start">最近</text><text x="970" y="285" font-size="20" fill="#192a3a" text-anchor="end">最久</text><path d="M690,163 L690,176 L885,176 L885,178" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="366" font-size="23" fill="#192a3a" text-anchor="start">A 命中后移到表头</text><rect x="330" y="330" width="170" height="64" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="415.0" y="370.0" font-size="26" fill="#192a3a" text-anchor="middle">A</text><rect x="565" y="330" width="170" height="64" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="650.0" y="370.0" font-size="26" fill="#192a3a" text-anchor="middle">C</text><rect x="800" y="330" width="170" height="64" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="885.0" y="370.0" font-size="26" fill="#192a3a" text-anchor="middle">B</text><path d="M500,362 L555,362" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M735,362 L790,362" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="514" font-size="23" fill="#192a3a" text-anchor="start">加入 D 并淘汰 B</text><rect x="330" y="478" width="170" height="64" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="415.0" y="518.0" font-size="26" fill="#192a3a" text-anchor="middle">D</text><rect x="565" y="478" width="170" height="64" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="650.0" y="518.0" font-size="26" fill="#192a3a" text-anchor="middle">A</text><rect x="800" y="478" width="170" height="64" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="885.0" y="518.0" font-size="26" fill="#192a3a" text-anchor="middle">C</text><path d="M500,510 L555,510" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M735,510 L790,510" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="617" font-size="23" fill="#192a3a" text-anchor="start">同时维护：索引中每个有效键，恰好对应链表中的一个节点</text><text x="45" y="663" font-size="23" fill="#192a3a" text-anchor="start">命中也会修改最近性；多线程下不能把它视为纯只读操作</text><text x="45" y="709" font-size="23" fill="#192a3a" text-anchor="start">容量按字节限制时，一次新增可能需要淘汰多个条目</text></g></svg>