<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">唤醒不等于立即运行</title><desc id="desc">甲阻塞时乙运行，输入完成后甲变为可运行，但直到调度到甲时才继续执行。时间长度为教学示意。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">唤醒不等于立即运行</text><text class="small" x="230" y="125">时间向右推进</text><path class="arrow" d="M420 118 H1130"/><text class="label" x="45" y="207">线程甲</text><text class="label" x="45" y="342">线程乙</text><text class="label" x="45" y="466">输入事件</text><rect x="210" y="165" width="200" height="75" rx="12" fill="#d7eadd" stroke="#7a98ac" stroke-width="2"/><text x="310.0" y="200" text-anchor="middle" class="label">运行</text><rect x="410" y="165" width="300" height="75" rx="12" fill="#edf0f3" stroke="#7a98ac" stroke-width="2"/><text x="560.0" y="200" text-anchor="middle" class="label">阻塞等待</text><rect x="710" y="165" width="220" height="75" rx="12" fill="#fff0d3" stroke="#7a98ac" stroke-width="2"/><text x="820.0" y="200" text-anchor="middle" class="label">可运行</text><rect x="930" y="165" width="230" height="75" rx="12" fill="#d7eadd" stroke="#7a98ac" stroke-width="2"/><text x="1045.0" y="200" text-anchor="middle" class="label">再次运行</text><rect x="210" y="300" width="200" height="75" rx="12" fill="#fff0d3" stroke="#7a98ac" stroke-width="2"/><text x="310.0" y="335" text-anchor="middle" class="label">等待调度</text><rect x="410" y="300" width="520" height="75" rx="12" fill="#d7eadd" stroke="#7a98ac" stroke-width="2"/><text x="670.0" y="335" text-anchor="middle" class="label">运行</text><rect x="930" y="300" width="230" height="75" rx="12" fill="#fff0d3" stroke="#7a98ac" stroke-width="2"/><text x="1045.0" y="335" text-anchor="middle" class="label">等待调度</text><path d="M410 242 V410" stroke="#8aa6b7" stroke-width="2" stroke-dasharray="6 5"/><path d="M710 242 V472" stroke="#8aa6b7" stroke-width="2" stroke-dasharray="6 5"/><path d="M930 242 V410" stroke="#8aa6b7" stroke-width="2" stroke-dasharray="6 5"/><path class="arrow" d="M270 459 H710"/><text class="small" x="410" y="444">输入尚未准备好</text><text class="small" x="725" y="465">输入完成，甲被唤醒</text><text class="small" x="45" y="548">唤醒使线程变为可运行；什么时候真正继续，由调度与资源条件决定</text><text class="small" x="45" y="588">线程甲的阻塞等待结束后，还可能存在一段调度等待</text></svg>