<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">描述符编号与资源对象分属不同层</title><desc id="desc">fd3和通过dup得到的fd8共同引用一个打开文件描述并共享偏移。独立open得到的fd9有独立偏移，但可关联同一文件对象。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">描述符编号与资源对象分属不同层</text><text class="label" x="45" y="120">进程描述符表</text><text class="label" x="435" y="120">打开文件描述</text><text class="label" x="910" y="120">文件对象</text><rect x="45" y="165" width="230" height="85" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="160.0" y="200" text-anchor="middle" class="label">fd 3</text><text x="160.0" y="231" text-anchor="middle" class="small">第一次 open</text><rect x="45" y="305" width="230" height="85" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="160.0" y="340" text-anchor="middle" class="label">fd 8</text><text x="160.0" y="371" text-anchor="middle" class="small">dup(fd 3)</text><rect x="45" y="445" width="230" height="85" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="160.0" y="480" text-anchor="middle" class="label">fd 9</text><text x="160.0" y="511" text-anchor="middle" class="small">另一次 open</text><rect x="435" y="235" width="295" height="100" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="582.5" y="270" text-anchor="middle" class="label">共享的一份状态</text><text x="582.5" y="301" text-anchor="middle" class="small">当前偏移 120</text><rect x="435" y="430" width="295" height="100" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="582.5" y="465" text-anchor="middle" class="label">独立的一份状态</text><text x="582.5" y="496" text-anchor="middle" class="small">当前偏移 0</text><rect x="900" y="300" width="255" height="100" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="1027.5" y="335" text-anchor="middle" class="label">同一个文件</text><text x="1027.5" y="366" text-anchor="middle" class="small">内容与元数据</text><path class="arrow" d="M275 208 H350 V270 H435"/><path class="arrow" d="M275 348 H350 V300 H435"/><path class="arrow" d="M275 488 H435"/><path class="arrow" d="M730 285 H815 V332 H900"/><path class="arrow" d="M730 480 H815 V367 H900"/><text class="small" x="45" y="586">关闭 fd 3 只移除它的引用；fd 8 仍可维持共同的打开文件描述</text></svg>