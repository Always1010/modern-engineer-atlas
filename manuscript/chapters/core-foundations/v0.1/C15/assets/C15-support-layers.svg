<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 15-2 从标准能力到项目可用性的证据层</title><desc id="desc">规范、前端、标准库、构建、目标平台和项目测试分别提供必要证据。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 15-2 从标准能力到项目可用性的证据层</text><rect x="50" y="120" width="300" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="200.0" y="152" text-anchor="middle" font-size="21">标准文本</text><text x="200.0" y="182" text-anchor="middle" font-size="21">固定草案 / 条款 / 修订</text><rect x="430" y="120" width="300" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="580.0" y="152" text-anchor="middle" font-size="21">语言前端</text><text x="580.0" y="182" text-anchor="middle" font-size="21">语法 / 模式 / 实验开关</text><rect x="810" y="120" width="300" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="960.0" y="152" text-anchor="middle" font-size="21">标准库</text><text x="960.0" y="182" text-anchor="middle" font-size="21">头文件 / 特性宏 / 缺陷</text><path d="M350 170 L425 170" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M730 170 L805 170" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="315" width="300" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="200.0" y="347" text-anchor="middle" font-size="21">构建与分发</text><text x="200.0" y="377" text-anchor="middle" font-size="21">生成器 / 扫描 / 安装</text><rect x="430" y="315" width="300" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="580.0" y="347" text-anchor="middle" font-size="21">目标环境</text><text x="580.0" y="377" text-anchor="middle" font-size="21">架构 / ABI / 运行时 / OS</text><rect x="810" y="315" width="300" height="100" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="960.0" y="347" text-anchor="middle" font-size="21">项目证据</text><text x="960.0" y="377" text-anchor="middle" font-size="21">编译 / 链接 / 行为 / 成本</text><path d="M350 365 L425 365" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M730 365 L805 365" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M960 220 L960 265 L200 265 L200 309" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="65" y="479" font-size="20">通过上一层 ≠ 自动通过下一层；状态表记录也不等于本地测试通过</text><text x="65" y="523" font-size="20">锁定版本与条件，使用真正需要的调用形态验证，并保留回退路径</text></g></svg>