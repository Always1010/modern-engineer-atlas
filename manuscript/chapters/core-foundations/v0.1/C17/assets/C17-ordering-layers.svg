<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">同一个排序问题的四层边界</title><desc id="desc">语言、编译器、硬件、操作系统及设备接口各有不同契约，逐层核对不能互相替代。</desc><metadata>作者原创；2026-10-03；N4861 语义教学图；非执行轨迹或实测。</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="605" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="48" font-size="27" text-anchor="start">同一个排序问题的四层边界</text><rect x="45" y="110" width="285" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="187.5" y="142" font-size="20" text-anchor="middle">C++ 语言模型</text><text x="187.5" y="171" font-size="20" text-anchor="middle">数据竞争与允许结果</text><rect x="405" y="110" width="645" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="727.5" y="142" font-size="20" text-anchor="middle">检查：哪条关系把写入连接到读取</text><text x="727.5" y="171" font-size="20" text-anchor="middle">原子性不自动提供事务与生命周期</text><rect x="45" y="230" width="285" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="187.5" y="262" font-size="20" text-anchor="middle">编译器映射</text><text x="187.5" y="291" font-size="20" text-anchor="middle">保持语义的优化与指令选择</text><rect x="405" y="230" width="645" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="727.5" y="262" font-size="20" text-anchor="middle">检查：工具链版本、目标与编译参数</text><text x="727.5" y="291" font-size="20" text-anchor="middle">汇编证据不恢复含数据竞争的源码保证</text><rect x="45" y="350" width="285" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="187.5" y="382" font-size="20" text-anchor="middle">CPU 与缓存系统</text><text x="187.5" y="411" font-size="20" text-anchor="middle">架构排序与一致性</text><rect x="405" y="350" width="645" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="727.5" y="382" font-size="20" text-anchor="middle">检查：内存类型、争用和架构约束</text><text x="727.5" y="411" font-size="20" text-anchor="middle">缓存一致性不等于跨字段一致快照</text><rect x="45" y="470" width="285" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="187.5" y="502" font-size="20" text-anchor="middle">OS 与设备接口</text><text x="187.5" y="531" font-size="20" text-anchor="middle">IO 完成与缓冲区资格</text><rect x="405" y="470" width="645" height="90" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="727.5" y="502" font-size="20" text-anchor="middle">检查：驱动、DMA、设备与完成契约</text><text x="727.5" y="531" font-size="20" text-anchor="middle">线程 fence 不等于设备完成或持久化</text><path d="M185 202 L185 222" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M185 322 L185 342" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M185 442 L185 462" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g></svg>