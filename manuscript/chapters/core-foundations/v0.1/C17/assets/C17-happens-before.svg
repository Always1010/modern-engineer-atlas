<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">一次发布的先行发生关系</title><desc id="desc">写负载先于 release；acquire 从该发布读取后再读取负载，建立 W 到 R 的链。</desc><metadata>作者原创；2026-10-03；N4861 语义教学图；非执行轨迹或实测。</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="580" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="48" font-size="27" text-anchor="start">一次发布的先行发生关系</text><text x="165" y="100" font-size="20" text-anchor="start">发布者</text><text x="827" y="100" font-size="20" text-anchor="start">消费者</text><rect x="50" y="145" width="335" height="77" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="217.5" y="177" font-size="20" text-anchor="middle">W：写入 payload</text><rect x="50" y="320" width="335" height="98" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="217.5" y="352" font-size="20" text-anchor="middle">A：ready.store(true)</text><text x="217.5" y="381" font-size="20" text-anchor="middle">release</text><rect x="715" y="145" width="335" height="98" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="882.5" y="177" font-size="20" text-anchor="middle">B：读取到 A 写的 true</text><text x="882.5" y="206" font-size="20" text-anchor="middle">acquire</text><rect x="715" y="340" width="335" height="77" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="882.5" y="372" font-size="20" text-anchor="middle">R：读取 payload</text><path d="M217 228 L217 309" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="237" y="280" font-size="20" text-anchor="start">同线程先后</text><path d="M882 250 L882 328" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="902" y="295" font-size="20" text-anchor="start">同线程先后</text><path d="M390 356 L708 207" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="416" y="214" font-size="21" text-anchor="start">A 与 B 同步</text><text x="411" y="245" font-size="18" text-anchor="start">前提：B 的读来源是 A</text><text x="62" y="500" font-size="22" text-anchor="start">连接 W → A → B → R，得到 W 先行发生于 R。</text><text x="62" y="538" font-size="20" text-anchor="start">对象仍须存活，发布之后不能无保护地继续修改 payload。</text></g></svg>