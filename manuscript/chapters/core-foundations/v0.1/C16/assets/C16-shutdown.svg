<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">关闭协议与资源生命周期</title><desc id="desc">关闭先禁止新提交并唤醒等待者，按排空或取消策略处理已接受任务，等待退出后回收。</desc><metadata>作者原创教学示意；2026-10-03；非测量结果；语义依据 N4861 与正文协议。</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="555" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="45" y="48" font-size="27" font-weight="700">关闭协议与资源生命周期</text><rect x="35" y="145" width="190" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="130.0" y="176" text-anchor="middle" font-size="20">运行中</text><text x="130.0" y="205" text-anchor="middle" font-size="20">接受提交</text><path d="M234 192 L287 192" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="298" y="145" width="215" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="405.5" y="176" text-anchor="middle" font-size="20">停止接受</text><text x="405.5" y="205" text-anchor="middle" font-size="20">关闭标志已提交</text><path d="M520 192 L575 192" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="590" y="145" width="205" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="692.5" y="176" text-anchor="middle" font-size="20">唤醒所有等待者</text><text x="692.5" y="205" text-anchor="middle" font-size="20">拒绝后续提交</text><path d="M802 192 L855 192" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="867" y="145" width="195" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="964.5" y="176" text-anchor="middle" font-size="20">等待执行者退出</text><text x="964.5" y="205" text-anchor="middle" font-size="20">最后才释放状态</text><path d="M410 250 L410 305" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="135" y="323" width="340" height="115" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="305.0" y="354" text-anchor="middle" font-size="20">排空策略</text><text x="305.0" y="383" text-anchor="middle" font-size="20">已接受任务继续被取出</text><text x="305.0" y="412" text-anchor="middle" font-size="20">运行任务正常结束</text><rect x="570" y="323" width="360" height="115" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="750.0" y="354" text-anchor="middle" font-size="20">取消策略</text><text x="750.0" y="383" text-anchor="middle" font-size="20">待处理任务交付取消结果</text><text x="750.0" y="412" text-anchor="middle" font-size="20">运行任务协作式停止</text><text x="75" y="505" font-size="20">通知完成 ≠ 线程退出；请求取消 ≠ 取消完成；join 时不能占住工作线程所需的锁。</text><path d="M410 280 L750 280 L750 312" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g></svg>