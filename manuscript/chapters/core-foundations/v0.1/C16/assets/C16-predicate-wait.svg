<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">等待谓词连接状态与通知</title><desc id="desc">消费者在锁下检查状态，wait 释放锁并等待，生产者入队通知，消费者重新加锁检查。</desc><metadata>作者原创教学示意；2026-10-03；非测量结果；语义依据 N4861 与正文协议。</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="580" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="45" y="48" font-size="27" font-weight="700">等待谓词连接状态与通知</text><text x="75" y="103" font-size="19">消费者</text><text x="460" y="103" font-size="19">共享状态与 mutex</text><text x="855" y="103" font-size="19">生产者</text><rect x="40" y="130" width="280" height="73" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="180.0" y="161" text-anchor="middle" font-size="20">持锁检查：队列为空</text><rect x="40" y="235" width="280" height="100" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="180.0" y="266" text-anchor="middle" font-size="20">wait 原子解锁并等待</text><text x="180.0" y="295" text-anchor="middle" font-size="20">此时不占有 mutex</text><path d="M180 206 L180 225" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="770" y="235" width="285" height="100" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="912.5" y="266" text-anchor="middle" font-size="20">取得 mutex → 入队</text><text x="912.5" y="295" text-anchor="middle" font-size="20">更新状态后解锁</text><path d="M330 285 L752 285" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="390" y="266" font-size="19">生产者才能取得锁</text><rect x="770" y="370" width="285" height="70" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="912.5" y="401" text-anchor="middle" font-size="20">notify_one</text><path d="M910 338 L910 360" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="370" width="280" height="100" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="180.0" y="401" text-anchor="middle" font-size="20">唤醒后重新取得锁</text><text x="180.0" y="430" text-anchor="middle" font-size="20">再次检查谓词</text><path d="M760 405 L336 405" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="427" y="389" font-size="19">重新检查的机会</text><text x="45" y="526" font-size="21">队列和关闭标志保存事实；通知本身不保存一个待处理任务。</text></g></svg>