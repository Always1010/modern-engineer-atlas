<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">锁顺序怎样影响等待环</title><desc id="desc">两线程反向持锁形成循环等待；右侧统一先甲后乙的获取顺序。</desc><metadata>作者原创教学示意；2026-10-03；非测量结果；语义依据 N4861 与正文协议。</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="540" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="45" y="48" font-size="27" font-weight="700">锁顺序怎样影响等待环</text><text x="45" y="95" font-size="19">左侧：存在相反的获取顺序</text><text x="590" y="95" font-size="19">右侧：所有路径遵守甲 → 乙</text><rect x="60" y="135" width="185" height="85" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="152.5" y="166" text-anchor="middle" font-size="20">线程一</text><text x="152.5" y="195" text-anchor="middle" font-size="20">持有锁甲</text><rect x="300" y="310" width="185" height="85" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="392.5" y="341" text-anchor="middle" font-size="20">线程二</text><text x="392.5" y="370" text-anchor="middle" font-size="20">持有锁乙</text><path d="M250 175 L385 300" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M295 350 L145 230" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="334" y="230" font-size="19">等待锁乙</text><text x="53" y="298" font-size="19">等待锁甲</text><rect x="605" y="140" width="175" height="75" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="692.5" y="171" text-anchor="middle" font-size="20">先取得锁甲</text><path d="M790 177 L865 177" stroke="#486078" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="875" y="140" width="175" height="75" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="962.5" y="171" text-anchor="middle" font-size="20">再取得锁乙</text><rect x="605" y="280" width="445" height="96" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="827.5" y="311" text-anchor="middle" font-size="20">线程一释放后，线程二再进入</text><text x="827.5" y="340" text-anchor="middle" font-size="20">不允许持有锁乙再请求锁甲</text><text x="45" y="470" font-size="21">消除这一组锁的顺序环，仍须检查 join、future、IO 与容量等待。</text></g></svg>