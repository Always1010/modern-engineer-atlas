<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">图 57-2 六层追问的证据梯度</title><desc id="desc">六层依次为识别概念、解释存在原因、推导机制与边界、定位失败、比较工程取舍、设计并验证系统，每层右侧列出可检查的证据类型。</desc><rect width="1000" height="700" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#151515"><text x="40" y="45" font-size="28" font-weight="bold">深度来自机制和证据 不是更多冷门词语</text><text x="40" y="88" font-size="21">本书教学方法，不是雇主的官方评分流程</text><g stroke="#728697" stroke-width="1.4" fill="#e8eff5"><rect x="42" y="125" width="360" height="65"/><rect x="42" y="205" width="360" height="65"/><rect x="42" y="285" width="360" height="65"/><rect x="42" y="365" width="360" height="65"/><rect x="42" y="445" width="360" height="65"/><rect x="42" y="525" width="360" height="65"/></g><g font-size="23"><text x="62" y="167">1 识别概念</text><text x="62" y="247">2 解释存在原因</text><text x="62" y="327">3 推导机制与边界</text><text x="62" y="407">4 定位失败</text><text x="62" y="487">5 比较工程取舍</text><text x="62" y="567">6 设计并验证系统</text></g><g font-size="22"><text x="465" y="167">定义 对象与责任</text><text x="465" y="247">原问题 目标与必要性</text><text x="465" y="327">不变量 时序与适用前提</text><text x="465" y="407">现象 假设与区分性检查</text><text x="465" y="487">约束 成本与反例</text><text x="465" y="567">完成条件 故障覆盖与真实结果</text></g><g stroke="#667e90" stroke-width="2"><path d="M410 157H445 M410 237H445 M410 317H445 M410 397H445 M410 477H445 M410 557H445"/></g><text x="40" y="650" font-size="22">问题决定展开到哪一层；没有执行的验证要明确保留为计划</text></g></svg>
