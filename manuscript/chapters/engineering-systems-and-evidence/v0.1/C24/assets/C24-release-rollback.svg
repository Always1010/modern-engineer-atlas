<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">同一制品逐级推广 回滚另有数据前提</title><desc id="desc">构建、验证和推广绑定同一制品，代码配置恢复与数据协议恢复分别检查。</desc><metadata>原创教学图；现代软件工程师能力地图；C24；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">同一制品逐级推广 回滚另有数据前提</text><rect x="45" y="115" width="270" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="180.0" y="151" text-anchor="middle" class="b">受控构建</text><text x="180.0" y="185" text-anchor="middle" class="t">源码、依赖、工具链</text><text x="180.0" y="214" text-anchor="middle" class="t">只构建一次</text><rect x="425" y="115" width="270" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="151" text-anchor="middle" class="b">候选制品</text><text x="560.0" y="185" text-anchor="middle" class="t">摘要与符号绑定</text><text x="560.0" y="214" text-anchor="middle" class="t">验证针对相同字节</text><rect x="805" y="115" width="270" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="940.0" y="151" text-anchor="middle" class="b">渐进推广</text><text x="940.0" y="185" text-anchor="middle" class="t">有限范围与对照</text><text x="940.0" y="214" text-anchor="middle" class="t">观测决定继续或停止</text><path d="M315 180 L420 180" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M695 180 L800 180" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="65" y="360" width="445" height="155" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="287.5" y="396" text-anchor="middle" class="b">代码与配置恢复</text><text x="287.5" y="430" text-anchor="middle" class="t">旧制品仍需配置兼容</text><text x="287.5" y="459" text-anchor="middle" class="t">启动成功不等于业务恢复</text><text x="287.5" y="488" text-anchor="middle" class="t">恢复后继续观测</text><rect x="610" y="360" width="445" height="155" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="832.5" y="396" text-anchor="middle" class="b">数据与协议恢复</text><text x="832.5" y="430" text-anchor="middle" class="t">新数据能否被旧版理解</text><text x="832.5" y="459" text-anchor="middle" class="t">外部副作用不能随代码倒退</text><text x="832.5" y="488" text-anchor="middle" class="t">不可逆阶段须提前说明</text><text x="560" y="595" class="n" text-anchor="middle">发布前证明恢复方向；发布中保存身份；发布后验证实际状态</text></svg>