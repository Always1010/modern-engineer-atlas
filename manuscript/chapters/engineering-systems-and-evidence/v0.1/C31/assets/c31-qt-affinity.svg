<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Qt 的线程边界也是事件与生命期边界</title><desc id="desc">左右为GUI线程和工作线程，双向数据交付使用请求标识与结果快照。</desc><metadata>本书原创教学图；2026-10-03；非框架截图、非实测轨迹。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">Qt 的线程边界也是事件与生命期边界</text><rect x="50" y="112" width="490" height="152" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="148" font-size="24" font-weight="bold">GUI 线程</text><text x="70" y="185" font-size="21">窗口、控件、视图与模型更新</text><text x="70" y="216" font-size="21">QThread 对象通常也由此线程拥有</text><text x="70" y="247" font-size="21">保持 GUI 事件循环可响应</text><rect x="660" y="112" width="490" height="152" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="680" y="148" font-size="24" font-weight="bold">工作线程</text><text x="680" y="185" font-size="21">工作 QObject 归属此线程</text><text x="680" y="216" font-size="21">串口、定时器等按归属使用</text><text x="680" y="247" font-size="21">事件循环需要实际获得运行机会</text><path d="M545 315 L650 315" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="150" y="323" font-size="22">请求 ID 与拥有明确的数据</text><path d="M650 368 L545 368" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="702" y="375" font-size="22">结果快照与终态通知</text><rect x="50" y="443" width="490" height="133" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="479" font-size="24" font-weight="bold">接纳结果前</text><text x="70" y="516" font-size="21">核对会话代数与当前请求</text><text x="70" y="547" font-size="21">对象活着也不代表结果仍有效</text><rect x="660" y="443" width="490" height="133" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="680" y="479" font-size="24" font-weight="bold">执行长任务时</text><text x="680" y="516" font-size="21">排队取消槽可能暂时无法运行</text><text x="680" y="547" font-size="21">分片或检查同步的停止请求</text><text x="50" y="635" font-size="23">排队连接提供交付方式，不自动保证参数生命期或业务状态正确</text></g></svg>