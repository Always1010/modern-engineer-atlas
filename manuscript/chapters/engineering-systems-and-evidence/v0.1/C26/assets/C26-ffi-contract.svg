<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">跨语言安全依赖共同满足的契约</title><desc id="desc">Rust安全接口与C++实现之间的FFI明确五类责任，外层系统仍需要权限、资源和运行防护。</desc><metadata>原创教学图；现代软件工程师能力地图；C26；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">跨语言安全依赖共同满足的契约</text><rect x="45" y="135" width="285" height="200" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="187.5" y="171" text-anchor="middle" class="b">Rust安全接口</text><text x="187.5" y="205" text-anchor="middle" class="t">拥有权与借用约束</text><text x="187.5" y="234" text-anchor="middle" class="t">可验证的安全封装</text><text x="187.5" y="263" text-anchor="middle" class="t">unsafe前提集中审查</text><rect x="405" y="105" width="310" height="290" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="141" text-anchor="middle" class="b">FFI共同契约</text><text x="560.0" y="175" text-anchor="middle" class="t">布局与调用约定</text><text x="560.0" y="204" text-anchor="middle" class="t">分配与释放责任</text><text x="560.0" y="233" text-anchor="middle" class="t">借用期限与线程资格</text><text x="560.0" y="262" text-anchor="middle" class="t">异常与panic边界</text><text x="560.0" y="291" text-anchor="middle" class="t">异步完成与取消</text><rect x="790" y="135" width="285" height="200" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="932.5" y="171" text-anchor="middle" class="b">C++遗留实现</text><text x="932.5" y="205" text-anchor="middle" class="t">真实满足接口前提</text><text x="932.5" y="234" text-anchor="middle" class="t">不保存过期借用</text><text x="932.5" y="263" text-anchor="middle" class="t">资源与错误按约定处理</text><path d="M330 235 L400 235" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M715 235 L785 235" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="155" y="475" width="810" height="115" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="511" text-anchor="middle" class="b">系统外层防护仍然必要</text><text x="560.0" y="545" text-anchor="middle" class="t">授权、输入预算、进程隔离、秘密管理与运行验证</text></svg>