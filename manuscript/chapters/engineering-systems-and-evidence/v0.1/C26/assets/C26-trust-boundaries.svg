<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">解析路径上的信任与权限边界</title><desc id="desc">不可信输入进入低权限解析进程，可信提交层独立检查授权与语义；秘密和其他租户数据不直接暴露。</desc><metadata>原创教学图；现代软件工程师能力地图；C26；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">解析路径上的信任与权限边界</text><rect x="45" y="120" width="300" height="160" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="195.0" y="156" text-anchor="middle" class="b">不可信输入</text><text x="195.0" y="190" text-anchor="middle" class="t">内容、名称、长度、频率</text><text x="195.0" y="219" text-anchor="middle" class="t">身份合法仍需验证结构</text><text x="195.0" y="248" text-anchor="middle" class="t">接收阶段执行资源限额</text><rect x="410" y="120" width="300" height="160" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="156" text-anchor="middle" class="b">低权限解析进程</text><text x="560.0" y="190" text-anchor="middle" class="t">只读指定输入</text><text x="560.0" y="219" text-anchor="middle" class="t">受控输出与资源预算</text><text x="560.0" y="248" text-anchor="middle" class="t">无任意网络和秘密权限</text><rect x="775" y="120" width="300" height="160" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="925.0" y="156" text-anchor="middle" class="b">可信提交边界</text><text x="925.0" y="190" text-anchor="middle" class="t">再次核对语义与授权</text><text x="925.0" y="219" text-anchor="middle" class="t">确定输出所属租户</text><text x="925.0" y="248" text-anchor="middle" class="t">按契约提交业务结果</text><path d="M345 200 L405 200" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M710 200 L770 200" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M375 95 V545 M745 95 V545" stroke="#a45c40" stroke-width="2" stroke-dasharray="8 7"/><rect x="80" y="385" width="400" height="125" rx="12" fill="#f8eee9" stroke="#536b80" stroke-width="2"/><text x="280.0" y="421" text-anchor="middle" class="b">秘密与其他租户数据</text><text x="280.0" y="455" text-anchor="middle" class="t">不直接暴露给解析器</text><text x="280.0" y="484" text-anchor="middle" class="t">访问必须经过授权边界</text><rect x="630" y="385" width="400" height="125" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="830.0" y="421" text-anchor="middle" class="b">失败与运行观察</text><text x="830.0" y="455" text-anchor="middle" class="t">安全拒绝、最少必要日志</text><text x="830.0" y="484" text-anchor="middle" class="t">保留诊断但不泄露内容</text><text x="560" y="609" class="n" text-anchor="middle">虚线表示信任边界；验证减少错误，隔离限制错误后果</text></svg>