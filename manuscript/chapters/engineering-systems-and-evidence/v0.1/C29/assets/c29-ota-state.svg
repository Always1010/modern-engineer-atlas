<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">OTA 成功要经过试运行与确认</title><desc id="desc">旧版、候选、新版试运行、恢复旧版和确认新版的状态关系。</desc><metadata>原创教学图；2026-10-03；作者推演，非实测；现代软件工程师能力地图。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">OTA 成功要经过试运行与确认</text><rect x="50" y="110" width="315" height="137" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="70" y="145" font-size="24" font-weight="bold">旧版已确认</text><text x="70" y="180" font-size="21">保持可启动镜像</text><text x="70" y="211" font-size="21">保留必要数据兼容性</text><rect x="442" y="110" width="315" height="137" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="462" y="145" font-size="24" font-weight="bold">下载与验证候选</text><text x="462" y="180" font-size="21">硬件适配、长度与签名</text><text x="462" y="211" font-size="21">失败仍使用旧版</text><rect x="835" y="110" width="315" height="137" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="855" y="145" font-size="24" font-weight="bold">试运行新版</text><text x="855" y="180" font-size="21">有界健康检查</text><text x="855" y="211" font-size="21">尚未确认不能算成功</text><path d="M370 178 L432 178" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M762 178 L825 178" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="390" width="465" height="145" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="70" y="425" font-size="24" font-weight="bold">恢复可用旧版</text><text x="70" y="460" font-size="21">需符合最低安全版本策略</text><text x="70" y="491" font-size="21">数据迁移不能使旧版失效</text><rect x="685" y="390" width="465" height="145" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="705" y="425" font-size="24" font-weight="bold">确认新版</text><text x="705" y="460" font-size="21">持久记录健康状态</text><text x="705" y="491" font-size="21">按受控策略推进安全版本</text><path d="M990 251 L990 330 L920 330 L920 378" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1005" y="328" font-size="21">通过</text><path d="M910 251 L910 308 L280 308 L280 378" stroke="#a36042" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="430" y="340" font-size="21">失败、复位或未按策略确认</text><text x="50" y="608" font-size="23">镜像回滚不撤销现实副作用；每个转换都要考虑中途掉电</text></g></svg>