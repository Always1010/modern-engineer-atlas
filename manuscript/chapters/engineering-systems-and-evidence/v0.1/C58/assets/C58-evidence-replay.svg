<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630"><title>回放与真实执行拥有不同出口</title><desc>共同输入证据进入离线回放或受控真实验证；结果核对保留未通过与未知，不把模拟当作真实执行。</desc><metadata>Original educational illustration; 2026-10-03; no experimental result.</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="50" y="57" class="title" text-anchor="start">回放与真实执行拥有不同出口</text><rect x="355" y="114" width="450" height="92" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="152.0" class="label" text-anchor="middle">保存输入 版本与时间</text><text x="580.0" y="182.0" class="small" text-anchor="middle">记录来源、范围与已知缺口</text><path d="M468,214 L282,294" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M692,214 L885,294" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="305" width="370" height="105" rx="9" fill="#edf3fa" stroke="#8fa8bc" stroke-width="2"/><text x="280.0" y="349.5" class="label" text-anchor="middle">离线回放</text><text x="280.0" y="379.5" class="small" text-anchor="middle">受控输入 / 模拟输出</text><rect x="695" y="305" width="370" height="105" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="880.0" y="349.5" class="label" text-anchor="middle">受控真实验证</text><text x="880.0" y="379.5" class="small" text-anchor="middle">明确权限 / 硬件与资源边界</text><path d="M280,419 L468,483" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M880,419 L690,483" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="489" width="460" height="80" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="521.0" class="label" text-anchor="middle">核对结果与证据</text><text x="580.0" y="551.0" class="small" text-anchor="middle">已验证、未通过、未知分别报告</text><text x="55" y="609" class="note" text-anchor="start">回放不自动重新执行机器人动作或外部写入</text></svg>