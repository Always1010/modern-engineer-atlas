<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">测试同时需要搜索能力与判断能力</title><desc id="desc">输入生成与独立判据共同决定执行的价值，覆盖只是搜索反馈，失败需要缩减并保存为回归。</desc><metadata>原创教学图；现代软件工程师能力地图；C23；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">测试同时需要搜索能力与判断能力</text><rect x="55" y="115" width="455" height="135" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="282.5" y="151" text-anchor="middle" class="b">输入探索</text><text x="282.5" y="185" text-anchor="middle" class="t">正常结构、边界、非法变体</text><text x="282.5" y="214" text-anchor="middle" class="t">生成器决定实际搜索范围</text><rect x="610" y="115" width="455" height="135" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="837.5" y="151" text-anchor="middle" class="b">独立判据</text><text x="837.5" y="185" text-anchor="middle" class="t">需求、规范、数学性质、模型</text><text x="837.5" y="214" text-anchor="middle" class="t">不能只复制被测实现</text><path d="M285 250 L430 340" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M835 250 L690 340" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="345" width="430" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="381" text-anchor="middle" class="b">执行与判断</text><text x="560.0" y="415" text-anchor="middle" class="t">失败、通过或不可判定</text><text x="560.0" y="444" text-anchor="middle" class="t">保留环境与输入身份</text><path d="M345 410 L270 410" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="45" y="345" width="220" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="155.0" y="381" text-anchor="middle" class="b">覆盖反馈</text><text x="155.0" y="415" text-anchor="middle" class="t">帮助继续搜索</text><text x="155.0" y="444" text-anchor="middle" class="t">不定义正确性</text><path d="M775 410 L855 410" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="860" y="345" width="220" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="970.0" y="381" text-anchor="middle" class="b">失败缩减</text><text x="970.0" y="415" text-anchor="middle" class="t">保留触发机制</text><text x="970.0" y="444" text-anchor="middle" class="t">固定回归样本</text><text x="560" y="570" class="n" text-anchor="middle">往返一致也可能共享错误；多个实现一致也不是规范</text><text x="560" y="614" class="n" text-anchor="middle">输入数量、运行时长、覆盖率都需配合有效判据解释</text></svg>