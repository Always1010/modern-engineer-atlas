<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img"><title>请求路径上的每个等待点都有容量</title><desc>连接接收、执行队列、业务和下游、连接输出都有限额。下游反馈回入口，全局预算约束所有连接之和。</desc><metadata>本书原创教学图；2026-10-03；构造场景，非实测记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">请求路径上的每个等待点都有容量</text><rect x="45" y="160" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="145.0" y="209.5" class="label" text-anchor="middle">连接接收</text><text x="145.0" y="239.5" class="small" text-anchor="middle">限制字节与消息</text><rect x="335" y="160" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="435.0" y="209.5" class="label" text-anchor="middle">执行队列</text><text x="435.0" y="239.5" class="small" text-anchor="middle">限制数量与期限</text><rect x="625" y="160" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="725.0" y="209.5" class="label" text-anchor="middle">业务和下游</text><text x="725.0" y="239.5" class="small" text-anchor="middle">限制并发与成本</text><rect x="915" y="160" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1015.0" y="209.5" class="label" text-anchor="middle">连接输出</text><text x="1015.0" y="239.5" class="small" text-anchor="middle">限制积压和保留</text><path d="M245,211 L325,211" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M535,211 L615,211" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M825,211 L905,211" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020,328 L135,328" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="367" class="small" text-anchor="middle">容量反馈沿路径返回，入口停止接收或明确拒绝</text><rect x="245" y="421" width="670" height="93" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="459.5" class="label" text-anchor="middle">全局与租户预算共同约束</text><text x="580.0" y="489.5" class="small" text-anchor="middle">每连接有界，不代表全进程总量有界</text><text x="55" y="575" class="note" text-anchor="start">取消与完成回到原请求所有者；不存在无界旁路缓存</text></svg>