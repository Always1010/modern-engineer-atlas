<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img"><title>发送成功与业务完成不是同一边界</title><desc>从本地接受字节到对端接收、业务提交及客户端收到响应分为四层。提交之后丢失响应会形成结果未知。</desc><metadata>本书原创教学图；2026-10-03；构造场景，非实测记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">发送成功与业务完成不是同一边界</text><rect x="45" y="140" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="145.0" y="189.5" class="label" text-anchor="middle">本地发送</text><text x="145.0" y="219.5" class="small" text-anchor="middle">接受部分或全部字节</text><rect x="335" y="140" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="435.0" y="189.5" class="label" text-anchor="middle">对端传输层</text><text x="435.0" y="219.5" class="small" text-anchor="middle">收到字节并确认</text><rect x="625" y="140" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="725.0" y="189.5" class="label" text-anchor="middle">远端业务</text><text x="725.0" y="219.5" class="small" text-anchor="middle">执行并达到提交边界</text><rect x="915" y="140" width="200" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1015.0" y="189.5" class="label" text-anchor="middle">客户端结果</text><text x="1015.0" y="219.5" class="small" text-anchor="middle">收到并解析响应</text><path d="M245,197 L325,197" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M535,197 L615,197" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M825,197 L905,197" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="355" width="460" height="100" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="397.0" class="label" text-anchor="middle">响应途中丢失</text><text x="580.0" y="427.0" class="small" text-anchor="middle">提交可能已完成，客户端仍不知道</text><path d="M825,260 L720,345" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="540" class="note" text-anchor="start">连接标识、请求标识、业务操作标识分别管理不同事实</text><text x="55" y="580" class="note" text-anchor="start">恢复使用稳定操作标识核查结果，不把超时等同于未执行</text></svg>