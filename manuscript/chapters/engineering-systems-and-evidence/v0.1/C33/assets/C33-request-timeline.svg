<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img"><title>先定位延迟阶段 再解释原因</title><desc>请求经过发现和池等待、建连握手、服务排队、业务工作、读取结果。诊断将各段时间与同一请求证据相连。</desc><metadata>本书原创教学图；2026-10-03；构造场景，非实测记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">先定位延迟阶段 再解释原因</text><rect x="42" y="155" width="165" height="112" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="124.5" y="203.0" class="label" text-anchor="middle">发现与借用</text><text x="124.5" y="233.0" class="small" text-anchor="middle">DNS / 池等待</text><rect x="272" y="155" width="165" height="112" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="354.5" y="203.0" class="label" text-anchor="middle">建立通道</text><text x="354.5" y="233.0" class="small" text-anchor="middle">TCP / TLS</text><rect x="502" y="155" width="165" height="112" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="584.5" y="203.0" class="label" text-anchor="middle">服务排队</text><text x="584.5" y="233.0" class="small" text-anchor="middle">等待执行资格</text><rect x="732" y="155" width="165" height="112" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="814.5" y="203.0" class="label" text-anchor="middle">业务工作</text><text x="814.5" y="233.0" class="small" text-anchor="middle">计算 / 下游</text><rect x="962" y="155" width="165" height="112" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1044.5" y="203.0" class="label" text-anchor="middle">接收结果</text><text x="1044.5" y="233.0" class="small" text-anchor="middle">首字节 / 完整响应</text><path d="M207,210 L264,210" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M437,210 L494,210" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M667,210 L724,210" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M897,210 L954,210" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M55,310 V333 H1110 V310" fill="none" stroke="#537086" stroke-width="3"/><text x="580" y="375" class="label" text-anchor="middle">同一请求的端到端观察区间</text><rect x="130" y="424" width="900" height="94" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="463.0" class="label" text-anchor="middle">阶段时间与证据身份相连</text><text x="580.0" y="493.0" class="small" text-anchor="middle">请求 / 实例 / 版本 / 采集位置 / 时钟关系</text><text x="55" y="576" class="note" text-anchor="start">未同步机器的时间戳不能直接相减作为单向网络延迟</text></svg>