<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">构建图记录真实输入与生成顺序</title><desc id="desc">协议描述和宿主生成器共同生成头文件，解析源码与头文件决定解析库，程序链接解析库。</desc><metadata>原创教学图；现代软件工程师能力地图；C21；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">构建图记录真实输入与生成顺序</text><rect x="45" y="115" width="240" height="135" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="165.0" y="151" text-anchor="middle" class="b">协议描述</text><text x="165.0" y="185" text-anchor="middle" class="t">字段与编码约定</text><rect x="345" y="115" width="240" height="135" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="465.0" y="151" text-anchor="middle" class="b">宿主代码生成器</text><text x="465.0" y="185" text-anchor="middle" class="t">程序和配置也是输入</text><rect x="665" y="115" width="390" height="135" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="860.0" y="151" text-anchor="middle" class="b">解析源文件</text><text x="860.0" y="185" text-anchor="middle" class="t">显式包含生成头文件</text><path d="M165 250 L370 340" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M465 250 L465 335" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="295" y="340" width="340" height="120" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="465.0" y="376" text-anchor="middle" class="b">生成头文件</text><text x="465.0" y="410" text-anchor="middle" class="t">单一受控生成动作</text><path d="M635 400 L715 400" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M860 250 L860 335" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="720" y="340" width="290" height="120" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="865.0" y="376" text-anchor="middle" class="b">解析库</text><text x="865.0" y="410" text-anchor="middle" class="t">编译所得对象与归档</text><path d="M860 460 L860 515" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="720" y="520" width="290" height="110" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="865.0" y="556" text-anchor="middle" class="b">命令行程序</text><text x="865.0" y="590" text-anchor="middle" class="t">最终链接依赖闭包</text><text x="55" y="535" class="n">缺失边 → 旧结果或并行竞争</text><text x="55" y="577" class="n">多余边 → 不必要的重建</text><text x="55" y="619" class="n">构建正确性先于加速</text></svg>