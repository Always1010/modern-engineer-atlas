<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">交叉编译分开宿主执行与目标执行</title><desc id="desc">宿主负责运行工具，目标提供头文件和库契约，二者共同决定最终目标制品；编译成功不等于目标验证完成。</desc><metadata>原创教学图；现代软件工程师能力地图；C21；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">交叉编译分开宿主执行与目标执行</text><rect x="55" y="115" width="465" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="287.5" y="151" text-anchor="middle" class="b">宿主环境</text><text x="287.5" y="185" text-anchor="middle" class="t">运行编译器与代码生成器</text><text x="287.5" y="214" text-anchor="middle" class="t">例：x86-64 Linux</text><rect x="600" y="115" width="465" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="832.5" y="151" text-anchor="middle" class="b">目标环境</text><text x="832.5" y="185" text-anchor="middle" class="t">最终程序的运行契约</text><text x="832.5" y="214" text-anchor="middle" class="t">例：AArch64 Linux</text><rect x="55" y="325" width="465" height="140" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="287.5" y="361" text-anchor="middle" class="b">宿主工具</text><text x="287.5" y="395" text-anchor="middle" class="t">代码生成器先在宿主运行</text><text x="287.5" y="424" text-anchor="middle" class="t">生成与架构无关的协议源码</text><rect x="600" y="325" width="465" height="140" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="832.5" y="361" text-anchor="middle" class="b">目标材料</text><text x="832.5" y="395" text-anchor="middle" class="t">sysroot 提供目标头文件和库</text><text x="832.5" y="424" text-anchor="middle" class="t">目标指令集与运行库保持一致</text><path d="M285 245 L285 320" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M835 245 L835 320" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M285 465 L440 535" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M835 465 L680 535" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="540" width="430" height="105" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="576" text-anchor="middle" class="b">目标制品</text><text x="560.0" y="610" text-anchor="middle" class="t">还需在目标环境验证</text></svg>