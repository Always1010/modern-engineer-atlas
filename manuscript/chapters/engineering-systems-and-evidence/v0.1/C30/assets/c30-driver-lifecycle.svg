<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">驱动生命期需要双向证明</title><desc id="desc">上行从取得资源到公开服务，下行从禁止新访问到排空活动并释放。</desc><metadata>本书原创；2026-10-03；教学示意，非实测数据。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">驱动生命期需要双向证明</text><rect x="50" y="108" width="320" height="150" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="144" font-size="24" font-weight="bold">取得与验证资源</text><text x="70" y="181" font-size="21">身份、寄存器、时钟</text><text x="70" y="212" font-size="21">DMA 能力与缓冲</text><rect x="440" y="108" width="320" height="150" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="460" y="144" font-size="24" font-weight="bold">建立可运行状态</text><text x="460" y="181" font-size="21">配置硬件与 IRQ</text><text x="460" y="212" font-size="21">初始化完整后再公开</text><rect x="830" y="108" width="320" height="150" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="850" y="144" font-size="24" font-weight="bold">提供用户服务</text><text x="850" y="181" font-size="21">允许打开和提交</text><text x="850" y="212" font-size="21">记录在途请求与引用</text><path d="M375 183 L430 183" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M765 183 L820 183" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="374" width="320" height="172" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="410" font-size="24" font-weight="bold">停止新访问</text><text x="70" y="447" font-size="21">标记设备不可用</text><text x="70" y="478" font-size="21">关闭新请求入口</text><text x="70" y="509" font-size="21">通知现有会话</text><rect x="440" y="374" width="320" height="172" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="460" y="410" font-size="24" font-weight="bold">排空活动与引用</text><text x="460" y="447" font-size="21">停止或等待 DMA</text><text x="460" y="478" font-size="21">同步 IRQ 与异步工作</text><text x="460" y="509" font-size="21">证明不再使用资源</text><rect x="830" y="374" width="320" height="172" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="850" y="410" font-size="24" font-weight="bold">释放与解绑</text><text x="850" y="447" font-size="21">释放缓冲与映射</text><text x="850" y="478" font-size="21">撤销已取得资源</text><text x="850" y="509" font-size="21">devm 只是辅助机制</text><path d="M375 458 L430 458" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M765 458 L820 458" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="50" y="626" font-size="23">公开服务是并发边界；自动释放资源不能证明硬件和回调已经停止</text></g></svg>