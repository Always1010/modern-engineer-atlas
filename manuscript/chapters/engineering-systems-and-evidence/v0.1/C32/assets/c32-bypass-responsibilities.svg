<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">三种路径改变的是责任分配</title><desc id="desc">并列比较内核网络栈、DPDK类旁路和RDMA的工作方式与必须承担的责任。</desc><metadata>本书原创；2026-10-03；教学路径示意，不对应照片旧式网卡能力；无实测数字。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">三种路径改变的是责任分配</text><rect x="50" y="114" width="345" height="330" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="68" y="148" font-size="23" font-weight="bold">传统内核网络栈</text><text x="68" y="182" font-size="20">应用通过 socket 等接口</text><text x="68" y="212" font-size="20">内核管理通用协议路径</text><text x="68" y="242" font-size="20">驱动与 NIC 共同收发</text><text x="68" y="272" font-size="20"></text><text x="68" y="302" font-size="20">需要评估：</text><text x="68" y="332" font-size="20">系统调用、排队与复制</text><text x="68" y="362" font-size="20">保留成熟管理与观测生态</text><rect x="427" y="114" width="345" height="330" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="445" y="148" font-size="23" font-weight="bold">DPDK 类包处理</text><text x="445" y="182" font-size="20">应用显式轮询与批处理</text><text x="445" y="212" font-size="20">管理包缓冲和队列所有权</text><text x="445" y="242" font-size="20">设备访问模式依 PMD</text><text x="445" y="272" font-size="20"></text><text x="445" y="302" font-size="20">需要评估：</text><text x="445" y="332" font-size="20">专用核心与内存成本</text><text x="445" y="362" font-size="20">协议、权限与监控责任</text><rect x="804" y="114" width="345" height="330" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="822" y="148" font-size="23" font-weight="bold">RDMA 通信</text><text x="822" y="182" font-size="20">使用注册内存与工作队列</text><text x="822" y="212" font-size="20">NIC 执行适用远程操作</text><text x="822" y="242" font-size="20">通过完成协议回收资源</text><text x="822" y="272" font-size="20"></text><text x="822" y="302" font-size="20">需要评估：</text><text x="822" y="332" font-size="20">注册、权限、键与生命期</text><text x="822" y="362" font-size="20">网络条件与应用提交语义</text><rect x="50" y="495" width="1100" height="114" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="68" y="529" font-size="23" font-weight="bold">共同前提</text><text x="68" y="563" font-size="20">硬件与驱动支持、DMA 隔离、失败恢复、可验证的完成语义，以及可维护的观测能力</text><text x="50" y="670" font-size="23">比较同一业务、数据形态与完成边界，不能只比较技术名称</text></g></svg>