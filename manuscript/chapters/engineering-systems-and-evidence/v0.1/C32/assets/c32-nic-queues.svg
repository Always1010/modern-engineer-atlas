<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">接收分流需要与核心及内存位置一起设计</title><desc id="desc">报文经RSS映射分配给三条接收队列，再由相应核心处理，强调单大流与局部性。</desc><metadata>本书原创；2026-10-03；教学路径示意，不对应照片旧式网卡能力；无实测数字。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">接收分流需要与核心及内存位置一起设计</text><rect x="50" y="235" width="245" height="175" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="68" y="269" font-size="23" font-weight="bold">报文流量</text><text x="68" y="303" font-size="20">同流字段参与哈希</text><text x="68" y="333" font-size="20">大流仍可能集中</text><text x="68" y="363" font-size="20">并非逐包平均轮转</text><rect x="347" y="235" width="230" height="175" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="365" y="269" font-size="23" font-weight="bold">NIC 分流</text><text x="365" y="303" font-size="20">RSS 与映射表</text><text x="365" y="333" font-size="20">选择接收队列</text><text x="365" y="363" font-size="20">DMA 写入缓冲</text><path d="M301 322 L337 322" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="637" y="108" width="248" height="122" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="655" y="142" font-size="23" font-weight="bold">接收队列 0</text><text x="655" y="176" font-size="20">描述符 + 数据缓冲</text><text x="655" y="206" font-size="20">补充与回收都有成本</text><rect x="950" y="108" width="200" height="122" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="968" y="142" font-size="23" font-weight="bold">处理核心 0</text><text x="968" y="176" font-size="20">核对亲和性</text><text x="968" y="206" font-size="20">核对 NUMA</text><path d="M891 168 L940 168" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M582 322 L606 322 L606 168 L627 168" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="637" y="278" width="248" height="122" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="655" y="312" font-size="23" font-weight="bold">接收队列 1</text><text x="655" y="346" font-size="20">描述符 + 数据缓冲</text><text x="655" y="376" font-size="20">补充与回收都有成本</text><rect x="950" y="278" width="200" height="122" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="968" y="312" font-size="23" font-weight="bold">处理核心 1</text><text x="968" y="346" font-size="20">核对亲和性</text><text x="968" y="376" font-size="20">核对 NUMA</text><path d="M891 338 L940 338" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M582 322 L606 322 L606 338 L627 338" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="637" y="448" width="248" height="122" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="655" y="482" font-size="23" font-weight="bold">接收队列 2</text><text x="655" y="516" font-size="20">描述符 + 数据缓冲</text><text x="655" y="546" font-size="20">补充与回收都有成本</text><rect x="950" y="448" width="200" height="122" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="968" y="482" font-size="23" font-weight="bold">处理核心 2</text><text x="968" y="516" font-size="20">核对亲和性</text><text x="968" y="546" font-size="20">核对 NUMA</text><path d="M891 508 L940 508" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M582 322 L606 322 L606 508 L627 508" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="50" y="638" font-size="23">按队列观察负载，整机平均空闲不排除一个队列已经过载</text><text x="50" y="680" font-size="21">拓扑为教学例子；真实队列、中断、核心和内存节点关系以设备与配置为准</text></g></svg>