<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">用户目标通过指标和预算影响工程决策</title><desc id="desc">好事件定义形成SLI和预算，短期消耗提示风险，工程动作与测量复核共同改善可靠性。</desc><metadata>原创教学图；现代软件工程师能力地图；C27；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">用户目标通过指标和预算影响工程决策</text><rect x="45" y="115" width="300" height="150" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="195.0" y="151" text-anchor="middle" class="b">用户承诺</text><text x="195.0" y="185" text-anchor="middle" class="t">什么结果算好</text><text x="195.0" y="214" text-anchor="middle" class="t">在哪测、分母是什么</text><text x="195.0" y="243" text-anchor="middle" class="t">窗口与关键分组</text><rect x="410" y="115" width="300" height="150" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="151" text-anchor="middle" class="b">SLI与预算</text><text x="560.0" y="185" text-anchor="middle" class="t">好事件 ÷ 有效事件</text><text x="560.0" y="214" text-anchor="middle" class="t">目标99.9% → 允许0.1%</text><text x="560.0" y="243" text-anchor="middle" class="t">请求预算不等于停机时间</text><rect x="775" y="115" width="300" height="150" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="925.0" y="151" text-anchor="middle" class="b">短期消耗</text><text x="925.0" y="185" text-anchor="middle" class="t">坏事件2% ÷ 0.1%</text><text x="925.0" y="214" text-anchor="middle" class="t">教学例：20倍消耗速率</text><text x="925.0" y="243" text-anchor="middle" class="t">多窗口判断影响是否持续</text><path d="M345 190 L405 190" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M710 190 L770 190" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="95" y="390" width="420" height="145" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="305.0" y="426" text-anchor="middle" class="b">工程行动</text><text x="305.0" y="460" text-anchor="middle" class="t">告警、恢复、发布与可靠性投入</text><text x="305.0" y="489" text-anchor="middle" class="t">按预设策略和授权决策</text><text x="305.0" y="518" text-anchor="middle" class="t">安全与数据不变量仍须保持</text><rect x="605" y="390" width="420" height="145" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="815.0" y="426" text-anchor="middle" class="b">观察与复核</text><text x="815.0" y="460" text-anchor="middle" class="t">测量链缺口必须可见</text><text x="815.0" y="489" text-anchor="middle" class="t">用户变化驱动目标调整</text><text x="815.0" y="518" text-anchor="middle" class="t">资源信号帮助解释原因</text><text x="560" y="610" class="n" text-anchor="middle">示例数字为假设推导；预算不能用于掩盖用户影响</text></svg>