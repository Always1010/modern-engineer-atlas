<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">C04-A 一个值与两种字节排列</title>
<desc id="desc">整数 0x12345678 以大端序排列为 12 34 56 78，以小端序排列为 78 56 34 12。每格八位，左边代表外部序列中靠前的位置。接收方按照协议指定的规则解码，再得到同一个整数值。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs>
<rect width="1000" height="540" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#111">
<text x="32" y="43" font-size="25" font-weight="bold">C04-A  一个值与两种字节排列</text>
<text x="32" y="83" font-size="22">值：0x12345678　　每格：一个八位字节</text>
<text x="248" y="134" font-size="21">在外部序列中的位置：从前到后</text>
<path d="M670 128H920" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="36" y="201" font-size="23" font-weight="bold">大端序</text>
<text x="36" y="233" font-size="21">高位字节先出现</text>
<g stroke="#222" stroke-width="2"><rect x="250" y="162" width="160" height="78" fill="#dbe6ed"/><rect x="410" y="162" width="160" height="78" fill="#edf2f5"/><rect x="570" y="162" width="160" height="78" fill="#f6f6f6"/><rect x="730" y="162" width="160" height="78" fill="#fff"/></g>
<g font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle"><text x="330" y="213">12</text><text x="490" y="213">34</text><text x="650" y="213">56</text><text x="810" y="213">78</text></g>
<text x="36" y="331" font-size="23" font-weight="bold">小端序</text>
<text x="36" y="363" font-size="21">低位字节先出现</text>
<g stroke="#222" stroke-width="2"><rect x="250" y="292" width="160" height="78" fill="#fff"/><rect x="410" y="292" width="160" height="78" fill="#f6f6f6"/><rect x="570" y="292" width="160" height="78" fill="#edf2f5"/><rect x="730" y="292" width="160" height="78" fill="#dbe6ed"/></g>
<g font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle"><text x="330" y="343">78</text><text x="490" y="343">56</text><text x="650" y="343">34</text><text x="810" y="343">12</text></g>
<path d="M570 388V431" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="459" font-size="23" font-weight="bold">接收方按约定解码，得到相同的值。</text>
<text x="32" y="503" font-size="22">外部格式规定排列；接收机器的本机字节序不改变这个约定。</text>
</g></svg>
