<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">C04-B 字节 码点与字素簇</title>
<desc id="desc">示例 Aé中😀 共有四个码点，UTF-8 字节依次为 41、C3 A9、E4 B8 AD、F0 9F 98 80，共十字节；UTF-16 需要五个码元。预组合 é 为一个码点，e 加组合重音为两个码点，两者都为一个扩展字素簇，规范等价但字节不同。</desc>
<rect width="1000" height="690" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#111">
<text x="32" y="43" font-size="25" font-weight="bold">C04-B  字节 码点与字素簇</text>
<text x="32" y="84" font-size="22">上方示例恰好是四个字素簇；这种相等并不适用于任意文本。</text>
<g text-anchor="middle">
<text x="155" y="151" font-size="36">A</text><text x="380" y="151" font-size="36">é</text><text x="605" y="151" font-size="36">中</text><path aria-label="😀" d="M642 1023Q642 1082 682.5 1122.5Q723 1163 782 1163Q840 1163 881.0 1122.5Q922 1082 922 1023Q922 965 881.0 923.5Q840 882 782 882Q723 882 682.5 923.5Q642 965 642 1023ZM1220 1023Q1220 1082 1261.0 1122.5Q1302 1163 1360.0 1163.0Q1418 1163 1459.5 1122.5Q1501 1082 1501 1023Q1501 965 1459.5 923.5Q1418 882 1360 882Q1301 882 1260.5 923.5Q1220 965 1220 1023ZM305 746Q305 430 528.5 207.5Q752 -15 1068 -15Q1385 -15 1607.5 207.5Q1830 430 1830 746Q1830 1063 1607.5 1287.0Q1385 1511 1068 1511Q752 1511 528.5 1287.0Q305 1063 305 746ZM170 746Q170 1119 433.0 1382.5Q696 1646 1068 1646Q1441 1646 1703.0 1382.5Q1965 1119 1965 746Q1965 374 1703.0 112.0Q1441 -150 1068 -150Q696 -150 433.0 112.0Q170 374 170 746ZM446 736H1689Q1689 478 1507.5 297.0Q1326 116 1068.0 116.0Q810 116 628.0 297.0Q446 478 446 736ZM1136 255Q1224 266 1300 308V601H1136ZM1000 255V601H836V308Q912 266 1000 255ZM1436 419Q1508 501 1536 601H1436ZM700 417V601H599Q627 499 700 417Z" transform="translate(812.27783203125 151) scale(0.0166015625 -0.0166015625)"/>
<text x="155" y="192" font-size="22">U+0041</text><text x="380" y="192" font-size="22">U+00E9</text><text x="605" y="192" font-size="22">U+4E2D</text><text x="830" y="192" font-size="22">U+1F600</text>
</g>
<g fill="#edf2f5" stroke="#222" stroke-width="1.5"><rect x="55" y="215" width="200" height="66"/><rect x="280" y="215" width="200" height="66"/><rect x="505" y="215" width="200" height="66"/><rect x="730" y="215" width="200" height="66"/></g>
<g text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="23"><text x="155" y="257">41</text><text x="380" y="257">C3 A9</text><text x="605" y="257">E4 B8 AD</text><text x="830" y="257">F0 9F 98 80</text></g>
<g text-anchor="middle" font-size="22"><text x="155" y="319">1 字节</text><text x="380" y="319">2 字节</text><text x="605" y="319">3 字节</text><text x="830" y="319">4 字节</text></g>
<text x="32" y="369" font-size="23" font-weight="bold">UTF-8：10 字节　　码点：4 个　　UTF-16：5 个码元</text>
<path d="M32 397H968" stroke="#999" stroke-width="1"/>
<text x="32" y="440" font-size="23" font-weight="bold">同一个文字单元，还可能由不同码点序列表达</text>
<text x="48" y="491" font-size="28">é</text><text x="190" y="491" font-size="23">U+00E9</text><text x="570" y="491" font-size="22">1 码点 · 2 个 UTF-8 字节</text>
<text x="48" y="543" font-size="28">e + ◌́</text><text x="190" y="543" font-size="23">U+0065 + U+0301</text><text x="570" y="543" font-size="22">2 码点 · 3 个 UTF-8 字节</text>
<text x="32" y="598" font-size="22">这两种形式各为一个扩展字素簇，规范等价，但字节序列不同。</text>
<text x="32" y="644" font-size="21">组合重音前的虚线圆仅作说明，不属于示例实际保存的文本。</text>
</g></svg>
