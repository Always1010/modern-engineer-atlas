<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img"><title>结构化输出之后 仍然需要应用验证</title><desc>模型候选经完整性和Schema验证，再检查语义事实权限，最终接纳或拒绝；独立判据不会因模型输出而改变。</desc><metadata>本书原创教学图；2026-10-03；非真实API执行记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">结构化输出之后 仍然需要应用验证</text><rect x="45" y="145" width="230" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="160.0" y="194.5" class="label" text-anchor="middle">模型候选</text><text x="160.0" y="224.5" class="small" text-anchor="middle">可能完整但错误</text><path d="M282,203 L340,203" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="145" width="270" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="485.0" y="194.5" class="label" text-anchor="middle">结构与类型</text><text x="485.0" y="224.5" class="small" text-anchor="middle">完整性 / Schema</text><path d="M628,203 L686,203" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="696" y="145" width="410" height="115" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="901.0" y="194.5" class="label" text-anchor="middle">语义 事实与权限</text><text x="901.0" y="224.5" class="small" text-anchor="middle">单位 / 来源 / 对象 / 会话</text><path d="M900,269 L900,369" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="696" y="380" width="410" height="100" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="901.0" y="422.0" class="label" text-anchor="middle">接纳或明确拒绝</text><text x="901.0" y="452.0" class="small" text-anchor="middle">允许未知，不强迫填满</text><rect x="70" y="380" width="490" height="100" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="315.0" y="422.0" class="label" text-anchor="middle">独立判据来自应用契约</text><text x="315.0" y="452.0" class="small" text-anchor="middle">不能因生成失败就悄悄放宽限制</text><text x="55" y="560" class="note" text-anchor="start">形状合法不等于内容正确，更不等于获得外部操作权限</text></svg>