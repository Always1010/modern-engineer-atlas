<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">动态检查各有观察范围与盲区</title><desc id="desc">四种动态检查工具分别观察地址、同步、操作语义和值定义的一部分，均不构成完整正确性证明。</desc><metadata>原创教学图；现代软件工程师能力地图；C22；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">动态检查各有观察范围与盲区</text><rect x="45" y="115" width="495" height="190" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="292.5" y="151" text-anchor="middle" class="b">ASan 地址访问</text><text x="292.5" y="185" text-anchor="middle" class="t">越界与释放后使用等</text><text x="292.5" y="214" text-anchor="middle" class="t">盲区：未执行路径、逻辑边界</text><text x="292.5" y="243" text-anchor="middle" class="t">自定义分配需要额外关注</text><rect x="580" y="115" width="495" height="190" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="827.5" y="151" text-anchor="middle" class="b">TSan 访问与同步</text><text x="827.5" y="185" text-anchor="middle" class="t">寻找实际执行中的数据竞争</text><text x="827.5" y="214" text-anchor="middle" class="t">盲区：业务原子性与算法进展</text><text x="827.5" y="243" text-anchor="middle" class="t">原生 Windows 无对称支持承诺</text><rect x="45" y="350" width="495" height="190" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="292.5" y="386" text-anchor="middle" class="b">UBSan 操作语义</text><text x="292.5" y="420" text-anchor="middle" class="t">检查已选择的未定义操作类别</text><text x="292.5" y="449" text-anchor="middle" class="t">盲区：不穷尽全部未定义行为</text><text x="292.5" y="478" text-anchor="middle" class="t">报告取决于选项与执行路径</text><rect x="580" y="350" width="495" height="190" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="827.5" y="386" text-anchor="middle" class="b">Memcheck 值与内存</text><text x="827.5" y="420" text-anchor="middle" class="t">无效访问、未定义值、泄漏等</text><text x="827.5" y="449" text-anchor="middle" class="t">盲区：业务预算与逻辑所有权</text><text x="827.5" y="478" text-anchor="middle" class="t">平台范围和运行成本需评估</text><text x="560" y="614" class="n" text-anchor="middle">互补检查 ＋ 真实输入 ＋ 明确平台覆盖 ≠ 完整正确性证明</text></svg>