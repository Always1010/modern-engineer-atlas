<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">嵌入式产品用可追溯证据连接各个阶段</title><desc id="desc">从研发样机、生产工位、现场维护到退役，每阶段有不同输入、结果和责任，形成反馈。</desc><metadata>本书原创教学示意；2026-10-04；非实测波形或厂商架构；未复制厂商图表。</metadata><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#53687c"/></marker></defs><rect width="1200" height="810" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="48" y="52" font-size="30" font-weight="bold">嵌入式产品用可追溯证据连接各个阶段</text><rect x="48" y="102" width="335" height="242" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="138" font-size="25" font-weight="bold">研发与样机验证</text><text x="68" y="177" font-size="22">明确需求和失败后果</text><text x="68" y="209" font-size="22">固件、板卡与BOM版本</text><text x="68" y="241" font-size="22">电气／实时／资源证据</text><text x="68" y="273" font-size="22">设计验证与已知边界</text><rect x="432" y="102" width="335" height="242" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="452" y="138" font-size="25" font-weight="bold">制造与生产放行</text><text x="452" y="177" font-size="22">工件、治具、工位身份</text><text x="452" y="209" font-size="22">受控烧录和标定计划</text><text x="452" y="241" font-size="22">原始测量、限值、判定</text><text x="452" y="273" font-size="22">测试尝试与放行记录</text><rect x="816" y="102" width="335" height="242" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="836" y="138" font-size="25" font-weight="bold">部署与现场维护</text><text x="836" y="177" font-size="22">发布包与目标兼容性</text><text x="836" y="209" font-size="22">更新确认与恢复材料</text><text x="836" y="241" font-size="22">故障快照与影响批次</text><text x="836" y="273" font-size="22">长期支持与停用条件</text><polyline points="388,224 420,224" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="773,224 804,224" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><text x="48" y="397" font-size="27" font-weight="bold">同一序列号连接历史，不覆盖历史</text><rect x="48" y="428" width="525" height="180" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="464" font-size="25" font-weight="bold">返修与复测形成新的记录</text><text x="68" y="503" font-size="22">新attempt关联原产品与返修原因</text><text x="68" y="535" font-size="22">保留原失败和新计划，不改写旧PASS</text><text x="68" y="567" font-size="22">良率统计说明一次通过与复测口径</text><rect x="626" y="428" width="525" height="180" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="646" y="464" font-size="25" font-weight="bold">退役有独立结束条件</text><text x="646" y="503" font-size="22">停止服务与更新资格</text><text x="646" y="535" font-size="22">处理数据、密钥和资产去向</text><text x="646" y="567" font-size="22">保留必要的追溯与责任记录</text><polyline points="1100,350 1100,415" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="983,350 983,374 600,374 600,510 584,510" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="310,420 310,413 32,413 32,224 40,224" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><text x="48" y="668" font-size="23">防呆：约束误接、错型号、错计划等可预见操作错误</text><text x="48" y="711" font-size="23">治具：建立稳定的定位、连接和测量条件；自身也要检验与维护</text><text x="48" y="766" font-size="24" font-weight="bold">量产测试通过不替代设计验证；安全保护有另外的风险与验证责任</text></g></svg>