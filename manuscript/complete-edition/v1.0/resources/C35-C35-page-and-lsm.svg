<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc"><title id="title">页式索引与 LSM 的不同更新组织</title><desc id="desc">左侧树页指向有序叶页，右侧更新经内存表形成多个有序文件并后台合并，说明各自读取和维护成本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="680" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">页式索引与 LSM 的不同更新组织</text><rect x="30" y="90" width="530" height="480" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><rect x="595" y="90" width="535" height="480" rx="10" fill="#f7f5ef" stroke="#a89a78" stroke-width="2"/><text x="55" y="135" class="body">页式有序索引</text><rect x="198" y="169" width="180" height="63" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="239" y="210" class="body">分隔键</text><line x1="225" y1="235" x2="126" y2="296" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="288" y1="235" x2="288" y2="296" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="351" y1="235" x2="452" y2="296" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="300" width="143" height="72" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="76" y="345" class="body">叶页 A</text><rect x="222" y="300" width="143" height="72" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="244" y="345" class="body">叶页 B</text><rect x="390" y="300" width="143" height="72" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="412" y="345" class="body">叶页 C</text><line x1="198" y1="337" x2="217" y2="337" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="366" y1="337" x2="385" y2="337" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="437" class="small">范围读沿有序叶层继续</text><text x="60" y="484" class="small">更新可能触及页分裂和父节点</text><text x="60" y="530" class="small">具体页布局与并发协议因实现而异</text><text x="619" y="135" class="body">LSM 有序文件集合</text><rect x="752" y="166" width="210" height="60" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="789" y="207" class="body">内存表</text><line x1="855" y1="230" x2="855" y2="268" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="278" width="146" height="64" rx="10" fill="#e8f1f7" stroke="#6686a3" stroke-width="2"/><text x="640" y="319" class="body">L0 文件</text><rect x="788" y="278" width="146" height="64" rx="10" fill="#e8f1f7" stroke="#6686a3" stroke-width="2"/><text x="808" y="319" class="body">L0 文件</text><rect x="956" y="278" width="146" height="64" rx="10" fill="#e8f1f7" stroke="#6686a3" stroke-width="2"/><text x="976" y="319" class="body">L0 文件</text><line x1="855" y1="350" x2="855" y2="394" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="925" y="378" class="small">合并</text><rect x="653" y="405" width="421" height="60" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="705" y="446" class="body">更低层的有序文件</text><text x="623" y="523" class="small">读需解释多个位置的版本与删除标记</text><text x="42" y="627" class="small">两种组织都需要持久化、缓存、并发控制与恢复；结构名称不直接决定性能</text></svg>