<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630"><title>内核更快 不等于服务按同比例更快</title><desc>五阶段请求链区分端到端延迟与设备内核区间，并指出取消结果与设备缓冲生命周期不同。</desc><metadata>Original educational illustration; 2026-10-03; no experimental result.</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="50" y="57" class="title" text-anchor="start">内核更快 不等于服务按同比例更快</text><rect x="40" y="150" width="165" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="122.5" y="194.5" class="label" text-anchor="middle">入口排队</text><text x="122.5" y="224.5" class="small" text-anchor="middle">容量 / 截止时间</text><rect x="270" y="150" width="165" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="352.5" y="194.5" class="label" text-anchor="middle">输入准备</text><text x="352.5" y="224.5" class="small" text-anchor="middle">解析 / 预处理</text><rect x="500" y="150" width="165" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="582.5" y="194.5" class="label" text-anchor="middle">设备执行</text><text x="582.5" y="224.5" class="small" text-anchor="middle">传输 / 核函数</text><rect x="730" y="150" width="165" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="812.5" y="194.5" class="label" text-anchor="middle">结果处理</text><text x="812.5" y="224.5" class="small" text-anchor="middle">质量 / 版本</text><rect x="960" y="150" width="165" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1042.5" y="194.5" class="label" text-anchor="middle">返回响应</text><text x="1042.5" y="224.5" class="small" text-anchor="middle">错误 / 超时</text><path d="M205,204 L261,204" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M435,204 L491,204" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M665,204 L721,204" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M895,204 L951,204" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M52,302 V325 H1113 V302" fill="none" stroke="#537086" stroke-width="3"/><text x="580" y="363" class="label" text-anchor="middle">用户端到端延迟：覆盖整条请求路径</text><path d="M510,399 V418 H655 V399" fill="none" stroke="#a78743" stroke-width="3"/><text x="580" y="455" class="small" text-anchor="middle">核函数只是设备执行的一部分</text><text x="55" y="536" class="note" text-anchor="start">输入形状、批量、并发、预热与计时范围必须同时记录</text><text x="55" y="575" class="note" text-anchor="start">超时结果已返回，也要保留设备仍在使用的缓冲区</text></svg>