<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>评价证据的三组边界</title><desc>输入与真值检查、性能和失效统计、场景覆盖一起决定结论适用范围。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">评价证据的三组边界</text><rect x="45" y="150" width="300" height="130" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="184" font-size="22" fill="#213746">输入与参考检查</text><text x="63" y="218" font-size="22" fill="#213746">时间 外参 参考误差</text><text x="63" y="252" font-size="22" fill="#213746">对齐方法与单位</text><rect x="445" y="150" width="300" height="130" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="463" y="184" font-size="22" fill="#213746">指标与失效统计</text><text x="463" y="218" font-size="22" fill="#213746">ATE RPE 完成率</text><text x="463" y="252" font-size="22" fill="#213746">在线时延与恢复</text><rect x="855" y="150" width="300" height="130" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="873" y="184" font-size="22" fill="#213746">场景与部署范围</text><text x="873" y="218" font-size="22" fill="#213746">纹理 几何 动态</text><text x="873" y="252" font-size="22" fill="#213746">未覆盖条件</text><path d="M345,215 L445,215" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M745,215 L855,215" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="145" y="390" width="915" height="130" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="163" y="424" font-size="22" fill="#213746">同一数据集的低平均误差不能覆盖全部现实</text><text x="163" y="458" font-size="22" fill="#213746">失败区间不能从结果中悄悄删除</text><text x="163" y="492" font-size="22" fill="#213746">离线优化后的轨迹不能冒充在线控制收到的状态</text><text x="45" y="600" font-size="23" fill="#213746">评价协议与数据版本必须固定；真值也有自己的不确定度</text></g></svg>