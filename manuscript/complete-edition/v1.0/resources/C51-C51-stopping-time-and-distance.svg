<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>停止距离来自反应与物理减速</title><desc>检测前后到制动建立有反应距离，随后减速仍需要距离；公式只在简化条件下成立。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">停止距离来自反应与物理减速</text><text x="50" y="135" font-size="22" fill="#213746">危险出现</text><text x="445" y="135" font-size="22" fill="#213746">开始制动</text><text x="955" y="135" font-size="22" fill="#213746">物理停稳</text><path d="M80,190 L1120,190" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><line x1="100" y1="170" x2="100" y2="215" stroke="#213746" stroke-width="3"/><line x1="500" y1="170" x2="500" y2="215" stroke="#213746" stroke-width="3"/><line x1="1050" y1="170" x2="1050" y2="215" stroke="#213746" stroke-width="3"/><rect x="65" y="255" width="405" height="165" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="83" y="289" font-size="22" fill="#213746">反应区间 τ</text><text x="83" y="323" font-size="22" fill="#213746">采样 检测 排队 决策 发送</text><text x="83" y="357" font-size="22" fill="#213746">期间仍在运动：vτ</text><rect x="535" y="255" width="560" height="165" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="553" y="289" font-size="22" fill="#213746">理想恒定减速阶段</text><text x="553" y="323" font-size="22" fill="#213746">减速度 a &gt; 0</text><text x="553" y="357" font-size="22" fill="#213746">距离：v² / (2a)</text><text x="65" y="490" font-size="25" fill="#213746">简化模型：d = vτ + v² / (2a)</text><text x="65" y="524" font-size="25" fill="#213746">教学数字：2×0.2 + 2²/(2×1) = 2.4 m</text><text x="65" y="585" font-size="22" fill="#213746">忽略坡度 附着变化 制动建立过程；不是现场安全距离建议</text></g></svg>