<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">优先级反转首先是一条资源依赖链</title><desc id="desc">上行是反转的原因，下行是继承的作用；不表示实测时间长度。</desc><metadata>原创教学图；2026-10-03；作者推演，非实测；现代软件工程师能力地图。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">优先级反转首先是一条资源依赖链</text><rect x="50" y="100" width="330" height="164" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="70" y="135" font-size="24" font-weight="bold">L 持有资源</text><text x="70" y="170" font-size="21">低优先级先进入临界区</text><text x="70" y="201" font-size="21">H 到达后等待这项资源</text><text x="70" y="232" font-size="21">L 需要 CPU 才能释放</text><rect x="435" y="100" width="330" height="164" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="455" y="135" font-size="24" font-weight="bold">M 抢占 L</text><text x="455" y="170" font-size="21">M 不需要这项资源</text><text x="455" y="201" font-size="21">但它可拖延 L 的运行</text><text x="455" y="232" font-size="21">H 因此间接等待 M</text><rect x="820" y="100" width="330" height="164" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="840" y="135" font-size="24" font-weight="bold">H 被阻塞</text><text x="840" y="170" font-size="21">高优先级不等于可运行</text><text x="840" y="201" font-size="21">继续提高 H 优先级</text><text x="840" y="232" font-size="21">仍不能替 L 释放资源</text><path d="M385 183 L425 183" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M770 183 L810 183" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="354" width="330" height="150" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="70" y="389" font-size="24" font-weight="bold">H 等待互斥量</text><text x="70" y="424" font-size="21">触发适用的继承协议</text><text x="70" y="455" font-size="21">内核记录依赖关系</text><rect x="435" y="354" width="330" height="150" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="455" y="389" font-size="24" font-weight="bold">L 临时继承</text><text x="455" y="424" font-size="21">减少来自 M 的干扰</text><text x="455" y="455" font-size="21">仍须完成剩余临界区</text><rect x="820" y="354" width="330" height="150" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="840" y="389" font-size="24" font-weight="bold">L 释放资源</text><text x="840" y="424" font-size="21">H 才能取得运行条件</text><text x="840" y="455" font-size="21">按协议恢复优先级</text><path d="M385 431 L425 431" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M770 431 L810 431" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="50" y="594" font-size="23">继承约束调度干扰，不消除外设等待、死锁或无界临界区</text></g></svg>