<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 11-2 虚调用语义与 ABI 实现层</title><desc id="desc">语言决定最终覆写者，常见实现通过调度信息转入目标；具体ABI和优化可能改变机器路径。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 11-2 虚调用语义与 ABI 实现层</text><rect x="40" y="130" width="280" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="180.0" y="162" text-anchor="middle" font-size="21">调用方只知道 Sink&amp;</text><text x="180.0" y="192" text-anchor="middle" font-size="21">sink.write(text)</text><rect x="420" y="130" width="280" height="105" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="560.0" y="162" text-anchor="middle" font-size="21">语言语义</text><text x="560.0" y="192" text-anchor="middle" font-size="21">选择最终覆写者</text><rect x="815" y="130" width="300" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="965.0" y="162" text-anchor="middle" font-size="21">实际对象</text><text x="965.0" y="192" text-anchor="middle" font-size="21">MemorySink</text><path d="M320 180 L415 180" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M815 180 L705 180" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="70" y="325" width="280" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="210.0" y="357" text-anchor="middle" font-size="21">常见实现入口</text><text x="210.0" y="387" text-anchor="middle" font-size="21">对象调度指针</text><rect x="445" y="325" width="280" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="585.0" y="357" text-anchor="middle" font-size="21">ABI 调度表</text><text x="585.0" y="387" text-anchor="middle" font-size="21">槽位 / 调整入口</text><rect x="820" y="325" width="295" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="967.5" y="357" text-anchor="middle" font-size="21">函数实现</text><text x="967.5" y="387" text-anchor="middle" font-size="21">必要时调整 this</text><path d="M350 375 L440 375" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M725 375 L815 375" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="70" y="282" font-size="20">下面仅是一种实现路径；对象字段位置不由 C++ 标准固定</text><text x="70" y="486" font-size="20">优化器若证明目标类型，可以去虚化，甚至把函数体内联</text><text x="70" y="525" font-size="20">语义保证与 ABI 约定分别核对；悬空对象不能靠调度表恢复有效性</text></g></svg>