<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">生成依赖与跨请求调度</title><desc id="desc">预填充可产生首个输出分布，解码继续扩展序列；步骤边界移除完成请求并接纳新请求。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#497486"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#183646"><text x="50" y="65" font-size="36" font-weight="700">生成依赖与跨请求调度</text><rect x="55" y="130" width="290" height="115" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="73" y="165" font-size="24">输入前缀</text><text x="73" y="198" font-size="24">分词 / 模型身份</text><path d="M350 186 L410 186" stroke="#497486" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="420" y="130" width="360" height="115" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="438" y="165" font-size="24">预填充：建立前缀KV</text><text x="438" y="198" font-size="24">产生首个新token分布</text><path d="M790 186 L850 186" stroke="#497486" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="865" y="130" width="470" height="115" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="883" y="165" font-size="24">解码：消费最新确定的token</text><text x="883" y="198" font-size="24">更新KV / 产生下一步分布</text><text x="65" y="320" font-size="28" font-weight="700">批次按步骤边界重组；每条请求仍保持自己的历史依赖</text><text x="65" y="402" font-size="26">步骤一</text><rect x="255" y="360" width="420" height="84" rx="13" fill="#e7f3e8" stroke="#7799aa" stroke-width="2"/><text x="273" y="395" font-size="24">请求A：继续</text><rect x="750" y="360" width="420" height="84" rx="13" fill="#fff0d8" stroke="#7799aa" stroke-width="2"/><text x="768" y="395" font-size="24">请求B：结束</text><text x="65" y="517" font-size="26">步骤二</text><rect x="255" y="475" width="420" height="84" rx="13" fill="#e7f3e8" stroke="#7799aa" stroke-width="2"/><text x="273" y="510" font-size="24">请求A：继续</text><rect x="750" y="475" width="420" height="84" rx="13" fill="#fff0d8" stroke="#7799aa" stroke-width="2"/><text x="768" y="510" font-size="24">请求C：加入</text><text x="65" y="632" font-size="26">步骤三</text><rect x="255" y="590" width="420" height="84" rx="13" fill="#e7f3e8" stroke="#7799aa" stroke-width="2"/><text x="273" y="625" font-size="24">请求A：结束</text><rect x="750" y="590" width="420" height="84" rx="13" fill="#fff0d8" stroke="#7799aa" stroke-width="2"/><text x="768" y="625" font-size="24">请求C：继续</text><text x="65" y="744" font-size="24">分块预填充可提供调度机会；不承诺更大的批量总能改善单请求时延</text></g></svg>