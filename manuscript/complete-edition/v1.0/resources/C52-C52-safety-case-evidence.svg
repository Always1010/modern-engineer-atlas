<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>安全案例把主张与证据连起来</title><desc>顶层主张依赖范围危害控制验证和运行保持，证据必须考虑适用条件和反驳。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">安全案例把主张与证据连起来</text><rect x="310" y="100" width="580" height="100" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="328" y="134" font-size="22" fill="#213746">主张：在明确范围和假设下</text><text x="328" y="168" font-size="22" fill="#213746">风险已得到适当控制</text><rect x="40" y="300" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="58" y="334" font-size="22" fill="#213746">范围明确</text><text x="58" y="368" font-size="22" fill="#213746">环境 模式 人员</text><path d="M600,200 L165,300" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="330" y="300" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="348" y="334" font-size="22" fill="#213746">危害控制有效</text><text x="348" y="368" font-size="22" fill="#213746">架构 独立保护</text><path d="M600,200 L455,300" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="300" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="638" y="334" font-size="22" fill="#213746">验证足够支持</text><text x="638" y="368" font-size="22" fill="#213746">模型 试验 分析</text><path d="M600,200 L745,300" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="910" y="300" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="928" y="334" font-size="22" fill="#213746">运行保持结论</text><text x="928" y="368" font-size="22" fill="#213746">维护 事件 变更</text><path d="M600,200 L1035,300" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="495" width="530" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="58" y="529" font-size="22" fill="#213746">证据：有版本 可追溯 有适用范围</text><text x="58" y="563" font-size="22" fill="#213746">不以组件证书代替整机论证</text><rect x="625" y="495" width="535" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="643" y="529" font-size="22" fill="#213746">反驳：共同原因 未覆盖条件 未知</text><text x="643" y="563" font-size="22" fill="#213746">改变主张范围或补充措施与证据</text></g></svg>