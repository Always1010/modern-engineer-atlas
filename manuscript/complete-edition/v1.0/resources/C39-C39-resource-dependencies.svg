<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">资源依赖与完成边界</title><desc id="desc">同一队列复制写之后通过执行依赖、内存可见性和布局转换进入采样读。跨队列家族保留独占资源内容另需释放和获取及跨队列顺序。CPU回收需要相关GPU完成。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="800" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">资源依赖与完成边界</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="150" width="270" height="160" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="185" font-size="25" fill="#16384c" text-anchor="start">生产者</text><text x="66" y="222" font-size="21" fill="#38596b" text-anchor="start">复制写入纹理</text><text x="66" y="253" font-size="21" fill="#38596b" text-anchor="start">已知子资源范围</text><text x="66" y="284" font-size="21" fill="#38596b" text-anchor="start">合法创建用途</text><rect x="378" y="150" width="432" height="160" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="396" y="185" font-size="25" fill="#16384c" text-anchor="start">依赖与状态</text><text x="396" y="222" font-size="21" fill="#38596b" text-anchor="start">覆盖源与目标阶段</text><text x="396" y="253" font-size="21" fill="#38596b" text-anchor="start">让写入对采样读可见</text><text x="396" y="284" font-size="21" fill="#38596b" text-anchor="start">图像布局符合使用要求</text><rect x="870" y="150" width="280" height="160" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="888" y="185" font-size="25" fill="#16384c" text-anchor="start">消费者</text><text x="888" y="222" font-size="21" fill="#38596b" text-anchor="start">片元采样读取</text><text x="888" y="253" font-size="21" fill="#38596b" text-anchor="start">匹配图像视图</text><text x="888" y="284" font-size="21" fill="#38596b" text-anchor="start">引用资源仍存活</text><path d="M318,230 L378,230" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810,230 L870,230" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="370" font-size="25" fill="#16384c" text-anchor="start">若跨队列家族保留独占资源内容，还需：</text><rect x="48" y="405" width="310" height="116" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="66" y="440" font-size="25" fill="#16384c" text-anchor="start">源家族释放</text><text x="66" y="477" font-size="21" fill="#38596b" text-anchor="start">发布先前访问</text><rect x="445" y="405" width="310" height="116" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="463" y="440" font-size="25" fill="#16384c" text-anchor="start">跨队列顺序</text><text x="463" y="477" font-size="21" fill="#38596b" text-anchor="start">例如Semaphore</text><rect x="842" y="405" width="310" height="116" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="860" y="440" font-size="25" fill="#16384c" text-anchor="start">目标家族获取</text><text x="860" y="477" font-size="21" fill="#38596b" text-anchor="start">确认可继续使用</text><path d="M358,460 L445,460" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M755,460 L842,460" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="581" width="1102" height="139" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="616" font-size="25" fill="#16384c" text-anchor="start">CPU回收与读回各有条件</text><text x="66" y="653" font-size="21" fill="#38596b" text-anchor="start">提交返回 ≠ GPU完成；等相关完成值后，才可复用或销毁资源</text><text x="66" y="684" font-size="21" fill="#38596b" text-anchor="start">读回先建立主机读可见性；非一致内存按规则失效；一致性不消除竞争</text><text x="48" y="764" font-size="22" fill="#16384c" text-anchor="start">本图不是API配置模板：阶段、访问、子资源、共享模式都须按实际使用填写</text></g></svg>