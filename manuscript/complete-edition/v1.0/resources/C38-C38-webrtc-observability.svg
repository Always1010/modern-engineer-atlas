<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">WebRTC媒体通路与诊断边界</title><desc id="desc">发送端经采集预处理编码和排队，通过ICE选定直连或中继路径，接收端进行抖动缓冲、解码和显示。四类观测不能互相冒充端到端延迟。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="740" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">WebRTC媒体通路与诊断边界</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="150" width="320" height="215" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="185" font-size="25" fill="#16384c" text-anchor="start">发送端</text><text x="66" y="222" font-size="21" fill="#38596b" text-anchor="start">采集与前处理</text><text x="66" y="253" font-size="21" fill="#38596b" text-anchor="start">编码与速率适配</text><text x="66" y="284" font-size="21" fill="#38596b" text-anchor="start">发送排队</text><text x="66" y="315" font-size="21" fill="#38596b" text-anchor="start">观察：帧率 / 编码耗时</text><rect x="435" y="150" width="330" height="215" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="453" y="185" font-size="25" fill="#16384c" text-anchor="start">网络与连通</text><text x="453" y="222" font-size="21" fill="#38596b" text-anchor="start">ICE 候选路径</text><text x="453" y="253" font-size="21" fill="#38596b" text-anchor="start">直连或 TURN 中继</text><text x="453" y="284" font-size="21" fill="#38596b" text-anchor="start">可能涉及 UDP / TCP / TLS</text><text x="453" y="315" font-size="21" fill="#38596b" text-anchor="start">观察：丢包 / RTT / 路径</text><rect x="830" y="150" width="320" height="215" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="848" y="185" font-size="25" fill="#16384c" text-anchor="start">接收端</text><text x="848" y="222" font-size="21" fill="#38596b" text-anchor="start">抖动缓冲与恢复</text><text x="848" y="253" font-size="21" fill="#38596b" text-anchor="start">解码与呈现队列</text><text x="848" y="284" font-size="21" fill="#38596b" text-anchor="start">显示与音频设备</text><text x="848" y="315" font-size="21" fill="#38596b" text-anchor="start">观察：冻结 / 补偿 / 延迟</text><path d="M368,247 L435,247" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M765,247 L830,247" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="425" width="533" height="175" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="66" y="460" font-size="25" fill="#16384c" text-anchor="start">时间解释</text><text x="66" y="497" font-size="21" fill="#38596b" text-anchor="start">设备时钟、媒体时间戳、本机时钟</text><text x="66" y="528" font-size="21" fill="#38596b" text-anchor="start">不能把不同时间域的整数直接相减</text><text x="66" y="559" font-size="21" fill="#38596b" text-anchor="start">统计区间要处理重置与对象切换</text><rect x="617" y="425" width="533" height="175" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="635" y="460" font-size="25" fill="#16384c" text-anchor="start">体验验收</text><text x="635" y="497" font-size="21" fill="#38596b" text-anchor="start">首个有效媒体、连续播放、清晰度</text><text x="635" y="528" font-size="21" fill="#38596b" text-anchor="start">音画同步与交互延迟一起评估</text><text x="635" y="559" font-size="21" fill="#38596b" text-anchor="start">RTT / 2 不等于玻璃到玻璃延迟</text><text x="48" y="682" font-size="24" fill="#16384c" text-anchor="start">信令、网络连通、媒体流动与用户听见看见，是需要分别确认的状态</text></g></svg>