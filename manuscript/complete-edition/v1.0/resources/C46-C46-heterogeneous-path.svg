<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">异构路径中的边界成本</title><desc id="desc">CPU GPU NPU分别执行不同子图，跨设备边包含搬运转换与同步；构造算术展示局部算子变快但整段变慢。</desc><metadata>Original educational diagram; Modern Engineer Atlas; 2026-10-03; no measured results; no third-party image.</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#406779"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="30" fill="#183849" text-anchor="start">异构路径中的边界成本</text><rect x="40" y="95" width="280" height="115" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="180.0" y="129" font-size="24" fill="#183849" text-anchor="middle">CPU</text><text x="180.0" y="163" font-size="24" fill="#183849" text-anchor="middle">输入准备 控制流</text><text x="180.0" y="197" font-size="24" fill="#183849" text-anchor="middle">宿主缓冲</text><rect x="360" y="95" width="280" height="115" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="500.0" y="129" font-size="24" fill="#183849" text-anchor="middle">GPU</text><text x="500.0" y="163" font-size="24" fill="#183849" text-anchor="middle">并行张量计算</text><text x="500.0" y="197" font-size="24" fill="#183849" text-anchor="middle">设备布局</text><rect x="680" y="95" width="280" height="115" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="820.0" y="129" font-size="24" fill="#183849" text-anchor="middle">NPU</text><text x="820.0" y="163" font-size="24" fill="#183849" text-anchor="middle">受支持子图</text><text x="820.0" y="197" font-size="24" fill="#183849" text-anchor="middle">编译制品</text><path d="M320,154 L360,154" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M640,154 L680,154" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="500" y="273" font-size="25" fill="#183849" text-anchor="middle">每条跨设备边：搬运 + 布局/精度转换 + 同步</text><rect x="40" y="326" width="920" height="93" rx="10" fill="#fbefd9" stroke="#598195" stroke-width="2"/><text x="500.0" y="360" font-size="24" fill="#183849" text-anchor="middle">构造例：全路径 2 + 1 + 2 = 5 ms</text><text x="500.0" y="394" font-size="24" fill="#183849" text-anchor="middle">中间改快：2 + 1.5 + 0.2 + 1.5 + 2 = 7.2 ms</text><text x="500" y="491" font-size="24" fill="#183849" text-anchor="middle">共享内存仍需证明访问顺序与缓冲生命周期</text><text x="500" y="547" font-size="24" fill="#183849" text-anchor="middle">验收：任务质量  尾延迟  持续能耗  峰值内存</text></g></svg>