<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">供应链完整性需要组合不同证据</title><desc id="desc">源码和依赖经过受控构建到分发制品，材料、过程、身份和内容证据各回答不同问题。</desc><metadata>原创教学图；现代软件工程师能力地图；C24；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">供应链完整性需要组合不同证据</text><rect x="45" y="115" width="300" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="195.0" y="151" text-anchor="middle" class="b">源码与依赖</text><text x="195.0" y="185" text-anchor="middle" class="t">评审与授权来源</text><text x="195.0" y="214" text-anchor="middle" class="t">许可证和版本记录</text><rect x="410" y="115" width="300" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="151" text-anchor="middle" class="b">构建过程</text><text x="560.0" y="185" text-anchor="middle" class="t">隔离执行与最少权限</text><text x="560.0" y="214" text-anchor="middle" class="t">输入、构建者、配置</text><rect x="775" y="115" width="300" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="925.0" y="151" text-anchor="middle" class="b">分发制品</text><text x="925.0" y="185" text-anchor="middle" class="t">准确摘要与身份</text><text x="925.0" y="214" text-anchor="middle" class="t">验证策略与部署范围</text><path d="M345 180 L405 180" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M710 180 L770 180" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="45" y="345" width="300" height="165" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="195.0" y="381" text-anchor="middle" class="b">材料证据</text><text x="195.0" y="415" text-anchor="middle" class="t">SBOM：包含什么</text><text x="195.0" y="444" text-anchor="middle" class="t">漏洞影响：是否受影响</text><text x="195.0" y="473" text-anchor="middle" class="t">许可证：哪些使用条件</text><rect x="410" y="345" width="300" height="165" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="381" text-anchor="middle" class="b">过程证据</text><text x="560.0" y="415" text-anchor="middle" class="t">来源证明：如何产生</text><text x="560.0" y="444" text-anchor="middle" class="t">可复现：能否重建</text><text x="560.0" y="473" text-anchor="middle" class="t">不能代替源码正确性</text><rect x="775" y="345" width="300" height="165" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="925.0" y="381" text-anchor="middle" class="b">身份与内容证据</text><text x="925.0" y="415" text-anchor="middle" class="t">摘要：内容是否变化</text><text x="925.0" y="444" text-anchor="middle" class="t">签名：预期身份认可</text><text x="925.0" y="473" text-anchor="middle" class="t">不能证明没有缺陷</text><text x="560" y="596" class="n" text-anchor="middle">证据必须绑定制品；每一种证据都有自己的信任前提和盲区</text></svg>