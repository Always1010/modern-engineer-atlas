<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">发件箱与消费端各自拥有事务边界</title><desc id="desc">生产端业务与发件箱同一事务提交，经可能重复的消息传递，到消费端由去重记录和业务变更同一事务保护。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">发件箱与消费端各自拥有事务边界</text><rect x="32" y="112" width="340" height="330" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="57" y="153" class="body">生产端本地事务</text><rect x="60" y="185" width="283" height="70" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="83" y="230" class="body">业务记录更新</text><rect x="60" y="296" width="283" height="70" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="83" y="341" class="body">发件箱事件入库</text><rect x="453" y="235" width="244" height="115" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="478" y="278" class="body">转发者与代理</text><text x="478" y="320" class="small">可重复发送</text><line x1="373" y1="294" x2="446" y2="294" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="112" width="348" height="330" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="804" y="153" class="body">消费端本地事务</text><rect x="808" y="185" width="291" height="70" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="832" y="230" class="body">唯一消息身份</text><rect x="808" y="296" width="291" height="70" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="832" y="341" class="body">业务效果与结果</text><line x1="700" y1="294" x2="773" y2="294" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="489" class="small">前提：各端两项修改确实位于同一受支持事务中</text><text x="45" y="538" class="small">外部短信、支付或设备动作不在这些绿色边界内，需另行设计</text><text x="45" y="582" class="small">图示不声称两个本地事务和消息代理构成一个分布式原子事务</text></svg>