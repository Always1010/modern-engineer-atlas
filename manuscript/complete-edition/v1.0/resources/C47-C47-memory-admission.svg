<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">显存预算同时覆盖现在与下一步</title><desc id="desc">以具体模型维度计算KV，再把固定、活动、临时、通信和余量共同纳入准入；不把空闲字节重复承诺给未来增长。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#497486"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#183646"><text x="50" y="65" font-size="36" font-weight="700">显存预算同时覆盖现在与下一步</text><rect x="60" y="125" width="1260" height="115" rx="13" fill="#fff0d8" stroke="#7799aa" stroke-width="2"/><text x="78" y="160" font-size="24">教学结构：32层 × 8个KV头 × 128维 × 2字节 × K/V两份</text><text x="78" y="193" font-size="24">每缓存位置128KiB；4096位置512MiB；32条独立缓存16GiB</text><rect x="60" y="300" width="295" height="145" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="78" y="335" font-size="24">固定状态</text><text x="78" y="368" font-size="24">权重 / 引擎</text><text x="78" y="401" font-size="24">常驻运行资源</text><rect x="375" y="300" width="295" height="145" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="393" y="335" font-size="24">活动状态</text><text x="393" y="368" font-size="24">KV / 分配块</text><text x="393" y="401" font-size="24">每请求增长</text><rect x="690" y="300" width="295" height="145" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="708" y="335" font-size="24">临时与通信</text><text x="708" y="368" font-size="24">激活 / 工作区</text><text x="708" y="401" font-size="24">在途传输</text><rect x="1005" y="300" width="315" height="145" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="1023" y="335" font-size="24">余量与边界</text><text x="1023" y="368" font-size="24">页尾 / 额外副本</text><text x="1023" y="401" font-size="24">更新与恢复峰值</text><text x="65" y="525" font-size="30" font-weight="700">准入检查 = 当前驻留 + 后续增长责任 + 其他峰值 + 余量</text><rect x="125" y="585" width="1145" height="95" rx="13" fill="#e7f3e8" stroke="#7799aa" stroke-width="2"/><text x="143" y="620" font-size="24">不足时：按契约等待、拒绝、限制规模或受控抢占；不得无限超卖</text><text x="65" y="742" font-size="24">适用于明确模型假设的教学预算；GQA、分片、复制与压缩需逐项核算</text></g></svg>