<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">恢复必须区分尾部不完整与中段缺口</title><desc id="desc">两组日志分别显示尾部不完整记录与中段损坏记录；尾部处理受引擎恢复模式约束，中段不可无依据跳过。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">恢复必须区分尾部不完整与中段缺口</text><text x="45" y="122" class="body">情形一  最后一次追加可能未完成</text><rect x="60" y="150" width="235" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="110" y="198" class="body">记录 1</text><rect x="318" y="150" width="235" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="368" y="198" class="body">记录 2</text><rect x="576" y="150" width="235" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="626" y="198" class="body">记录 3</text><rect x="834" y="150" width="235" height="78" rx="10" fill="#fff0d6" stroke="#6686a3" stroke-width="2"/><text x="884" y="198" class="body">尾部片段</text><text x="60" y="271" class="small">尾部位置不是未提交证明；按格式、校验、恢复模式判断并保留证据</text><text x="45" y="348" class="body">情形二  中间已出现损坏</text><rect x="60" y="376" width="235" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="110" y="424" class="body">记录 1</text><rect x="318" y="376" width="235" height="78" rx="10" fill="#fae5e2" stroke="#6686a3" stroke-width="2"/><text x="368" y="424" class="body">损坏缺口</text><rect x="576" y="376" width="235" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="626" y="424" class="body">记录 3</text><rect x="834" y="376" width="235" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="884" y="424" class="body">记录 4</text><text x="60" y="500" class="small">后续记录校验通过，不证明它们不依赖缺失的前置修改</text><text x="60" y="554" class="small">宽松模式能够启动，不等于完成无损恢复或满足原有业务不变量</text></svg>