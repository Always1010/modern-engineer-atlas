<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">地址空间需要两张地图</title><desc id="desc">左侧列出Flash、SRAM和设备寄存器，右侧区分硬件地址图与链接启动契约。</desc><metadata>原创教学图；现代软件工程师能力地图；2026-10-03；非实测数据；未复制厂商图表。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="670" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="55" y="54" font-size="30" font-weight="bold">地址空间需要两张地图</text><rect x="55" y="98" width="515" height="132" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="77" y="133" font-size="24" font-weight="bold">Flash 与只读镜像</text><text x="77" y="170" font-size="21">代码、常量、初始值的存储副本</text><text x="77" y="201" font-size="21">擦除粒度与写入条件由芯片规定</text><rect x="55" y="250" width="515" height="132" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="77" y="285" font-size="24" font-weight="bold">SRAM 与运行状态</text><text x="77" y="322" font-size="21">数据、栈、缓冲；核对容量和生命期</text><text x="77" y="353" font-size="21">CPU 可访问 ≠ DMA 必然可访问</text><rect x="55" y="402" width="515" height="132" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="77" y="437" font-size="24" font-weight="bold">外设寄存器与保留区域</text><text x="77" y="474" font-size="21">读写可能清标志、弹出 FIFO 或启动动作</text><text x="77" y="505" font-size="21">访问宽度、时钟与电源是前提</text><rect x="640" y="98" width="505" height="175" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="662" y="133" font-size="24" font-weight="bold">硬件地址图</text><text x="662" y="170" font-size="21">回答：谁响应这段地址</text><text x="662" y="201" font-size="21">查芯片型号、总线矩阵与存储属性</text><text x="662" y="232" font-size="21">不同 RAM 区域可以有不同可达性</text><rect x="640" y="308" width="505" height="175" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="662" y="343" font-size="24" font-weight="bold">链接与启动契约</text><text x="662" y="380" font-size="21">回答：代码和对象实际放在哪里</text><text x="662" y="411" font-size="21">复制初始化数据，清零，建立栈</text><text x="662" y="442" font-size="21">镜像位置须与启动交接一致</text><path d="M575 158 L632 158" stroke="#4b6379" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M575 315 L632 375" stroke="#4b6379" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="55" y="600" font-size="23">地址相同形式，不代表相同语义；示意分区不按容量比例，不能直接用于接线或烧录</text></g></svg>