<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">融合收益与合法性边界</title><desc id="desc">上方独立执行会物化中间张量并可能发生低精度舍入，下方融合保留局部值但需同时核查收益、语义和资源。</desc><metadata>Original educational diagram; Modern Engineer Atlas; 2026-10-03; no measured results; no third-party image.</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#406779"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="30" fill="#183849" text-anchor="start">融合收益与合法性边界</text><text x="45" y="100" font-size="26" fill="#183849" text-anchor="start">独立执行</text><rect x="45" y="124" width="230" height="86" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="160.0" y="158" font-size="24" fill="#183849" text-anchor="middle">GEMM</text><text x="160.0" y="192" font-size="24" fill="#183849" text-anchor="middle">较宽累加器</text><rect x="385" y="124" width="230" height="86" rx="10" fill="#fbefd9" stroke="#598195" stroke-width="2"/><text x="500.0" y="158" font-size="24" fill="#183849" text-anchor="middle">中间张量</text><text x="500.0" y="192" font-size="24" fill="#183849" text-anchor="middle">写回 再读取</text><rect x="725" y="124" width="230" height="86" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="840.0" y="158" font-size="24" fill="#183849" text-anchor="middle">Bias 与激活</text><text x="840.0" y="192" font-size="24" fill="#183849" text-anchor="middle">再次启动</text><path d="M275,168 L385,168" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M615,168 L725,168" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="500" y="257" font-size="24" fill="#183849" text-anchor="middle">中间若写成 FP16，此处发生一次舍入</text><text x="45" y="335" font-size="26" fill="#183849" text-anchor="start">融合执行</text><rect x="45" y="365" width="910" height="86" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="500.0" y="399" font-size="24" fill="#183849" text-anchor="middle">GEMM → 局部累加器 → Bias 与激活 → 最终写回</text><rect x="45" y="495" width="280" height="85" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="185.0" y="529" font-size="24" fill="#183849" text-anchor="middle">收益</text><text x="185.0" y="563" font-size="24" fill="#183849" text-anchor="middle">少中间流量 少启动</text><rect x="360" y="495" width="280" height="85" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="500.0" y="529" font-size="24" fill="#183849" text-anchor="middle">合法性</text><text x="500.0" y="563" font-size="24" fill="#183849" text-anchor="middle">别名 消费者 舍入</text><rect x="675" y="495" width="280" height="85" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="815.0" y="529" font-size="24" fill="#183849" text-anchor="middle">资源约束</text><text x="815.0" y="563" font-size="24" fill="#183849" text-anchor="middle">寄存器 片上容量</text></g></svg>