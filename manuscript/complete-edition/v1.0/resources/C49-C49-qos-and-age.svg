<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>QoS匹配之后仍需检查数据年龄</title><desc>端点先匹配QoS，样本再经历传输调度和应用有效性检查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">QoS匹配之后仍需检查数据年龄</text><rect x="45" y="135" width="295" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="169" font-size="22" fill="#213746">发布端 offered</text><text x="63" y="203" font-size="22" fill="#213746">可靠性 持久性 期限</text><text x="63" y="237" font-size="22" fill="#213746">历史与资源限制</text><rect x="435" y="135" width="300" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="453" y="169" font-size="22" fill="#213746">兼容性检查</text><text x="453" y="203" font-size="22" fill="#213746">满足订阅者要求？</text><rect x="825" y="135" width="330" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="843" y="169" font-size="22" fill="#213746">订阅端 requested</text><text x="843" y="203" font-size="22" fill="#213746">匹配不代表立即处理</text><path d="M340,195 L435,195" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M735,195 L825,195" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="50" y="380" width="260" height="105" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="68" y="414" font-size="22" fill="#213746">传输与重传</text><text x="68" y="448" font-size="22" fill="#213746">网络延迟与资源</text><rect x="445" y="380" width="265" height="105" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="463" y="414" font-size="22" fill="#213746">执行器与回调</text><text x="463" y="448" font-size="22" fill="#213746">排队和处理时长</text><rect x="850" y="380" width="305" height="105" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="868" y="414" font-size="22" fill="#213746">应用有效性检查</text><text x="868" y="448" font-size="22" fill="#213746">年龄 版本 内容</text><path d="M310,430 L445,430" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M710,430 L850,430" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="570" font-size="23" fill="#213746">可靠交付 ≠ 期限内可用；deadline 事件 ≠ 自动制动</text><text x="55" y="604" font-size="23" fill="#213746">best effort 发布者不能满足 reliable 订阅者的要求</text></g></svg>