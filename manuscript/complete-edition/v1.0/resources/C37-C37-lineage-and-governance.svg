<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc"><title id="title">运行身份连接输入与派生数据版本</title><desc id="desc">原始分区版本3经代码版本7的一次任务运行R42形成表快照18，随后派生搜索索引9；治理检查随数据传播。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="660" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">运行身份连接输入与派生数据版本</text><rect x="36" y="178" width="246" height="129" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="92" y="221" class="body">输入数据</text><text x="56" y="275" class="small">分区版本 3</text><rect x="322" y="178" width="246" height="129" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="378" y="221" class="body">任务运行</text><text x="342" y="275" class="small">R42 · 代码版本 7</text><rect x="608" y="178" width="246" height="129" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="664" y="221" class="body">表数据</text><text x="628" y="275" class="small">快照版本 18</text><rect x="894" y="178" width="246" height="129" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="950" y="221" class="body">搜索索引</text><text x="914" y="275" class="small">索引版本 9</text><line x1="286" y1="243" x2="315" y2="243" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="573" y1="243" x2="602" y2="243" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="861" y1="243" x2="888" y2="243" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="375" width="1020" height="131" rx="10" fill="#fff3df" stroke="#ad8850" stroke-width="2"/><text x="98" y="417" class="body">每次运行共同记录</text><text x="98" y="458" class="small">输入快照与时间范围 · Schema · 转换参数 · 质量结果 · 输出发布身份</text><text x="45" y="567" class="small">权限、保留与更正规则沿派生链继续生效；血缘不是自动授权</text><text x="45" y="613" class="small">静态依赖说明计划，运行血缘说明观察到的事实；未观测依赖应标为未知</text></svg>