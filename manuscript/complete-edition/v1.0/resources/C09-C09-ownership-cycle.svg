<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="590" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
  <title id="title">强所有权环与弱观察回指</title>
  <desc id="desc">左图中 A 和 B 分别用 shared_ptr 拥有对方，即使外部所有者释放，内部强环仍然存在。右图 A 继续拥有 B，B 对 A 只保留 weak_ptr，外部释放 A 后回指不会阻止清理。若 B 需要使用 A，应先 lock 并保留得到的共享所有权直到使用结束。</desc>
  <defs>
    <marker id="own" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#25619a"/></marker>
    <marker id="observe" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a07825"/></marker>
  </defs>
  <rect width="1160" height="590" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172333">
    <text x="35" y="43" font-size="29" font-weight="700">两条访问路径　不一定需要两条拥有关系</text>
    <path d="M35 83H106" stroke="#25619a" stroke-width="3" marker-end="url(#own)"/>
    <text x="121" y="91" font-size="22">拥有并保留</text>
    <path d="M345 83H416" stroke="#a07825" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#observe)"/>
    <text x="431" y="91" font-size="22">弱观察　不维持目标生命</text>
    <path d="M580 130V525" stroke="#d8dee6" stroke-width="2"/>
    <g font-size="25" font-weight="700" text-anchor="middle">
      <text x="290" y="157">外部释放后　强环仍在</text>
      <text x="870" y="157">正向拥有　回指只观察</text>
    </g>
    <g fill="#edf4fb" stroke="#557b9e" stroke-width="2">
      <rect x="70" y="243" width="145" height="87" rx="10"/>
      <rect x="365" y="243" width="145" height="87" rx="10"/>
      <rect x="650" y="243" width="145" height="87" rx="10"/>
      <rect x="945" y="243" width="145" height="87" rx="10"/>
    </g>
    <g font-size="29" font-weight="700" text-anchor="middle">
      <text x="142" y="297">A</text><text x="437" y="297">B</text>
      <text x="722" y="297">A</text><text x="1017" y="297">B</text>
    </g>
    <g fill="none" stroke="#25619a" stroke-width="3" marker-end="url(#own)">
      <path d="M215 266H365"/>
      <path d="M437 330V386H142V330"/>
      <path d="M795 266H945"/>
    </g>
    <path d="M1017 330V386H722V330" fill="none" stroke="#a07825" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#observe)"/>
    <g font-size="22" text-anchor="middle">
      <text x="290" y="229" fill="#25619a">shared_ptr</text>
      <text x="290" y="418" fill="#25619a">shared_ptr</text>
      <text x="870" y="229" fill="#25619a">shared_ptr</text>
      <text x="870" y="418" fill="#a07825">weak_ptr</text>
      <text x="290" y="472">双方都仍被对方保留</text>
      <text x="870" y="472">观察边不阻止 A 的清理</text>
      <text x="290" y="508">清理无法仅靠外部 reset 开始</text>
      <text x="870" y="508">访问 A 前先 lock 并处理失败</text>
    </g>
    <text x="35" y="565" font-size="20" fill="#536274">示意两个普通共享对象的关系；弱化哪条边，应由真实的生命周期责任决定</text>
  </g>
</svg>
