<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">域分解与光晕交换的依赖</title><desc id="desc">四个二维rank块交换光晕；发起通信后可算内部，只有通信完成后才能读取新光晕计算边界。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">域分解与光晕交换的依赖</text><rect x="85" y="180" width="235" height="175" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="202.5" y="226" text-anchor="middle" font-size="27">rank 0</text><text x="202.5" y="266" text-anchor="middle" font-size="27">内部区域</text><rect x="95" y="190" width="215" height="155" rx="12" fill="none" stroke="#d2a44e" stroke-width="12"/><rect x="380" y="180" width="235" height="175" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="497.5" y="226" text-anchor="middle" font-size="27">rank 1</text><text x="497.5" y="266" text-anchor="middle" font-size="27">内部区域</text><rect x="390" y="190" width="215" height="155" rx="12" fill="none" stroke="#d2a44e" stroke-width="12"/><rect x="85" y="430" width="235" height="175" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="202.5" y="476" text-anchor="middle" font-size="27">rank 2</text><text x="202.5" y="516" text-anchor="middle" font-size="27">内部区域</text><rect x="95" y="440" width="215" height="155" rx="12" fill="none" stroke="#d2a44e" stroke-width="12"/><rect x="380" y="430" width="235" height="175" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="497.5" y="476" text-anchor="middle" font-size="27">rank 3</text><text x="497.5" y="516" text-anchor="middle" font-size="27">内部区域</text><rect x="390" y="440" width="215" height="155" rx="12" fill="none" stroke="#d2a44e" stroke-width="12"/><path d="M325 245 L370 245" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M370 270 L325 270" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M325 495 L370 495" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M370 520 L325 520" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M190 360 L190 420" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M215 420 L215 360" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M490 360 L490 420" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M515 420 L515 360" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="85" y="665" font-size="26">金色边带：光晕 / 邻居数据</text><text x="750" y="190" font-size="28">有独立工作才有重叠机会</text><rect x="745" y="255" width="570" height="95" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1030.0" y="301" text-anchor="middle" font-size="27">发起通信 → 持续进展 → 完成</text><rect x="745" y="405" width="310" height="105" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="900.0" y="451" text-anchor="middle" font-size="27">计算内部</text><text x="900.0" y="491" text-anchor="middle" font-size="27">不读取新光晕</text><rect x="1100" y="405" width="215" height="105" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1207.5" y="451" text-anchor="middle" font-size="27">边界计算</text><text x="1207.5" y="491" text-anchor="middle" font-size="27">通信完成后</text><path d="M1060 460 L1090 460" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1250 350 L1250 395" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="750" y="600" font-size="25">等待：仅在需要新边界数据时</text><text x="750" y="650" font-size="25">非阻塞发起不保证实际重叠</text></g></svg>