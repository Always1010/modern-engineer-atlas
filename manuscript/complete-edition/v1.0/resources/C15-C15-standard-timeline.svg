<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 15-1 标准演进与本书的固定锚点</title><desc id="desc">按标准版本展示能力演进，并明确已出版C++23与C++26 DIS基础文本以及后续C++29不同。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 15-1 标准演进与本书的固定锚点</text><rect x="35" y="155" width="200" height="130" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="135.0" y="187" text-anchor="middle" font-size="21">C++11 / 14</text><text x="135.0" y="217" text-anchor="middle" font-size="21">所有权与移动</text><text x="135.0" y="247" text-anchor="middle" font-size="21">lambda / constexpr</text><path d="M235 219 L259 219" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="265" y="155" width="200" height="130" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="365.0" y="187" text-anchor="middle" font-size="21">C++17</text><text x="365.0" y="217" text-anchor="middle" font-size="21">值类型与分解</text><text x="365.0" y="247" text-anchor="middle" font-size="21">直接结果构造</text><path d="M465 219 L489 219" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="495" y="155" width="200" height="130" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="595.0" y="187" text-anchor="middle" font-size="21">C++20</text><text x="595.0" y="217" text-anchor="middle" font-size="21">本书教学主线</text><text x="595.0" y="247" text-anchor="middle" font-size="21">N4861</text><path d="M695 219 L719 219" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="725" y="155" width="200" height="130" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="825.0" y="187" text-anchor="middle" font-size="21">C++23</text><text x="825.0" y="217" text-anchor="middle" font-size="21">按需扩展</text><text x="825.0" y="247" text-anchor="middle" font-size="21">N4950</text><path d="M925 219 L949 219" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="955" y="155" width="200" height="130" rx="12" fill="#fff1dc" stroke="#8296aa"/><text x="1055.0" y="187" text-anchor="middle" font-size="21">C++26 草案</text><text x="1055.0" y="217" text-anchor="middle" font-size="21">前沿研究</text><text x="1055.0" y="247" text-anchor="middle" font-size="21">N5050</text><text x="45" y="108" font-size="20">能力演进不等于该年份所有平台已支持</text><rect x="85" y="365" width="440" height="90" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="305.0" y="397" text-anchor="middle" font-size="21">ISO 已出版：14882:2024</text><text x="305.0" y="427" text-anchor="middle" font-size="21">通常称为 C++23</text><rect x="620" y="365" width="455" height="90" rx="12" fill="#fff1dc" stroke="#8296aa"/><text x="847.5" y="397" text-anchor="middle" font-size="21">C++26：N5050 是 DIS 基础</text><text x="847.5" y="427" text-anchor="middle" font-size="21">N5054 已进入 C++29</text><text x="85" y="515" font-size="20">官方状态核验：2026-10-03；固定文本、实现支持和项目采用分别记录</text></g></svg>