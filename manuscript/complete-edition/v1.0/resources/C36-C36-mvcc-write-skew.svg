<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">稳定快照仍可能允许写偏斜</title><desc id="desc">至少一台节点须可用。两个事务都读到甲乙可用，各自停用一台，在允许写偏斜的隔离下可能共同提交而破坏约束。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">稳定快照仍可能允许写偏斜</text><rect x="235" y="90" width="690" height="70" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="265" y="136" class="body">共同旧快照：甲可用，乙可用；至少一台须可用</text><rect x="44" y="212" width="493" height="205" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><rect x="622" y="212" width="493" height="205" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="72" y="255" class="body">事务甲</text><text x="72" y="306" class="small">读取：甲可用，乙可用</text><text x="72" y="363" class="body">写入：停用甲</text><text x="650" y="255" class="body">事务乙</text><text x="650" y="306" class="small">读取：甲可用，乙可用</text><text x="650" y="363" class="body">写入：停用乙</text><line x1="370" y1="164" x2="300" y2="204" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="810" y1="164" x2="862" y2="204" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="300" y1="423" x2="442" y2="474" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="862" y1="423" x2="720" y2="474" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="250" y="480" width="655" height="74" rx="10" fill="#fae5e2" stroke="#b17b70" stroke-width="2"/><text x="280" y="527" class="body">若均提交：甲停用，乙停用，约束被破坏</text><text x="45" y="597" class="small">无同一行写冲突，不等于无事务读写依赖；图示并非所有隔离级别均允许</text></svg>