<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">控制流汇合与 SSA 值的来源</title><desc id="desc">左分支与右分支定义不同值，phi依据前驱选择；内存读取还需要分析写入和别名。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">控制流汇合与 SSA 值的来源</text><rect x="505" y="130" width="360" height="85" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="685.0" y="176" text-anchor="middle" font-size="27">入口：条件分支</text><rect x="125" y="285" width="400" height="105" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="325.0" y="331" text-anchor="middle" font-size="27">左分支：x1 = 10</text><rect x="875" y="285" width="400" height="105" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1075.0" y="331" text-anchor="middle" font-size="27">右分支：x2 = 20</text><rect x="425" y="475" width="530" height="115" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="690.0" y="521" text-anchor="middle" font-size="27">汇合：x3 = phi(x1, x2)</text><text x="690.0" y="561" text-anchor="middle" font-size="27">按实际前驱选择</text><path d="M545 215 L350 280" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M825 215 L1070 280" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M330 390 L540 470" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1070 390 L840 470" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="75" y="680" font-size="28">内存另查：load(p) → 可能经别名写入 → load(p)</text><text x="75" y="730" font-size="26">SSA 名称唯一，不证明两次读取之间的内存未改变</text></g></svg>