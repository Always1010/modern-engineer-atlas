<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>因子图约束与不可观测方向</title><desc>圆是未知变量，小方块是运动因子；回环与地标提供不同关系，规范与退化不能混为一谈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">因子图约束与不可观测方向</text><circle cx="110" cy="205" r="47" fill="#edf5f6" stroke="#357381" stroke-width="2"/><text x="84" y="213" font-size="23" fill="#213746">x0</text><line x1="157" y1="205" x2="323" y2="205" stroke="#357381" stroke-width="2"/><rect x="230" y="193" width="24" height="24" fill="#bd8144"/><circle cx="370" cy="205" r="47" fill="#edf5f6" stroke="#357381" stroke-width="2"/><text x="344" y="213" font-size="23" fill="#213746">x1</text><line x1="417" y1="205" x2="583" y2="205" stroke="#357381" stroke-width="2"/><rect x="490" y="193" width="24" height="24" fill="#bd8144"/><circle cx="630" cy="205" r="47" fill="#edf5f6" stroke="#357381" stroke-width="2"/><text x="604" y="213" font-size="23" fill="#213746">x2</text><line x1="677" y1="205" x2="843" y2="205" stroke="#357381" stroke-width="2"/><rect x="750" y="193" width="24" height="24" fill="#bd8144"/><circle cx="890" cy="205" r="47" fill="#edf5f6" stroke="#357381" stroke-width="2"/><text x="864" y="213" font-size="23" fill="#213746">x3</text><text x="980" y="205" font-size="20" fill="#213746">圆：变量</text><text x="980" y="239" font-size="20" fill="#213746">方块：因子</text><path d="M110 158 V95 H890 V158" stroke="#bd8144" stroke-width="3" fill="none"/><text x="550" y="82" font-size="20" fill="#213746">已验证回环</text><circle cx="505" cy="370" r="36" fill="#fff2df" stroke="#bd8144"/><text x="482" y="377" font-size="20" fill="#213746">地标</text><line x1="370" y1="253" x2="505" y2="335" stroke="#357381" stroke-width="2"/><line x1="630" y1="253" x2="505" y2="335" stroke="#357381" stroke-width="2"/><rect x="491" y="83" width="24" height="24" fill="#bd8144"/><rect x="425" y="282" width="24" height="24" fill="#bd8144"/><rect x="556" y="282" width="24" height="24" fill="#bd8144"/><rect x="45" y="480" width="530" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="514" font-size="22" fill="#213746">规范自由度：选定全局坐标表达</text><text x="63" y="548" font-size="22" fill="#213746">固定首帧不代表得到外部绝对定位</text><rect x="615" y="480" width="540" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="633" y="514" font-size="22" fill="#213746">几何退化：当前信息沿某方向很弱</text><text x="633" y="548" font-size="22" fill="#213746">更多同方向点不一定改善可观测性</text></g></svg>