<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">时间和内存约束下的可行区域</title>
  <desc id="desc">构造的三个候选均假设满足功能要求。时间上限250毫秒，内存上限192 MiB。甲耗时180毫秒、内存120 MiB，两项均满足；乙310毫秒、64 MiB，时间超限；丙120毫秒、220 MiB，内存超限。没有实测数据。</desc>
  <rect width="1000" height="680" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" fill="#17212b">
    <text x="44" y="45" font-size="31" font-weight="700">先同时满足时间与内存上限</text>
    <text x="44" y="84" font-size="23">构造候选，仅演示约束关系，不代表性能测量</text>
    <rect x="120" y="220" width="500" height="300" fill="#eaf2ee"/>
    <g stroke="#d9dfe4" stroke-width="1.5">
      <path d="M120 120H820 M120 320H820 M120 420H820"/>
      <path d="M320 120V520 M520 120V520 M720 120V520"/>
    </g>
    <g stroke="#333f48" stroke-width="2.5">
      <path d="M120 120V520H820" fill="none"/>
    </g>
    <g stroke="#6a747b" stroke-width="2.5" stroke-dasharray="9 7">
      <path d="M120 220H820 M620 120V520" fill="none"/>
    </g>
    <g font-size="23" text-anchor="end">
      <text x="103" y="528">0</text><text x="103" y="428">64</text>
      <text x="103" y="328">128</text><text x="103" y="228">192</text>
      <text x="103" y="128">256</text>
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="120" y="551">0</text><text x="320" y="551">100</text>
      <text x="520" y="551">200</text><text x="620" y="551">250</text>
      <text x="720" y="551">300</text><text x="820" y="551">350</text>
    </g>
    <text x="120" y="111" font-size="23">峰值内存 / MiB</text>
    <text x="660" y="589" font-size="24">耗时 / ms</text>
    <text x="157" y="475" font-size="26" font-weight="600">两项约束的可行区域</text>
    <text x="636" y="151" font-size="22">时间上限</text>
    <text x="836" y="228" font-size="22">内存上限</text>
    <circle cx="480" cy="332.5" r="9" fill="#22604b" stroke="#ffffff" stroke-width="2"/>
    <text x="499" y="327" font-size="26" font-weight="700">甲</text>
    <text x="360" y="370" font-size="22">180 ms · 120 MiB</text>
    <path d="M732 412L748 428M748 412L732 428" stroke="#5c6470" stroke-width="4"/>
    <text x="661" y="377" font-size="26" font-weight="700">乙 时间超限</text>
    <text x="660" y="408" font-size="22">310 ms · 64 MiB</text>
    <path d="M352 168.25L368 184.25M368 168.25L352 184.25" stroke="#5c6470" stroke-width="4"/>
    <text x="380" y="173" font-size="26" font-weight="700">丙 内存超限</text>
    <text x="380" y="204" font-size="22">120 ms · 220 MiB</text>
    <text x="44" y="632" font-size="23">图中假设功能要求已满足；未画出的其他约束仍须另外核对</text>
  </g>
</svg>
