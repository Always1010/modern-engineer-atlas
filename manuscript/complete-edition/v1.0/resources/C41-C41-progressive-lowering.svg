<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc"><title id="title">逐层降低：使用结构，再承诺实现</title><desc id="desc">张量层保留领域结构，循环向量层做分块等变换，低层固定地址和ABI。缓冲化不自动解决释放。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="600" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">逐层降低：使用结构，再承诺实现</text><rect x="65" y="150" width="350" height="135" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="240.0" y="196" text-anchor="middle" font-size="27">张量 / 领域操作</text><text x="240.0" y="236" text-anchor="middle" font-size="27">形状、归约、值语义</text><rect x="525" y="150" width="350" height="135" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="700.0" y="196" text-anchor="middle" font-size="27">循环 / 向量</text><text x="700.0" y="236" text-anchor="middle" font-size="27">分块、融合、尾部</text><rect x="985" y="150" width="350" height="135" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1160.0" y="196" text-anchor="middle" font-size="27">低层 / 机器</text><text x="1160.0" y="236" text-anchor="middle" font-size="27">地址、ABI、指令</text><path d="M420 215 L515 215" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M880 215 L975 215" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="110" y="335" width="520" height="145" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="370.0" y="381" text-anchor="middle" font-size="27">降低义务：保留数值与边界语义</text><text x="370.0" y="421" text-anchor="middle" font-size="27">显式化布局、存储与执行映射</text><rect x="765" y="335" width="520" height="145" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1025.0" y="381" text-anchor="middle" font-size="27">缓冲化：决定复用或复制</text><text x="1025.0" y="421" text-anchor="middle" font-size="27">释放与异步生命周期另有义务</text><path d="M700 290 L370 325" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M700 290 L1010 325" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="95" y="555" font-size="27">并非唯一固定流水线：项目可以分层降低、重排或选择目标分支</text></g></svg>