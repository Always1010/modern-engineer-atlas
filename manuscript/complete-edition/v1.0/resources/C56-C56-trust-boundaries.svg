<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img"><title>把数据 建议与执行权分开</title><desc>不可信资料进入受控模型分析，模型建议经可信执行器校验后才到外部资源或本地沙箱；不同层承担不同限制。</desc><metadata>本书原创教学图；2026-10-03；非真实系统运行记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="690" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">把数据 建议与执行权分开</text><rect x="40" y="143" width="250" height="112" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="165.0" y="191.0" class="label" text-anchor="middle">不可信资料</text><text x="165.0" y="221.0" class="small" text-anchor="middle">网页 / 文档 / 工具内容</text><path d="M300,199 L355,199" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="143" width="305" height="112" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="522.5" y="191.0" class="label" text-anchor="middle">模型与受控分析</text><text x="522.5" y="221.0" class="small" text-anchor="middle">输出候选动作</text><path d="M685,199 L740,199" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="755" y="122" width="365" height="153" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="937.5" y="175.5" class="label" text-anchor="middle">可信执行器</text><text x="937.5" y="205.5" class="small" text-anchor="middle">身份 / 对象 / 参数 / 批准</text><text x="937.5" y="235.5" class="small" text-anchor="middle">预算 / 资源版本</text><path d="M935,285 L935,350" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="366" width="375" height="104" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="937.5" y="410.0" class="label" text-anchor="middle">外部资源</text><text x="937.5" y="440.0" class="small" text-anchor="middle">服务端权限与效果证据</text><rect x="50" y="368" width="575" height="104" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="337.5" y="412.0" class="label" text-anchor="middle">本地执行沙箱</text><text x="337.5" y="442.0" class="small" text-anchor="middle">文件 / 网络 / 进程 / 时间限制</text><path d="M935,320 H338 V355" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="105" y="556" width="955" height="69" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="582.5" y="597.5" class="label" text-anchor="middle">外部内容不能修改可信权限；沙箱不替代远端业务授权</text><text x="55" y="675" class="note" text-anchor="start">防护分类器提供辅助信号，真实控制必须落实在执行与资源边界</text></svg>