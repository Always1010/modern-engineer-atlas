<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">构建与装载逐步确定不同信息</title><desc id="desc">源码及配置经过翻译和代码生成、符号链接、装载，分别产生可用于故障重建的输入记录、目标信息、最终产物和实际加载信息。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">构建与装载逐步确定不同信息</text><rect x="45" y="145" width="210" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="150.0" y="180" text-anchor="middle" class="label">源码与头文件</text><text x="150.0" y="211" text-anchor="middle" class="small">宏、声明、定义</text><text x="150.0" y="242" text-anchor="middle" class="small">构建配置</text><rect x="340" y="145" width="230" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="455.0" y="180" text-anchor="middle" class="label">翻译与代码生成</text><text x="455.0" y="211" text-anchor="middle" class="small">语言检查、IR</text><text x="455.0" y="242" text-anchor="middle" class="small">指令与目标文件</text><rect x="655" y="145" width="230" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="770.0" y="180" text-anchor="middle" class="label">链接</text><text x="770.0" y="211" text-anchor="middle" class="small">符号与重定位</text><text x="770.0" y="242" text-anchor="middle" class="small">依赖和布局</text><rect x="960" y="145" width="195" height="115" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="1057.5" y="180" text-anchor="middle" class="label">装载</text><text x="1057.5" y="211" text-anchor="middle" class="small">映射与权限</text><text x="1057.5" y="242" text-anchor="middle" class="small">运行时绑定</text><path class="arrow" d="M255 202 H340"/><path class="arrow" d="M570 202 H655"/><path class="arrow" d="M885 202 H960"/><rect x="45" y="355" width="210" height="105" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="150.0" y="390" text-anchor="middle" class="label">可保留的证据</text><text x="150.0" y="421" text-anchor="middle" class="small">真实输入与命令</text><text x="150.0" y="452" text-anchor="middle" class="small">工具和依赖版本</text><rect x="340" y="355" width="230" height="105" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="455.0" y="390" text-anchor="middle" class="label">可保留的证据</text><text x="455.0" y="421" text-anchor="middle" class="small">目标符号、反汇编</text><text x="455.0" y="452" text-anchor="middle" class="small">调试信息</text><rect x="655" y="355" width="230" height="105" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="770.0" y="390" text-anchor="middle" class="label">可保留的证据</text><text x="770.0" y="421" text-anchor="middle" class="small">最终产物与标识</text><text x="770.0" y="452" text-anchor="middle" class="small">声明依赖</text><rect x="960" y="355" width="195" height="105" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="1057.5" y="390" text-anchor="middle" class="label">可保留的证据</text><text x="1057.5" y="421" text-anchor="middle" class="small">实际加载路径</text><text x="1057.5" y="452" text-anchor="middle" class="small">模块基址</text><path class="arrow" d="M150 260 V355"/><path class="arrow" d="M455 260 V355"/><path class="arrow" d="M770 260 V355"/><path class="arrow" d="M1057 260 V355"/><text class="small" x="45" y="540">编译通过只说明当前翻译条件成立；链接、装载和 ABI 仍有独立要求</text><text class="small" x="45" y="580">启用 LTO 时，代码生成可以继续发生在链接阶段</text></svg>