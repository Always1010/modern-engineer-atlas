<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 12-2 常量求值不是优化器是否折叠</title><desc id="desc">constexpr算法可常量求值或运行时执行，要求常量表达式与普通优化行为分开。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 12-2 常量求值不是优化器是否折叠</text><rect x="420" y="115" width="340" height="85" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="590.0" y="147" text-anchor="middle" font-size="21">constexpr 算法</text><text x="590.0" y="177" text-anchor="middle" font-size="21">可用于两种求值场景</text><rect x="55" y="280" width="450" height="105" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="280.0" y="312" text-anchor="middle" font-size="21">constexpr 变量 / static_assert</text><text x="280.0" y="342" text-anchor="middle" font-size="21">必须满足常量表达式规则</text><rect x="655" y="280" width="450" height="105" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="880.0" y="312" text-anchor="middle" font-size="21">运行时输入的普通调用</text><text x="880.0" y="342" text-anchor="middle" font-size="21">允许在程序运行时执行</text><path d="M440 200 L300 275" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 200 L880 275" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="425" width="450" height="60" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="280.0" y="457" text-anchor="middle" font-size="21">计算成本计入构建与制品</text><rect x="655" y="425" width="450" height="60" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="880.0" y="457" text-anchor="middle" font-size="21">优化器仍可能折叠已知计算</text><path d="M280 385 L280 420" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M880 385 L880 420" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="75" y="535" font-size="20">consteval 限制相应即时调用；constinit 约束静态初始化，二者不是同一问题</text></g></svg>