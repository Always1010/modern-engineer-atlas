<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">配置替换分开建立可见性与持久性</title><desc id="desc">先准备并同步临时文件，再原子切换目标名称，然后同步父目录，最后报告成功。替换后的同步失败不等于什么都没发生。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">配置替换分开建立可见性与持久性</text><rect x="45" y="140" width="300" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="195.0" y="175" text-anchor="middle" class="label">1 准备临时文件</text><text x="195.0" y="206" text-anchor="middle" class="small">同目录、唯一名称</text><text x="195.0" y="237" text-anchor="middle" class="small">完整写入并检查</text><rect x="445" y="140" width="300" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="595.0" y="175" text-anchor="middle" class="label">2 同步新文件</text><text x="595.0" y="206" text-anchor="middle" class="small">数据与必要元数据</text><text x="595.0" y="237" text-anchor="middle" class="small">检查同步结果</text><rect x="845" y="140" width="310" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="1000.0" y="175" text-anchor="middle" class="label">3 切换目标名称</text><text x="1000.0" y="206" text-anchor="middle" class="small">原子替换的可见点</text><text x="1000.0" y="237" text-anchor="middle" class="small">检查 rename 结果</text><path class="arrow" d="M345 192 H445"/><path class="arrow" d="M745 192 H845"/><rect x="845" y="350" width="310" height="105" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="1000.0" y="385" text-anchor="middle" class="label">4 同步父目录</text><text x="1000.0" y="416" text-anchor="middle" class="small">建立名称持久化条件</text><text x="1000.0" y="447" text-anchor="middle" class="small">检查同步结果</text><rect x="445" y="350" width="300" height="105" rx="12" fill="#e8f4ec" stroke="#7a98ac" stroke-width="2"/><text x="595.0" y="385" text-anchor="middle" class="label">5 报告成功</text><text x="595.0" y="416" text-anchor="middle" class="small">此时才满足约定</text><text x="595.0" y="447" text-anchor="middle" class="small">保留失败进展</text><path class="arrow" d="M1000 245 V350"/><path class="arrow" d="M845 402 H745"/><text class="small" x="45" y="352">替换前失败：</text><text class="small" x="45" y="386">通常保留旧目标</text><text class="small" x="45" y="430">替换后同步失败：</text><text class="small" x="45" y="464">新名称可能已经可见</text><text class="small" x="45" y="544">前提：目标文件系统与设备支持并遵守相应同步语义</text><text class="small" x="45" y="582">原子可见性与崩溃后持久性分别建立，不能只检查最后一次写入</text></svg>