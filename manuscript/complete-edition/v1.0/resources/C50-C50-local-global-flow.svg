<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>局部及时输出与全局一致性分工</title><desc>前端提供及时连续的局部状态，后端通过经验证的历史约束修正全局地图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">局部及时输出与全局一致性分工</text><rect x="45" y="140" width="270" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="174" font-size="22" fill="#213746">原始观测与条件</text><text x="63" y="208" font-size="22" fill="#213746">坐标 时间 标定</text><rect x="465" y="140" width="270" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="483" y="174" font-size="22" fill="#213746">前端局部跟踪</text><text x="483" y="208" font-size="22" fill="#213746">关联与相对运动</text><rect x="890" y="140" width="265" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="908" y="174" font-size="22" fill="#213746">连续局部输出</text><text x="908" y="208" font-size="22" fill="#213746">时间与退化状态</text><path d="M315,200 L465,200" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M735,200 L890,200" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="385" width="290" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="419" font-size="22" fill="#213746">关键帧与子地图</text><text x="63" y="453" font-size="22" fill="#213746">保留有价值的信息</text><rect x="465" y="385" width="270" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="483" y="419" font-size="22" fill="#213746">后端图优化</text><text x="483" y="453" font-size="22" fill="#213746">历史约束与版本</text><rect x="865" y="385" width="290" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="883" y="419" font-size="22" fill="#213746">回环候选与验证</text><text x="883" y="453" font-size="22" fill="#213746">外观相似不是证据</text><path d="M465,240 L270,385" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M335,445 L465,445" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M865,445 L735,445" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="45" y="590" font-size="23" fill="#213746">后台结果合入要检查图版本；全局地图修正不等于物体瞬时运动</text></g></svg>