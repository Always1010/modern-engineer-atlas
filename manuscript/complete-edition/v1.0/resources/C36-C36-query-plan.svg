<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730" role="img" aria-labelledby="title desc"><title id="title">从查询语义到物理执行计划</title><desc id="desc">上方为解析绑定、逻辑变换和成本选择，下方为教学查询的扫描、连接、聚合物理树，统计与约束输入优化器。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="730" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">从查询语义到物理执行计划</text><rect x="42" y="99" width="322" height="72" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="82" y="145" class="body">解析与语义绑定</text><rect x="418" y="99" width="322" height="72" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="458" y="145" class="body">逻辑等价变换</text><rect x="794" y="99" width="322" height="72" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="834" y="145" class="body">物理计划选择</text><line x1="368" y1="135" x2="411" y2="135" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="745" y1="135" x2="788" y2="135" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="222" width="395" height="100" rx="10" fill="#fff3df" stroke="#ad8850" stroke-width="2"/><text x="90" y="263" class="body">统计：基数、分布、相关性</text><text x="90" y="298" class="small">约束：键、类型、空值与授权</text><line x1="469" y1="270" x2="859" y2="270" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="859" y1="268" x2="859" y2="183" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="47" y="373" class="small">一个教学物理计划：按条件关联，再汇总</text><rect x="463" y="403" width="260" height="65" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="530" y="446" class="body">聚合结果</text><rect x="463" y="502" width="260" height="65" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="530" y="545" class="body">哈希连接</text><line x1="593" y1="499" x2="593" y2="475" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="102" y="616" width="370" height="67" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="137" y="659" class="body">订单扫描与过滤</text><rect x="751" y="616" width="340" height="67" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="790" y="659" class="body">客户索引访问</text><line x1="289" y1="613" x2="458" y2="548" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="900" y1="613" x2="730" y2="548" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/></svg>