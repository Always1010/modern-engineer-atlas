<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">图 57-1 从岗位词语到可核对证据</title><desc id="desc">以设备上位机为例，职责经交付对象、运行约束、失败风险三方面拆解，分别寻找状态机与接口、实验与故障记录、交付与维护文档，最后明确个人责任和证据限制。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#476a83"/></marker></defs><rect width="1000" height="610" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#141414"><text x="40" y="44" font-size="28" font-weight="bold">从“用了什么”继续问“交付了什么”</text><text x="40" y="82" font-size="21">教学示例：设备上位机，不代表任何岗位的完整要求</text><g fill="#e6eef5" stroke="#61798c" stroke-width="1.5"><rect x="40" y="124" width="245" height="97" rx="5"/><rect x="379" y="124" width="245" height="97" rx="5"/><rect x="713" y="124" width="245" height="97" rx="5"/><rect x="40" y="327" width="245" height="110" rx="5"/><rect x="379" y="327" width="245" height="110" rx="5"/><rect x="713" y="327" width="245" height="110" rx="5"/></g><g font-size="22" text-anchor="middle"><text x="162" y="162">交付对象</text><text x="162" y="199" font-size="20">界面 设备与连接状态</text><text x="501" y="162">运行约束</text><text x="501" y="199" font-size="20">时延 资源与现场环境</text><text x="835" y="162">失败风险</text><text x="835" y="199" font-size="20">断连 取消与数据损坏</text><text x="162" y="366">实现与设计证据</text><text x="162" y="403" font-size="20">状态机 接口与所有权</text><text x="501" y="366">验证证据</text><text x="501" y="403" font-size="20">负载 测量与故障记录</text><text x="835" y="366">交付与复盘证据</text><text x="835" y="403" font-size="20">安装 诊断与恢复文档</text></g><g stroke="#476a83" stroke-width="3" marker-end="url(#a)"><path d="M162 222V320"/><path d="M501 222V320"/><path d="M835 222V320"/></g><text x="40" y="504" font-size="23" font-weight="bold">每项证据都要说明</text><text x="40" y="545" font-size="22">自己的责任 采用的前提 已做的验证 尚未确认的部分</text><text x="40" y="585" font-size="20">技术词提供线索，不能单独证明独立交付能力</text></g></svg>
