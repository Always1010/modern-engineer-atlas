<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">源图 交换图与设备制品</title><desc id="desc">源模型经过导出和契约核验生成ONNX图，再针对CPU、GPU或NPU条件编译，三种设备制品具有各自兼容要求。</desc><metadata>Original educational diagram; Modern Engineer Atlas; 2026-10-03; no measured results; no third-party image.</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#406779"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="30" fill="#183849" text-anchor="start">源图 交换图与设备制品</text><rect x="35" y="100" width="245" height="120" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="157.5" y="134" font-size="24" fill="#183849" text-anchor="middle">源框架模型</text><text x="157.5" y="168" font-size="24" fill="#183849" text-anchor="middle">参数与模块模式</text><text x="157.5" y="202" font-size="24" fill="#183849" text-anchor="middle">预处理契约</text><rect x="377" y="100" width="245" height="120" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="499.5" y="134" font-size="24" fill="#183849" text-anchor="middle">ONNX 交换图</text><text x="499.5" y="168" font-size="24" fill="#183849" text-anchor="middle">IR 与 opset</text><text x="499.5" y="202" font-size="24" fill="#183849" text-anchor="middle">shape 与 dtype</text><rect x="725" y="100" width="240" height="120" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="845.0" y="134" font-size="24" fill="#183849" text-anchor="middle">目标编译器</text><text x="845.0" y="168" font-size="24" fill="#183849" text-anchor="middle">覆盖与分区</text><text x="845.0" y="202" font-size="24" fill="#183849" text-anchor="middle">布局与精度</text><path d="M280,160 L377,160" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M622,160 L725,160" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="330" y="140" font-size="23" fill="#183849" text-anchor="middle">导出</text><text x="674" y="140" font-size="23" fill="#183849" text-anchor="middle">检查</text><rect x="45" y="319" width="910" height="86" rx="10" fill="#fbefd9" stroke="#598195" stroke-width="2"/><text x="500.0" y="353" font-size="24" fill="#183849" text-anchor="middle">每一步核验：输入范围  中间结果  任务输出  资源峰值</text><path d="M845,220 L845,295" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="467" width="260" height="90" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="180.0" y="501" font-size="24" fill="#183849" text-anchor="middle">CPU 制品</text><text x="180.0" y="535" font-size="24" fill="#183849" text-anchor="middle">运行库与指令集</text><rect x="370" y="467" width="260" height="90" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="500.0" y="501" font-size="24" fill="#183849" text-anchor="middle">GPU 引擎</text><text x="500.0" y="535" font-size="24" fill="#183849" text-anchor="middle">设备与运行时版本</text><rect x="690" y="467" width="260" height="90" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="820.0" y="501" font-size="24" fill="#183849" text-anchor="middle">NPU 制品</text><text x="820.0" y="535" font-size="24" fill="#183849" text-anchor="middle">编译器与固件条件</text><path d="M180,405 L180,467" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M500,405 L500,467" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M820,405 L820,467" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/></g></svg>