<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="t d"><title id="t">安全回收记录什么信息</title><desc id="d">危险指针按对象保护，epoch按时期保护，RCU按读侧区间与宽限期延后回收。</desc><metadata>作者原创教学示意；2026-10-03；非运行记录；语义见正文来源。</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="580" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">安全回收记录什么信息</text><rect x="40" y="112" width="290" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="185.0" y="143" font-size="20" text-anchor="middle">Hazard Pointer</text><text x="185.0" y="172" font-size="20" text-anchor="middle">读者声明具体对象 A</text><rect x="400" y="112" width="650" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="725.0" y="143" font-size="20" text-anchor="middle">A 已退休，扫描仍看到合法保护 → 保留 A</text><text x="725.0" y="172" font-size="20" text-anchor="middle">保护结束后才可按协议回收</text><rect x="40" y="245" width="290" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="185.0" y="276" font-size="20" text-anchor="middle">Epoch</text><text x="185.0" y="305" font-size="20" text-anchor="middle">读者登记活跃时期 e</text><rect x="400" y="245" width="650" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="725.0" y="276" font-size="20" text-anchor="middle">旧时期读者未退出 → 相关退休批次继续保留</text><text x="725.0" y="305" font-size="20" text-anchor="middle">阶段推进依赖完整参与者协议</text><rect x="40" y="378" width="290" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="185.0" y="409" font-size="20" text-anchor="middle">RCU</text><text x="185.0" y="438" font-size="20" text-anchor="middle">读侧区间与宽限期</text><rect x="400" y="378" width="650" height="95" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="725.0" y="409" font-size="20" text-anchor="middle">先阻止新读者进入旧对象，再等待旧读者结束</text><text x="725.0" y="438" font-size="20" text-anchor="middle">宽限期经过与删除回调完成需要区分</text><text x="45" y="535" font-size="21" text-anchor="start">三者都不自动提供写者互斥，也不替代对象初始化的发布关系。</text></g></svg>