<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">分布式查询必须保持相容的读取点</title><desc id="desc">协调者指定读取点120，三个分片需要提供该点快照。第二分片进度110尚不足，不能静默返回旧数据。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">分布式查询必须保持相容的读取点</text><rect x="338" y="92" width="483" height="87" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="374" y="146" class="body">协调者：共同读取点为 120</text><rect x="42" y="303" width="322" height="143" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="130" y="349" class="body">分片甲</text><text x="86" y="400" class="small">可提供 120</text><rect x="418" y="303" width="322" height="143" rx="10" fill="#fff3df" stroke="#6686a3" stroke-width="2"/><text x="506" y="349" class="body">分片乙</text><text x="462" y="400" class="small">当前只推进到 110</text><rect x="794" y="303" width="322" height="143" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="882" y="349" class="body">分片丙</text><text x="838" y="400" class="small">可提供 120</text><line x1="400" y1="183" x2="201" y2="293" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="579" y1="183" x2="579" y2="293" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="750" y1="183" x2="955" y2="293" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="271" class="small">读同一快照</text><text x="448" y="271" class="small">读同一快照</text><text x="927" y="241" class="small">读同一快照</text><text x="43" y="507" class="small">落后分片：等待、改路由或按契约失败；不得静默降低读取点</text><text x="43" y="558" class="small">对单个分片重试，也须保持与其他已取得结果相容的快照身份</text></svg>