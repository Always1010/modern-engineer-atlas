<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">帧时间线与呈现预算</title><desc id="desc">教学时间线中CPU准备每帧5毫秒，GPU每帧执行10毫秒，两者可流水重叠。GPU完成后仍可能等待60赫兹呈现点，帧吞吐和输入到显示延迟不同。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="790" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">帧时间线与呈现预算</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><text x="48" y="225" font-size="25" fill="#16384c" text-anchor="start">CPU</text><path d="M180,238 L1110,238" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="320" font-size="25" fill="#16384c" text-anchor="start">GPU</text><path d="M180,333 L1110,333" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="420" font-size="25" fill="#16384c" text-anchor="start">呈现</text><path d="M180,433 L1110,433" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="163" font-size="19" fill="#16384c" text-anchor="middle">0</text><text x="310" y="163" font-size="19" fill="#16384c" text-anchor="middle">5</text><text x="440" y="163" font-size="19" fill="#16384c" text-anchor="middle">10</text><text x="570" y="163" font-size="19" fill="#16384c" text-anchor="middle">15</text><text x="700" y="163" font-size="19" fill="#16384c" text-anchor="middle">20</text><text x="830" y="163" font-size="19" fill="#16384c" text-anchor="middle">25</text><text x="960" y="163" font-size="19" fill="#16384c" text-anchor="middle">30</text><text x="1090" y="163" font-size="19" fill="#16384c" text-anchor="middle">35</text><text x="48" y="163" font-size="21" fill="#16384c" text-anchor="start">时间 / ms</text><rect x="180" y="198" width="130" height="54" rx="8" fill="#e8f5ee" stroke="#7796a8"/><text x="245.0" y="233" font-size="21" fill="#16384c" text-anchor="middle">帧N</text><rect x="310" y="198" width="130" height="54" rx="8" fill="#e8f2f7" stroke="#7796a8"/><text x="375.0" y="233" font-size="21" fill="#16384c" text-anchor="middle">帧N+1</text><rect x="310" y="292" width="260" height="54" rx="8" fill="#e8f5ee" stroke="#7796a8"/><text x="440.0" y="327" font-size="21" fill="#16384c" text-anchor="middle">帧N：10 ms</text><rect x="570" y="292" width="260" height="54" rx="8" fill="#e8f2f7" stroke="#7796a8"/><text x="700.0" y="327" font-size="21" fill="#16384c" text-anchor="middle">帧N+1：10 ms</text><circle cx="613.4200000000001" cy="433" r="9" fill="#ac7629"/><text x="613.4200000000001" y="475" font-size="22" fill="#16384c" text-anchor="middle">帧N</text><circle cx="1046.58" cy="433" r="9" fill="#ac7629"/><text x="1046.58" y="475" font-size="22" fill="#16384c" text-anchor="middle">帧N+1</text><text x="180" y="527" font-size="22" fill="#16384c" text-anchor="start">假设60 Hz呈现且未错过相应刷新：16.67 ms、33.33 ms</text><rect x="48" y="579" width="533" height="145" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="66" y="614" font-size="25" fill="#16384c" text-anchor="start">吞吐看瓶颈与限制</text><text x="66" y="651" font-size="21" fill="#38596b" text-anchor="start">CPU与GPU可重叠，不能简单相加</text><text x="66" y="682" font-size="21" fill="#38596b" text-anchor="start">显示刷新或限帧可能另设上限</text><rect x="617" y="579" width="533" height="145" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="635" y="614" font-size="25" fill="#16384c" text-anchor="start">延迟看同一输入的完整路径</text><text x="635" y="651" font-size="21" fill="#38596b" text-anchor="start">准备 → 排队 → 执行 → 呈现等待</text><text x="635" y="682" font-size="21" fill="#38596b" text-anchor="start">更多在途帧可能提高吞吐并增加等待</text><text x="48" y="766" font-size="21" fill="#16384c" text-anchor="start">人工模型省略上传、调度波动与扫描时间，不是任何设备的实测日志</text></g></svg>