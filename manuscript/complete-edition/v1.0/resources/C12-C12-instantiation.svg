<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 12-1 模板调用的检查层次</title><desc id="desc">展示推导、约束候选筛选、定义实例化与错误边界。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 12-1 模板调用的检查层次</text><rect x="50" y="120" width="250" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="175.0" y="152" text-anchor="middle" font-size="21">调用实参</text><text x="175.0" y="182" text-anchor="middle" font-size="21">类型 / 值类别</text><rect x="405" y="120" width="340" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="575.0" y="152" text-anchor="middle" font-size="21">推导与候选形成</text><text x="575.0" y="182" text-anchor="middle" font-size="21">不是任意隐式转换搜索</text><rect x="855" y="120" width="250" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="980.0" y="152" text-anchor="middle" font-size="21">接口约束</text><text x="980.0" y="182" text-anchor="middle" font-size="21">是否适用</text><path d="M300 170 L400 170" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 170 L850 170" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="75" y="325" width="285" height="100" rx="12" fill="#fff1dc" stroke="#8296aa"/><text x="217.5" y="357" text-anchor="middle" font-size="21">无候选或无法消歧</text><text x="217.5" y="387" text-anchor="middle" font-size="21">公开调用点失败</text><rect x="455" y="325" width="285" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="597.5" y="357" text-anchor="middle" font-size="21">选定候选后</text><text x="597.5" y="387" text-anchor="middle" font-size="21">按需要实例化定义</text><rect x="835" y="325" width="285" height="100" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="977.5" y="357" text-anchor="middle" font-size="21">函数体检查</text><text x="977.5" y="387" text-anchor="middle" font-size="21">内部错误可能是硬错误</text><path d="M980 220 L600 320" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M920 220 L260 320" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 375 L830 375" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="65" y="485" font-size="20">类模板形成不等于所有成员函数体都立即实例化</text><text x="65" y="528" font-size="20">SFINAE / requires 有即时上下文边界，不能屏蔽任意内部错误</text></g></svg>