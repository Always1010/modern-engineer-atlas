<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">几何表示与科学数据证据链</title><desc id="desc">原始CAD几何分别生成显示网格、碰撞代理和分析网格。分析结果携带关联位置单位时间误差，再经插值与色标呈现。显示更平滑不增加原始测量或求解信息。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="830" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">几何表示与科学数据证据链</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="151" width="297" height="186" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="186" font-size="25" fill="#16384c" text-anchor="start">原始设计几何</text><text x="66" y="223" font-size="21" fill="#38596b" text-anchor="start">解析 / 参数曲面</text><text x="66" y="254" font-size="21" fill="#38596b" text-anchor="start">拓扑、定向与容差</text><text x="66" y="285" font-size="21" fill="#38596b" text-anchor="start">持久部件身份</text><rect x="426" y="146" width="327" height="100" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="444" y="181" font-size="25" fill="#16384c" text-anchor="start">显示网格</text><text x="444" y="218" font-size="21" fill="#38596b" text-anchor="start">轮廓与屏幕误差</text><rect x="426" y="275" width="327" height="100" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="444" y="310" font-size="25" fill="#16384c" text-anchor="start">碰撞代理</text><text x="444" y="347" font-size="21" fill="#38596b" text-anchor="start">检测与实时预算</text><rect x="426" y="404" width="327" height="100" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="444" y="439" font-size="25" fill="#16384c" text-anchor="start">分析网格</text><text x="444" y="476" font-size="21" fill="#38596b" text-anchor="start">单元与物理离散</text><path d="M345,198 L426,198" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M345,253 L426,325" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M345,302 L426,454" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="826" y="405" width="327" height="162" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="844" y="440" font-size="25" fill="#16384c" text-anchor="start">结果字段</text><text x="844" y="477" font-size="21" fill="#38596b" text-anchor="start">点 / 单元 / 积分点</text><text x="844" y="508" font-size="21" fill="#38596b" text-anchor="start">单位、坐标、时间</text><text x="844" y="539" font-size="21" fill="#38596b" text-anchor="start">来源版本与误差</text><path d="M753,454 L826,454" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="611" width="527" height="138" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="66" y="646" font-size="25" fill="#16384c" text-anchor="start">后处理必须保留参数</text><text x="66" y="683" font-size="21" fill="#38596b" text-anchor="start">插值、重采样、等值面与体采样</text><text x="66" y="714" font-size="21" fill="#38596b" text-anchor="start">数值关联改变可能影响极值与守恒</text><rect x="625" y="611" width="528" height="138" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="643" y="646" font-size="25" fill="#16384c" text-anchor="start">显示必须保留解释</text><text x="643" y="683" font-size="21" fill="#38596b" text-anchor="start">色标、范围、单位、缺失值与倍率</text><text x="643" y="714" font-size="21" fill="#38596b" text-anchor="start">截图不代替数据和处理记录</text><path d="M575,680 L625,680" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="799" font-size="23" fill="#16384c" text-anchor="start">显示网格、碰撞网格和分析网格可以关联，不能无条件互相替代</text></g></svg>