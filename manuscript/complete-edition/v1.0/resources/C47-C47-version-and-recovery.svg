<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">模型发布与流式恢复的边界</title><desc id="desc">制品版本绑定请求与缓存；已发送输出不能简单撤回；通信组恢复需要协调清理和明确重建条件。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#497486"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#183646"><text x="50" y="65" font-size="36" font-weight="700">模型发布与流式恢复的边界</text><rect x="55" y="125" width="370" height="120" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="73" y="160" font-size="24">版本身份</text><text x="73" y="193" font-size="24">权重 / 模板 / 量化 / 运行时</text><path d="M435 185 L500 185" stroke="#497486" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="515" y="125" width="370" height="120" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="533" y="160" font-size="24">请求与缓存绑定</text><text x="533" y="193" font-size="24">输入 / 前缀 / 状态版本</text><path d="M895 185 L960 185" stroke="#497486" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="975" y="125" width="370" height="120" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="993" y="160" font-size="24">并行实例组</text><text x="993" y="193" font-size="24">rank / 通信步骤 / 缓冲</text><rect x="70" y="325" width="545" height="140" rx="13" fill="#e7f3e8" stroke="#7799aa" stroke-width="2"/><text x="88" y="360" font-size="24">尚未交付输出</text><text x="88" y="393" font-size="24">符合权限与期限时可重试或重算</text><text x="88" y="426" font-size="24">仍需处理原执行是否已经停止</text><rect x="755" y="325" width="575" height="140" rx="13" fill="#fff0d8" stroke="#7799aa" stroke-width="2"/><text x="773" y="360" font-size="24">已有部分输出送出</text><text x="773" y="393" font-size="24">保留片段身份与确认边界</text><text x="773" y="426" font-size="24">不得默默拼接两次不同生成</text><rect x="160" y="555" width="1080" height="115" rx="13" fill="#e5f1f5" stroke="#7799aa" stroke-width="2"/><text x="178" y="590" font-size="24">通信组失效：停止新提交 → 协调终止与清理 → 重建可用状态</text><text x="178" y="623" font-size="24">缓存可重算不代表可以无条件复现原采样轨迹</text><text x="65" y="739" font-size="26">入口取消 ≠ 设备停止；模型加载 ≠ 质量验收；进程重启 ≠ 请求恢复</text></g></svg>