<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">日志多数派与资源栅栏保护不同边界</title><desc id="desc">左侧五个投票节点中三个构成多数，右侧资源已接受代次42并拒绝旧工作者代次41。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">日志多数派与资源栅栏保护不同边界</text><rect x="35" y="86" width="515" height="443" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><rect x="585" y="86" width="540" height="443" rx="10" fill="#faf7f0" stroke="#ab9475" stroke-width="2"/><text x="58" y="129" class="body">复制日志的决定</text><text x="608" y="129" class="body">外部资源的接受规则</text><circle cx="120" cy="210" r="42" fill="#dceee3" stroke="#617f90" stroke-width="2"/><text x="110" y="219" class="body">A</text><circle cx="270" cy="210" r="42" fill="#dceee3" stroke="#617f90" stroke-width="2"/><text x="260" y="219" class="body">B</text><circle cx="420" cy="210" r="42" fill="#dceee3" stroke="#617f90" stroke-width="2"/><text x="410" y="219" class="body">C</text><circle cx="190" cy="342" r="42" fill="#eee" stroke="#617f90" stroke-width="2"/><text x="180" y="351" class="body">D</text><circle cx="355" cy="342" r="42" fill="#eee" stroke="#617f90" stroke-width="2"/><text x="345" y="351" class="body">E</text><text x="58" y="432" class="small">A B C 可构成三节点多数</text><text x="58" y="479" class="small">还须遵守任期、日志和提交规则</text><rect x="610" y="178" width="192" height="74" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="630" y="222" class="body">新工作者 42</text><rect x="610" y="324" width="192" height="74" rx="10" fill="#eee" stroke="#999" stroke-width="2"/><text x="630" y="368" class="body">旧工作者 41</text><rect x="904" y="240" width="190" height="103" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="925" y="280" class="body">资源端</text><text x="925" y="317" class="small">已接受 42</text><line x1="805" y1="215" x2="900" y2="260" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="805" y1="361" x2="900" y2="324" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="821" y="215" class="small">接受</text><text x="821" y="399" class="small">拒绝</text><text x="610" y="469" class="small">令牌必须与资源修改原子核验</text><text x="42" y="578" class="small">选出新 Leader，并不自动撤销旧工作者对日志之外资源的请求</text></svg>