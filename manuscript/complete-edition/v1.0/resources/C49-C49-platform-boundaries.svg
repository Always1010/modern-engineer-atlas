<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>平台分工与硬件保护边界</title><desc>端云按时间约束划分职责，设备保护独立于普通命令路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">平台分工与硬件保护边界</text><rect x="40" y="130" width="285" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="58" y="164" font-size="22" fill="#213746">端侧传感与估计</text><text x="58" y="198" font-size="22" fill="#213746">采样时间 有效状态</text><rect x="440" y="130" width="290" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="458" y="164" font-size="22" fill="#213746">本地控制循环</text><text x="458" y="198" font-size="22" fill="#213746">read → update → write</text><rect x="850" y="130" width="300" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="868" y="164" font-size="22" fill="#213746">硬件驱动与执行器</text><text x="868" y="198" font-size="22" fill="#213746">实际反馈与故障</text><path d="M325,190 L440,190" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M730,190 L850,190" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="375" width="300" height="135" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="58" y="409" font-size="22" fill="#213746">云端任务与离线分析</text><text x="58" y="443" font-size="22" fill="#213746">结果带版本和期限</text><text x="58" y="477" font-size="22" fill="#213746">网络可中断</text><rect x="445" y="375" width="285" height="135" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="463" y="409" font-size="22" fill="#213746">本地监督状态机</text><text x="463" y="443" font-size="22" fill="#213746">启动 降级 恢复</text><rect x="850" y="375" width="300" height="135" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="868" y="409" font-size="22" fill="#213746">独立硬件保护边界</text><text x="868" y="443" font-size="22" fill="#213746">依危害设计</text><text x="868" y="477" font-size="22" fill="#213746">不等云端答复</text><path d="M340,430 L445,430" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M590,375 L590,250" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1000,375 L1000,250" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="45" y="590" font-size="22" fill="#213746">软件状态 设备使能 机械停稳必须分别确认；图中箭头仅表示责任关系</text></g></svg>