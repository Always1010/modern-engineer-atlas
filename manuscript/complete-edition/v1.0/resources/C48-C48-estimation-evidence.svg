<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>融合是带条件的证据更新</title><desc>预测和新观测形成创新，通过统计及有效性检查产生后验和退化状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">融合是带条件的证据更新</text><rect x="50" y="145" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="68" y="179" font-size="22" fill="#213746">先验状态与协方差</text><text x="68" y="213" font-size="22" fill="#213746">x⁺，P⁺</text><rect x="465" y="145" width="270" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="483" y="179" font-size="22" fill="#213746">运动模型传播</text><text x="483" y="213" font-size="22" fill="#213746">x⁻，P⁻，参考时刻</text><rect x="895" y="145" width="255" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="913" y="179" font-size="22" fill="#213746">创新与一致性</text><text x="913" y="213" font-size="22" fill="#213746">r，S，异常状态</text><path d="M300,202 L465,202" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M735,202 L895,202" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="455" y="365" width="310" height="130" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="473" y="399" font-size="22" fill="#213746">新观测 z 与模型 h</text><text x="473" y="433" font-size="22" fill="#213746">坐标 单位 采样时间</text><text x="473" y="467" font-size="22" fill="#213746">R 与原始来源</text><path d="M765,410 L895,260" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="900" y="390" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="918" y="424" font-size="22" fill="#213746">后验与有效状态</text><text x="918" y="458" font-size="22" fill="#213746">x⁺，P⁺，退化标记</text><path d="M1022,260 L1022,390" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="380" font-size="21" fill="#213746">检查输入是否重复</text><text x="55" y="414" font-size="21" fill="#213746">检查误差是否相关</text><text x="55" y="448" font-size="21" fill="#213746">拒绝不等于自动恢复</text><text x="55" y="580" font-size="23" fill="#213746">独立性和模型成立是前提；协方差变小不自动证明真实误差变小</text></g></svg>