<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">坐标 法线与颜色的不同变换</title><desc id="desc">模型点经世界和观察变换到裁剪空间，再裁剪、透视除法和视口映射。法线使用可逆线性变换的逆转置，颜色在线性空间参与照明与合成。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="760" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">坐标 法线与颜色的不同变换</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="150" width="250" height="120" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="185" font-size="25" fill="#16384c" text-anchor="start">模型空间</text><text x="66" y="222" font-size="21" fill="#38596b" text-anchor="start">物体自身坐标</text><path d="M298,212 L327,212" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="332" y="150" width="250" height="120" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="350" y="185" font-size="25" fill="#16384c" text-anchor="start">世界空间</text><text x="350" y="222" font-size="21" fill="#38596b" text-anchor="start">M：放入场景</text><path d="M582,212 L611,212" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="616" y="150" width="250" height="120" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="634" y="185" font-size="25" fill="#16384c" text-anchor="start">观察空间</text><text x="634" y="222" font-size="21" fill="#38596b" text-anchor="start">V：相机坐标</text><path d="M866,212 L895,212" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="900" y="150" width="250" height="120" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="918" y="185" font-size="25" fill="#16384c" text-anchor="start">裁剪空间</text><text x="918" y="222" font-size="21" fill="#38596b" text-anchor="start">P：齐次投影</text><rect x="48" y="325" width="340" height="135" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="360" font-size="25" fill="#16384c" text-anchor="start">先裁剪</text><text x="66" y="397" font-size="21" fill="#38596b" text-anchor="start">保留齐次关系与 w</text><text x="66" y="428" font-size="21" fill="#38596b" text-anchor="start">遵循API裁剪约定</text><rect x="430" y="325" width="340" height="135" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="448" y="360" font-size="25" fill="#16384c" text-anchor="start">再透视除法</text><text x="448" y="397" font-size="21" fill="#38596b" text-anchor="start">x / w，y / w，z / w</text><text x="448" y="428" font-size="21" fill="#38596b" text-anchor="start">得到归一化设备坐标</text><rect x="812" y="325" width="340" height="135" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="830" y="360" font-size="25" fill="#16384c" text-anchor="start">再视口映射</text><text x="830" y="397" font-size="21" fill="#38596b" text-anchor="start">映射到帧缓冲</text><text x="830" y="428" font-size="21" fill="#38596b" text-anchor="start">核对深度范围与Y方向</text><path d="M388,394 L430,394" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M770,394 L812,394" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="525" width="533" height="154" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="66" y="560" font-size="25" fill="#16384c" text-anchor="start">法线独立处理</text><text x="66" y="597" font-size="21" fill="#38596b" text-anchor="start">n′ = A⁻ᵀ n，再归一化</text><text x="66" y="628" font-size="21" fill="#38596b" text-anchor="start">前提：A可逆；注意镜像与切线手性</text><rect x="617" y="525" width="533" height="154" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="635" y="560" font-size="25" fill="#16384c" text-anchor="start">颜色独立处理</text><text x="635" y="597" font-size="21" fill="#38596b" text-anchor="start">颜色解码 → 线性照明 → 输出编码</text><text x="635" y="628" font-size="21" fill="#38596b" text-anchor="start">法线、粗糙度等数据不做sRGB解码</text><text x="48" y="727" font-size="23" fill="#16384c" text-anchor="start">约定必须贯穿CPU、Shader、资源格式与最终显示</text></g></svg>