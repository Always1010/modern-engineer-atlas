<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">张量元数据 共享存储与反向依赖</title><desc id="desc">两种不同shape和stride的张量视图共同引用六个存储元素；前向保存的数值由反向阶段使用。</desc><metadata>Original educational diagram; Modern Engineer Atlas; 2026-10-03; no measured results; no third-party image.</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#406779"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="30" fill="#183849" text-anchor="start">张量元数据 共享存储与反向依赖</text><rect x="40" y="88" width="410" height="126" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="245.0" y="122" font-size="24" fill="#183849" text-anchor="middle">视图 A  shape (2,3)</text><text x="245.0" y="156" font-size="24" fill="#183849" text-anchor="middle">stride (3,1)  offset 0</text><rect x="550" y="88" width="410" height="126" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="755.0" y="122" font-size="24" fill="#183849" text-anchor="middle">转置视图 B  shape (3,2)</text><text x="755.0" y="156" font-size="24" fill="#183849" text-anchor="middle">stride (1,3)  offset 0</text><path d="M245,214 L385,277" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M755,214 L615,277" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="255" y="281" width="490" height="90" rx="10" fill="#fbefd9" stroke="#598195" stroke-width="2"/><text x="500.0" y="315" font-size="24" fill="#183849" text-anchor="middle">共享存储  0  1  2  3  4  5</text><text x="500" y="411" font-size="25" fill="#183849" text-anchor="middle">转置改变解释方式；不等于重排字节</text><rect x="40" y="454" width="255" height="90" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="167.5" y="488" font-size="24" fill="#183849" text-anchor="middle">前向运算</text><text x="167.5" y="522" font-size="24" fill="#183849" text-anchor="middle">读取输入与参数</text><rect x="374" y="454" width="255" height="90" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="501.5" y="488" font-size="24" fill="#183849" text-anchor="middle">保存求导所需值</text><text x="501.5" y="522" font-size="24" fill="#183849" text-anchor="middle">存储须保持有效</text><rect x="708" y="454" width="255" height="90" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="835.5" y="488" font-size="24" fill="#183849" text-anchor="middle">反向运算</text><text x="835.5" y="522" font-size="24" fill="#183849" text-anchor="middle">传播梯度</text><path d="M295,499 L374,499" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M629,499 L708,499" stroke="#406779" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="500" y="589" font-size="23" fill="#183849" text-anchor="middle">共享视图的原地修改，可能破坏反向所需旧值</text></g></svg>