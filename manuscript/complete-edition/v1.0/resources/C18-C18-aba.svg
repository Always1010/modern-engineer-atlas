<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="t d"><title id="t">比较相同地址无法验证旧拓扑</title><desc id="d">甲保存 A 与后继 B，乙摘下 A B 后重插 A，甲错误提交旧后继。</desc><metadata>作者原创教学示意；2026-10-03；非运行记录；语义见正文来源。</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="580" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">比较相同地址无法验证旧拓扑</text><text x="50" y="100" font-size="20" text-anchor="start">初始：head → A → B → C</text><rect x="45" y="130" width="420" height="108" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="255.0" y="161" font-size="20" text-anchor="middle">线程甲</text><text x="255.0" y="190" font-size="20" text-anchor="middle">读取 head = A，保存 next = B</text><text x="255.0" y="219" font-size="20" text-anchor="middle">随后暂停</text><rect x="635" y="130" width="420" height="108" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="845.0" y="161" font-size="20" text-anchor="middle">线程乙</text><text x="845.0" y="190" font-size="20" text-anchor="middle">移走 A，再移走 B</text><text x="845.0" y="219" font-size="20" text-anchor="middle">把 A 重新插到 C 之前</text><path d="M475 185 L623 185" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><text x="680" y="287" font-size="23" text-anchor="start">当前：head → A → C</text><rect x="45" y="320" width="420" height="105" rx="10" fill="#f8ece8" stroke="#7893ab" stroke-width="2"/><text x="255.0" y="351" font-size="20" text-anchor="middle">线程甲恢复</text><text x="255.0" y="380" font-size="20" text-anchor="middle">CAS 仍看到 head = A</text><text x="255.0" y="409" font-size="20" text-anchor="middle">把 head 错误更新为旧 B</text><path d="M635 337 L477 370" fill="none" stroke="#486078" stroke-width="3" marker-end="url(#a)"/><text x="48" y="478" font-size="21" text-anchor="start">地址仍是 A，但 A 的后继已经改变；节点不释放也会出现这个逻辑 ABA。</text><text x="48" y="520" font-size="21" text-anchor="start">保护生存期与验证拓扑历史，是两项不同的责任。</text></g></svg>