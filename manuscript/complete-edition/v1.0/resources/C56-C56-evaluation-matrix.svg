<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img"><title>任务类型与运行条件共同定义评测范围</title><desc>三种任务跨正常输入、资料权限变化以及故障恶意内容形成九类覆盖；汇总指标还需关键违规和成本。</desc><metadata>本书原创教学图；2026-10-03；非真实系统运行记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="690" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">任务类型与运行条件共同定义评测范围</text><text x="380" y="137" class="label" text-anchor="middle">正常输入</text><text x="670" y="137" class="label" text-anchor="middle">资料与权限变化</text><text x="960" y="137" class="label" text-anchor="middle">故障与恶意内容</text><rect x="35" y="180" width="200" height="85" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="135.0" y="229.5" class="label" text-anchor="middle">查询与总结</text><rect x="255" y="180" width="250" height="85" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="380.0" y="229.5" class="label" text-anchor="middle">证据与完整性</text><rect x="545" y="180" width="250" height="85" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="670.0" y="229.5" class="label" text-anchor="middle">版本 / 访问范围</text><rect x="835" y="180" width="250" height="85" rx="9" fill="#f1edf8" stroke="#8fa8bc" stroke-width="2"/><text x="960.0" y="229.5" class="label" text-anchor="middle">缺失 / 注入</text><rect x="35" y="305" width="200" height="85" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="135.0" y="354.5" class="label" text-anchor="middle">生成与编辑</text><rect x="255" y="305" width="250" height="85" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="380.0" y="354.5" class="label" text-anchor="middle">制品与约束</text><rect x="545" y="305" width="250" height="85" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="670.0" y="354.5" class="label" text-anchor="middle">对象 / 内容变更</text><rect x="835" y="305" width="250" height="85" rx="9" fill="#f1edf8" stroke="#8fa8bc" stroke-width="2"/><text x="960.0" y="354.5" class="label" text-anchor="middle">中断 / 验收绕过</text><rect x="35" y="430" width="200" height="85" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="135.0" y="479.5" class="label" text-anchor="middle">外部工具动作</text><rect x="255" y="430" width="250" height="85" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="380.0" y="479.5" class="label" text-anchor="middle">实际状态核验</text><rect x="545" y="430" width="250" height="85" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="670.0" y="479.5" class="label" text-anchor="middle">批准 / 权限撤销</text><rect x="835" y="430" width="250" height="85" rx="9" fill="#f1edf8" stroke="#8fa8bc" stroke-width="2"/><text x="960.0" y="479.5" class="label" text-anchor="middle">未知 / 重复 / 取消</text><rect x="110" y="573" width="940" height="67" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="613.5" class="label" text-anchor="middle">分别报告任务成功、关键违规、恢复结果与完整成本</text><text x="55" y="675" class="note" text-anchor="start">这是覆盖设计，不是测试成绩；低频高后果问题不能被平均分掩盖</text></svg>