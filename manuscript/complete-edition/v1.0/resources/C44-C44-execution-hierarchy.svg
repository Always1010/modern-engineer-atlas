<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">逻辑线程层次与物理驻留约束</title><desc id="desc">Grid含多个Block，Block含32线程Warp；SM资源有限，块可分批执行；网格同步要求协作启动。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">逻辑线程层次与物理驻留约束</text><rect x="55" y="145" width="735" height="465" rx="22" fill="#edf3f7" stroke="#88a6b8" stroke-width="2"/><text x="90" y="195" font-size="30">一次 Grid：多个逻辑线程块</text><rect x="90" y="235" width="310" height="315" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="245.0" y="281" text-anchor="middle" font-size="27">Block 0：协作单位</text><rect x="110" y="305" width="270" height="60" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="245.0" y="351" text-anchor="middle" font-size="27">Warp 0：32线程</text><rect x="110" y="375" width="270" height="60" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="245.0" y="421" text-anchor="middle" font-size="27">Warp 1：32线程</text><rect x="110" y="445" width="270" height="60" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="245.0" y="491" text-anchor="middle" font-size="27">Warp 2：32线程</text><rect x="445" y="235" width="310" height="315" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="600.0" y="281" text-anchor="middle" font-size="27">Block 1：协作单位</text><rect x="465" y="305" width="270" height="60" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="600.0" y="351" text-anchor="middle" font-size="27">Warp 0：32线程</text><rect x="465" y="375" width="270" height="60" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="600.0" y="421" text-anchor="middle" font-size="27">Warp 1：32线程</text><rect x="465" y="445" width="270" height="60" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="600.0" y="491" text-anchor="middle" font-size="27">Warp 2：32线程</text><rect x="900" y="200" width="430" height="155" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1115.0" y="246" text-anchor="middle" font-size="27">SM：有限驻留资源</text><text x="1115.0" y="286" text-anchor="middle" font-size="27">寄存器 / 共享存储</text><text x="1115.0" y="326" text-anchor="middle" font-size="27">线程与块上限</text><rect x="900" y="425" width="430" height="135" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1115.0" y="471" text-anchor="middle" font-size="27">其余块等待调度</text><text x="1115.0" y="511" text-anchor="middle" font-size="27">不保证按索引顺序运行</text><path d="M795 325 L890 280" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M795 470 L890 485" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="75" y="680" font-size="28">块内可同步；普通 Grid 不承诺全部块同时驻留</text><text x="75" y="730" font-size="27">网格同步另需协作启动、设备支持和驻留容量证明</text></g></svg>