<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Embedded Linux 发布需要解释配套工件</title><desc id="desc">启动加载器、内核、设备树、根文件系统、应用和实时核镜像需要兼容验证，持久数据与恢复另行管理。</desc><metadata>本书原创教学示意；2026-10-04；非实测波形或厂商架构；未复制厂商图表。</metadata><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#53687c"/></marker></defs><rect width="1200" height="810" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="48" y="52" font-size="30" font-weight="bold">Embedded Linux 发布需要解释配套工件</text><rect x="48" y="98" width="525" height="164" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="134" font-size="25" font-weight="bold">启动与硬件交接</text><text x="68" y="173" font-size="22">Boot ROM／bootloader：选择与加载</text><text x="68" y="205" font-size="22">kernel＋DTB：设备描述与驱动绑定</text><text x="68" y="237" font-size="22">板卡身份、启动参数与分区布局</text><rect x="626" y="98" width="525" height="164" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="646" y="134" font-size="25" font-weight="bold">用户态产品功能</text><text x="646" y="173" font-size="22">rootfs：系统库、服务与配置</text><text x="646" y="205" font-size="22">application：业务程序和依赖</text><text x="646" y="237" font-size="22">应用、配置、协议各有版本</text><polyline points="581,181 615,181" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="318" width="525" height="164" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="354" font-size="25" font-weight="bold">异构实时核</text><text x="68" y="393" font-size="22">remoteproc：生命周期与装载边界</text><text x="68" y="425" font-size="22">rpmsg：消息端点与协议边界</text><text x="68" y="457" font-size="22">实时固件、共享内存、握手版本</text><rect x="626" y="318" width="525" height="164" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="646" y="354" font-size="25" font-weight="bold">配套发布清单</text><text x="646" y="393" font-size="22">工件哈希、目标型号、兼容范围</text><text x="646" y="425" font-size="22">允许的更新组合与确认条件</text><text x="646" y="457" font-size="22">部分更新失败后的恢复路径</text><polyline points="310,269 310,306" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="581,403 615,403" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="888,269 888,306" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="538" width="525" height="170" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="574" font-size="25" font-weight="bold">持久数据另有生命周期</text><text x="68" y="613" font-size="22">配置、标定、身份和历史记录</text><text x="68" y="645" font-size="22">新旧版本的数据可读写方向</text><text x="68" y="677" font-size="22">镜像回退之前先核对数据兼容</text><rect x="626" y="538" width="525" height="170" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="646" y="574" font-size="25" font-weight="bold">保留能实际启动的恢复入口</text><text x="646" y="613" font-size="22">恢复镜像、介质与启动条件</text><text x="646" y="645" font-size="22">确认正常功能后再推进状态</text><text x="646" y="677" font-size="22">Bootloader更新按产品能力单列</text><polyline points="888,489 888,527" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><text x="48" y="763" font-size="24" font-weight="bold">箭头是兼容与交接，不承诺全包原子更新；具体机制服从产品文档</text></g></svg>