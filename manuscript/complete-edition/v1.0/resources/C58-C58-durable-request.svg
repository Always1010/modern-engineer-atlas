<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630"><title>一次写入有多个完成边界</title><desc>接收、日志写入、持久化、回复分开。恢复根据有效日志核查同一操作，避免超时后重复业务效果。</desc><metadata>Original educational illustration; 2026-10-03; no experimental result.</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="50" y="57" class="title" text-anchor="start">一次写入有多个完成边界</text><rect x="45" y="145" width="215" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="152.5" y="189.5" class="label" text-anchor="middle">接收请求</text><text x="152.5" y="219.5" class="small" text-anchor="middle">长度 / 身份 / 容量</text><rect x="330" y="145" width="215" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="437.5" y="189.5" class="label" text-anchor="middle">写入记录</text><text x="437.5" y="219.5" class="small" text-anchor="middle">保持操作标识</text><rect x="615" y="145" width="215" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="722.5" y="189.5" class="label" text-anchor="middle">确认持久化</text><text x="722.5" y="219.5" class="small" text-anchor="middle">检查同步结果</text><rect x="900" y="145" width="215" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1007.5" y="189.5" class="label" text-anchor="middle">发送回复</text><text x="1007.5" y="219.5" class="small" text-anchor="middle">客户端可能未收到</text><path d="M260,198 L322,198" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M545,198 L607,198" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M830,198 L892,198" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="355" width="400" height="112" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="403.0" class="label" text-anchor="middle">恢复有效日志</text><text x="580.0" y="433.0" class="small" text-anchor="middle">重建数据与操作结果</text><path d="M720,255 L720,345" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,410 L152,410" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M152,410 L152,262" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><text x="278" y="392" class="small" text-anchor="middle">按原标识核查</text><text x="55" y="540" class="note" text-anchor="start">未收到回复 ≠ 未产生效果</text><text x="55" y="579" class="note" text-anchor="start">失败与未知分开；新建 / 更名还需对应目录持久化条件</text></svg>