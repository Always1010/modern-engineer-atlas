<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">B+ 树范围访问路径</title><desc id="desc">查询二十四到六十八的半开范围。先定位起始叶页，再沿叶层扫描，必要时访问正文记录。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#506579"/></marker></defs><rect width="1120" height="650" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" fill="#192a3a"><text x="42" y="50" font-size="28" fill="#192a3a" text-anchor="start">范围查询：定位起点，然后沿有序叶层扫描</text><rect x="410" y="100" width="300" height="70" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="560.0" y="143.0" font-size="23" fill="#192a3a" text-anchor="middle">分隔键  24 │ 55</text><rect x="80" y="278" width="275" height="70" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="217.5" y="321.0" font-size="25" fill="#192a3a" text-anchor="middle">8 │ 16 │ 20</text><rect x="405" y="278" width="275" height="70" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="542.5" y="321.0" font-size="25" fill="#192a3a" text-anchor="middle">24 │ 31 │ 40</text><rect x="730" y="278" width="275" height="70" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="867.5" y="321.0" font-size="25" fill="#192a3a" text-anchor="middle">55 │ 63 │ 68</text><path d="M460,170 L217,270" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560,170 L542,270" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660,170 L867,270" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M355,313 L395,313" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680,313 L720,313" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="145" y="385" font-size="20" fill="#192a3a" text-anchor="start">第一个叶页</text><text x="434" y="385" font-size="20" fill="#192a3a" text-anchor="start">24 是扫描起点</text><text x="758" y="385" font-size="20" fill="#192a3a" text-anchor="start">遇到 68 停止</text><rect x="265" y="445" width="585" height="75" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="557.5" y="490.5" font-size="23" fill="#192a3a" text-anchor="middle">输出键：24、31、40、55、63</text><path d="M542,348 L542,435" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="265" y="563" font-size="22" fill="#192a3a" text-anchor="start">若索引只保存记录位置，仍需读取所需正文</text><text x="265" y="606" font-size="22" fill="#192a3a" text-anchor="start">叶子链接表达逻辑次序，不保证物理页连续</text></g></svg>