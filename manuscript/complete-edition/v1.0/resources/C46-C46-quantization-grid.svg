<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">离散网格 舍入与饱和</title><desc id="desc">无符号4位教学格式的尺度为0.25零点为3，0.625按最近偶数舍入后重建0.5，4饱和后只能重建3。</desc><metadata>Original educational diagram; Modern Engineer Atlas; 2026-10-03; no measured results; no third-party image.</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#406779"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="30" fill="#183849" text-anchor="start">离散网格 舍入与饱和</text><text x="45" y="101" font-size="25" fill="#183849" text-anchor="start">教学格式：uint4  范围 0…15  scale=0.25  zero_point=3</text><text x="45" y="155" font-size="24" fill="#183849" text-anchor="start">x=0.625 → 商 2.5 → 最近偶数 2 → q=5 → 重建 0.5</text><text x="45" y="205" font-size="24" fill="#183849" text-anchor="start">x=4 → 商 16 → 编码 19 → 饱和到 15 → 重建 3</text><path d="M70,319 L930,319" stroke="#406779" stroke-width="3"/><path d="M85,308 L85,330" stroke="#406779" stroke-width="2"/><text x="85" y="365" font-size="24" fill="#183849" text-anchor="middle">−0.75</text><path d="M250,308 L250,330" stroke="#406779" stroke-width="2"/><text x="250" y="365" font-size="24" fill="#183849" text-anchor="middle">0</text><path d="M360,308 L360,330" stroke="#406779" stroke-width="2"/><text x="360" y="365" font-size="24" fill="#183849" text-anchor="middle">0.5</text><path d="M470,308 L470,330" stroke="#406779" stroke-width="2"/><text x="470" y="365" font-size="24" fill="#183849" text-anchor="middle">1</text><path d="M690,308 L690,330" stroke="#406779" stroke-width="2"/><text x="690" y="365" font-size="24" fill="#183849" text-anchor="middle">2</text><path d="M910,308 L910,330" stroke="#406779" stroke-width="2"/><text x="910" y="365" font-size="24" fill="#183849" text-anchor="middle">3</text><text x="250" y="405" font-size="24" fill="#183849" text-anchor="middle">零可精确表示</text><text x="700" y="405" font-size="24" fill="#183849" text-anchor="middle">3 是该格式的最大重建值</text><rect x="40" y="470" width="280" height="95" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="180.0" y="504" font-size="24" fill="#183849" text-anchor="middle">网格误差</text><text x="180.0" y="538" font-size="24" fill="#183849" text-anchor="middle">未饱和时 ≤ s/2</text><rect x="360" y="470" width="280" height="95" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="500.0" y="504" font-size="24" fill="#183849" text-anchor="middle">饱和误差</text><text x="500.0" y="538" font-size="24" fill="#183849" text-anchor="middle">超范围后不受此界限</text><rect x="680" y="470" width="280" height="95" rx="10" fill="#e9f2f5" stroke="#598195" stroke-width="2"/><text x="820.0" y="504" font-size="24" fill="#183849" text-anchor="middle">任务误差</text><text x="820.0" y="538" font-size="24" fill="#183849" text-anchor="middle">还需检查输出决策</text></g></svg>