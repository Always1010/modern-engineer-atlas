<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">门禁检查指定制品的证据</title><desc id="desc">发布需要明确承诺、实际验证与制品身份，门禁保留未运行与例外，发布后的观察持续补充回归。</desc><metadata>原创教学图；现代软件工程师能力地图；C23；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">门禁检查指定制品的证据</text><rect x="45" y="115" width="300" height="140" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="195.0" y="151" text-anchor="middle" class="b">明确承诺</text><text x="195.0" y="185" text-anchor="middle" class="t">需求与兼容范围</text><text x="195.0" y="214" text-anchor="middle" class="t">独立验收判据</text><rect x="410" y="115" width="300" height="140" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="151" text-anchor="middle" class="b">实际验证</text><text x="560.0" y="185" text-anchor="middle" class="t">准确代码与配置</text><text x="560.0" y="214" text-anchor="middle" class="t">真实执行和缺口</text><rect x="775" y="115" width="300" height="140" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="925.0" y="151" text-anchor="middle" class="b">制品身份</text><text x="925.0" y="185" text-anchor="middle" class="t">构建和依赖来源</text><text x="925.0" y="214" text-anchor="middle" class="t">摘要与符号记录</text><path d="M195 255 L425 340" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M560 255 L560 335" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M925 255 L695 340" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="345" width="430" height="130" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="381" text-anchor="middle" class="b">发布门禁</text><text x="560.0" y="415" text-anchor="middle" class="t">通过、失败、未运行分开</text><text x="560.0" y="444" text-anchor="middle" class="t">例外有责任人和期限</text><path d="M560 475 L560 530" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="305" y="535" width="510" height="105" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="571" text-anchor="middle" class="b">受控发布与运行观察</text><text x="560.0" y="605" text-anchor="middle" class="t">风险接受明确；新问题转成回归</text></svg>