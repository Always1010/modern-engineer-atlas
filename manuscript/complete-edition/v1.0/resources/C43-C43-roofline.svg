<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Roofline：计算与数据移动共同给出上界</title><desc id="desc">假想P上限1000GFLOP/s，带宽100GB/s，在强度10FLOP/byte处相交。双对数轴，非实测。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">Roofline：计算与数据移动共同给出上界</text><text x="75" y="140" font-size="26">P：GFLOP/s（对数刻度）</text><path d="M200 620 H1220" stroke="#cbd9e2" stroke-width="1"/><text x="115" y="630" font-size="23">1</text><path d="M200 486.67 H1220" stroke="#cbd9e2" stroke-width="1"/><text x="115" y="496.67" font-size="23">10</text><path d="M200 353.33 H1220" stroke="#cbd9e2" stroke-width="1"/><text x="115" y="363.33" font-size="23">100</text><path d="M200 220 H1220" stroke="#cbd9e2" stroke-width="1"/><text x="115" y="230" font-size="23">1000</text><path d="M220 200 V620" stroke="#cbd9e2" stroke-width="1"/><text x="202" y="660" font-size="23">0.1</text><path d="M520 200 V620" stroke="#cbd9e2" stroke-width="1"/><text x="502" y="660" font-size="23">1</text><path d="M820 200 V620" stroke="#cbd9e2" stroke-width="1"/><text x="802" y="660" font-size="23">10</text><path d="M1120 200 V620" stroke="#cbd9e2" stroke-width="1"/><text x="1102" y="660" font-size="23">100</text><path d="M200 625 L200 185" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M195 620 L1260 620" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M220 486.67 L820 220 L1200 220" stroke="#147b8a" stroke-width="7" fill="none"/><text x="820" y="185" font-size="26">计算上界：1000 GFLOP/s</text><text x="270" y="335" font-size="26">带宽斜线：100 × I</text><circle cx="820" cy="220" r="9" fill="#bc673c"/><text x="850" y="315" font-size="25">拐点 I = 10</text><text x="660" y="715" font-size="26">I：FLOP/byte（对数刻度）</text><text x="65" y="755" font-size="24">假想带宽100 GB/s；仅为模型演算，没有硬件实测数据</text></g></svg>