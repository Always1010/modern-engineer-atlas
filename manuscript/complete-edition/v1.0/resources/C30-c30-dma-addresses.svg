<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">CPU 与设备不共享同一种地址视图</title><desc id="desc">两侧地址分别映射到系统内存；下方区分描述符内存发布与MMIO通知。</desc><metadata>本书原创；2026-10-03；教学示意，非实测数据。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">CPU 与设备不共享同一种地址视图</text><rect x="50" y="108" width="320" height="170" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="144" font-size="24" font-weight="bold">CPU 虚拟地址</text><text x="70" y="181" font-size="21">内核访问缓冲的指针</text><text x="70" y="212" font-size="21">通过 CPU 页表转换</text><text x="70" y="243" font-size="21">不能直接交给设备</text><rect x="440" y="108" width="320" height="170" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="460" y="144" font-size="24" font-weight="bold">系统物理内存</text><text x="460" y="181" font-size="21">缓冲与描述符实际存储</text><text x="460" y="212" font-size="21">保持合法生命期</text><text x="460" y="243" font-size="21">核对缓存与一致性</text><rect x="830" y="108" width="320" height="170" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="850" y="144" font-size="24" font-weight="bold">设备 DMA 地址</text><text x="850" y="181" font-size="21">由 DMA API 返回</text><text x="850" y="212" font-size="21">可能经过 IOMMU 转换</text><text x="850" y="243" font-size="21">受设备地址能力约束</text><path d="M375 190 L430 190" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M825 190 L770 190" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="382" width="510" height="166" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="418" font-size="24" font-weight="bold">描述符发布关系</text><text x="70" y="455" font-size="21">先写地址、长度等字段</text><text x="70" y="486" font-size="21">按 DMA 契约发布所有权</text><text x="70" y="517" font-size="21">完成后按契约取得结果</text><rect x="640" y="382" width="510" height="166" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="660" y="418" font-size="24" font-weight="bold">MMIO 通知关系</text><text x="660" y="455" font-size="21">使用内核设备访问器</text><text x="660" y="486" font-size="21">doorbell 写入的到达条件</text><text x="660" y="517" font-size="21">与共享内存排序分别核查</text><text x="50" y="627" font-size="23">DMA API 管理映射与同步；缓存一致性不自动提供多字段事务</text></g></svg>