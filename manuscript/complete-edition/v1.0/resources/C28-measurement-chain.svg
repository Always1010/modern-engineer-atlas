<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">测量链将电路条件与数字结果连接起来</title><desc id="desc">隔离低压目标经过电路条件、模拟波形、数字解码和处理器状态四层观察；画出的波形为教学示意。</desc><metadata>本书原创教学示意；2026-10-04；非实测波形或厂商架构；未复制厂商图表。</metadata><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#53687c"/></marker></defs><rect width="1200" height="850" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="48" y="52" font-size="30" font-weight="bold">测量链将电路条件与数字结果连接起来</text><rect x="48" y="90" width="340" height="160" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="126" font-size="25" font-weight="bold">先界定被测对象</text><text x="68" y="165" font-size="22">隔离、能量受控的低压目标</text><text x="68" y="197" font-size="22">核对电源与信号额定值</text><text x="68" y="229" font-size="22">确认参考地和允许测试点</text><rect x="430" y="90" width="340" height="160" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="450" y="126" font-size="25" font-weight="bold">工具各有可见范围</text><text x="450" y="165" font-size="22">万用表：稳态与慢变读数</text><text x="450" y="197" font-size="22">示波器：幅度与时间关系</text><text x="450" y="229" font-size="22">逻辑分析仪：数字事件</text><rect x="810" y="90" width="340" height="160" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="830" y="126" font-size="25" font-weight="bold">测量记录必须配套</text><text x="830" y="165" font-size="22">型号、修订、固件版本</text><text x="830" y="197" font-size="22">探头、量程、阈值、触发</text><text x="830" y="229" font-size="22">位置、时序与原始数据</text><polyline points="394,170 420,170" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="776,170 800,170" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><text x="48" y="296" font-size="24" font-weight="bold">教学构造：边沿变慢时，模拟条件与数字解码不能互相替代</text><rect x="48" y="322" width="718" height="290" rx="8" fill="#f7f9fb" stroke="#8497a7" stroke-width="2"/><text x="76" y="360" font-size="21">电压</text><text x="673" y="582" font-size="21">时间</text><polyline points="115,553 725,553" fill="none" stroke="#53687c" stroke-width="2" marker-end="url(#a)"/><polyline points="115,553 115,380" fill="none" stroke="#53687c" stroke-width="2" marker-end="url(#a)"/><polyline points="115,436 725,436" fill="none" stroke="#9c6d2b" stroke-width="2"/><text x="466" y="424" font-size="20" fill="#80571e">示意判定阈值 θ</text><polyline points="120,532 242,532 251,500 264,472 283,450 304,432 330,417 365,404 422,394 522,390 685,390" fill="none" stroke="#26618a" stroke-width="4"/><polyline points="305,447 305,550" fill="none" stroke="#8093a3" stroke-width="2"/><text x="137" y="598" font-size="20">圆滑上升沿只是原理示意，不给出器件通用合格值</text><rect x="810" y="322" width="340" height="290" rx="8" fill="#f3f7f4" stroke="#8497a7" stroke-width="2"/><text x="830" y="358" font-size="25" font-weight="bold">对照数字证据</text><text x="830" y="397" font-size="22">解码能显示地址、数据和ACK</text><text x="830" y="429" font-size="22">阈值与采样率影响观察</text><text x="830" y="461" font-size="22">解码正确不证明电压裕量</text><text x="830" y="493" font-size="22">解码失败不独立指认根因</text><text x="830" y="525" font-size="22">调试器补充内部执行状态</text><rect x="48" y="653" width="1102" height="124" rx="8" fill="#fbf6ec" stroke="#8497a7" stroke-width="2"/><text x="68" y="689" font-size="25" font-weight="bold">安全与解释边界</text><text x="68" y="728" font-size="22">图不是接线图；不得解除示波器保护接地，不测未知参考地、高压或高能量目标</text><text x="68" y="760" font-size="22">真实阈值、探头连接与停止条件以准确目标和仪器手册为准</text><text x="48" y="824" font-size="24" font-weight="bold">实物辨认 → 电路假设 → 模拟证据 → 协议证据 → 软件状态</text></g></svg>