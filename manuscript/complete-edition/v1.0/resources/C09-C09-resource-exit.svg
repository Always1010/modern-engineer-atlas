<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="535" viewBox="0 0 1160 535" role="img" aria-labelledby="title desc">
  <title id="title">资源退出必须覆盖最后一次使用</title>
  <desc id="desc">拥有者一直保留资源。停止接收新工作之后，既有使用 A 和既有使用 B 仍可继续，直到后者也结束。随后解除不再需要的回调与缓存保留，才释放拥有者。时间线说明请求停止早于最后使用和最终释放。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
  </defs>
  <rect width="1160" height="535" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172333">
    <text x="35" y="43" font-size="29" font-weight="700">收到停止请求　不等于最后一次使用已经结束</text>
    <g font-size="22" text-anchor="middle">
      <text x="405" y="99">停止接收新工作</text>
      <text x="745" y="99">最后使用结束</text>
      <text x="985" y="99">最终释放</text>
    </g>
    <path d="M237 126H1080" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g stroke="#8b99aa" stroke-width="1.6" stroke-dasharray="6 6">
      <path d="M405 117V425"/><path d="M745 117V425"/><path d="M985 117V425"/>
    </g>
    <g font-size="23">
      <text x="35" y="190">拥有者保留资源</text>
      <text x="35" y="268">既有使用 A</text>
      <text x="35" y="336">既有使用 B</text>
      <text x="35" y="404">回调与缓存保留</text>
    </g>
    <rect x="260" y="159" width="725" height="48" rx="7" fill="#d9ebfb" stroke="#25619a" stroke-width="2"/>
    <text x="622" y="191" text-anchor="middle" font-size="22">资源仍可供已获准的工作使用</text>
    <rect x="290" y="239" width="250" height="42" rx="7" fill="#dff0e8" stroke="#2f7861" stroke-width="2"/>
    <text x="563" y="268" font-size="21">完成</text>
    <rect x="330" y="307" width="415" height="42" rx="7" fill="#dff0e8" stroke="#2f7861" stroke-width="2"/>
    <text x="765" y="336" font-size="21">完成或确认取消结束</text>
    <rect x="260" y="375" width="643" height="42" rx="7" fill="#fbf1d9" stroke="#a07825" stroke-width="2"/>
    <text x="581" y="404" text-anchor="middle" font-size="22">不再需要的保留关系也须解除</text>
    <text x="260" y="469" font-size="22">先确认使用结束，再让清理沿依赖关系发生</text>
    <text x="35" y="512" font-size="19" fill="#536274">一种退出安排示意；具体取消、等待与释放条件由业务和资源接口规定，不代表固定时长</text>
  </g>
</svg>
