<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>规划到真实反馈的闭环契约</title><desc>规划结果经过控制和执行器产生物理运动，再由实际测量反馈；独立保护不由命令回显代替。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">规划到真实反馈的闭环契约</text><rect x="45" y="150" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="184" font-size="22" fill="#213746">规划轨迹</text><text x="63" y="218" font-size="22" fill="#213746">时间 约束 版本</text><rect x="450" y="150" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="468" y="184" font-size="22" fill="#213746">控制器</text><text x="468" y="218" font-size="22" fill="#213746">反馈与内部状态</text><rect x="870" y="150" width="285" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="888" y="184" font-size="22" fill="#213746">驱动与物理对象</text><text x="888" y="218" font-size="22" fill="#213746">饱和 延迟 故障</text><path d="M295,207 L450,207" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M700,207 L870,207" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="390" width="290" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="458" y="424" font-size="22" fill="#213746">实际测量与估计</text><text x="458" y="458" font-size="22" fill="#213746">采样时刻 质量</text><text x="458" y="492" font-size="22" fill="#213746">不是命令回显</text><path d="M1010,265 V450 H730" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M580,390 L580,265" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="390" width="265" height="120" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="424" font-size="22" fill="#213746">独立保护与监督</text><text x="63" y="458" font-size="22" fill="#213746">检查失效条件</text><text x="63" y="492" font-size="22" fill="#213746">按风险限制后果</text><text x="45" y="585" font-size="24" fill="#213746">控制器的理想输入、限幅后的命令与实际作用必须区分</text></g></svg>