<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">存储范围与 Warp 地址集合分开分析</title><desc id="desc">寄存器私有，共享存储块内协作，全局内存有独立同步责任。32线程连续4B访问跨4段，步长8B跨8段。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">存储范围与 Warp 地址集合分开分析</text><rect x="60" y="135" width="370" height="125" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="245.0" y="181" text-anchor="middle" font-size="27">Register：线程私有</text><text x="245.0" y="221" text-anchor="middle" font-size="27">有限；溢出会增加访存</text><rect x="515" y="135" width="370" height="125" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="700.0" y="181" text-anchor="middle" font-size="27">Shared：块内协作</text><text x="700.0" y="221" text-anchor="middle" font-size="27">显式加载、同步与复用</text><rect x="970" y="135" width="370" height="125" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1155.0" y="181" text-anchor="middle" font-size="27">Global：设备地址空间</text><text x="1155.0" y="221" text-anchor="middle" font-size="27">可访问不等于已同步</text><text x="70" y="320" font-size="28">Local Memory：线程私有，但通常由设备内存支撑</text><text x="70" y="395" font-size="27">连续地址：32线程 × 4B，有效请求128B → 4个32B段</text><rect x="80" y="425" width="280" height="70" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="220.0" y="471" text-anchor="middle" font-size="27">0–31 B</text><rect x="380" y="425" width="280" height="70" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="520.0" y="471" text-anchor="middle" font-size="27">32–63 B</text><rect x="680" y="425" width="280" height="70" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="820.0" y="471" text-anchor="middle" font-size="27">64–95 B</text><rect x="980" y="425" width="280" height="70" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="1120.0" y="471" text-anchor="middle" font-size="27">96–127 B</text><text x="70" y="560" font-size="27">步长8B：同样128B有效请求，地址范围跨8个32B段</text><rect x="80" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="150.0" y="636" text-anchor="middle" font-size="27">段 0</text><rect x="235" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="305.0" y="636" text-anchor="middle" font-size="27">段 1</text><rect x="390" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="460.0" y="636" text-anchor="middle" font-size="27">段 2</text><rect x="545" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="615.0" y="636" text-anchor="middle" font-size="27">段 3</text><rect x="700" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="770.0" y="636" text-anchor="middle" font-size="27">段 4</text><rect x="855" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="925.0" y="636" text-anchor="middle" font-size="27">段 5</text><rect x="1010" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1080.0" y="636" text-anchor="middle" font-size="27">段 6</text><rect x="1165" y="590" width="140" height="70" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1235.0" y="636" text-anchor="middle" font-size="27">段 7</text><text x="70" y="725" font-size="25">限定：计算能力≥6.0、4B访问、起点32B对齐；段数不等于DRAM总流量</text></g></svg>