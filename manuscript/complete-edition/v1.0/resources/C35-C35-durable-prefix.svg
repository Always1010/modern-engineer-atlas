<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">组提交按稳定日志前缀确认事务</title><desc id="desc">日志位置由左向右，稳定前缀覆盖事务甲结束位置但尚未覆盖事务乙。数据页写回另受WAL顺序约束。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">组提交按稳定日志前缀确认事务</text><text x="45" y="104" class="small">假设此处只有本地日志持久化条件；不表示跨副本提交协议</text><line x1="122" y1="177" x2="1090" y2="177" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="961" y="155" class="small">日志位置</text><rect x="120" y="216" width="540" height="95" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><rect x="660" y="216" width="400" height="95" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="2"/><text x="197" y="259" class="body">已稳定的日志前缀</text><text x="750" y="259" class="body">尚未稳定</text><text x="220" y="292" class="small">同步覆盖到 L</text><line x1="660" y1="193" x2="660" y2="477" stroke="#518167" stroke-width="3" stroke-dasharray="7 6"/><line x1="425" y1="318" x2="425" y2="374" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><line x1="850" y1="318" x2="850" y2="374" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="309" y="409" class="body">甲结束位置 ≤ L</text><text x="295" y="453" class="small">可满足此持久条件</text><text x="725" y="409" class="body">乙结束位置 &gt; L</text><text x="710" y="453" class="small">仍需等待后续同步</text><text x="46" y="523" class="small">数据页稳定写回之前，所依赖的 WAL 必须已稳定</text><text x="46" y="570" class="small">一次同步可服务多个事务，但不能放行超出其覆盖范围的事务</text></svg>