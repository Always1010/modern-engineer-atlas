<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">运行时必须协调代码和数据的存活期</title><desc id="desc">模块可调用后先停止新请求，等待在途执行与保留引用均结束再回收；安全点让运行时识别活跃对象。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">运行时必须协调代码和数据的存活期</text><rect x="55" y="155" width="270" height="130" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="190.0" y="201" text-anchor="middle" font-size="27">声明 / 编译链接</text><text x="190.0" y="241" text-anchor="middle" font-size="27">依赖与元数据</text><rect x="430" y="155" width="250" height="130" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="555.0" y="201" text-anchor="middle" font-size="27">可调用</text><text x="555.0" y="241" text-anchor="middle" font-size="27">允许新请求</text><rect x="785" y="155" width="250" height="130" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="910.0" y="201" text-anchor="middle" font-size="27">退役中</text><text x="910.0" y="241" text-anchor="middle" font-size="27">阻止新调用</text><rect x="1100" y="155" width="245" height="130" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1222.5" y="201" text-anchor="middle" font-size="27">可回收</text><text x="1222.5" y="241" text-anchor="middle" font-size="22">执行与保留引用结束</text><path d="M330 215 L420 215" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M685 215 L775 215" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1040 215 L1090 215" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="160" y="420" width="1080" height="140" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="700.0" y="466" text-anchor="middle" font-size="27">数据对象：活跃引用 → 安全点映射 → GC协调</text><text x="700.0" y="506" text-anchor="middle" font-size="27">代码对象：入口、栈帧、回调、调试元数据都可能延长存活</text><text x="110" y="665" font-size="27">删除符号 ≠ 已无人执行；对象可达 ≠ 外部资源可以无限期保留</text></g></svg>