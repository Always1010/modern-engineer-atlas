<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">场景层级 组件布局与资产依赖</title><desc id="desc">场景图组织空间实例，ECS布局组织批量数据，资产图组织共享几何材质纹理。三种关系通过稳定身份联系，不等于同一所有权树。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="780" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">场景层级 组件布局与资产依赖</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="150" width="342" height="405" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="185" font-size="25" fill="#16384c" text-anchor="start">场景关系</text><text x="66" y="222" font-size="21" fill="#38596b" text-anchor="start">工厂实例</text><text x="66" y="253" font-size="21" fill="#38596b" text-anchor="start">  设备甲 → 子部件</text><text x="66" y="284" font-size="21" fill="#38596b" text-anchor="start">  设备乙 → 子部件</text><text x="66" y="315" font-size="21" fill="#38596b" text-anchor="start"></text><text x="66" y="346" font-size="21" fill="#38596b" text-anchor="start">关注：相对变换</text><text x="66" y="377" font-size="21" fill="#38596b" text-anchor="start">变化：重设父节点</text><text x="66" y="408" font-size="21" fill="#38596b" text-anchor="start">不能推断共享资源销毁</text><rect x="430" y="150" width="342" height="405" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="448" y="185" font-size="25" fill="#16384c" text-anchor="start">组件布局</text><text x="448" y="222" font-size="21" fill="#38596b" text-anchor="start">身份 → 位置 → 速度</text><text x="448" y="253" font-size="21" fill="#38596b" text-anchor="start">实体甲   连续数据</text><text x="448" y="284" font-size="21" fill="#38596b" text-anchor="start">实体乙   连续数据</text><text x="448" y="315" font-size="21" fill="#38596b" text-anchor="start"></text><text x="448" y="346" font-size="21" fill="#38596b" text-anchor="start">关注：访问局部性</text><text x="448" y="377" font-size="21" fill="#38596b" text-anchor="start">变化：组件迁移</text><text x="448" y="408" font-size="21" fill="#38596b" text-anchor="start">内存地址不等于身份</text><rect x="812" y="150" width="340" height="405" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="830" y="185" font-size="25" fill="#16384c" text-anchor="start">资产依赖</text><text x="830" y="222" font-size="21" fill="#38596b" text-anchor="start">网格实例 → 共享网格</text><text x="830" y="253" font-size="21" fill="#38596b" text-anchor="start">材质实例 → 共享纹理</text><text x="830" y="284" font-size="21" fill="#38596b" text-anchor="start">源文件 → 平台产物</text><text x="830" y="315" font-size="21" fill="#38596b" text-anchor="start"></text><text x="830" y="346" font-size="21" fill="#38596b" text-anchor="start">关注：版本与驻留</text><text x="830" y="377" font-size="21" fill="#38596b" text-anchor="start">变化：重导入与回收</text><text x="830" y="408" font-size="21" fill="#38596b" text-anchor="start">GPU在途使用仍须保留</text><rect x="48" y="610" width="1102" height="113" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="645" font-size="25" fill="#16384c" text-anchor="start">通过稳定标识建立映射</text><text x="66" y="682" font-size="21" fill="#38596b" text-anchor="start">持久资产身份 ≠ 场景实例身份 ≠ 运行期句柄；删除、替换和回收各有边界</text><text x="48" y="758" font-size="21" fill="#16384c" text-anchor="start">示意中的箭头表达关系，不规定强引用，也不要求所有系统采用同一存储结构</text></g></svg>