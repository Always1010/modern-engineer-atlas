<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">媒体表示层与容量单位</title><desc id="desc">采样产生带时间的原始样本，编码把样本变成压缩数据，封装和传输再增加不同开销。音频1.536Mbit每秒和视频746.496Mbit每秒为理想未压缩模型。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="680" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">媒体表示层与容量单位</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="150" width="250" height="160" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="185" font-size="25" fill="#16384c" text-anchor="start">采样与量化</text><text x="66" y="222" font-size="21" fill="#38596b" text-anchor="start">时间间隔 → 采样率</text><text x="66" y="253" font-size="21" fill="#38596b" text-anchor="start">幅值精度 → 位宽</text><text x="66" y="284" font-size="21" fill="#38596b" text-anchor="start">多路信号 → 声道</text><rect x="345" y="150" width="345" height="160" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="363" y="185" font-size="25" fill="#16384c" text-anchor="start">原始表示</text><text x="363" y="222" font-size="21" fill="#38596b" text-anchor="start">PCM：帧数 × 每帧字节数</text><text x="363" y="253" font-size="21" fill="#38596b" text-anchor="start">图像：累加各平面所占字节</text><text x="363" y="284" font-size="21" fill="#38596b" text-anchor="start">格式不同，字节算法不同</text><rect x="740" y="150" width="410" height="160" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="758" y="185" font-size="25" fill="#16384c" text-anchor="start">编码与传输</text><text x="758" y="222" font-size="21" fill="#38596b" text-anchor="start">预测、量化、熵编码</text><text x="758" y="253" font-size="21" fill="#38596b" text-anchor="start">容器 / RTP / 安全 / 网络头</text><text x="758" y="284" font-size="21" fill="#38596b" text-anchor="start">压缩码率 ≠ 原始内存带宽</text><path d="M298,230 L345,230" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M690,230 L740,230" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="360" width="533" height="190" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="66" y="395" font-size="25" fill="#16384c" text-anchor="start">音频演算</text><text x="66" y="432" font-size="21" fill="#38596b" text-anchor="start">48 000 Hz × 16 bit × 2 声道</text><text x="66" y="463" font-size="21" fill="#38596b" text-anchor="start">= 1.536 Mbit/s = 192 000 byte/s</text><text x="66" y="494" font-size="21" fill="#38596b" text-anchor="start">10 ms → 480 采样帧 → 1 920 byte</text><rect x="617" y="360" width="533" height="190" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="635" y="395" font-size="25" fill="#16384c" text-anchor="start">视频演算</text><text x="635" y="432" font-size="21" fill="#38596b" text-anchor="start">1920 × 1080 × 1.5 byte × 30 fps</text><text x="635" y="463" font-size="21" fill="#38596b" text-anchor="start">= 93 312 000 byte/s</text><text x="635" y="494" font-size="21" fill="#38596b" text-anchor="start">8 bit 4:2:0，紧密布局且无行填充</text><text x="48" y="620" font-size="22" fill="#16384c" text-anchor="start">演算不含对齐、文件头、重传、加密与网络开销；10 bit 还要核对实际存储布局</text></g></svg>