<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img"><title>自定义工具由可信执行器控制效果</title><desc>模型给出调用建议，宿主验证身份参数与稳定操作状态，外部系统产生实际效果，结果证据再返回解释。</desc><metadata>本书原创教学图；2026-10-03；非真实API执行记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="630" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">自定义工具由可信执行器控制效果</text><rect x="40" y="145" width="220" height="110" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="150.0" y="192.0" class="label" text-anchor="middle">模型调用建议</text><text x="150.0" y="222.0" class="small" text-anchor="middle">工具名称与参数</text><path d="M270,200 L333,200" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="130" width="465" height="140" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="577.5" y="177.0" class="label" text-anchor="middle">可信宿主执行器</text><text x="577.5" y="207.0" class="small" text-anchor="middle">会话授权 / 参数与资源版本</text><text x="577.5" y="237.0" class="small" text-anchor="middle">稳定操作标识 / 在途与完成状态</text><path d="M820,200 L883,200" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="895" y="145" width="220" height="110" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1005.0" y="192.0" class="label" text-anchor="middle">外部系统</text><text x="1005.0" y="222.0" class="small" text-anchor="middle">实际状态与副作用</text><path d="M1005,285 L1005,395" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M990,412 L680,412" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="365" width="315" height="95" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="507.5" y="404.5" class="label" text-anchor="middle">结果与证据</text><text x="507.5" y="434.5" class="small" text-anchor="middle">成功 / 失败 / 未知</text><path d="M337,412 L150,412" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M150,401 L150,270" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="546" class="note" text-anchor="start">这是应用自定义工具的执行路径；托管工具需另核验执行位置</text><text x="55" y="584" class="note" text-anchor="start">结果未知时先核查，不把重新生成文本当作事务恢复</text></svg>