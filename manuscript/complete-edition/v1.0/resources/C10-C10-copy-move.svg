<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 10-1 复制与移动改变的是哪一种关系</title><desc id="desc">复制建立独立值，移动可转移资源责任；源对象仍有生命周期，不能概括为空。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 10-1 复制与移动改变的是哪一种关系</text><text x="40" y="103" font-size="20">复制：两个值可独立修改</text><rect x="70" y="130" width="210" height="90" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="175.0" y="162" text-anchor="middle" font-size="21">来源 A</text><text x="175.0" y="192" text-anchor="middle" font-size="21">仍管理原值</text><rect x="370" y="130" width="210" height="90" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="475.0" y="162" text-anchor="middle" font-size="21">目标 B</text><text x="475.0" y="192" text-anchor="middle" font-size="21">管理独立副本</text><rect x="770" y="125" width="300" height="50" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="920.0" y="157" text-anchor="middle" font-size="21">值内容相同</text><path d="M280 175 L365 175" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="70" y="265" font-size="20">对象 A 与 B 的生命都继续；独立性由类型语义保证</text><text x="40" y="325" font-size="20">移动：目标接管资源，来源对象仍在</text><rect x="70" y="350" width="210" height="90" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="175.0" y="382" text-anchor="middle" font-size="21">来源 A</text><text x="175.0" y="412" text-anchor="middle" font-size="21">移动后状态</text><rect x="370" y="350" width="210" height="90" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="475.0" y="382" text-anchor="middle" font-size="21">目标 B</text><text x="475.0" y="412" text-anchor="middle" font-size="21">接管资源</text><rect x="810" y="350" width="250" height="90" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="935.0" y="382" text-anchor="middle" font-size="21">原有资源</text><text x="935.0" y="412" text-anchor="middle" font-size="21">不必重新构造</text><path d="M580 395 L805 395" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="70" y="495" font-size="20">来源状态查具体契约：unique_ptr 为空；不能推广到所有类型</text></g></svg>