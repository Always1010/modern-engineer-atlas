<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc"><title id="title">权限过滤改变近邻搜索的候选集合</title><desc id="desc">全库候选先截断后过滤，只剩一个合格结果；授权集合内搜索需要正确的过滤式算法，并单独衡量近似召回。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="700" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">权限过滤改变近邻搜索的候选集合</text><text x="45" y="106" class="small">教学需求：最多返回 k=2 条；字母表示文档，允与禁表示当前权限</text><text x="45" y="156" class="body">先截断全库候选，再过滤</text><rect x="45" y="185" width="145" height="78" rx="10" fill="#fae5e2" stroke="#6686a3" stroke-width="2"/><text x="79" y="232" class="body">A 禁</text><rect x="212" y="185" width="145" height="78" rx="10" fill="#fae5e2" stroke="#6686a3" stroke-width="2"/><text x="246" y="232" class="body">B 禁</text><rect x="379" y="185" width="145" height="78" rx="10" fill="#e3f2e9" stroke="#6686a3" stroke-width="2"/><text x="413" y="232" class="body">C 允</text><rect x="546" y="185" width="145" height="78" rx="10" fill="#fae5e2" stroke="#6686a3" stroke-width="2"/><text x="580" y="232" class="body">D 禁</text><line x1="703" y1="224" x2="836" y2="224" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="715" y="204" class="small">过滤</text><rect x="848" y="185" width="251" height="78" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="883" y="232" class="body">只剩 C：1 条</text><text x="45" y="312" class="small">即使授权集合中另有 E、F，候选截断也可能已把它们排除</text><text x="45" y="380" class="body">把授权条件纳入搜索问题</text><rect x="45" y="408" width="287" height="96" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="75" y="451" class="body">授权集合 C E F</text><text x="75" y="486" class="small">同一数据版本与权限</text><line x1="341" y1="456" x2="423" y2="456" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="434" y="408" width="333" height="96" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="464" y="451" class="body">受约束的近邻探索</text><text x="464" y="486" class="small">必要时扩大或精确搜索</text><line x1="777" y1="456" x2="838" y2="456" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="408" width="249" height="96" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="872" y="451" class="body">合格结果至多 k</text><text x="872" y="486" class="small">召回仍需评测</text><text x="45" y="572" class="small">安全验收：无权文本、摘要、上下文不得泄露；缓存与日志也要受控</text><text x="45" y="622" class="small">质量验收：与同一授权集合的精确近邻参考比较，不能用全库参考混算</text></svg>