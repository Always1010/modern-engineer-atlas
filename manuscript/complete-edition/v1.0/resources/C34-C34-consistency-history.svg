<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">调用区间决定线性一致性的判断</title><desc id="desc">同一配置对象的写入区间、写后读取和并发读取，说明真实时间先后和区间重叠的区别。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">调用区间决定线性一致性的判断</text><text x="46" y="105" class="small">配置初始为旧版；没有其他写入</text><line x1="190" y1="160" x2="1090" y2="160" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="980" y="139" class="small">时间向右</text><text x="45" y="235" class="body">写新版</text><rect x="220" y="190" width="420" height="70" rx="10" fill="#e3f2e9" stroke="#518167" stroke-width="2"/><text x="250" y="235" class="body">调用</text><text x="535" y="235" class="body">返回成功</text><line x1="640" y1="178" x2="640" y2="512" stroke="#518167" stroke-width="2" stroke-dasharray="6 6"/><text x="45" y="340" class="body">写后读</text><rect x="735" y="295" width="325" height="70" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="755" y="340" class="body">调用 → 返回新版</text><text x="737" y="400" class="small">不能返回初始旧版</text><text x="45" y="480" class="body">重叠读</text><rect x="390" y="435" width="540" height="70" rx="10" fill="#fff3df" stroke="#ad8850" stroke-width="2"/><text x="410" y="480" class="body">调用 → 可选合法生效点 → 返回</text><text x="45" y="562" class="small">重叠读可读旧版或新版，取决于完整历史是否存在合法线性化</text></svg>