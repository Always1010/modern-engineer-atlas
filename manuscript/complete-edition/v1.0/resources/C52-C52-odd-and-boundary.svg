<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>运行域与持续有效的系统边界</title><desc>环境任务和系统配置决定有效范围，监控判断条件是否满足并为退出保留物理余量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">运行域与持续有效的系统边界</text><rect x="45" y="140" width="300" height="150" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="174" font-size="22" fill="#213746">环境与任务</text><text x="63" y="208" font-size="22" fill="#213746">地理 天气 光照 路况</text><text x="63" y="242" font-size="22" fill="#213746">人员 负载 作业流程</text><rect x="445" y="140" width="300" height="150" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="463" y="174" font-size="22" fill="#213746">系统有效配置</text><text x="463" y="208" font-size="22" fill="#213746">设备 标定 软件版本</text><text x="463" y="242" font-size="22" fill="#213746">保护与输入健康</text><rect x="855" y="140" width="300" height="150" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="873" y="174" font-size="22" fill="#213746">运行域监控</text><text x="873" y="208" font-size="22" fill="#213746">满足 / 不满足 / 未知</text><text x="873" y="242" font-size="22" fill="#213746">监控自身也有误差</text><path d="M345,215 L445,215" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M745,215 L855,215" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="390" width="500" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="63" y="424" font-size="22" fill="#213746">能力边界必须有证据支持</text><text x="63" y="458" font-size="22" fill="#213746">围栏内不自动表示条件满足</text><rect x="655" y="390" width="500" height="125" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="673" y="424" font-size="22" fill="#213746">接近边界时执行定义好的退出</text><text x="673" y="458" font-size="22" fill="#213746">保留检测 决策 与物理停止余量</text><path d="M1005,290 L910,390" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="45" y="600" font-size="23" fill="#213746">ODD描述与运行监控是不同工作；未知不能默认变成允许</text></g></svg>