<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img"><title>先定位哪一阶段失真 再检查用户任务</title><desc>四层评测依次检查资料授权、召回重排、生成引用和整体任务，每层有不同判据；训练开发与测试保持独立。</desc><metadata>本书原创教学图；2026-10-03；非真实检索运行结果。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="690" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">先定位哪一阶段失真 再检查用户任务</text><rect x="50" y="128" width="285" height="83" rx="9" fill="#edf3fa" stroke="#8fa8bc" stroke-width="2"/><text x="192.5" y="176.5" class="label" text-anchor="middle">资料与授权</text><rect x="375" y="128" width="725" height="83" rx="9" fill="#edf3fa" stroke="#8fa8bc" stroke-width="2"/><text x="737.5" y="176.5" class="label" text-anchor="middle">内容是否完整、版本适用、当前身份可见</text><path d="M192,217 L192,234" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="241" width="285" height="83" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="192.5" y="289.5" class="label" text-anchor="middle">检索与重排</text><rect x="375" y="241" width="725" height="83" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="737.5" y="289.5" class="label" text-anchor="middle">必需证据是否进入候选并保留限定条件</text><path d="M192,330 L192,347" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="354" width="285" height="83" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="192.5" y="402.5" class="label" text-anchor="middle">生成与引用</text><rect x="375" y="354" width="725" height="83" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="737.5" y="402.5" class="label" text-anchor="middle">主张是否受支持、引用能否定位、未知是否说明</text><path d="M192,443 L192,460" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="467" width="285" height="83" rx="9" fill="#f1edf8" stroke="#8fa8bc" stroke-width="2"/><text x="192.5" y="515.5" class="label" text-anchor="middle">整体用户任务</text><rect x="375" y="467" width="725" height="83" rx="9" fill="#f1edf8" stroke="#8fa8bc" stroke-width="2"/><text x="737.5" y="515.5" class="label" text-anchor="middle">有效结果、失败、重试、延迟与每次成功成本</text><text x="55" y="636" class="note" text-anchor="start">阶段指标帮助找原因；端到端验收仍覆盖权限、时效与失败任务</text><text x="55" y="674" class="note" text-anchor="start">开发与测试分开，近重复、未来信息与标准答案不得偷偷流入优化</text></svg>