<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">固定步进 运动覆盖与三种保证</title><desc id="desc">墙钟增量进入累积器，按固定h推进输入碰撞和求解，再用相邻已知状态插值显示。离散检测可能错过一步内穿过薄墙的碰撞；固定步长本身不保证稳定性或确定性。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="840" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">固定步进 运动覆盖与三种保证</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><rect x="48" y="148" width="305" height="158" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="183" font-size="25" fill="#16384c" text-anchor="start">墙钟与累积器</text><text x="66" y="220" font-size="21" fill="#38596b" text-anchor="start">r 加入经过时间</text><text x="66" y="251" font-size="21" fill="#38596b" text-anchor="start">r ≥ h 才推进模拟</text><text x="66" y="282" font-size="21" fill="#38596b" text-anchor="start">每完成一步 r 减 h</text><rect x="425" y="148" width="365" height="158" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="443" y="183" font-size="25" fill="#16384c" text-anchor="start">一个固定模拟步 h</text><text x="443" y="220" font-size="21" fill="#38596b" text-anchor="start">输入归步 → 碰撞 → 求解</text><text x="443" y="251" font-size="21" fill="#38596b" text-anchor="start">状态从 k 推进到 k+1</text><text x="443" y="282" font-size="21" fill="#38596b" text-anchor="start">补步上限须有语义策略</text><rect x="863" y="148" width="289" height="158" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="881" y="183" font-size="25" fill="#16384c" text-anchor="start">渲染显示</text><text x="881" y="220" font-size="21" fill="#38596b" text-anchor="start">从已知状态插值</text><text x="881" y="251" font-size="21" fill="#38596b" text-anchor="start">与显示频率解耦</text><text x="881" y="282" font-size="21" fill="#38596b" text-anchor="start">不增加原始模拟精度</text><path d="M353,226 L425,226" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M790,226 L863,226" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="370" font-size="26" fill="#16384c" text-anchor="start">离散采样可能看不到中途碰撞</text><rect x="565" y="400" width="50" height="133" fill="#d3a457"/><text x="590" y="565" font-size="22" fill="#16384c" text-anchor="middle">薄障碍物</text><circle cx="270" cy="465" r="32" fill="#d5e9f3" stroke="#5c859b" stroke-width="3"/><text x="270" y="525" font-size="22" fill="#16384c" text-anchor="middle">起点</text><circle cx="920" cy="465" r="32" fill="#d5e9f3" stroke="#5c859b" stroke-width="3"/><text x="920" y="525" font-size="22" fill="#16384c" text-anchor="middle">终点</text><path d="M310,465 L875,465" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="608" font-size="22" fill="#16384c" text-anchor="start">教学演算：20 m/s × 1/60 s ≈ 0.333 m，可能跨过0.05 m厚障碍物</text><rect x="48" y="657" width="342" height="124" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="692" font-size="25" fill="#16384c" text-anchor="start">步长固定</text><text x="66" y="729" font-size="21" fill="#38596b" text-anchor="start">时间网格保持一致</text><rect x="428" y="657" width="342" height="124" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="446" y="692" font-size="25" fill="#16384c" text-anchor="start">数值稳定</text><text x="446" y="729" font-size="21" fill="#38596b" text-anchor="start">还取决于积分器与参数</text><rect x="808" y="657" width="342" height="124" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="826" y="692" font-size="25" fill="#16384c" text-anchor="start">结果确定</text><text x="826" y="729" font-size="21" fill="#38596b" text-anchor="start">还取决于顺序与数值实现</text><text x="48" y="819" font-size="21" fill="#16384c" text-anchor="start">三种性质必须分别验证；CCD也有形状、运动和实现支持边界</text></g></svg>