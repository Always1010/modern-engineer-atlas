<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="t d"><title id="t">平均值不代表尾部请求的体验</title><desc id="d">人工1000请求，900个1ms，90个10ms，10个100ms，均值2.8ms与分位数分别列出。</desc><metadata>作者原创人工数据图；2026-10-03；没有实测数据；数值和演算见正文。</metadata><rect width="1100" height="590" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="49" font-size="27" text-anchor="start">平均值不代表尾部请求的体验</text><text x="45" y="92" font-size="20" text-anchor="start">人工样本：1,000 个请求；横轴为请求数，纵向分组为耗时</text><line x1="250.0" y1="135" x2="250.0" y2="415" stroke="#cbd6df" stroke-width="1"/><text x="250.0" y="444" font-size="18" text-anchor="middle">0</text><line x1="412.5" y1="135" x2="412.5" y2="415" stroke="#cbd6df" stroke-width="1"/><text x="412.5" y="444" font-size="18" text-anchor="middle">250</text><line x1="575.0" y1="135" x2="575.0" y2="415" stroke="#cbd6df" stroke-width="1"/><text x="575.0" y="444" font-size="18" text-anchor="middle">500</text><line x1="737.5" y1="135" x2="737.5" y2="415" stroke="#cbd6df" stroke-width="1"/><text x="737.5" y="444" font-size="18" text-anchor="middle">750</text><line x1="900.0" y1="135" x2="900.0" y2="415" stroke="#cbd6df" stroke-width="1"/><text x="900.0" y="444" font-size="18" text-anchor="middle">1000</text><text x="180" y="191" font-size="22" text-anchor="end">1 ms</text><rect x="250" y="160" width="585.0" height="48" fill="#568cad" stroke="white"/><text x="845.0" y="192" font-size="20" text-anchor="start">900 个（90%）</text><text x="180" y="281" font-size="22" text-anchor="end">10 ms</text><rect x="250" y="250" width="58.5" height="48" fill="#6e9c8c" stroke="white"/><text x="318.5" y="282" font-size="20" text-anchor="start">90 个（9%）</text><text x="180" y="371" font-size="22" text-anchor="end">100 ms</text><rect x="250" y="340" width="6.5" height="48" fill="#bd795d" stroke="white"/><text x="266.5" y="372" font-size="20" text-anchor="start">10 个（1%）</text><text x="45" y="502" font-size="20" text-anchor="start">均值 2.8 ms；最近秩定义：p50 = 1，p95 = 10，p99 = 10，p99.9 = 100 ms</text><text x="45" y="548" font-size="20" text-anchor="start">最后十个慢请求真实存在；分位数的边界、样本数与阈值比例必须一起读。</text></g></svg>