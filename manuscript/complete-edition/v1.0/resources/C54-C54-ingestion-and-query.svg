<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img"><title>摄取与查询需要共享明确的版本边界</title><desc>上方摄取资料版本，经结构解析和索引构建发布代次；下方当前身份授权后召回重排生成；撤销约束所有读取路径。</desc><metadata>本书原创教学图；2026-10-03；非真实检索运行结果。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="690" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">摄取与查询需要共享明确的版本边界</text><text x="50" y="119" class="note" text-anchor="start">摄取路径</text><rect x="45" y="145" width="215" height="110" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="152.5" y="192.0" class="label" text-anchor="middle">原始资料版本</text><text x="152.5" y="222.0" class="small" text-anchor="middle">定位 / 权限来源</text><rect x="330" y="145" width="215" height="110" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="437.5" y="192.0" class="label" text-anchor="middle">结构解析与分块</text><text x="437.5" y="222.0" class="small" text-anchor="middle">条件 / 表头 / 版本</text><rect x="615" y="145" width="215" height="110" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="722.5" y="192.0" class="label" text-anchor="middle">词项与向量索引</text><text x="722.5" y="222.0" class="small" text-anchor="middle">嵌入配置 / 元数据</text><rect x="900" y="145" width="215" height="110" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="1007.5" y="192.0" class="label" text-anchor="middle">发布索引代次</text><text x="1007.5" y="222.0" class="small" text-anchor="middle">校验完成后切换</text><path d="M270,200 L319,200" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M555,200 L604,200" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M840,200 L889,200" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="335" class="note" text-anchor="start">查询路径</text><rect x="45" y="370" width="215" height="110" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="152.5" y="417.0" class="label" text-anchor="middle">当前请求</text><text x="152.5" y="447.0" class="small" text-anchor="middle">身份 / 时间 / 范围</text><rect x="330" y="370" width="215" height="110" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="437.5" y="417.0" class="label" text-anchor="middle">授权集合内召回</text><text x="437.5" y="447.0" class="small" text-anchor="middle">全文 / 向量 / 融合</text><rect x="615" y="370" width="215" height="110" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="722.5" y="417.0" class="label" text-anchor="middle">重排与证据整理</text><text x="722.5" y="447.0" class="small" text-anchor="middle">去重 / 补全条件</text><rect x="900" y="370" width="215" height="110" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="1007.5" y="417.0" class="label" text-anchor="middle">生成与引用核对</text><text x="1007.5" y="447.0" class="small" text-anchor="middle">支持关系 / 缺口</text><path d="M270,425 L319,425" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M555,425 L604,425" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M840,425 L889,425" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><path d="M1008,265 V305 H438 V359" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="553" width="820" height="76" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="598.0" class="label" text-anchor="middle">撤销与权限更新约束全部读取路径</text><text x="55" y="668" class="note" text-anchor="start">索引存在不等于当前可用；生成与重排服务接触材料前先满足授权</text></svg>