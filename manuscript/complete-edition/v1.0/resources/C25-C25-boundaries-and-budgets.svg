<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">从具体承诺推导边界与成本</title><desc id="desc">用户场景决定模块数据边界与部署选择，预算和证据用于检查设计是否满足约束。</desc><metadata>原创教学图；现代软件工程师能力地图；C25；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">从具体承诺推导边界与成本</text><rect x="45" y="115" width="300" height="145" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="195.0" y="151" text-anchor="middle" class="b">用户与业务承诺</text><text x="195.0" y="185" text-anchor="middle" class="t">功能、失败与变化场景</text><text x="195.0" y="214" text-anchor="middle" class="t">硬约束、目标、偏好分开</text><rect x="410" y="115" width="300" height="145" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="560.0" y="151" text-anchor="middle" class="b">模块和数据边界</text><text x="560.0" y="185" text-anchor="middle" class="t">谁拥有状态与不变量</text><text x="560.0" y="214" text-anchor="middle" class="t">哪些变化可以局部完成</text><rect x="775" y="115" width="300" height="145" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="925.0" y="151" text-anchor="middle" class="b">部署与资源选择</text><text x="925.0" y="185" text-anchor="middle" class="t">库、进程或独立服务</text><text x="925.0" y="214" text-anchor="middle" class="t">隔离收益与失败成本</text><path d="M345 185 L405 185" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M710 185 L770 185" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="95" y="365" width="420" height="155" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="305.0" y="401" text-anchor="middle" class="b">预算检验</text><text x="305.0" y="435" text-anchor="middle" class="t">延迟、内存、容量、团队成本</text><text x="305.0" y="464" text-anchor="middle" class="t">平均值之外考虑突发和长尾</text><text x="305.0" y="493" text-anchor="middle" class="t">识别最敏感的未知假设</text><rect x="605" y="365" width="420" height="155" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="815.0" y="401" text-anchor="middle" class="b">证据检验</text><text x="815.0" y="435" text-anchor="middle" class="t">原型、契约测试、运行观察</text><text x="815.0" y="464" text-anchor="middle" class="t">明确适用输入与环境</text><text x="815.0" y="493" text-anchor="middle" class="t">不成立时修订边界</text><text x="560" y="605" class="n" text-anchor="middle">服务数量和技术新旧不能直接衡量架构质量</text></svg>