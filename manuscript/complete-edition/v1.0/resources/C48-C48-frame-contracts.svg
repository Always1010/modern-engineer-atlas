<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>坐标链同时携带责任 时间与约定</title><desc>地图修正与连续里程计分别负责不同变换边，传感器安装边有独立标定版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#357381"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#213746"><text x="45" y="55" font-size="28" font-weight="bold">坐标链同时携带责任 时间与约定</text><rect x="55" y="150" width="250" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="73" y="184" font-size="22" fill="#213746">map 全局参考</text><text x="73" y="218" font-size="22" fill="#213746">允许定位修正跳变</text><rect x="470" y="150" width="255" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="488" y="184" font-size="22" fill="#213746">odom 局部参考</text><text x="488" y="218" font-size="22" fill="#213746">连续但可能漂移</text><rect x="880" y="150" width="265" height="115" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="898" y="184" font-size="22" fill="#213746">base_link 机体</text><text x="898" y="218" font-size="22" fill="#213746">定义位置与轴向</text><path d="M305,207 L470,207" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M725,207 L880,207" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="325" y="180" font-size="18" fill="#213746">定位权威</text><text x="742" y="180" font-size="18" fill="#213746">里程计权威</text><rect x="455" y="370" width="280" height="105" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="473" y="404" font-size="22" fill="#213746">lidar 传感器系</text><text x="473" y="438" font-size="22" fill="#213746">静态安装外参</text><rect x="855" y="370" width="290" height="105" rx="12" fill="#edf5f6" stroke="#9db6bf"/><text x="873" y="404" font-size="22" fill="#213746">camera_optical</text><text x="873" y="438" font-size="22" fill="#213746">光学轴约定</text><path d="M1010,265 L610,370" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1010,265 L1005,370" stroke="#357381" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="330" font-size="21" fill="#213746">同一条边只有一个权威</text><text x="55" y="364" font-size="21" fill="#213746">每次查询指定有效时间</text><text x="55" y="398" font-size="21" fill="#213746">标定携带设备与版本</text><text x="55" y="565" font-size="23" fill="#213746">T_AB：将 B 系坐标转换到 A 系；p_A = R_AB p_B + t_AB</text><text x="55" y="599" font-size="23" fill="#213746">坐标树可查询 ≠ 标定正确；最新变换 ≠ 测量时刻变换</text></g></svg>