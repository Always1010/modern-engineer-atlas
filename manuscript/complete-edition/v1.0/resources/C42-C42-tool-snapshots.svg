<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">语言工具处理的是版本化语义快照</title><desc id="desc">编辑器缓冲区与编译上下文共同组成分析快照，当前诊断和后台索引提供不同精度与新鲜度的结果。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">语言工具处理的是版本化语义快照</text><rect x="60" y="150" width="360" height="145" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="240.0" y="196" text-anchor="middle" font-size="27">编辑器缓冲区 v17</text><text x="240.0" y="236" text-anchor="middle" font-size="27">未保存内容 / 编码</text><rect x="980" y="150" width="360" height="145" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1160.0" y="196" text-anchor="middle" font-size="27">编译命令与依赖</text><text x="1160.0" y="236" text-anchor="middle" font-size="27">宏 / 目标 / 头文件</text><rect x="500" y="350" width="400" height="125" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="700.0" y="396" text-anchor="middle" font-size="27">语义快照</text><text x="700.0" y="436" text-anchor="middle" font-size="27">内容版本 + 编译上下文</text><path d="M330 300 L580 345" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1100 300 L820 345" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="90" y="560" width="475" height="120" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="327.5" y="606" text-anchor="middle" font-size="27">当前文件分析与诊断</text><text x="327.5" y="646" text-anchor="middle" font-size="27">结果必须说明新鲜度</text><rect x="820" y="560" width="475" height="120" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="1057.5" y="606" text-anchor="middle" font-size="27">后台索引与多文件编辑</text><text x="1057.5" y="646" text-anchor="middle" font-size="27">编辑应用要检查版本前提</text><path d="M570 480 L385 555" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M830 480 L1050 555" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/></g></svg>