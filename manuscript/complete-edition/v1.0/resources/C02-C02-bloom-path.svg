<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Bloom Filter 的单向确定性</title><desc id="desc">已置位位置可以来自多个键。含零的查询可排除，全部为一的查询仍需精确确认。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#506579"/></marker></defs><rect width="1120" height="640" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" fill="#192a3a"><text x="42" y="50" font-size="28" fill="#192a3a" text-anchor="start">先用紧凑过滤器排除，再到精确集合确认</text><text x="42" y="107" font-size="23" fill="#192a3a" text-anchor="start">示例位数组</text><rect x="180" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="213.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="213" y="222" font-size="18" fill="#192a3a" text-anchor="middle">0</text><rect x="253" y="130" width="67" height="62" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="286.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">1</text><text x="286" y="222" font-size="18" fill="#192a3a" text-anchor="middle">1</text><rect x="326" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="359.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="359" y="222" font-size="18" fill="#192a3a" text-anchor="middle">2</text><rect x="399" y="130" width="67" height="62" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="432.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">1</text><text x="432" y="222" font-size="18" fill="#192a3a" text-anchor="middle">3</text><rect x="472" y="130" width="67" height="62" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="505.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">1</text><text x="505" y="222" font-size="18" fill="#192a3a" text-anchor="middle">4</text><rect x="545" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="578.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="578" y="222" font-size="18" fill="#192a3a" text-anchor="middle">5</text><rect x="618" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="651.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="651" y="222" font-size="18" fill="#192a3a" text-anchor="middle">6</text><rect x="691" y="130" width="67" height="62" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="724.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">1</text><text x="724" y="222" font-size="18" fill="#192a3a" text-anchor="middle">7</text><rect x="764" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="797.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="797" y="222" font-size="18" fill="#192a3a" text-anchor="middle">8</text><rect x="837" y="130" width="67" height="62" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="870.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">1</text><text x="870" y="222" font-size="18" fill="#192a3a" text-anchor="middle">9</text><rect x="910" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="943.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="943" y="222" font-size="18" fill="#192a3a" text-anchor="middle">10</text><rect x="983" y="130" width="67" height="62" rx="5" fill="#f4f6f8" stroke="#70899d" stroke-width="2"/><text x="1016.5" y="169.0" font-size="26" fill="#192a3a" text-anchor="middle">0</text><text x="1016" y="222" font-size="18" fill="#192a3a" text-anchor="middle">11</text><rect x="55" y="285" width="295" height="83" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="202.5" y="334.5" font-size="23" fill="#192a3a" text-anchor="middle">查询甲：位置 1、4、8</text><rect x="415" y="285" width="290" height="83" rx="5" fill="#f4eee0" stroke="#70899d" stroke-width="2"/><text x="560.0" y="334.5" font-size="23" fill="#192a3a" text-anchor="middle">位置 8 为 0</text><rect x="775" y="285" width="290" height="83" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="920.0" y="334.5" font-size="23" fill="#192a3a" text-anchor="middle">确认不在该集合</text><path d="M350,326 L405,326" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M705,326 L765,326" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="421" width="295" height="83" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="202.5" y="470.5" font-size="23" fill="#192a3a" text-anchor="middle">查询乙：位置 1、4、7</text><rect x="415" y="421" width="290" height="83" rx="5" fill="#f4eee0" stroke="#70899d" stroke-width="2"/><text x="560.0" y="470.5" font-size="23" fill="#192a3a" text-anchor="middle">三个位置都是 1</text><rect x="775" y="421" width="290" height="83" rx="5" fill="#e5edf8" stroke="#70899d" stroke-width="2"/><text x="920.0" y="470.5" font-size="23" fill="#192a3a" text-anchor="middle">继续查精确集合</text><path d="M350,462 L405,462" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M705,462 L765,462" stroke="#506579" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="55" y="568" font-size="22" fill="#192a3a" text-anchor="start">阴性成立的前提：已完整插入、规则一致、没有丢失置位或错误清零</text><text x="55" y="605" font-size="22" fill="#192a3a" text-anchor="start">阳性只说明可能存在，不能直接决定丢弃、授权或业务成功</text></g></svg>