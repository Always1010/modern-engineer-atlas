<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img"><title>未知结果先核查 再决定恢复动作</title><desc>发出请求后中断时保留未知，通过稳定操作标识核查外部状态，分已完成未执行仍未知三路；取消和补偿另有生命周期。</desc><metadata>本书原创教学图；2026-10-03；非真实系统运行记录。</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#537086"/></marker></defs><rect width="1160" height="690" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#233746}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}.note{font-size:20px;fill:#526678}</style><text x="48" y="57" class="title" text-anchor="start">未知结果先核查 再决定恢复动作</text><rect x="35" y="130" width="245" height="106" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="157.5" y="175.0" class="label" text-anchor="middle">请求已发出</text><text x="157.5" y="205.0" class="small" text-anchor="middle">连接或进程中断</text><path d="M290,183 L350,183" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="130" width="330" height="106" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="530.0" y="175.0" class="label" text-anchor="middle">保留结果未知</text><text x="530.0" y="205.0" class="small" text-anchor="middle">稳定业务操作标识</text><path d="M705,183 L765,183" fill="none" stroke="#537086" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="130" width="335" height="106" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="947.5" y="175.0" class="label" text-anchor="middle">查询外部真实状态</text><text x="947.5" y="205.0" class="small" text-anchor="middle">当前权限与资源版本</text><path d="M948,248 V294 H207 V345 M580,294 V345 M952,294 V345" fill="none" stroke="#537086" stroke-width="3"/><rect x="45" y="355" width="320" height="105" rx="9" fill="#eaf4ec" stroke="#8fa8bc" stroke-width="2"/><text x="205.0" y="399.5" class="label" text-anchor="middle">确认已完成</text><text x="205.0" y="429.5" class="small" text-anchor="middle">保存证据再核对续行条件</text><rect x="410" y="355" width="320" height="105" rx="9" fill="#eef4fa" stroke="#8fa8bc" stroke-width="2"/><text x="570.0" y="399.5" class="label" text-anchor="middle">确认未执行</text><text x="570.0" y="429.5" class="small" text-anchor="middle">授权仍有效才调度</text><rect x="775" y="355" width="320" height="105" rx="9" fill="#fff3df" stroke="#8fa8bc" stroke-width="2"/><text x="935.0" y="399.5" class="label" text-anchor="middle">仍然无法确定</text><text x="935.0" y="429.5" class="small" text-anchor="middle">保留未知并升级处理</text><rect x="60" y="555" width="1040" height="78" rx="9" fill="#f1edf8" stroke="#8fa8bc" stroke-width="2"/><text x="580.0" y="601.0" class="label" text-anchor="middle">取消阻止新动作；在途效果先核查，补偿另行授权</text><text x="55" y="675" class="note" text-anchor="start">超时不是未执行的证明，补偿也不等于回到完全相同的初始状态</text></svg>