<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">插件隔离：数据、能力、资源三个边界</title><desc id="desc">Wasm实例经范围和权限检查访问宿主能力，同时有独立资源预算；宿主库仍需要安全实现。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">插件隔离：数据、能力、资源三个边界</text><rect x="45" y="135" width="520" height="440" rx="22" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="85" y="190" font-size="30">Wasm 实例与资源预算</text><rect x="105" y="240" width="395" height="130" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="302.5" y="286" text-anchor="middle" font-size="27">受管理线性内存</text><text x="302.5" y="326" text-anchor="middle" font-size="27">模块代码 / 表 / 句柄</text><text x="100" y="465" font-size="25">CPU、内存、调用数量有界</text><text x="100" y="515" font-size="25">陷阱与取消也要释放资源</text><rect x="670" y="210" width="310" height="230" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="825.0" y="256" text-anchor="middle" font-size="27">受检验宿主接口</text><text x="825.0" y="296" text-anchor="middle" font-size="27">范围与编码</text><text x="825.0" y="336" text-anchor="middle" font-size="27">权限与句柄</text><text x="825.0" y="376" text-anchor="middle" font-size="27">超时与取消</text><rect x="1090" y="210" width="260" height="230" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="1220.0" y="256" text-anchor="middle" font-size="27">授权能力</text><text x="1220.0" y="296" text-anchor="middle" font-size="27">指定目录</text><text x="1220.0" y="336" text-anchor="middle" font-size="27">任务服务</text><text x="1220.0" y="376" text-anchor="middle" font-size="27">受限网络</text><path d="M570 315 L660 315" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M985 315 L1080 315" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="640" y="570" font-size="28">宿主本地库仍属于可信边界</text><text x="90" y="680" font-size="27">线性内存隔离不等于模块内部对象无越界，也不代替宿主权限设计</text></g></svg>