<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">渐进演进需要可解释的中间状态</title><desc id="desc">旧系统权威、有限切换、扩大迁移和退役旧路径四阶段均有责任、回退和退出条件。</desc><metadata>原创教学图；现代软件工程师能力地图；C25；2026-10-03；无外部素材</metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#476379"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b3a}.b{font-size:24px;font-weight:600}.t{font-size:21px}.n{font-size:22px}</style></defs><rect width="1120" height="670" fill="#fff"/><text x="48" y="55" font-size="30" font-weight="700">渐进演进需要可解释的中间状态</text><rect x="45" y="130" width="235" height="230" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="162.5" y="166" text-anchor="middle" class="b">一 旧系统权威</text><text x="162.5" y="200" text-anchor="middle" class="t">新路径只做比较</text><text x="162.5" y="229" text-anchor="middle" class="t">输入已授权</text><text x="162.5" y="258" text-anchor="middle" class="t">副作用被隔离</text><text x="162.5" y="287" text-anchor="middle" class="t">记录行为差异</text><rect x="310" y="130" width="235" height="230" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="427.5" y="166" text-anchor="middle" class="b">二 有限切换</text><text x="427.5" y="200" text-anchor="middle" class="t">对象路由稳定</text><text x="427.5" y="229" text-anchor="middle" class="t">结果权威明确</text><text x="427.5" y="258" text-anchor="middle" class="t">监测资源与错误</text><text x="427.5" y="287" text-anchor="middle" class="t">保留恢复条件</text><rect x="575" y="130" width="235" height="230" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="692.5" y="166" text-anchor="middle" class="b">三 扩大迁移</text><text x="692.5" y="200" text-anchor="middle" class="t">数据与读者兼容</text><text x="692.5" y="229" text-anchor="middle" class="t">消费者逐项核对</text><text x="692.5" y="258" text-anchor="middle" class="t">验证退出条件</text><text x="692.5" y="287" text-anchor="middle" class="t">处理剩余差异</text><rect x="840" y="130" width="235" height="230" rx="12" fill="#eaf1f8" stroke="#536b80" stroke-width="2"/><text x="957.5" y="166" text-anchor="middle" class="b">四 退役旧路径</text><text x="957.5" y="200" text-anchor="middle" class="t">确认低频使用</text><text x="957.5" y="229" text-anchor="middle" class="t">撤销旧权限</text><text x="957.5" y="258" text-anchor="middle" class="t">清理配置与告警</text><text x="957.5" y="287" text-anchor="middle" class="t">保留必要历史</text><path d="M280 245 L305 245" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M545 245 L570 245" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M810 245 L835 245" stroke="#476379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="560" y="451" class="n" text-anchor="middle">每个阶段都回答：谁读、谁写、谁拥有权威状态</text><text x="560" y="502" class="n" text-anchor="middle">回退窗口会变化；双写不自动保证一致</text><text x="560" y="553" class="n" text-anchor="middle">过渡有成本，因此必须有可验证的退出条件</text></svg>