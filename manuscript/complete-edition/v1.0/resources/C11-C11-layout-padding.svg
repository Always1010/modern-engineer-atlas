<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 11-1 对齐、填充与对象大小</title><desc id="desc">明确假设下展示12字节与8字节两种布局，填充用浅黄色标出；不是标准规定的固定布局。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 11-1 对齐、填充与对象大小</text><text x="40" y="100" font-size="20">教学假设：char 为 1 字节；uint32_t 大小与对齐均为 4 字节</text><text x="40" y="153" font-size="20">声明顺序：kind / count / status</text><rect x="40" y="178" width="87" height="72" fill="#dcefe0" stroke="#8296aa"/><text x="51" y="277" font-size="17">0</text><text x="45" y="222" font-size="17">kind</text><rect x="127" y="178" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="138" y="277" font-size="17">1</text><text x="132" y="222" font-size="17">填</text><rect x="214" y="178" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="225" y="277" font-size="17">2</text><text x="219" y="222" font-size="17">填</text><rect x="301" y="178" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="312" y="277" font-size="17">3</text><text x="306" y="222" font-size="17">填</text><rect x="388" y="178" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="399" y="277" font-size="17">4</text><text x="393" y="222" font-size="17">count</text><rect x="475" y="178" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="486" y="277" font-size="17">5</text><rect x="562" y="178" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="573" y="277" font-size="17">6</text><rect x="649" y="178" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="660" y="277" font-size="17">7</text><rect x="736" y="178" width="87" height="72" fill="#dcefe0" stroke="#8296aa"/><text x="747" y="277" font-size="17">8</text><text x="741" y="222" font-size="17">status</text><rect x="823" y="178" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="834" y="277" font-size="17">9</text><text x="828" y="222" font-size="17">填</text><rect x="910" y="178" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="921" y="277" font-size="17">10</text><text x="915" y="222" font-size="17">填</text><rect x="997" y="178" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="1008" y="277" font-size="17">11</text><text x="1002" y="222" font-size="17">填</text><text x="40" y="318" font-size="20">该布局下：sizeof = 12，下一数组元素从偏移 12 开始</text><text x="40" y="370" font-size="20">调整顺序：count / kind / status</text><rect x="40" y="390" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="51" y="488" font-size="17">0</text><text x="45" y="433" font-size="17">count</text><rect x="127" y="390" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="138" y="488" font-size="17">1</text><rect x="214" y="390" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="225" y="488" font-size="17">2</text><rect x="301" y="390" width="87" height="72" fill="#d4e8fb" stroke="#8296aa"/><text x="312" y="488" font-size="17">3</text><rect x="388" y="390" width="87" height="72" fill="#dcefe0" stroke="#8296aa"/><text x="399" y="488" font-size="17">4</text><text x="393" y="433" font-size="17">kind</text><rect x="475" y="390" width="87" height="72" fill="#dcefe0" stroke="#8296aa"/><text x="486" y="488" font-size="17">5</text><text x="480" y="433" font-size="17">status</text><rect x="562" y="390" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="573" y="488" font-size="17">6</text><text x="567" y="433" font-size="17">填</text><rect x="649" y="390" width="87" height="72" fill="#f4e8cf" stroke="#8296aa"/><text x="660" y="488" font-size="17">7</text><text x="654" y="433" font-size="17">填</text><text x="785" y="423" font-size="20">示例大小 8 字节</text><text x="785" y="457" font-size="20">不是跨平台保证</text><text x="40" y="535" font-size="20">成员重排也可能改变 ABI 与初始化语义；必须结合接口和构建条件评估</text></g></svg>