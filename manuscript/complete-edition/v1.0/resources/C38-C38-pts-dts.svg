<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">参考依赖与两种顺序</title><desc id="desc">显示序列是I0 B1 B2 P3；解码序列是I0 P3 B1 B2。B1与B2依赖已经解码的P3。横向位置只代表序列先后，不给定真实时间戳。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6575"/></marker></defs><rect width="1200" height="680" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="32" fill="#14364a" text-anchor="start">参考依赖与两种顺序</text><text x="48" y="99" font-size="18" fill="#516575" text-anchor="start">原创机制示意 · 不代表设备测量 · 2026-10-03</text><text x="48" y="181" font-size="26" fill="#16384c" text-anchor="start">显示顺序</text><text x="48" y="369" font-size="26" fill="#16384c" text-anchor="start">解码顺序</text><rect x="210" y="210" width="180" height="78" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="228" y="245" font-size="25" fill="#16384c" text-anchor="start">I0</text><path d="M390,249 L437,249" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="210" width="180" height="78" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="458" y="245" font-size="25" fill="#16384c" text-anchor="start">B1</text><path d="M620,249 L667,249" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="670" y="210" width="180" height="78" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="688" y="245" font-size="25" fill="#16384c" text-anchor="start">B2</text><path d="M850,249 L897,249" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="900" y="210" width="180" height="78" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="918" y="245" font-size="25" fill="#16384c" text-anchor="start">P3</text><rect x="210" y="396" width="180" height="78" rx="14" fill="#e8f5ee" stroke="#9ab4c2"/><text x="228" y="431" font-size="25" fill="#16384c" text-anchor="start">I0</text><path d="M390,435 L437,435" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="396" width="180" height="78" rx="14" fill="#fff3de" stroke="#9ab4c2"/><text x="458" y="431" font-size="25" fill="#16384c" text-anchor="start">P3</text><path d="M620,435 L667,435" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="670" y="396" width="180" height="78" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="688" y="431" font-size="25" fill="#16384c" text-anchor="start">B1</text><path d="M850,435 L897,435" stroke="#4a6575" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="900" y="396" width="180" height="78" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="918" y="431" font-size="25" fill="#16384c" text-anchor="start">B2</text><text x="210" y="330" font-size="23" fill="#16384c" text-anchor="start">PTS关联呈现时刻；DTS关联解码时刻，两者都要带时间基</text><rect x="48" y="525" width="1102" height="106" rx="14" fill="#e8f2f7" stroke="#9ab4c2"/><text x="66" y="560" font-size="25" fill="#16384c" text-anchor="start">为什么需要重排</text><text x="66" y="597" font-size="21" fill="#38596b" text-anchor="start">B1 / B2 需要 P3 的参考信息，所以 P3 先解码、后显示；缓冲由依赖决定</text></g></svg>