<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">可信计算的两项交付：结果与成本</title><desc id="desc">问题与误差预算定义验收，执行正确性与数值质量共同验证结果，端到端性能验证成本。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">可信计算的两项交付：结果与成本</text><rect x="80" y="160" width="550" height="140" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="355.0" y="206" text-anchor="middle" font-size="27">问题定义与误差预算</text><text x="355.0" y="246" text-anchor="middle" font-size="27">尺度、条件、精度、停止准则</text><rect x="770" y="160" width="550" height="140" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1045.0" y="206" text-anchor="middle" font-size="27">执行正确性</text><text x="1045.0" y="246" text-anchor="middle" font-size="27">依赖、边界、竞争、通信</text><path d="M635 230 L760 230" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="80" y="465" width="550" height="140" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="355.0" y="511" text-anchor="middle" font-size="27">端到端成本</text><text x="355.0" y="551" text-anchor="middle" font-size="27">移动、等待、计算、资源</text><rect x="770" y="465" width="550" height="140" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="1045.0" y="511" text-anchor="middle" font-size="27">数值质量</text><text x="1045.0" y="551" text-anchor="middle" font-size="27">残差、性质、独立参照</text><path d="M1045 310 L1045 455" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M760 530 L640 530" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="125" y="700" font-size="27">保存输入、版本、编译选项、精度模式和拓扑，才能解释并重现结论</text></g></svg>