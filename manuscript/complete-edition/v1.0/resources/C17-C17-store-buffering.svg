<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">同一段结构 不同的排序约束</title><desc id="desc">两线程各先写后读对方；RA 的零零没有交叉同步，SC 的零零与总序矛盾。</desc><metadata>作者原创；2026-10-03；N4861 语义教学图；非执行轨迹或实测。</metadata><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486078"/></marker></defs><rect width="1100" height="550" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172c43"><text x="42" y="48" font-size="27" text-anchor="start">同一段结构 不同的排序约束</text><rect x="45" y="120" width="430" height="135" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="260.0" y="152" font-size="20" text-anchor="middle">线程一</text><text x="260.0" y="181" font-size="20" text-anchor="middle">A：x.store(1)</text><text x="260.0" y="210" font-size="20" text-anchor="middle">B：r1 = y.load()</text><rect x="625" y="120" width="430" height="135" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="840.0" y="152" font-size="20" text-anchor="middle">线程二</text><text x="840.0" y="181" font-size="20" text-anchor="middle">C：y.store(1)</text><text x="840.0" y="210" font-size="20" text-anchor="middle">D：r2 = x.load()</text><rect x="45" y="305" width="430" height="145" rx="10" fill="#f4f0e7" stroke="#7893ab" stroke-width="2"/><text x="260.0" y="337" font-size="20" text-anchor="middle">release / acquire</text><text x="260.0" y="366" font-size="20" text-anchor="middle">r1 = 0 且 r2 = 0 可以被允许</text><text x="260.0" y="395" font-size="20" text-anchor="middle">两个读都没有接到对方发布</text><rect x="625" y="305" width="430" height="145" rx="10" fill="#eaf2fa" stroke="#7893ab" stroke-width="2"/><text x="840.0" y="337" font-size="20" text-anchor="middle">四个操作都用 seq_cst</text><text x="840.0" y="366" font-size="20" text-anchor="middle">零零会要求 A &lt; B &lt; C &lt; D &lt; A</text><text x="840.0" y="395" font-size="20" text-anchor="middle">总序不能有环，因此禁止</text><text x="50" y="505" font-size="21" text-anchor="start">允许性来自语言规则；出现频率与具体硬件观测不是同一件事。</text></g></svg>