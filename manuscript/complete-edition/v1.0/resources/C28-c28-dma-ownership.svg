<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">DMA 的关键是所有权交接</title><desc id="desc">上下两行分别为发送与接收，强调CPU与DMA不能同时任意改写缓存缓冲。</desc><metadata>原创教学图；现代软件工程师能力地图；2026-10-03；非实测数据；未复制厂商图表。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="670" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="55" y="54" font-size="30" font-weight="bold">DMA 的关键是所有权交接</text><rect x="55" y="112" width="335" height="156" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="77" y="147" font-size="24" font-weight="bold">CPU 准备发送</text><text x="77" y="184" font-size="21">独占写缓冲</text><text x="77" y="215" font-size="21">按平台清理脏缓存</text><text x="77" y="246" font-size="21">满足设备发布顺序</text><rect x="432" y="112" width="335" height="156" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="454" y="147" font-size="24" font-weight="bold">DMA 读取发送</text><text x="454" y="184" font-size="21">设备拥有缓冲</text><text x="454" y="215" font-size="21">CPU 不得提前改写</text><text x="454" y="246" font-size="21">等待真实完成证据</text><rect x="810" y="112" width="335" height="156" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="832" y="147" font-size="24" font-weight="bold">CPU 回收发送</text><text x="832" y="184" font-size="21">确认设备不再访问</text><text x="832" y="215" font-size="21">记录完成或错误</text><text x="832" y="246" font-size="21">再交给下一次传输</text><path d="M395 191 L423 191" stroke="#4b6379" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M773 191 L801 191" stroke="#4b6379" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="55" y="350" width="335" height="156" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="77" y="385" font-size="24" font-weight="bold">CPU 交付接收</text><text x="77" y="422" font-size="21">核对平台前置维护</text><text x="77" y="453" font-size="21">缓冲独占缓存行</text><text x="77" y="484" font-size="21">停止修改相关数据</text><rect x="432" y="350" width="335" height="156" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="454" y="385" font-size="24" font-weight="bold">DMA 写入接收</text><text x="454" y="422" font-size="21">设备拥有缓冲</text><text x="454" y="453" font-size="21">处理溢出和部分传输</text><text x="454" y="484" font-size="21">完成后交回所有权</text><rect x="810" y="350" width="335" height="156" rx="10" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="832" y="385" font-size="24" font-weight="bold">CPU 读取接收</text><text x="832" y="422" font-size="21">按规定失效旧缓存</text><text x="832" y="453" font-size="21">完成要求的同步</text><text x="832" y="484" font-size="21">读取并处理新数据</text><path d="M395 427 L423 427" stroke="#4b6379" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M773 427 L801 427" stroke="#4b6379" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="55" y="584" font-size="24">接收后盲目 clean 可能把旧脏数据写回，覆盖设备结果</text><text x="55" y="622" font-size="21">本图限定非一致性缓存语境；具体操作、顺序、对齐和屏障以平台 DMA 契约为准</text></g></svg>