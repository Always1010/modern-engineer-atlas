<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">测试判定 留档 同步与放行是不同边界</title><desc id="desc">工业工位对每次测试尝试保留工件与计划身份，区分设备动作未知、本地记录持久化、MES接纳与生产放行。</desc><metadata>本书原创教学示意；2026-10-04；非实测波形或厂商架构；未复制厂商图表。</metadata><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#53687c"/></marker></defs><rect width="1200" height="850" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="48" y="52" font-size="30" font-weight="bold">测试判定 留档 同步与放行是不同边界</text><rect x="48" y="91" width="1103" height="118" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="127" font-size="25" font-weight="bold">冻结本次上下文</text><text x="68" y="166" font-size="22">serial ＋ attempt_id ＋ station_id ＋ plan_version；仪器与治具条件归入同一记录</text><rect x="48" y="263" width="337" height="174" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="68" y="299" font-size="25" font-weight="bold">设备动作与有效测量</text><text x="68" y="338" font-size="22">operation_id保持原动作身份</text><text x="68" y="370" font-size="22">回执丢失：结果未知，先查询</text><text x="68" y="402" font-size="22">PASS：有效结果满足冻结限值</text><rect x="431" y="263" width="337" height="174" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="451" y="299" font-size="25" font-weight="bold">本地持久记录</text><text x="451" y="338" font-size="22">同一事务保存result＋outbox</text><text x="451" y="370" font-size="22">提交完成才表示“已留档”</text><text x="451" y="402" font-size="22">未保存不得伪称证据已保留</text><rect x="815" y="263" width="337" height="174" rx="8" fill="#eef4f8" stroke="#8497a7" stroke-width="2"/><text x="835" y="299" font-size="25" font-weight="bold">MES结果同步</text><text x="835" y="338" font-size="22">独立、固定的submission_id</text><text x="835" y="370" font-size="22">去重与查询须由接口约定</text><text x="835" y="402" font-size="22">接收确认对应这份结果身份</text><polyline points="390,350 420,350" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="773,350 804,350" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="215,216 215,253" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="600,216 600,253" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="980,216 980,253" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="492" width="337" height="171" rx="8" fill="#fbf6ec" stroke="#8497a7" stroke-width="2"/><text x="68" y="528" font-size="25" font-weight="bold">边界一：动作回包丢失</text><text x="68" y="567" font-size="22">不能自动当成未执行</text><text x="68" y="599" font-size="22">保留Unknown与恢复依据</text><text x="68" y="631" font-size="22">缺少证据时进入受控复核</text><rect x="431" y="492" width="337" height="171" rx="8" fill="#fbf6ec" stroke="#8497a7" stroke-width="2"/><text x="451" y="528" font-size="25" font-weight="bold">边界二：本地提交后崩溃</text><text x="451" y="567" font-size="22">从持久记录恢复待同步项</text><text x="451" y="599" font-size="22">不凭界面缓存决定重测</text><text x="451" y="631" font-size="22">重测必须建立新的attempt</text><rect x="815" y="492" width="337" height="171" rx="8" fill="#fbf6ec" stroke="#8497a7" stroke-width="2"/><text x="835" y="528" font-size="25" font-weight="bold">边界三：MES回包丢失</text><text x="835" y="567" font-size="22">同一提交身份查询或重试</text><text x="835" y="599" font-size="22">不新造一次生产事实</text><text x="835" y="631" font-size="22">拒绝与未知分别处理</text><polyline points="215,443 215,481" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="600,443 600,481" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><polyline points="980,443 980,481" fill="none" stroke="#53687c" stroke-width="3" marker-end="url(#a)"/><text x="48" y="721" font-size="25" font-weight="bold">放行策略：按产品和工艺规定综合判定、留档、MES状态及其他前提</text><text x="48" y="764" font-size="23">GUI显示权威模型；PLC工位握手不能替代安全控制或风险验证</text><text x="48" y="814" font-size="22">本书教学重建，非企业内部架构；不承诺任意MES天然支持幂等</text></g></svg>