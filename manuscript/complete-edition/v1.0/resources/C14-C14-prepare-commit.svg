<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc"><title id="title">图 14-1 把失败留在提交点之前</title><desc id="desc">原配置不变，候选完成分配构造验证后经不抛交换提交；失败销毁候选。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526578"/></marker></defs><rect width="1160" height="560" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#182e43"><text x="40" y="48" font-size="26" font-weight="700">图 14-1 把失败留在提交点之前</text><rect x="50" y="125" width="285" height="110" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="192.5" y="157" text-anchor="middle" font-size="21">原配置</text><text x="192.5" y="187" text-anchor="middle" font-size="21">name + limits</text><text x="192.5" y="217" text-anchor="middle" font-size="21">继续保持原值</text><rect x="440" y="125" width="285" height="110" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="582.5" y="157" text-anchor="middle" font-size="21">准备候选配置</text><text x="582.5" y="187" text-anchor="middle" font-size="21">分配 / 构造 / 验证</text><text x="582.5" y="217" text-anchor="middle" font-size="21">此阶段可能失败</text><rect x="835" y="125" width="285" height="110" rx="12" fill="#e8f4ed" stroke="#8296aa"/><text x="977.5" y="157" text-anchor="middle" font-size="21">不抛提交</text><text x="977.5" y="187" text-anchor="middle" font-size="21">交换候选与原值</text><text x="977.5" y="217" text-anchor="middle" font-size="21">承诺条件必须成立</text><path d="M335 180 L435 180" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M725 180 L830 180" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><rect x="355" y="350" width="365" height="90" rx="12" fill="#fff1dc" stroke="#8296aa"/><text x="537.5" y="382" text-anchor="middle" font-size="21">准备失败：销毁候选</text><text x="537.5" y="412" text-anchor="middle" font-size="21">原配置保持不变</text><rect x="805" y="350" width="315" height="90" rx="12" fill="#eaf2fb" stroke="#8296aa"/><text x="962.5" y="382" text-anchor="middle" font-size="21">提交成功：新配置生效</text><text x="962.5" y="412" text-anchor="middle" font-size="21">候选负责清理旧值</text><path d="M580 235 L535 345" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><path d="M975 235 L970 345" fill="none" stroke="#526578" stroke-width="2.5" marker-end="url(#a)"/><text x="55" y="495" font-size="20">强保证覆盖约定的内存状态；已经发生的网络、文件等副作用不自动撤销</text><text x="55" y="535" font-size="20">候选副本有峰值内存成本；更换成员或分配器后需重新证明提交条件</text></g></svg>