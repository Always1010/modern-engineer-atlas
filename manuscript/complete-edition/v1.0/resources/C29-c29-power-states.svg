<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">休眠深度由能量和时限共同决定</title><desc id="desc">三个功耗状态以及能量条件和响应条件的并列约束。</desc><metadata>原创教学图；2026-10-03；作者推演，非实测；现代软件工程师能力地图。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">休眠深度由能量和时限共同决定</text><rect x="50" y="112" width="320" height="168" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="70" y="147" font-size="24" font-weight="bold">工作状态</text><text x="70" y="182" font-size="21">采样、计算或通信</text><text x="70" y="213" font-size="21">功率 P工作，持续时间 t工作</text><text x="70" y="244" font-size="21">确认是否可聚合工作</text><rect x="440" y="112" width="320" height="168" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="460" y="147" font-size="24" font-weight="bold">浅睡状态</text><text x="460" y="182" font-size="21">保留更多可用状态</text><text x="460" y="213" font-size="21">较低功率 P浅</text><text x="460" y="244" font-size="21">较短的恢复路径</text><rect x="830" y="112" width="320" height="168" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="850" y="147" font-size="24" font-weight="bold">深睡状态</text><text x="850" y="182" font-size="21">可能关闭更多电源域</text><text x="850" y="213" font-size="21">更低持续功率 P深</text><text x="850" y="244" font-size="21">额外进出能量 E</text><path d="M375 194 L429 194" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M765 194 L819 194" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="370" width="520" height="156" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="70" y="405" font-size="24" font-weight="bold">能量条件</text><text x="70" y="440" font-size="21">空闲期节省的能量 &gt; 进出代价</text><text x="70" y="471" font-size="21">简化盈亏平衡：E / (P浅 − P深)</text><text x="70" y="502" font-size="21">需先满足 P浅 &gt; P深</text><rect x="630" y="370" width="520" height="156" rx="10" fill="#edf4f8" stroke="#879cab" stroke-width="2"/><text x="650" y="405" font-size="24" font-weight="bold">响应条件</text><text x="650" y="440" font-size="21">检测 + 恢复 + 调度 + 处理</text><text x="650" y="471" font-size="21">必须满足业务允许响应时间</text><text x="650" y="502" font-size="21">监听电路也占整机能源预算</text><text x="50" y="610" font-size="22">参数关系示意，无具体芯片实测数值；更深的睡眠不一定更省总能量</text></g></svg>