<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">前端的两条产出：程序语义与来源关系</title><desc id="desc">源码及上下文经过词法、语法与语义分析形成AST，位置与展开来源同时服务诊断和工具。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">前端的两条产出：程序语义与来源关系</text><rect x="55" y="165" width="290" height="140" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="200.0" y="211" text-anchor="middle" font-size="27">源码 + 编译上下文</text><text x="200.0" y="251" text-anchor="middle" font-size="27">标准 / 宏 / 目标</text><rect x="420" y="165" width="260" height="140" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="550.0" y="211" text-anchor="middle" font-size="27">词法 / 语法 / 语义</text><text x="550.0" y="251" text-anchor="middle" font-size="27">Token → 结构</text><rect x="755" y="165" width="570" height="140" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="1040.0" y="211" text-anchor="middle" font-size="27">语义树 AST</text><text x="1040.0" y="251" text-anchor="middle" font-size="27">声明身份 / 类型 / 隐式操作</text><path d="M345 230 L415 230" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M680 230 L750 230" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="230" y="425" width="940" height="140" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="700.0" y="471" text-anchor="middle" font-size="27">源位置与展开关系贯穿前端</text><text x="700.0" y="511" text-anchor="middle" font-size="27">拼写位置 ≠ 宏展开位置</text><path d="M195 310 L350 418" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M550 310 L600 418" stroke="#527083" stroke-width