<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">点击取消之后仍然需要完成协议</title><desc id="desc">取消请求之后可能得到已取消、已完成或外部结果未知三种终态。</desc><metadata>本书原创教学图；2026-10-03；非框架截图、非实测轨迹。</metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4b6379"/></marker></defs><rect width="1200" height="680" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#142b40"><text x="50" y="52" font-size="29" font-weight="bold">点击取消之后仍然需要完成协议</text><rect x="50" y="110" width="320" height="148" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="146" font-size="24" font-weight="bold">运行中</text><text x="70" y="183" font-size="21">拥有操作状态与缓冲</text><text x="70" y="214" font-size="21">设备可能已经开始执行</text><rect x="440" y="110" width="320" height="148" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="460" y="146" font-size="24" font-weight="bold">用户请求取消</text><text x="460" y="183" font-size="21">停止新增相关工作</text><text x="460" y="214" font-size="21">向计算与 IO 传播请求</text><rect x="830" y="110" width="320" height="148" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="850" y="146" font-size="24" font-weight="bold">等待终态证据</text><text x="850" y="183" font-size="21">完成可能先于取消</text><text x="850" y="214" font-size="21">缓冲继续保持有效</text><path d="M375 183 L430 183" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M765 183 L820 183" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="397" width="320" height="145" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="70" y="433" font-size="24" font-weight="bold">确定已取消</text><text x="70" y="470" font-size="21">接口确认操作结束</text><text x="70" y="501" font-size="21">按协议回收资源</text><rect x="440" y="397" width="320" height="145" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="460" y="433" font-size="24" font-weight="bold">确定已完成</text><text x="460" y="470" font-size="21">接纳合法完成结果</text><text x="460" y="501" font-size="21">不能伪装成未执行</text><rect x="830" y="397" width="320" height="145" rx="10" fill="#edf4f8" stroke="#8298aa" stroke-width="2"/><text x="850" y="433" font-size="24" font-weight="bold">外部结果未知</text><text x="850" y="470" font-size="21">重新查询设备状态</text><text x="850" y="501" font-size="21">禁止盲目重放副作用</text><path d="M990 268 L990 334 L208 334 L208 385" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="50" y="627" font-size="23">取消 UI 等待、取消本地传输与撤销设备动作，是三种不同承诺</text><path d="M600 334 L600 385" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M990 334 L990 385" stroke="#4b6379" stroke-width="3" fill="none" marker-end="url(#a)"/></g></svg>