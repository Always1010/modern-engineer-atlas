<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">跨流依赖与最后使用决定资源回收</title><desc id="desc">流A生产后记录E，流B等待E再消费，缓冲需等消费者完成才可复用；主机提交不等于设备完成。</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#527083" stroke-width="2"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#173044"><text x="55" y="70" font-size="36" font-weight="700">跨流依赖与最后使用决定资源回收</text><text x="65" y="170" font-size="28">主机</text><text x="65" y="295" font-size="28">流 A</text><text x="65" y="435" font-size="28">流 B</text><text x="65" y="585" font-size="28">独立流</text><path d="M190 190 H1310" stroke="#bccdd8" stroke-width="2"/><path d="M190 320 H1310" stroke="#bccdd8" stroke-width="2"/><path d="M190 460 H1310" stroke="#bccdd8" stroke-width="2"/><path d="M190 610 H1310" stroke="#bccdd8" stroke-width="2"/><rect x="220" y="130" width="345" height="80" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="392.5" y="176" text-anchor="middle" font-size="27">提交后可继续工作</text><rect x="300" y="260" width="340" height="95" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="470.0" y="306" text-anchor="middle" font-size="27">生产内核</text><rect x="690" y="260" width="180" height="95" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="780.0" y="306" text-anchor="middle" font-size="27">记录 E</text><path d="M645 305 L680 305" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="690" y="400" width="180" height="95" rx="18" fill="#fff0d8" stroke="#88a6b8" stroke-width="2"/><text x="780.0" y="446" text-anchor="middle" font-size="27">等待 E</text><rect x="925" y="400" width="355" height="95" rx="18" fill="#e5f2e8" stroke="#88a6b8" stroke-width="2"/><text x="1102.5" y="446" text-anchor="middle" font-size="27">消费内核</text><path d="M780 360 L780 390" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M875 447 L915 447" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="260" y="550" width="650" height="95" rx="18" fill="#e3f0f6" stroke="#88a6b8" stroke-width="2"/><text x="585.0" y="596" text-anchor="middle" font-size="27">独立工作：有并发机会，是否重叠需观察</text><path d="M1280 500 L1280 685" stroke="#527083" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="795" y="730" font-size="27">消费者完成 → 缓冲才可复用</text><text x="75" y="730" font-size="25">示意无时间单位，非实测</text></g></svg>