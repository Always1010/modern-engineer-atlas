<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">节组织文件 段描述装载</title><desc id="desc">左侧代码、只读数据、初始数据、零初始化需求与调试信息按节组织，右侧程序头指导建立不同权限段。调试信息不必装入运行映像。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#486477"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17384b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:20px}.arrow{stroke:#486477;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="620" fill="#fff"/><text x="44" y="55" class="title">节组织文件 段描述装载</text><text class="label" x="60" y="115">ELF 文件中的节</text><text class="label" x="715" y="115">依据程序头建立运行映像</text><rect x="55" y="150" width="300" height="73" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="205.0" y="185" text-anchor="middle" class="label">.text 代码</text><rect x="55" y="238" width="300" height="73" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="205.0" y="273" text-anchor="middle" class="label">.rodata 只读内容</text><rect x="55" y="326" width="300" height="73" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="205.0" y="361" text-anchor="middle" class="label">.data 初始数据</text><rect x="55" y="414" width="300" height="73" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="205.0" y="449" text-anchor="middle" class="label">.bss 零值需求</text><rect x="55" y="502" width="300" height="73" rx="12" fill="#fff0e8" stroke="#7a98ac" stroke-width="2"/><text x="205.0" y="537" text-anchor="middle" class="label">调试信息</text><rect x="735" y="150" width="390" height="85" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="930.0" y="185" text-anchor="middle" class="label">可读可执行段</text><text x="930.0" y="216" text-anchor="middle" class="small">可覆盖代码相关节</text><rect x="735" y="273" width="390" height="85" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="930.0" y="308" text-anchor="middle" class="label">只读段</text><text x="930.0" y="339" text-anchor="middle" class="small">可覆盖常量相关节</text><rect x="735" y="396" width="390" height="100" rx="12" fill="#e8f0f6" stroke="#7a98ac" stroke-width="2"/><text x="930.0" y="431" text-anchor="middle" class="label">可读可写段</text><text x="930.0" y="462" text-anchor="middle" class="small">文件中的初始字节</text><text x="930.0" y="493" text-anchor="middle" class="small">加上内存中的零值范围</text><path class="arrow" d="M355 186 H735"/><path class="arrow" d="M355 275 H560 V315 H735"/><path class="arrow" d="M355 363 H590 V428 H735"/><path class="arrow" d="M355 451 H735"/><text class="small" x="420" y="537">调试信息不必进入可装载段</text><text class="small" x="420" y="575">文件偏移、虚拟地址和内存大小分别解释</text></svg>