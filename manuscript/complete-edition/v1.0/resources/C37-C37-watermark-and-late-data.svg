<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">水印推进后仍需要迟到处理</title><desc id="desc">已见最大事件时间10点10分，教学规则减两分钟得水印约10点08分；后来收到10点05分事件，应按既定迟到策略处理。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#52657a"/></marker></defs><rect width="1160" height="620" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172638} .small{font-size:21px} .body{font-size:25px} .head{font-size:30px;font-weight:700}</style><text x="44" y="52" class="head">水印推进后仍需要迟到处理</text><text x="43" y="104" class="small">教学规则：已见最大事件时间减去两分钟；边界开闭依具体实现</text><line x1="106" y1="186" x2="1090" y2="186" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="88" y="158" class="small">10:00</text><line x1="125" y1="179" x2="125" y2="195" stroke="#52657a" stroke-width="2"/><text x="450" y="158" class="small">10:05</text><line x1="487" y1="179" x2="487" y2="195" stroke="#52657a" stroke-width="2"/><text x="728" y="158" class="small">约 10:08</text><line x1="765" y1="179" x2="765" y2="195" stroke="#52657a" stroke-width="2"/><text x="971" y="158" class="small">10:10</text><line x1="1008" y1="179" x2="1008" y2="195" stroke="#52657a" stroke-width="2"/><text x="675" y="235" class="small">水印推进位置</text><text x="912" y="270" class="small">已见事件</text><rect x="41" y="323" width="361" height="94" rx="10" fill="#fff3df" stroke="#ad8850" stroke-width="2"/><text x="65" y="365" class="body">后来才收到一条记录</text><text x="65" y="399" class="small">其事件时间为 10:05</text><line x1="410" y1="370" x2="502" y2="370" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="513" y="314" width="605" height="117" rx="10" fill="#eef5fa" stroke="#6686a3" stroke-width="2"/><text x="543" y="357" class="body">迟到路径：按契约更正、旁路或丢弃</text><text x="543" y="400" class="small">保留计数、原因和必要追溯信息</text><text x="45" y="501" class="small">水印是系统的进度声明；若来源没有保证，它不证明更早事件全部到齐</text><text x="45" y="551" class="small">空闲分区恢复、离线补传与时钟错误，都可能产生较早时间戳</text></svg>