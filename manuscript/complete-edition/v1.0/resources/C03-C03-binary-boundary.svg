<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">二分查找的边界不变量</title><desc id="desc">查找第一个不小于一的位置，候选半开区间每轮缩小，最终返回边界一。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#506579"/></marker></defs><rect width="1120" height="700" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" fill="#192a3a"><text x="42" y="50" font-size="28" fill="#192a3a" text-anchor="start">查找第一个不小于 1 的位置</text><rect x="42" y="80" width="218" height="43" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="151.0" y="109.5" font-size="20" fill="#192a3a" text-anchor="middle">未决候选</text><rect x="282" y="80" width="218" height="43" rx="5" fill="#f3eee3" stroke="#70899d" stroke-width="2"/><text x="391.0" y="109.5" font-size="20" fill="#192a3a" text-anchor="middle">已确认小于 1</text><rect x="522" y="80" width="270" height="43" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="657.0" y="109.5" font-size="20" fill="#192a3a" text-anchor="middle">已确认不小于 1</text><text x="42" y="199" font-size="25" fill="#192a3a" text-anchor="start">[0, 5)</text><rect x="210" y="166" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="262.0" y="200.5" font-size="25" fill="#192a3a" text-anchor="middle">−3</text><text x="262" y="244" font-size="17" fill="#192a3a" text-anchor="middle">0</text><rect x="320" y="166" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="372.0" y="200.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="372" y="244" font-size="17" fill="#192a3a" text-anchor="middle">1</text><rect x="430" y="166" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="482.0" y="200.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="482" y="244" font-size="17" fill="#192a3a" text-anchor="middle">2</text><rect x="540" y="166" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="592.0" y="200.5" font-size="25" fill="#192a3a" text-anchor="middle">4</text><text x="592" y="244" font-size="17" fill="#192a3a" text-anchor="middle">3</text><rect x="650" y="166" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="702.0" y="200.5" font-size="25" fill="#192a3a" text-anchor="middle">9</text><text x="702" y="244" font-size="17" fill="#192a3a" text-anchor="middle">4</text><text x="810" y="198" font-size="20" fill="#192a3a" text-anchor="start">初始，mid = 2</text><text x="42" y="317" font-size="25" fill="#192a3a" text-anchor="start">[0, 2)</text><rect x="210" y="284" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="262.0" y="318.5" font-size="25" fill="#192a3a" text-anchor="middle">−3</text><text x="262" y="362" font-size="17" fill="#192a3a" text-anchor="middle">0</text><rect x="320" y="284" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="372.0" y="318.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="372" y="362" font-size="17" fill="#192a3a" text-anchor="middle">1</text><rect x="430" y="284" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="482.0" y="318.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="482" y="362" font-size="17" fill="#192a3a" text-anchor="middle">2</text><rect x="540" y="284" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="592.0" y="318.5" font-size="25" fill="#192a3a" text-anchor="middle">4</text><text x="592" y="362" font-size="17" fill="#192a3a" text-anchor="middle">3</text><rect x="650" y="284" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="702.0" y="318.5" font-size="25" fill="#192a3a" text-anchor="middle">9</text><text x="702" y="362" font-size="17" fill="#192a3a" text-anchor="middle">4</text><text x="810" y="316" font-size="20" fill="#192a3a" text-anchor="start">值 1 ≥ 1，right = 2</text><text x="42" y="435" font-size="25" fill="#192a3a" text-anchor="start">[0, 1)</text><rect x="210" y="402" width="104" height="53" rx="5" fill="#edf3f8" stroke="#70899d" stroke-width="2"/><text x="262.0" y="436.5" font-size="25" fill="#192a3a" text-anchor="middle">−3</text><text x="262" y="480" font-size="17" fill="#192a3a" text-anchor="middle">0</text><rect x="320" y="402" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="372.0" y="436.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="372" y="480" font-size="17" fill="#192a3a" text-anchor="middle">1</text><rect x="430" y="402" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="482.0" y="436.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="482" y="480" font-size="17" fill="#192a3a" text-anchor="middle">2</text><rect x="540" y="402" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="592.0" y="436.5" font-size="25" fill="#192a3a" text-anchor="middle">4</text><text x="592" y="480" font-size="17" fill="#192a3a" text-anchor="middle">3</text><rect x="650" y="402" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="702.0" y="436.5" font-size="25" fill="#192a3a" text-anchor="middle">9</text><text x="702" y="480" font-size="17" fill="#192a3a" text-anchor="middle">4</text><text x="810" y="434" font-size="20" fill="#192a3a" text-anchor="start">值 1 ≥ 1，right = 1</text><text x="42" y="553" font-size="25" fill="#192a3a" text-anchor="start">[1, 1)</text><rect x="210" y="520" width="104" height="53" rx="5" fill="#f3eee3" stroke="#70899d" stroke-width="2"/><text x="262.0" y="554.5" font-size="25" fill="#192a3a" text-anchor="middle">−3</text><text x="262" y="598" font-size="17" fill="#192a3a" text-anchor="middle">0</text><rect x="320" y="520" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="372.0" y="554.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="372" y="598" font-size="17" fill="#192a3a" text-anchor="middle">1</text><rect x="430" y="520" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="482.0" y="554.5" font-size="25" fill="#192a3a" text-anchor="middle">1</text><text x="482" y="598" font-size="17" fill="#192a3a" text-anchor="middle">2</text><rect x="540" y="520" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="592.0" y="554.5" font-size="25" fill="#192a3a" text-anchor="middle">4</text><text x="592" y="598" font-size="17" fill="#192a3a" text-anchor="middle">3</text><rect x="650" y="520" width="104" height="53" rx="5" fill="#dceee7" stroke="#70899d" stroke-width="2"/><text x="702.0" y="554.5" font-size="25" fill="#192a3a" text-anchor="middle">9</text><text x="702" y="598" font-size="17" fill="#192a3a" text-anchor="middle">4</text><text x="810" y="552" font-size="20" fill="#192a3a" text-anchor="start">值 −3 &lt; 1，left = 1</text><text x="42" y="659" font-size="23" fill="#192a3a" text-anchor="start">left = right = 1：返回第一个 1 的位置；没有解引用尾后边界</text></g></svg>