<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" role="img" aria-labelledby="title desc">
  <title id="title">optional 中的存储与对象生命周期</title>
  <desc id="desc">slot 对象以及其内部存储从创建持续到离开作用域。内部整数 7 的生命周期在 reset 时结束，中间没有整数值，emplace 后开始内部整数 9 的生命周期。存储持续存在不代表值一直存在。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#334155"/></marker>
  </defs>
  <rect width="1160" height="460" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172333">
    <text x="36" y="44" font-size="29" font-weight="700">存储持续存在　内部对象可以结束并重新建立</text>
    <g font-size="23" text-anchor="middle">
      <text x="270" y="96">创建 slot</text>
      <text x="490" y="96">reset()</text>
      <text x="760" y="96">emplace(9)</text>
      <text x="1010" y="96">离开作用域</text>
    </g>
    <path d="M238 124H1078" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g stroke="#a4aebc" stroke-width="1.7" stroke-dasharray="6 6">
      <path d="M270 114V351"/><path d="M490 114V351"/><path d="M760 114V351"/><path d="M1010 114V351"/>
    </g>
    <g font-size="23">
      <text x="35" y="190">slot 与内部存储</text>
      <text x="35" y="286">所含整数的生命</text>
    </g>
    <rect x="270" y="158" width="740" height="55" rx="8" fill="#e8edf3" stroke="#62748b" stroke-width="2"/>
    <text x="640" y="194" text-anchor="middle" font-size="23">外层 optional 仍可使用</text>
    <rect x="270" y="250" width="220" height="60" rx="8" fill="#d9ebfb" stroke="#25619a" stroke-width="2"/>
    <text x="380" y="288" text-anchor="middle" font-size="23">整数 7</text>
    <rect x="504" y="250" width="242" height="60" rx="8" fill="#fbf7ee" stroke="#af8a3d" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="625" y="288" text-anchor="middle" font-size="23">没有整数值</text>
    <rect x="760" y="250" width="250" height="60" rx="8" fill="#dff0e8" stroke="#2f7861" stroke-width="2"/>
    <text x="885" y="288" text-anchor="middle" font-size="23">整数 9</text>
    <text x="270" y="365" font-size="22">reset 结束内部值的生命，未销毁 slot</text>
    <text x="270" y="400" font-size="22">emplace 在 slot 中建立新值，不是给旧值赋值</text>
    <text x="35" y="443" font-size="19" fill="#536274">图示只表达示例的时间关系，不规定 optional 的内部布局</text>
  </g>
</svg>
