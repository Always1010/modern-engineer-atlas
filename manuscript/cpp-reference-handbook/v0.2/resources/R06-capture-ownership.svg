<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">闭包值捕获与引用捕获</title><desc id="desc">值捕获保存整数副本，引用捕获借用原对象；原对象销毁使借用失效。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="360" fill="#ffffff"/>
<text x="28" y="36" class="label">回调返回以后，闭包到底保留了什么</text><rect x="55" y="105" width="215" height="70" rx="4" class="node"/><text x="69" y="147">局部 base = 6</text><rect x="400" y="80" width="220" height="70" rx="4" class="ok"/><text x="414" y="122">[base]：副本 6</text><rect x="400" y="195" width="220" height="70" rx="4" class="bad"/><text x="414" y="237">[&amp;base]：借用</text><path d="M275 130L390 115" class="line"/><text x="285" y="98" class="small">复制</text><path d="M395 230L280 156" class="line"/><text x="287" y="216" class="small">引用</text><text x="665" y="111" class="small">可独立返回</text><text x="665" y="138" class="small">前提：成员自足</text><text x="665" y="227" class="small">局部离开作用域</text><text x="665" y="254" class="warning">延后调用非法</text><text x="28" y="323" class="small">捕获 this 保存指针；初始化捕获 unique_ptr 可将资源所有权转入闭包。</text>
</svg>
