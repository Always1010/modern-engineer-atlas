<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">插件先关闭业务再释放库</title><desc id="desc">加载后查入口并验证版本，再创建业务句柄和调用。结束时先停止新调用，等待在途调用，使用插件close销毁业务句柄，清除借用指针，最后释放库句柄。入口或版本失败则直接释放已获得的库句柄。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#172b43}.small{font-size:16px;fill:#53667a}.node{fill:#eaf2fc;stroke:#86a9d2;stroke-width:1.4}.warm{fill:#f8f2e8;stroke:#c1a174;stroke-width:1.4}.arrow{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="920" height="420" fill="#fff"/><text x="24" y="34">库句柄的寿命必须覆盖所有依赖库代码的状态</text>
<rect x="24" y="70" width="870" height="270" rx="3" fill="#f7faff" stroke="#86a9d2" stroke-width="1.4"/><text x="41" y="100" class="small">有效库句柄：打开成功 → 最后释放引用</text>
<rect x="41" y="126" width="150" height="70" rx="3" class="node"/><text x="116" y="155" text-anchor="middle">查入口</text><text x="116" y="182" text-anchor="middle">验证版本</text>
<rect x="257" y="126" width="175" height="70" rx="3" class="node"/><text x="344" y="155" text-anchor="middle">创建业务句柄</text><text x="344" y="182" text-anchor="middle">执行调用</text>
<rect x="498" y="126" width="175" height="70" rx="3" class="warm"/><text x="585" y="155" text-anchor="middle">停止新调用</text><text x="585" y="182" text-anchor="middle">等待在途结束</text>
<rect x="732" y="126" width="145" height="70" rx="3" class="warm"/><text x="804" y="155" text-anchor="middle">业务 close</text><text x="804" y="182" text-anchor="middle">销毁库对象</text>
<path d="M195 161L251 161" class="arrow"/><path d="M435 161L492 161" class="arrow"/><path d="M677 161L727 161" class="arrow"/>
<rect x="498" y="253" width="175" height="60" rx="3" class="warm"/><text x="585" y="278" text-anchor="middle">清除借用指针</text><text x="585" y="303" text-anchor="middle" class="small">入口表／函数地址</text>
<rect x="257" y="253" width="175" height="60" rx="3" class="warm"/><text x="344" y="278" text-anchor="middle">释放库句柄</text><text x="344" y="303" text-anchor="middle" class="small">dlclose / FreeLibrary</text>
<path d="M804 200L804 282L678 282" class="arrow"/><path d="M494 282L437 282" class="arrow"/>
<path d="M116 200L116 283L251 283" class="arrow"/><text x="132" y="239" class="small">入口／版本失败</text>
<text x="24" y="378" class="small">示例为同步单线程；异步插件还要撤销回调、回收线程和依赖库的析构逻辑。</text>
<text x="24" y="406" class="small">释放装载引用后不再使用旧指针；引用计数不能证明没有在途业务调用。</text>
</svg>
