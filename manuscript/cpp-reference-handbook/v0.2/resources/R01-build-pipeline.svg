<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
<title id="title">从两个翻译单元到一个程序</title><desc id="desc">公共头进入两个源文件；各自产生目标文件，链接解析跨单元定义。详细翻译阶段见独立阶段图。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="380" fill="#ffffff"/>
<text x="28" y="36" class="label">构建的依赖路径</text><rect x="30" y="90" width="160" height="54" rx="4" class="node"/><text x="44" y="124">公共头 .hpp</text><rect x="270" y="90" width="170" height="54" rx="4" class="ok"/><text x="284" y="124">main.cpp</text><rect x="270" y="210" width="170" height="54" rx="4" class="ok"/><text x="284" y="244">twice.cpp</text><path d="M190 117L262 117" class="line"/><path d="M190 132L262 237" class="line"/><path d="M445 117L515 117" class="line"/><path d="M445 237L515 237" class="line"/><text x="457" y="92" class="small">编译</text><text x="457" y="210" class="small">编译</text><rect x="520" y="90" width="170" height="54" rx="4" class="ok"/><text x="534" y="124">main.o</text><rect x="520" y="210" width="170" height="54" rx="4" class="ok"/><text x="534" y="244">twice.o</text><path d="M695 117L755 165" class="line"/><path d="M695 237L755 190" class="line"/><rect x="760" y="150" width="125" height="58" rx="4" class="ok"/><text x="774" y="186">程序 app</text><text x="744" y="130" class="small">链接</text><text x="28" y="304" class="small">预处理后的源文件各形成一个翻译单元；普通外部定义只提供一处。</text><text x="28" y="340" class="small">头中的类、模板、inline 定义还必须满足相同定义及名字查找等 ODR 条件。</text>
</svg>
