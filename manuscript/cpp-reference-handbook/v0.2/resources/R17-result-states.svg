<svg xmlns="http://www.w3.org/2000/svg" width="920" height="485" viewBox="0 0 920 485" role="img" aria-labelledby="title desc">
<title id="title">通用结果类型的状态差异</title><desc id="desc">tuple 固定多个值；optional 为有值或空；variant 从封闭候选中选择；expected 为成功或失败；any 存开放类型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="485" fill="#ffffff"/>
<text x="28" y="36" class="label">先确定状态集合，再选择类型</text><text x="28" y="66" class="small">图中方框是语义状态，不表示大小、分配位置或实际对象布局。</text><text x="28" y="113" class="label">tuple：固定并列值</text><rect x="280" y="85" width="185" height="50" rx="4" class="ok"/><text x="292" y="117">id：int</text><rect x="480" y="85" width="255" height="50" rx="4" class="ok"/><text x="492" y="117">name：string</text><text x="28" y="188" class="label">optional&lt;T&gt;</text><rect x="280" y="160" width="200" height="50" rx="4" class="ok"/><text x="292" y="192">有值：T</text><rect x="530" y="160" width="205" height="50" rx="4" class="ok"/><text x="542" y="192">空：nullopt</text><text x="28" y="263" class="label">variant&lt;A,B&gt;</text><rect x="280" y="235" width="130" height="50" rx="4" class="ok"/><text x="292" y="267">候选 A</text><rect x="435" y="235" width="130" height="50" rx="4" class="ok"/><text x="447" y="267">候选 B</text><rect x="590" y="235" width="270" height="50" rx="4" class="bad"/><text x="602" y="267">异常时可能无值</text><text x="28" y="338" class="label">expected&lt;T,E&gt;，23</text><rect x="280" y="310" width="200" height="50" rx="4" class="ok"/><text x="292" y="342">成功：T</text><rect x="530" y="310" width="205" height="50" rx="4" class="ok"/><text x="542" y="342">失败：E</text><text x="28" y="413" class="label">any</text><rect x="280" y="385" width="200" height="50" rx="4" class="ok"/><text x="292" y="417">空</text><rect x="530" y="385" width="330" height="50" rx="4" class="ok"/><text x="542" y="417">某个可拷贝类型的值</text><text x="28" y="470" class="small">optional 的空不携带错误；any_cast 需精确匹配；expected 不以无值表示失败。</text>
</svg>
