<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">顺序容器的布局与访问路径</title><desc id="desc">array 与一般 vector 连续；deque 常见为分块；list 与 forward_list 常见为双向与单向节点。节点链访问位置需要逐步遍历。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d9e0e8" stroke-width="1"/></pattern></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.code{font-family:Consolas,"Microsoft YaHei",monospace}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#65768b;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.space{fill:url(#hatch);stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.warning{fill:#a14623}.green{fill:#18694c}</style>
<rect width="920" height="520" fill="#ffffff"/>
<text x="28" y="36" class="label">元素在哪里，怎样访问</text><text x="28" y="62" class="small">连续性是保证；分块和节点连线是常见实现示意。</text><text x="28" y="110" class="code">array / vector</text><rect x="235" y="80" width="72" height="48" rx="3" class="ok"/><text x="271" y="111" text-anchor="middle" class="code">10</text><rect x="307" y="80" width="72" height="48" rx="3" class="ok"/><text x="343" y="111" text-anchor="middle" class="code">20</text><rect x="379" y="80" width="72" height="48" rx="3" class="ok"/><text x="415" y="111" text-anchor="middle" class="code">30</text><rect x="451" y="80" width="72" height="48" rx="3" class="ok"/><text x="487" y="111" text-anchor="middle" class="code">40</text><rect x="523" y="80" width="72" height="48" rx="3" class="ok"/><text x="559" y="111" text-anchor="middle" class="code">50</text><text x="640" y="107" class="small">连续元素：可用 data()</text><text x="640" y="132" class="small">vector 还可有预留存储</text><text x="28" y="209" class="code">deque</text><rect x="235" y="160" width="66" height="42" rx="3" class="node"/><text x="268" y="188" text-anchor="middle" class="code">块 0</text><rect x="330" y="160" width="66" height="42" rx="3" class="node"/><text x="363" y="188" text-anchor="middle" class="code">块 1</text><rect x="425" y="160" width="66" height="42" rx="3" class="node"/><text x="458" y="188" text-anchor="middle" class="code">块 2</text><path d="M268 202L268 228" class="line"/><rect x="235" y="231" width="60" height="42" rx="3" class="ok"/><text x="265" y="259" text-anchor="middle" class="code">10</text><rect x="295" y="231" width="60" height="42" rx="3" class="ok"/><text x="325" y="259" text-anchor="middle" class="code">20</text><path d="M363 202L423 228" class="line"/><rect x="390" y="231" width="60" height="42" rx="3" class="ok"/><text x="420" y="259" text-anchor="middle" class="code">30</text><rect x="450" y="231" width="60" height="42" rx="3" class="ok"/><text x="480" y="259" text-anchor="middle" class="code">40</text><path d="M458 202L578 228" class="line"/><rect x="545" y="231" width="60" height="42" rx="3" class="ok"/><text x="575" y="259" text-anchor="middle" class="code">50</text><rect x="605" y="231" width="60" height="42" rx="3" class="ok"/><text x="635" y="259" text-anchor="middle" class="code">60</text><text x="730" y="216" class="small">块间不保证连续</text><text x="730" y="243" class="small">仍可随机访问</text><text x="28" y="340" class="code">list</text><rect x="235" y="310" width="95" height="48" rx="3" class="node"/><text x="282.5" y="341" text-anchor="middle" class="code">10</text><path d="M335 334L375 334" class="back"/><rect x="380" y="310" width="95" height="48" rx="3" class="node"/><text x="427.5" y="341" text-anchor="middle" class="code">20</text><path d="M480 334L520 334" class="back"/><rect x="525" y="310" width="95" height="48" rx="3" class="node"/><text x="572.5" y="341" text-anchor="middle" class="code">30</text><path d="M625 334L665 334" class="back"/><rect x="670" y="310" width="95" height="48" rx="3" class="node"/><text x="717.5" y="341" text-anchor="middle" class="code">40</text><text x="28" y="448" class="code">forward_list</text><rect x="235" y="414" width="95" height="48" rx="3" class="node"/><text x="282.5" y="445" text-anchor="middle" class="code">10</text><path d="M335 438L375 438" class="line"/><rect x="380" y="414" width="95" height="48" rx="3" class="node"/><text x="427.5" y="445" text-anchor="middle" class="code">20</text><path d="M480 438L520 438" class="line"/><rect x="525" y="414" width="95" height="48" rx="3" class="node"/><text x="572.5" y="445" text-anchor="middle" class="code">30</text><path d="M625 438L665 438" class="line"/><rect x="670" y="414" width="95" height="48" rx="3" class="node"/><text x="717.5" y="445" text-anchor="middle" class="code">40</text><text x="235" y="496" class="small">访问第 k 项：链表逐节点走；array / vector / deque 可随机访问。</text>
</svg>
