<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">重试共享绝对截止时间</title><desc id="desc">总预算100毫秒，第一次失败用去70毫秒，重试只剩30毫秒，不能重新给100毫秒。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="350" fill="#ffffff"/>
<text x="28" y="36" class="label">总预算只设一次，每次等待计算剩余量</text><text x="28" y="66" class="small">耗时与截止使用 steady_clock；唤醒和调度延迟不由预算消除。</text><path d="M140 156L853 156" class="line"/><path d="M170 123L170 190" class="rule"/><path d="M625 123L625 190" class="rule"/><path d="M820 108L820 207" class="rule"/><text x="150" y="108">开始</text><text x="562" y="108">第一次失败</text><text x="785" y="91">截止点</text><text x="146" y="232">0ms</text><text x="597" y="232">70ms</text><text x="785" y="232">100ms</text><rect x="193" y="118" width="395" height="54" rx="4" class="ok"/><text x="205" y="152">第一轮已耗时70ms</text><rect x="640" y="118" width="165" height="54" rx="4" class="ok"/><text x="652" y="152">剩余30ms</text><path d="M626 261L820 261" class="rule"/><text x="454" y="299" class="label">remaining = deadline − now</text><text x="28" y="333" class="small">第二轮继续使用同一 deadline；失败重试不重置整体计时。</text>
</svg>
