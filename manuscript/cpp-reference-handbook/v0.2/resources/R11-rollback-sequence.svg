<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">暂存修改与不抛提交</title><desc id="desc">复制旧状态到暂存，追加及注入失败均在暂存；失败清理暂存，成功 swap 提交。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="440" fill="#ffffff"/>
<text x="28" y="36" class="label">所有可失败步骤放在提交之前</text><text x="70" y="85" class="label">原 target</text><text x="380" y="85" class="label">暂存 staged</text><text x="740" y="85" class="label">调用方</text><path d="M130 104L130 400" class="guide"/><path d="M455 104L455 400" class="guide"/><path d="M800 104L800 400" class="guide"/><rect x="45" y="120" width="180" height="50" rx="4" class="ok"/><text x="59" y="152">{1, 2}</text><path d="M230 145L350 145" class="line"/><rect x="360" y="120" width="205" height="50" rx="4" class="ok"/><text x="374" y="152">复制并追加 3</text><text x="240" y="125" class="small">拷贝</text><rect x="355" y="200" width="210" height="55" rx="4" class="bad"/><text x="369" y="234.5">提交前抛异常</text><path d="M570 227L755 227" class="line"/><text x="610" y="214" class="small">展开与捕获</text><text x="55" y="240" class="small">仍是 {1, 2}</text><text x="600" y="264" class="small">暂存销毁，Active 归零</text><rect x="350" y="300" width="220" height="50" rx="4" class="ok"/><text x="364" y="332">成功：swap 提交</text><path d="M346 325L230 325" class="line"/><rect x="45" y="300" width="180" height="50" rx="4" class="ok"/><text x="59" y="332">{1, 2, 3}</text><text x="610" y="331" class="small">旧值随 staged 销毁</text><text x="28" y="423" class="small">本例使用默认分配器 vector&lt;int&gt;；外部副作用和任意分配器须另行核对。</text>
</svg>
