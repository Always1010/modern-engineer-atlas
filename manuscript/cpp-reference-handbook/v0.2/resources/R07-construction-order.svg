<svg xmlns="http://www.w3.org/2000/svg" width="920" height="395" viewBox="0 0 920 395" role="img" aria-labelledby="title desc">
<title id="title">构造与析构的逆序关系</title><desc id="desc">Base 先构造，随后成员按声明顺序构造，最后执行 Derived 构造体；销毁按相反方向。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="395" fill="#ffffff"/>
<text x="28" y="36" class="label">成员声明顺序决定初始化顺序</text><text x="28" y="80" class="label">构造 →</text><rect x="170" y="55" width="130" height="54" rx="4" class="ok"/><text x="184" y="89">Base：1</text><rect x="345" y="55" width="145" height="54" rx="4" class="ok"/><text x="359" y="89">first：2</text><rect x="535" y="55" width="145" height="54" rx="4" class="ok"/><text x="549" y="89">second：3</text><rect x="725" y="55" width="165" height="54" rx="4" class="ok"/><text x="739" y="89">构造体：4</text><path d="M304 82L337 82" class="line"/><path d="M494 82L527 82" class="line"/><path d="M684 82L717 82" class="line"/><text x="28" y="200" class="label">析构 ←</text><rect x="170" y="170" width="130" height="54" rx="4" class="ok"/><text x="184" y="204">Base：8</text><rect x="345" y="170" width="145" height="54" rx="4" class="ok"/><text x="359" y="204">first：7</text><rect x="535" y="170" width="145" height="54" rx="4" class="ok"/><text x="549" y="204">second：6</text><rect x="725" y="170" width="165" height="54" rx="4" class="ok"/><text x="739" y="204">析构体：5</text><path d="M723 197L688 197" class="line"/><path d="M531 197L498 197" class="line"/><path d="M341 197L308 197" class="line"/><path d="M808 113L808 164" class="line"/><text x="28" y="287" class="small">异常构造：只销毁已经构造完成的子对象。</text><text x="28" y="322" class="small">完整对象的构造未成功，其完整析构不会运行；成员所有者负责清理已取得资源。</text><text x="28" y="360" class="small">本图无虚基类；有虚基类时由最派生类先按规定顺序初始化。</text>
</svg>
