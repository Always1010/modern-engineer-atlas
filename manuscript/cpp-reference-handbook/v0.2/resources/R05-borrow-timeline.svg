<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title desc">
<title id="title">两类临时对象的生命周期</title><desc id="desc">直接绑定到局部引用的临时延长到作用域末尾；函数参数绑定的临时在调用完整表达式末尾结束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="370" fill="#ffffff"/>
<text x="28" y="36" class="label">先找到临时对象，再定位完整表达式</text><text x="250" y="86" class="small">创建</text><text x="485" y="86" class="small">分号 / 调用表达式末尾</text><text x="760" y="86" class="small">作用域末尾</text><path d="M245 105L865 105" class="line"/><text x="28" y="158">局部直接绑定</text><rect x="250" y="125" width="580" height="57" rx="4" class="ok"/><text x="264" y="160.5">const T&amp; r = T{}：对象仍存活</text><text x="28" y="241">函数参数绑定</text><rect x="250" y="208" width="280" height="57" rx="4" class="ok"/><text x="264" y="243.5">f(T{})：对象存活</text><rect x="540" y="208" width="290" height="57" rx="4" class="bad"/><text x="554" y="243.5">保存的引用已悬垂</text><path d="M530 113L530 290" class="guide"/><path d="M830 113L830 290" class="guide"/><text x="28" y="327" class="small">将绑定引用再次传给别处，不会再次延长临时寿命。</text><text x="28" y="354" class="small">返回引用、new 初始化器及 C++20 圆括号聚合初始化需另查例外。</text>
</svg>
