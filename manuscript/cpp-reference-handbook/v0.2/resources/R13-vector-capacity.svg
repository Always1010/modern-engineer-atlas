<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="title desc">
<title id="title">vector 的容量与已构造元素</title><desc id="desc">初始三个元素，依次 reserve、push_back、resize 增长和 resize 缩短；四步与正文代码一致，容量示意为六。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d9e0e8" stroke-width="1"/></pattern></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.code{font-family:Consolas,"Microsoft YaHei",monospace}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#65768b;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.space{fill:url(#hatch);stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.warning{fill:#a14623}.green{fill:#18694c}</style>
<rect width="920" height="490" fill="#ffffff"/>
<text x="28" y="36" class="label">reserve 管存储，resize 管元素</text><text x="28" y="65" class="small">初始 v = {10, 20, 30}；教学图假设实际 capacity 为 6。</text>
<text x="28" y="127" class="code">reserve(6)</text>
<rect x="235" y="93" width="90" height="50" rx="3" class="ok"/><text x="280" y="126" text-anchor="middle" class="code">10</text>
<rect x="325" y="93" width="90" height="50" rx="3" class="ok"/><text x="370" y="126" text-anchor="middle" class="code">20</text>
<rect x="415" y="93" width="90" height="50" rx="3" class="ok"/><text x="460" y="126" text-anchor="middle" class="code">30</text>
<rect x="505" y="93" width="90" height="50" rx="3" class="space"/><text x="550" y="126" text-anchor="middle" class="code">空位</text>
<rect x="595" y="93" width="90" height="50" rx="3" class="space"/><text x="640" y="126" text-anchor="middle" class="code">空位</text>
<rect x="685" y="93" width="90" height="50" rx="3" class="space"/><text x="730" y="126" text-anchor="middle" class="code">空位</text>
<text x="235" y="166" class="small">size = 3；新增容量没有元素</text>
<text x="28" y="218" class="code">push_back(40)</text>
<rect x="235" y="184" width="90" height="50" rx="3" class="ok"/><text x="280" y="217" text-anchor="middle" class="code">10</text>
<rect x="325" y="184" width="90" height="50" rx="3" class="ok"/><text x="370" y="217" text-anchor="middle" class="code">20</text>
<rect x="415" y="184" width="90" height="50" rx="3" class="ok"/><text x="460" y="217" text-anchor="middle" class="code">30</text>
<rect x="505" y="184" width="90" height="50" rx="3" class="ok"/><text x="550" y="217" text-anchor="middle" class="code">40</text>
<rect x="595" y="184" width="90" height="50" rx="3" class="space"/><text x="640" y="217" text-anchor="middle" class="code">空位</text>
<rect x="685" y="184" width="90" height="50" rx="3" class="space"/><text x="730" y="217" text-anchor="middle" class="code">空位</text>
<text x="235" y="257" class="small">size = 4；尾部构造 40</text>
<text x="28" y="309" class="code">resize(6, -1)</text>
<rect x="235" y="275" width="90" height="50" rx="3" class="ok"/><text x="280" y="308" text-anchor="middle" class="code">10</text>
<rect x="325" y="275" width="90" height="50" rx="3" class="ok"/><text x="370" y="308" text-anchor="middle" class="code">20</text>
<rect x="415" y="275" width="90" height="50" rx="3" class="ok"/><text x="460" y="308" text-anchor="middle" class="code">30</text>
<rect x="505" y="275" width="90" height="50" rx="3" class="ok"/><text x="550" y="308" text-anchor="middle" class="code">40</text>
<rect x="595" y="275" width="90" height="50" rx="3" class="ok"/><text x="640" y="308" text-anchor="middle" class="code">-1</text>
<rect x="685" y="275" width="90" height="50" rx="3" class="ok"/><text x="730" y="308" text-anchor="middle" class="code">-1</text>
<text x="235" y="348" class="small">size = 6；新构造两个 -1</text>
<text x="28" y="400" class="code">resize(2)</text>
<rect x="235" y="366" width="90" height="50" rx="3" class="ok"/><text x="280" y="399" text-anchor="middle" class="code">10</text>
<rect x="325" y="366" width="90" height="50" rx="3" class="ok"/><text x="370" y="399" text-anchor="middle" class="code">20</text>
<rect x="415" y="366" width="90" height="50" rx="3" class="space"/><text x="460" y="399" text-anchor="middle" class="code">空位</text>
<rect x="505" y="366" width="90" height="50" rx="3" class="space"/><text x="550" y="399" text-anchor="middle" class="code">空位</text>
<rect x="595" y="366" width="90" height="50" rx="3" class="space"/><text x="640" y="399" text-anchor="middle" class="code">空位</text>
<rect x="685" y="366" width="90" height="50" rx="3" class="space"/><text x="730" y="399" text-anchor="middle" class="code">空位</text>
<text x="235" y="439" class="small">size = 2；尾部元素销毁，容量保留</text>
<text x="28" y="474" class="small">可索引范围始终是 [0, size)；虚线槽位不可通过下标访问。</text>
</svg>
