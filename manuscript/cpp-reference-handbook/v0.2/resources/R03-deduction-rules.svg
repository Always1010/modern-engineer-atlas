<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
<title id="title">同一初值的不同类型推导</title><desc id="desc">source 是 const int 左值，按值 auto 得到 int，引用 auto 保留 const，decltype 受括号影响。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="340" fill="#ffffff"/>
<text x="28" y="36" class="label">初值相同，声明语法决定结果</text><rect x="28" y="80" width="210" height="55" rx="4" class="ok"/><text x="42" y="114.5">const int source = 4</text><path d="M242 107L298 107" class="line"/><rect x="305" y="75" width="250" height="50" rx="4" class="ok"/><text x="319" y="107">auto x = source</text><rect x="640" y="75" width="235" height="50" rx="4" class="ok"/><text x="654" y="107">int：按值副本</text><path d="M560 100L632 100" class="line"/><rect x="305" y="145" width="250" height="50" rx="4" class="ok"/><text x="319" y="177">auto&amp; x = source</text><rect x="640" y="145" width="235" height="50" rx="4" class="ok"/><text x="654" y="177">const int&amp;：借用</text><path d="M560 170L632 170" class="line"/><rect x="305" y="215" width="250" height="50" rx="4" class="ok"/><text x="319" y="247">decltype((source))</text><rect x="640" y="215" width="235" height="50" rx="4" class="ok"/><text x="654" y="247">const int&amp;：借用</text><path d="M560 240L632 240" class="line"/><path d="M270 108L270 240" class="guide"/><path d="M270 170L298 170" class="line"/><path d="M270 240L298 240" class="line"/><text x="28" y="313" class="small">decltype(source) 则取名字的声明类型 const int；decltype(auto) 沿用 decltype 规则。</text>
</svg>
