<svg xmlns="http://www.w3.org/2000/svg" width="920" height="552" viewBox="0 0 920 552" role="img" aria-labelledby="title desc">
<title id="title">性能调查分流</title><desc id="desc">固定指标负载后区分计算、等待和积压，分别收集栈与计数器、事件与协议、寿命与速率，再做同条件对照。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#172b43}.small{font-size:16px;fill:#53667a}.node{fill:#eaf2fc;stroke:#86a9d2;stroke-width:1.4}.arrow{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="920" height="552" fill="#fff"/>
<text x="24" y="34">同样的“慢”，需要不同的调查路径</text><rect x="324" y="66" width="272" height="60" rx="3" class="node"/><text x="460" y="102" text-anchor="middle">先固定负载与指标</text><path d="M460 129L460 165" class="arrow"/><rect x="24" y="170" width="270" height="85" rx="3" class="node"/><text x="159" y="206" text-anchor="middle">计算消耗</text><text x="159" y="231" text-anchor="middle">CPU 热点／有效工作</text><rect x="325" y="170" width="270" height="85" rx="3" class="node"/><text x="460" y="206" text-anchor="middle">等待时间</text><text x="460" y="231" text-anchor="middle">锁／I/O／调度</text><rect x="626" y="170" width="270" height="85" rx="3" class="node"/><text x="761" y="206" text-anchor="middle">资源积压</text><text x="761" y="231" text-anchor="middle">队列／内存／连接</text><path d="M460 145L159 145L159 166" class="arrow"/><path d="M460 145L761 145L761 166" class="arrow"/><path d="M159 258L159 295" class="arrow"/><path d="M460 258L460 295" class="arrow"/><path d="M761 258L761 295" class="arrow"/><rect x="24" y="299" width="270" height="87" rx="3" class="node"/><text x="159" y="336" text-anchor="middle">栈采样与计数器</text><text x="159" y="361" text-anchor="middle">算法／布局／忙等</text><rect x="325" y="299" width="270" height="87" rx="3" class="node"/><text x="460" y="336" text-anchor="middle">事件与线程协议</text><text x="460" y="361" text-anchor="middle">锁粒度／截止时间</text><rect x="626" y="299" width="270" height="87" rx="3" class="node"/><text x="761" y="336" text-anchor="middle">寿命与速率统计</text><text x="761" y="361" text-anchor="middle">容量上限／背压</text><path d="M159 389L159 429" class="arrow"/><path d="M460 389L460 429" class="arrow"/><path d="M761 389L761 429" class="arrow"/><rect x="24" y="432" width="872" height="60" rx="3" class="node"/><text x="460" y="468" text-anchor="middle">同条件对照：正确性、吞吐、尾延迟与峰值资源一起核对</text><text x="24" y="528" class="small">调查路径不是单因果证明；不要靠关闭校验或放大无界队列换速度。</text>
</svg>
