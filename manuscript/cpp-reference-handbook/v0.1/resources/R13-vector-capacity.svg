<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">vector 的容量与已构造元素</title><desc id="desc">reserve 后 size 不变，剩余预留存储不可通过下标访问；resize 增长会构造元素。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d9e0e8" stroke-width="1"/></pattern></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.code{font-family:Consolas,"Microsoft YaHei",monospace}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#65768b;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.space{fill:url(#hatch);stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.warning{fill:#a14623}.green{fill:#18694c}</style>
<rect width="920" height="350" fill="#ffffff"/>
<text x="28" y="36" class="label">reserve 管存储，resize 管元素</text><text x="28" y="65" class="small">初始 v = {10, 20, 30}；本图假设实际 capacity 为 6。</text><text x="28" y="115" class="code">reserve(6)</text><text x="28" y="142" class="small">size = 3</text><rect x="235" y="89" width="90" height="54" rx="3" class="ok"/><text x="280" y="123" text-anchor="middle" class="code">10</text><text x="275" y="166" class="small">0</text><rect x="325" y="89" width="90" height="54" rx="3" class="ok"/><text x="370" y="123" text-anchor="middle" class="code">20</text><text x="365" y="166" class="small">1</text><rect x="415" y="89" width="90" height="54" rx="3" class="ok"/><text x="460" y="123" text-anchor="middle" class="code">30</text><text x="455" y="166" class="small">2</text><rect x="505" y="89" width="90" height="54" rx="3" class="space"/><text x="550" y="123" text-anchor="middle" class="code">空位</text><text x="545" y="166" class="small">3</text><rect x="595" y="89" width="90" height="54" rx="3" class="space"/><text x="640" y="123" text-anchor="middle" class="code">空位</text><text x="635" y="166" class="small">4</text><rect x="685" y="89" width="90" height="54" rx="3" class="space"/><text x="730" y="123" text-anchor="middle" class="code">空位</text><text x="725" y="166" class="small">5</text><text x="235" y="196" class="warning">索引只能到 2；预留存储不等于已有元素。</text><text x="28" y="256" class="code">resize(6, -1)</text><text x="28" y="283" class="small">size = 6</text><rect x="235" y="226" width="90" height="54" rx="3" class="ok"/><text x="280" y="260" text-anchor="middle" class="code">10</text><rect x="325" y="226" width="90" height="54" rx="3" class="ok"/><text x="370" y="260" text-anchor="middle" class="code">20</text><rect x="415" y="226" width="90" height="54" rx="3" class="ok"/><text x="460" y="260" text-anchor="middle" class="code">30</text><rect x="505" y="226" width="90" height="54" rx="3" class="ok"/><text x="550" y="260" text-anchor="middle" class="code">-1</text><rect x="595" y="226" width="90" height="54" rx="3" class="ok"/><text x="640" y="260" text-anchor="middle" class="code">-1</text><rect x="685" y="226" width="90" height="54" rx="3" class="ok"/><text x="730" y="260" text-anchor="middle" class="code">-1</text><text x="235" y="322" class="small">新增三个元素；可索引范围现在是 [0, 6)。</text>
</svg>
