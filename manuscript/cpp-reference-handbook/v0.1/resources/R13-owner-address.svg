<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
<title id="title">vector 的拥有者与独立对象</title><desc id="desc">vector 扩容移动 unique_ptr 拥有者，所指对象保持地址；只有所有权持续存在时裸指针借用才有效。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d9e0e8" stroke-width="1"/></pattern></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.code{font-family:Consolas,"Microsoft YaHei",monospace}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#65768b;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.space{fill:url(#hatch);stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.warning{fill:#a14623}.green{fill:#18694c}</style>
<rect width="920" height="410" fill="#ffffff"/>
<text x="28" y="36" class="label">拥有者搬迁，不等于所指对象搬迁</text><text x="28" y="65" class="small">vector&lt;unique_ptr&lt;T&gt;&gt;：T 单独存放，saved 借用的是 T。</text><text x="28" y="112" class="label">扩容前</text><rect x="210" y="85" width="192" height="60" rx="3" class="ok"/><text x="306" y="122" text-anchor="middle" class="code">unique_ptr</text><text x="210" y="174" class="small">vector 的旧槽位</text><rect x="670" y="180" width="180" height="76" rx="3" class="node"/><text x="760" y="225" text-anchor="middle" class="code">T：42 → 43</text><text x="670" y="289" class="green">T 保持在原位置</text><path d="M408 115L662 195" class="line"/><text x="440" y="108" class="small">拥有</text><text x="28" y="247" class="label">扩容后</text><rect x="210" y="218" width="192" height="60" rx="3" class="ok"/><text x="306" y="255" text-anchor="middle" class="code">unique_ptr</text><text x="210" y="310" class="small">vector 的新槽位</text><path d="M408 248L662 231" class="line"/><text x="445" y="281" class="small">所有权转移</text><text x="505" y="341" class="code">saved 指向 T，不指向 vector 槽位</text><text x="28" y="388" class="small">旧槽位借用失效；T 在拥有者被删除、reset、替换或销毁时才失去这份保活。</text>
</svg>
