<svg xmlns="http://www.w3.org/2000/svg" width="920" height="345" viewBox="0 0 920 345" role="img" aria-labelledby="title desc">
<title id="title">值类别与身份</title><desc id="desc">lvalue 和 xvalue 有身份，合为 glvalue；xvalue 和 prvalue 可供右值绑定，合为 rvalue。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="345" fill="#ffffff"/>
<text x="28" y="36" class="label">将亡值同时属于两个分类</text><rect x="40" y="85" width="230" height="80" rx="4" class="ok"/><text x="54" y="132">lvalue：变量名</text><rect x="345" y="85" width="230" height="80" rx="4" class="ok"/><text x="359" y="132">xvalue：move(x)</text><rect x="650" y="85" width="230" height="80" rx="4" class="ok"/><text x="664" y="132">prvalue：T{}</text><rect x="90" y="235" width="360" height="58" rx="4" class="node"/><text x="104" y="271">glvalue：标识对象或函数</text><rect x="490" y="235" width="350" height="58" rx="4" class="node"/><text x="504" y="271">rvalue：右值绑定分类</text><path d="M155 171L215 229" class="line"/><path d="M460 171L365 229" class="line"/><path d="M460 171L565 229" class="line"/><path d="M765 171L710 229" class="line"/><text x="28" y="325" class="small">std::move 只产生转换后的表达式；资源是否转移取决于接下来的构造或赋值。</text>
</svg>
