<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">解析位置与完整字段校验</title><desc id="desc">解析42x得到42并留下x，整字段校验拒绝；仅无错误码不能证明输入全部被接受。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="420" fill="#ffffff"/>
<text x="28" y="36" class="label">解析成功还需检查 ptr 是否到达 last</text><text x="28" y="68" class="small">接口接受 [first,last)；不需要零结尾，不自动跳过前导空白。</text><text x="28" y="125">输入 "42x"</text><rect x="280" y="95" width="100" height="48" rx="4" class="ok"/><text x="292" y="126">4</text><rect x="380" y="95" width="100" height="48" rx="4" class="ok"/><text x="392" y="126">2</text><rect x="480" y="95" width="100" height="48" rx="4" class="bad"/><text x="492" y="126">x</text><path d="M280 189L280 149" class="line"/><text x="253" y="215">first</text><path d="M480 189L480 149" class="line"/><text x="466" y="215">ptr</text><path d="M580 189L580 149" class="line"/><text x="568" y="215">last</text><rect x="650" y="95" width="220" height="68" rx="4" class="ok"/><text x="662" y="136">候选值 =42</text><text x="650" y="189" class="small">ec 为空，但 ptr ≠ last</text><path d="M490 238L490 264" class="line"/><rect x="280" y="274" width="410" height="55" rx="4" class="bad"/><text x="292" y="308.5">整字段策略：拒绝，不提交 candidate</text><text x="28" y="365" class="label">无匹配：invalid_argument；范围超限：result_out_of_range</text><text x="28" y="399" class="small">to_chars 成功后按 ptr 构造结果；它不写零结尾。缓冲不足时不可消费输出。</text>
</svg>
