<svg xmlns="http://www.w3.org/2000/svg" width="920" height="465" viewBox="0 0 920 465" role="img" aria-labelledby="title desc">
<title id="title">故障证据分流</title><desc id="desc">编译检查命令与首条诊断，链接检查符号与依赖，运行异常检查现场与生命周期；最后核对触发条件并回归。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#172b43}.small{font-size:16px;fill:#53667a}.node{fill:#eaf2fc;stroke:#86a9d2;stroke-width:1.4}.arrow{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="920" height="465" fill="#fff"/>
<text x="24" y="34">先看失败阶段，再决定证据与检查入口</text><rect x="24" y="75" width="270" height="58" rx="3" class="node"/><text x="159" y="110" text-anchor="middle">编译报错</text><path d="M159 136L159 171" class="arrow"/><rect x="325" y="75" width="270" height="58" rx="3" class="node"/><text x="460" y="110" text-anchor="middle">链接失败</text><path d="M460 136L460 171" class="arrow"/><rect x="626" y="75" width="270" height="58" rx="3" class="node"/><text x="761" y="110" text-anchor="middle">运行异常</text><path d="M761 136L761 171" class="arrow"/><rect x="24" y="175" width="270" height="100" rx="3" class="node"/><text x="159" y="206" text-anchor="middle">实际编译命令</text><text x="159" y="231" text-anchor="middle">首条诊断</text><text x="159" y="256" text-anchor="middle">实例化与声明</text><rect x="325" y="175" width="270" height="100" rx="3" class="node"/><text x="460" y="206" text-anchor="middle">符号与链接命令</text><text x="460" y="231" text-anchor="middle">定义和依赖</text><text x="460" y="256" text-anchor="middle">签名与架构</text><rect x="626" y="175" width="270" height="100" rx="3" class="node"/><text x="761" y="206" text-anchor="middle">匹配二进制与符号</text><text x="761" y="231" text-anchor="middle">调用栈／多线程栈</text><text x="761" y="256" text-anchor="middle">输入与对象寿命</text><path d="M159 278L159 322" class="arrow"/><path d="M460 278L460 322" class="arrow"/><path d="M761 278L761 322" class="arrow"/><rect x="24" y="325" width="872" height="78" rx="3" class="node"/><text x="460" y="357.5" text-anchor="middle">最小复现仍保留触发条件</text><text x="460" y="382.5" text-anchor="middle">确认规则边界 → 修复 → 失败路径与回归</text><text x="24" y="440" class="small">没有复现不等于正确；dump 与日志可能包含敏感内容。</text>
</svg>
