<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
<title id="title">move 转换与 unique_ptr 所有权转移</title><desc id="desc">move 给出右值表达式，移动构造将独占所有权转交 next；源 unique_ptr 仍存活但为空。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="390" fill="#ffffff"/>
<text x="28" y="36" class="label">转换表达式与转移资源是两个事件</text><text x="28" y="87">构造前</text><rect x="180" y="55" width="220" height="60" rx="4" class="ok"/><text x="194" y="92">owner：拥有 int</text><rect x="675" y="140" width="190" height="70" rx="4" class="node"/><text x="689" y="182">int：42</text><path d="M405 85L665 155" class="line"/><text x="435" y="75" class="small">独占拥有</text><text x="28" y="265">构造后</text><rect x="180" y="230" width="220" height="60" rx="4" class="ok"/><text x="194" y="267">owner：空</text><rect x="430" y="230" width="200" height="60" rx="4" class="ok"/><text x="444" y="267">next：拥有 int</text><path d="M632 255L665 193" class="line"/><path d="M290 121L290 223" class="line"/><text x="320" y="170" class="small">move → 选择移动构造</text><text x="28" y="345" class="small">源对象仍会析构；所指 int 未搬迁，其存活由 next 的所有权维持。</text><text x="28" y="375" class="small">其他类型的移动后状态必须查各自契约，不能套用“源一定为空”。</text>
</svg>
