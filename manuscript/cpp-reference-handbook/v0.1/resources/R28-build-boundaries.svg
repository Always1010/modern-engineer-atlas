<svg xmlns="http://www.w3.org/2000/svg" width="920" height="435" viewBox="0 0 920 435" role="img" aria-labelledby="title desc">
<title id="title">编译链接与装载边界</title><desc id="desc">两个翻译单元生成目标文件，静态库提供定义，最终链接形成程序；运行时加载器还需加载动态依赖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#172b43}.small{font-size:16px;fill:#53667a}.node{fill:#eaf2fc;stroke:#86a9d2;stroke-width:1.4}.arrow{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="920" height="435" fill="#fff"/>
<text x="24" y="34">源文件到运行进程：不同阶段有不同的失败条件</text><rect x="24" y="80" width="170" height="65" rx="3" class="node"/><text x="109" y="106" text-anchor="middle">metric.cpp</text><text x="109" y="131" text-anchor="middle">包含声明</text><rect x="24" y="205" width="170" height="65" rx="3" class="node"/><text x="109" y="231" text-anchor="middle">main.cpp</text><text x="109" y="256" text-anchor="middle">调用声明</text><path d="M197 112L257 112" class="arrow"/><path d="M197 237L257 237" class="arrow"/><rect x="260" y="80" width="170" height="65" rx="3" class="node"/><text x="345" y="106" text-anchor="middle">metric.o</text><text x="345" y="131" text-anchor="middle">提供定义</text><rect x="260" y="205" width="170" height="65" rx="3" class="node"/><text x="345" y="231" text-anchor="middle">main.o</text><text x="345" y="256" text-anchor="middle">引用符号</text><path d="M432 112L502 112" class="arrow"/><rect x="505" y="80" width="170" height="65" rx="3" class="node"/><text x="590" y="106" text-anchor="middle">静态库归档</text><text x="590" y="131" text-anchor="middle">metric.a</text><path d="M676 112L720 112L720 208" class="arrow"/><path d="M432 237L502 237" class="arrow"/><rect x="505" y="205" width="310" height="65" rx="3" class="node"/><text x="660" y="231" text-anchor="middle">最终链接</text><text x="660" y="256" text-anchor="middle">解析符号 → 可执行程序</text><rect x="505" y="340" width="310" height="65" rx="3" class="node"/><text x="660" y="366" text-anchor="middle">运行时加载器</text><text x="660" y="391" text-anchor="middle">加载动态依赖 → 进程</text><path d="M660 271L660 336" class="arrow"/><text x="24" y="330" class="small">编译：类型与声明</text><text x="24" y="360" class="small">链接：定义与依赖</text><text x="24" y="390" class="small">装载：库版本与搜索</text>
</svg>
