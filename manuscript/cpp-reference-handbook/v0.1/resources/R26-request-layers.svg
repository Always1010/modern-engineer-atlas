<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
<title id="title">首次HTTPS请求分层时序</title><desc id="desc">客户端向解析器解析名字，与服务端建立TCP再协商TLS，最后传输HTTP；不同阶段失败需要不同证据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.box{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.life{stroke:#b6c2cf;stroke-width:2;stroke-dasharray:5 5}.read{stroke:#6c98d2;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
<rect width="920" height="560" fill="#fff"/>
<text x="28" y="36" class="label">无缓存、无复用：TCP + TLS 1.3 请求示意</text>
<text x="110" y="82">客户端</text><text x="405" y="82">解析器</text><text x="720" y="82">服务端</text>
<path d="M150 105V495M450 105V495M770 105V495" class="life"/>
<path d="M150 130H450" class="line"/><path d="M450 170H150" class="line"/><text x="245" y="120">DNS 查询</text><text x="230" y="197" class="small">候选地址，可能多个</text>
<path d="M150 230H770" class="line"/><path d="M770 265H150" class="line"/><path d="M150 300H770" class="line"/><text x="450" y="218">SYN</text><text x="430" y="254">SYN-ACK</text><text x="450" y="289">ACK</text>
<rect x="385" y="324" width="340" height="40" rx="4" class="box"/><text x="555" y="351" text-anchor="middle">TLS 协商密钥、验证身份、ALPN</text>
<path d="M150 341H375" class="line"/><path d="M770 365H150" class="line"/><text x="380" y="393" class="small">握手细节省略；失败未进入 HTTP 请求</text>
<path d="M150 430H770" class="line"/><path d="M770 468H150" class="line"/><text x="405" y="418">HTTP 请求</text><text x="405" y="456">HTTP 响应</text>
<text x="28" y="533" class="small">图不规定固定 RTT；TLS 消息可合并，连接可复用；HTTP/3 使用 QUIC，流程不同。</text>
</svg>
