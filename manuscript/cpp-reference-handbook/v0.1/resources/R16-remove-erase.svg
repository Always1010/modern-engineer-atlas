<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
<title id="title">remove 和 erase 的两步效果</title><desc id="desc">remove 压紧保留值但长度不变，erase 销毁逻辑尾部并改变长度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="400" fill="#ffffff"/>
<text x="28" y="36" class="label">先压紧值，再结束尾部对象的生命周期</text><text x="28" y="68" class="small">remove_if 移除偶数；尾部对象仍存在，但值不作为过滤结果。</text><text x="28" y="124">初始 size=5</text><rect x="280" y="92" width="95" height="48" rx="4" class="ok"/><text x="292" y="123">1</text><rect x="375" y="92" width="95" height="48" rx="4" class="ok"/><text x="387" y="123">2</text><rect x="470" y="92" width="95" height="48" rx="4" class="ok"/><text x="482" y="123">3</text><rect x="565" y="92" width="95" height="48" rx="4" class="ok"/><text x="577" y="123">4</text><rect x="660" y="92" width="95" height="48" rx="4" class="ok"/><text x="672" y="123">5</text><text x="28" y="228">remove 后 size=5</text><rect x="280" y="196" width="95" height="48" rx="4" class="ok"/><text x="292" y="227">1</text><rect x="375" y="196" width="95" height="48" rx="4" class="ok"/><text x="387" y="227">3</text><rect x="470" y="196" width="95" height="48" rx="4" class="ok"/><text x="482" y="227">5</text><rect x="565" y="196" width="95" height="48" rx="4" class="dim"/><text x="577" y="227">未知</text><rect x="660" y="196" width="95" height="48" rx="4" class="dim"/><text x="672" y="227">未知</text><path d="M517 145L427 189" class="line"/><path d="M705 145L515 189" class="line"/><path d="M565 282L565 250" class="line"/><text x="586" y="284" class="small">返回 new_end</text><text x="28" y="345">erase 后 size=3</text><rect x="280" y="314" width="95" height="48" rx="4" class="ok"/><text x="292" y="345">1</text><rect x="375" y="314" width="95" height="48" rx="4" class="ok"/><text x="387" y="345">3</text><rect x="470" y="314" width="95" height="48" rx="4" class="ok"/><text x="482" y="345">5</text><text x="604" y="345" class="small">尾部被销毁</text><text x="28" y="386" class="small">值搬移可能改变地址所代表的业务对象；erase 的借用失效按容器规则检查。</text>
</svg>
