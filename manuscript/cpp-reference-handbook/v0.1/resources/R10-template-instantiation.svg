<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
<title id="title">模板诊断与实例化</title><desc id="desc">定义阶段检查可确定的规则，调用点推导并形成具体参数，再实例化所需定义；constexpr 分支按参数选择。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="390" fill="#ffffff"/>
<text x="28" y="36" class="label">从一族代码到一个具体实例</text><rect x="30" y="85" width="220" height="65" rx="4" class="ok"/><text x="44" y="124.5">模板定义</text><rect x="335" y="85" width="220" height="65" rx="4" class="ok"/><text x="349" y="124.5">调用与推导</text><rect x="640" y="85" width="240" height="65" rx="4" class="ok"/><text x="654" y="124.5">所需定义实例化</text><path d="M255 117L327 117" class="line"/><path d="M560 117L632 117" class="line"/><text x="30" y="187" class="small">非依赖名字与语法</text><text x="335" y="187" class="small">实际 T、重载、约束</text><text x="640" y="187" class="small">依赖操作是否合法</text><path d="M762 154L762 216" class="line"/><rect x="520" y="225" width="200" height="60" rx="4" class="ok"/><text x="534" y="262">if constexpr</text><path d="M759 233L725 250" class="line"/><path d="M615 290L435 320" class="line"/><path d="M650 290L758 320" class="line"/><rect x="260" y="320" width="200" height="45" rx="4" class="ok"/><text x="274" y="349.5">整数：返回 1</text><rect x="680" y="320" width="200" height="45" rx="4" class="ok"/><text x="694" y="349.5">其他：size()</text><text x="30" y="287" class="small">未使用成员不必都实例化；</text><text x="30" y="314" class="small">丢弃分支仍必须可解析。</text>
</svg>
