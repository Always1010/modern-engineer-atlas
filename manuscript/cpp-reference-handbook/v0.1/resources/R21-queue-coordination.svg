<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="title desc">
<title id="title">有界队列的等待条件与关闭</title><desc id="desc">队列空时消费者等待非空或关闭，队列满时生产者等待未满或关闭；关闭通知两类等待者。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.box{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.life{stroke:#b6c2cf;stroke-width:2;stroke-dasharray:5 5}.read{stroke:#6c98d2;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
<rect width="920" height="490" fill="#fff"/>
<text x="28" y="36" class="label">状态决定能否继续；通知促使重查状态</text>
<rect x="330" y="85" width="260" height="270" rx="8" class="box"/><text x="460" y="120" text-anchor="middle">同一 mutex 保护</text>
<rect x="360" y="150" width="90" height="56" rx="4" class="box"/><text x="405" y="185" text-anchor="middle">项 1</text><rect x="470" y="150" width="90" height="56" rx="4" class="box"/><text x="515" y="185" text-anchor="middle">项 2</text>
<text x="460" y="246" text-anchor="middle">size ≤ capacity</text><text x="460" y="283" text-anchor="middle">closed 状态</text><text x="460" y="323" text-anchor="middle" class="small">修改完再解锁与通知</text>
<text x="35" y="130">生产者 push</text><text x="35" y="165" class="small">等：未满或 closed</text><path d="M180 190H330" class="line"/><text x="35" y="239" class="small">关闭后拒绝新项</text>
<text x="650" y="130">消费者 pop</text><text x="650" y="165" class="small">等：非空或 closed</text><path d="M590 190H740" class="line"/><text x="650" y="239" class="small">关闭后排空已有项</text>
<path d="M350 355Q210 390 125 320" class="line"/><path d="M570 355Q710 390 785 320" class="line"/>
<text x="340" y="414">close：两侧 notify_all</text>
<text x="28" y="465" class="small">wait 原子释放锁并阻塞，醒来重新持锁检查谓词；notify 不保存“令牌”，不保证公平。</text>
</svg>
