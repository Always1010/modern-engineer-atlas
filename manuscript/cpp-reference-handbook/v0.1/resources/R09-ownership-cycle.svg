<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
<title id="title">循环强所有权与弱反向边</title><desc id="desc">A 和 B 互相以强所有权持有会形成环；把 B 到 A 的反向边设为 weak_ptr 可打破强环。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="300" fill="#ffffff"/>
<text x="28" y="36" class="label">外部所有者离开后，强环仍互相保活</text><rect x="100" y="95" width="165" height="65" rx="4" class="ok"/><text x="114" y="134.5">对象 A</text><rect x="480" y="95" width="165" height="65" rx="4" class="ok"/><text x="494" y="134.5">对象 B</text><path d="M273 115L472 115" class="line"/><path d="M472 147L273 147" class="line"/><text x="320" y="97" class="small">shared_ptr</text><text x="320" y="184" class="warning">shared_ptr：强环</text><text x="28" y="240" class="small">改为 B → A 的 weak_ptr：A 不由反向边保活；访问前 lock，并处理失败。</text><text x="28" y="273" class="small">弱边只改变所有权关系，不自动同步对象数据。</text>
</svg>
