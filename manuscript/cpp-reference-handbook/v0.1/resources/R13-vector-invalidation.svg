<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455" role="img" aria-labelledby="title desc">
<title id="title">vector 插入与重分配的失效范围</title><desc id="desc">不重分配的中间插入保留插入点之前的借用，使该点及之后的借用和旧 end 失效；重分配使全部借用失效。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d9e0e8" stroke-width="1"/></pattern></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.code{font-family:Consolas,"Microsoft YaHei",monospace}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.back{stroke:#65768b;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.space{fill:url(#hatch);stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.warning{fill:#a14623}.green{fill:#18694c}</style>
<rect width="920" height="455" fill="#ffffff"/>
<text x="28" y="36" class="label">没有扩容，也可能失效</text><text x="28" y="66" class="small">在下标 1 插入 99，假设 capacity 足够。</text><text x="28" y="120" class="label">修改前</text><rect x="235" y="88" width="110" height="52" rx="3" class="ok"/><text x="290" y="121" text-anchor="middle" class="code">10</text><rect x="345" y="88" width="110" height="52" rx="3" class="bad"/><text x="400" y="121" text-anchor="middle" class="code">20</text><rect x="455" y="88" width="110" height="52" rx="3" class="bad"/><text x="510" y="121" text-anchor="middle" class="code">30</text><text x="586" y="122" class="warning">旧 end</text><text x="235" y="170" class="green">借用 10 保留</text><text x="393" y="170" class="warning">旧借用 20、30 与旧 end 失效</text><path d="M260 190L260 234" class="line"/><path d="M397 190L475 234" class="line"/><path d="M507 190L585 234" class="line"/><text x="28" y="271" class="label">修改后</text><rect x="235" y="239" width="110" height="52" rx="3" class="ok"/><text x="290" y="272" text-anchor="middle" class="code">10</text><rect x="345" y="239" width="110" height="52" rx="3" class="bad"/><text x="400" y="272" text-anchor="middle" class="code">99</text><rect x="455" y="239" width="110" height="52" rx="3" class="bad"/><text x="510" y="272" text-anchor="middle" class="code">20</text><rect x="565" y="239" width="110" height="52" rx="3" class="bad"/><text x="620" y="272" text-anchor="middle" class="code">30</text><text x="715" y="272" class="small">新 end</text><text x="235" y="333" class="small">箭头表示值的迁移，不表示旧借用可以继续使用。</text><line x1="28" y1="361" x2="888" y2="361" stroke="#d4dfe9"/><text x="28" y="401" class="label">一旦重分配</text><text x="235" y="401" class="warning">原存储内全部元素借用与旧 end 都失效。</text><text x="235" y="432" class="small">应从容器重新取得迭代器、指针或引用。</text>
</svg>
