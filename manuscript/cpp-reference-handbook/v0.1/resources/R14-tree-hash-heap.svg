<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">有序树、哈希桶与堆</title><desc id="desc">树按键有序，哈希只要求等价键进入同哈希关系；堆仅保持父子优先关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="500" fill="#ffffff"/>
<text x="28" y="36" class="label">三种关系决定查找与取值方式</text><text x="28" y="65" class="small">树与链式桶为常见实现；堆不是完整排序。</text><text x="40" y="110" class="label">有序键：左小，右大</text><rect x="110" y="139" width="75" height="48" rx="4" class="ok"/><text x="122" y="170">4</text><rect x="45" y="230" width="75" height="48" rx="4" class="ok"/><text x="57" y="261">2</text><rect x="200" y="230" width="75" height="48" rx="4" class="ok"/><text x="212" y="261">7</text><path d="M130 189L84 223" class="line"/><path d="M163 189L234 223" class="line"/><text x="40" y="327" class="small">查找沿键关系选择分支</text><text x="40" y="355" class="small">O(log n) 由容器保证</text><path d="M307 90L307 445" class="rule"/><text x="340" y="110" class="label">哈希：键 → 桶</text><rect x="350" y="145" width="64" height="42" rx="4" class="ok"/><text x="362" y="173">0</text><rect x="350" y="208" width="64" height="42" rx="4" class="ok"/><text x="362" y="236">1</text><rect x="350" y="271" width="64" height="42" rx="4" class="ok"/><text x="362" y="299">2</text><rect x="462" y="145" width="85" height="42" rx="4" class="ok"/><text x="474" y="173">k=4</text><rect x="462" y="271" width="85" height="42" rx="4" class="ok"/><text x="474" y="299">k=2</text><rect x="560" y="271" width="50" height="42" rx="4" class="ok"/><text x="572" y="299">8</text><path d="M419 166L455 166" class="line"/><path d="M419 292L455 292" class="line"/><path d="M551 292L555 292" class="line"/><text x="340" y="350" class="small">不同键允许哈希碰撞</text><text x="340" y="378" class="small">rehash 改桶与迭代路径</text><text x="340" y="406" class="small">元素引用可继续有效</text><path d="M638 90L638 445" class="rule"/><text x="671" y="110" class="label">最大堆：父 ≥ 子</text><rect x="740" y="139" width="64" height="48" rx="4" class="ok"/><text x="752" y="170">9</text><rect x="676" y="230" width="64" height="48" rx="4" class="ok"/><text x="688" y="261">4</text><rect x="822" y="230" width="64" height="48" rx="4" class="ok"/><text x="834" y="261">7</text><path d="M756 189L711 223" class="line"/><path d="M791 189L851 223" class="line"/><text x="671" y="327" class="small">4 与 7 不要求互相排序</text><text x="671" y="355" class="small">top 为9；pop 后重新调整</text><text x="28" y="477" class="small">排序关系与哈希等价必须稳定；改变外部比较配置可能破坏容器契约。</text>
</svg>
