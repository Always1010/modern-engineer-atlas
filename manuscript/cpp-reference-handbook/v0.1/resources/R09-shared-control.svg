<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455" role="img" aria-labelledby="title desc">
<title id="title">shared_ptr 与 weak_ptr 的控制关系</title><desc id="desc">强所有者维持对象存活，弱观察者只维持观察状态；最后一个强所有者释放后对象销毁。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.node{fill:#f0f5fa;stroke:#94a8bd;stroke-width:1.4}.space{fill:#fafcfe;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{fill:none;stroke:#65768b;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.warning{fill:#a14623}</style>
<rect width="920" height="455" fill="#ffffff"/>
<text x="28" y="36" class="label">对象寿命与控制状态寿命分开</text><rect x="30" y="85" width="200" height="60" rx="4" class="ok"/><text x="44" y="122">shared_ptr A</text><rect x="30" y="175" width="200" height="60" rx="4" class="ok"/><text x="44" y="212">shared_ptr B</text><rect x="335" y="120" width="230" height="70" rx="4" class="node"/><text x="349" y="162">控制状态</text><rect x="685" y="125" width="180" height="60" rx="4" class="ok"/><text x="699" y="162">对象 T</text><rect x="335" y="245" width="230" height="55" rx="4" class="ok"/><text x="349" y="279.5">weak_ptr</text><path d="M234 115L327 144" class="line"/><path d="M234 205L327 170" class="line"/><path d="M570 155L677 155" class="line"/><text x="265" y="96" class="small">强所有权</text><path d="M450 241L450 198" class="line"/><text x="577" y="277" class="small">观察，不保活 T</text><text x="28" y="347">最后强所有者释放</text><rect x="335" y="320" width="230" height="55" rx="4" class="space"/><text x="349" y="354.5">控制状态仍可在</text><rect x="685" y="320" width="180" height="55" rx="4" class="bad"/><text x="699" y="354.5">T 已销毁</text><text x="28" y="423" class="small">weak_ptr::lock 成功才取得临时强所有权；控制状态的物理布局和分配数量未规定。</text>
</svg>
