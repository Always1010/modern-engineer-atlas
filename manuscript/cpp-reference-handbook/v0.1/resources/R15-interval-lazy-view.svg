<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="title desc">
<title id="title">半开区间与惰性管线</title><desc id="desc">半开区间包含首位置不包含尾位置；filter 和 transform 遍历时读取仍然存在的基底。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="490" fill="#ffffff"/>
<text x="28" y="36" class="label">位置范围与计算发生时机</text><text x="28" y="68" class="small">[first, last)：last 可以比较，不能当区间内元素解引用。</text><rect x="220" y="104" width="115" height="48" rx="4" class="ok"/><text x="232" y="135">10</text><rect x="335" y="104" width="115" height="48" rx="4" class="ok"/><text x="347" y="135">20</text><rect x="450" y="104" width="115" height="48" rx="4" class="ok"/><text x="462" y="135">30</text><rect x="565" y="104" width="115" height="48" rx="4" class="ok"/><text x="577" y="135">40</text><path d="M240 200L240 159" class="line"/><text x="220" y="229">first</text><path d="M680 200L680 159" class="line"/><text x="653" y="229">last</text><path d="M240 187L680 187" class="rule"/><text x="28" y="138" class="label">半开区间</text><text x="727" y="133" class="small">尾后位置</text><path d="M28 253L888 253" class="rule"/><text x="28" y="292" class="label">基底 values</text><rect x="220" y="267" width="96" height="48" rx="4" class="ok"/><text x="232" y="298">1</text><rect x="316" y="267" width="96" height="48" rx="4" class="ok"/><text x="328" y="298">2</text><rect x="412" y="267" width="96" height="48" rx="4" class="ok"/><text x="424" y="298">3</text><rect x="508" y="267" width="96" height="48" rx="4" class="ok"/><text x="520" y="298">4</text><rect x="604" y="267" width="96" height="48" rx="4" class="ok"/><text x="616" y="298">5</text><rect x="220" y="342" width="270" height="52" rx="4" class="ok"/><text x="232" y="375">filter：只选偶数</text><rect x="550" y="342" width="300" height="52" rx="4" class="ok"/><text x="562" y="375">transform：值 ×10</text><path d="M712 316L712 328L352 328L352 336" class="line"/><path d="M496 368L544 368" class="line"/><text x="220" y="427" class="label">遍历产生：20，40；没有创建结果 vector</text><text x="28" y="468" class="small">保活链：基底所有者 → 基底元素 → 管线闭包和迭代器；三处都需检查。</text>
</svg>
