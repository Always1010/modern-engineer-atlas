<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">string 与视图的拥有和借用</title><desc id="desc">string 拥有五个字符，all 和 tail 仅指向各自区间；保存为 string 后拥有独立副本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65768b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b43;font-size:19px}.small{font-size:16px;fill:#4b6077}.label{font-weight:600}.ok{fill:#eaf2fc;stroke:#6c98d2;stroke-width:1.4}.dim{fill:#f0f5fa;stroke:#aab7c6;stroke-width:1.4;stroke-dasharray:5 4}.bad{fill:#fff1e9;stroke:#bf784e;stroke-width:1.4}.line{stroke:#65768b;stroke-width:2;fill:none;marker-end:url(#arrow)}.rule{stroke:#aab7c6;stroke-width:1.4;fill:none}.dash{stroke:#65768b;stroke-width:1.4;stroke-dasharray:6 4;fill:none}</style>
<rect width="920" height="420" fill="#ffffff"/>
<text x="28" y="36" class="label">字符由 string 拥有，视图只保存位置与长度</text><text x="28" y="65" class="small">例子含内嵌零；视图无零结尾保证，所有者修改后应重新建立借用。</text><rect x="28" y="96" width="230" height="68" rx="4" class="ok"/><text x="40" y="137">owner：string，size=5</text><path d="M264 130L330 130" class="line"/><rect x="340" y="106" width="70" height="48" rx="4" class="ok"/><text x="352" y="137">a</text><rect x="410" y="106" width="70" height="48" rx="4" class="ok"/><text x="422" y="137">b</text><rect x="480" y="106" width="70" height="48" rx="4" class="ok"/><text x="492" y="137">\0</text><rect x="550" y="106" width="70" height="48" rx="4" class="ok"/><text x="562" y="137">c</text><rect x="620" y="106" width="70" height="48" rx="4" class="ok"/><text x="632" y="137">d</text><rect x="690" y="106" width="70" height="48" rx="4" class="dim"/><text x="702" y="137">\0</text><text x="772" y="138" class="small">额外结尾零</text><path d="M340 194L340 168" class="line"/><path d="M690 194L690 168" class="line"/><path d="M340 195L690 195" class="rule"/><rect x="28" y="211" width="260" height="58" rx="4" class="ok"/><text x="40" y="247">all：指针 + 长度5</text><path d="M294 238L330 147" class="line"/><path d="M550 277L550 168" class="line"/><path d="M690 277L690 168" class="line"/><path d="M550 278L690 278" class="rule"/><rect x="340" y="304" width="310" height="58" rx="4" class="ok"/><text x="352" y="340">tail：指针 + 长度2，内容 cd</text><rect x="28" y="304" width="260" height="58" rx="4" class="ok"/><text x="40" y="340">saved：独立 string</text><text x="28" y="397" class="small">复制视图生成 saved 后，saved 的寿命不再依赖 owner。</text>
</svg>
