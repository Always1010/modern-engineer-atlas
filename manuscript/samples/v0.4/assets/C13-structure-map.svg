<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="705" viewBox="0 0 1000 705" role="img" aria-labelledby="title desc"><title id="title">C13-A 容器 存储与元素的关系</title><desc id="desc">vector 管理连续存储与元素生命。data 提供已有元素区起点，size 为已有元素数，capacity 为当前存储可容纳数量。借用者访问元素但不接管所有权。追加时有余量则在原存储构造，已满则取得新存储，构造元素并清理旧存储。本图为概念结构和成功路径，不是具体内存布局。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#303a43"/></marker></defs><rect width="1000" height="705" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="30" y="40" font-size="27" font-weight="bold">C13-A  容器 存储与元素的关系</text><text x="30" y="79" font-size="22">接口描述可观察关系；下图不表示标准规定的内部字段。</text><rect x="30" y="114" width="360" height="110" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="210" y="149" font-size="25" text-anchor="middle" font-weight="bold">vector 容器对象</text><text x="210" y="188" font-size="23" text-anchor="middle">管理存储与元素生命</text><rect x="585" y="114" width="380" height="110" fill="white" stroke="#47515b" stroke-width="2"/><text x="775" y="149" font-size="24" text-anchor="middle" font-weight="bold">使用这些元素的代码</text><text x="775" y="188" font-size="22" text-anchor="middle">可以借用  不接管所有权</text><path d="M210 226V282H250V329" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="269" font-size="22">管理</text><path d="M775 226V280H535V329" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="780" y="268" font-size="22">访问</text><text x="30" y="318" font-size="22">data() 给出起点</text><path d="M225 310H252V332" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="335" width="110" height="77" fill="#dfeaf2" stroke="#47515b" stroke-width="2"/><text x="315" y="382" font-size="24" text-anchor="middle">18</text><rect x="370" y="335" width="110" height="77" fill="#dfeaf2" stroke="#47515b" stroke-width="2"/><text x="425" y="382" font-size="24" text-anchor="middle">21</text><rect x="480" y="335" width="110" height="77" fill="#dfeaf2" stroke="#47515b" stroke-width="2"/><text x="535" y="382" font-size="24" text-anchor="middle">24</text><rect x="590" y="335" width="110" height="77" fill="#fff" stroke="#47515b" stroke-width="2"/><text x="645" y="382" font-size="24" text-anchor="middle">预留</text><rect x="700" y="335" width="110" height="77" fill="#fff" stroke="#47515b" stroke-width="2"/><text x="755" y="382" font-size="24" text-anchor="middle">预留</text><rect x="810" y="335" width="110" height="77" fill="#fff" stroke="#47515b" stroke-width="2"/><text x="865" y="382" font-size="24" text-anchor="middle">预留</text><text x="30" y="373" font-size="24">连续存储</text><text x="260" y="447" font-size="23">size() = 3  已有元素</text><text x="590" y="447" font-size="23">尚未创建元素</text><text x="260" y="487" font-size="23">capacity() = 6  无需重新分配可容纳的数量</text><text x="30" y="541" font-size="23" font-weight="bold">一次尾部追加的两条成功路径</text><text x="30" y="582" font-size="23">容量有余</text><path d="M155 574H224" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="582" font-size="23">原存储创建新元素</text><path d="M478 574H555" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="582" font-size="23">size 增加 1  原有元素位置不变</text><text x="30" y="625" font-size="23">容量已满</text><path d="M155 617H224" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="625" font-size="23">新存储构造所需元素</text><path d="M500 617H555" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="625" font-size="23">清理旧存储  重新取得借用</text><text x="30" y="675" font-size="22">预留空间不能按元素访问；容量数值只是示意。异常路径见正文第 4 节。</text></g></svg>