<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="802" viewBox="0 0 1000 802" role="img" aria-labelledby="title desc"><title id="title">C55-B 任务生命周期与反馈循环</title><desc id="desc">任务接收目标并建立状态，循环准备信息、取得模型建议、控制器检查、执行工具和记录结果。证据足够时完成并交付；条件不足时等待，仅此分支在条件补齐后重新核对并继续；停止条件使后续动作结束。结束本地循环不等于撤销外部影响。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#303a43"/></marker></defs><rect width="1000" height="802" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="30" y="40" font-size="27" font-weight="bold">C55-B  任务生命周期与反馈循环</text><text x="30" y="79" font-size="22">等待与结束都有条件；新观察决定下一步是否继续。</text><rect x="270" y="110" width="460" height="60" fill="white" stroke="#47515b" stroke-width="2"/><text x="500" y="148" font-size="23" text-anchor="middle">接收目标  确定范围  建立状态</text><path d="M500 172V208" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="214" width="360" height="60" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="500" y="252" font-size="24" text-anchor="middle">准备当前信息</text><path d="M500 276V311" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="317" width="360" height="60" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="500" y="355" font-size="24" text-anchor="middle">模型提出下一步</text><path d="M500 379V414" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="420" width="360" height="86" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="500" y="453" font-size="24" text-anchor="middle" font-weight="bold">控制器判断</text><text x="500" y="485" font-size="22" text-anchor="middle">核对条件并选择出口</text><path d="M500 508V548" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="554" width="360" height="86" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="500" y="588" font-size="23" text-anchor="middle">通过检查后执行工具</text><text x="500" y="619" font-size="22" text-anchor="middle">记录结果与进度</text><path d="M320 597H225V245H313" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="405" font-size="22">新观察反馈</text><text x="42" y="437" font-size="22">进入下一轮</text><path d="M681 445H713V350H743" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><path d="M681 463H743" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><path d="M681 485H713V583H743" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="749" y="315" width="221" height="70" fill="white" stroke="#47515b" stroke-width="2"/><text x="859" y="344" font-size="23" text-anchor="middle">证据足够</text><text x="859" y="373" font-size="23" text-anchor="middle" font-weight="bold">完成并交付</text><rect x="749" y="425" width="221" height="82" fill="white" stroke="#47515b" stroke-width="2"/><text x="859" y="456" font-size="23" text-anchor="middle">条件缺失</text><text x="859" y="489" font-size="23" text-anchor="middle" font-weight="bold">等待</text><rect x="749" y="545" width="221" height="83" fill="white" stroke="#47515b" stroke-width="2"/><text x="859" y="577" font-size="22" text-anchor="middle">达到停止条件</text><text x="859" y="610" font-size="23" text-anchor="middle" font-weight="bold">停止后续动作</text><path d="M972 466H989V690H96V246H216" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="270" y="722" font-size="22">仅等待分支可在条件补齐后  重新核对并继续</text><text x="30" y="773" font-size="22">停止后不再发起新动作；已发送的请求和已有影响仍需按证据核查。</text></g></svg>