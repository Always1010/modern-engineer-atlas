<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="823" viewBox="0 0 1000 823" role="img" aria-labelledby="title desc"><title id="title">C55-A Agent 系统的职责关系</title><desc id="desc">用户目标与批准范围进入控制器。控制器向模型提供上下文，接收动作建议；读取并更新任务状态。执行前检查参数、批准、权限和预算，通过后调用工具。工具连接文件、资料库和业务服务，观察结果返回控制器并记录。组件划分不规定部署位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#303a43"/></marker></defs><rect width="1000" height="823" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="30" y="40" font-size="27" font-weight="bold">C55-A  Agent 系统的职责关系</text><text x="30" y="79" font-size="22">控制器组织执行；状态记录事实；工具连接外部环境。</text><rect x="30" y="107" width="940" height="69" fill="white" stroke="#47515b" stroke-width="2"/><text x="500" y="148" font-size="25" text-anchor="middle" font-weight="bold">用户目标与批准范围</text><path d="M500 178V234" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="305" y="239" width="390" height="133" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="500" y="278" font-size="25" text-anchor="middle" font-weight="bold">宿主控制器</text><text x="500" y="313" font-size="23" text-anchor="middle">组织输入  处理建议</text><text x="500" y="346" font-size="22" text-anchor="middle">调度  记录  决定是否继续</text><rect x="30" y="249" width="230" height="115" fill="white" stroke="#47515b" stroke-width="2"/><text x="145" y="289" font-size="25" text-anchor="middle" font-weight="bold">模型</text><text x="145" y="325" font-size="23" text-anchor="middle">提出下一步</text><path d="M303 272H266" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><path d="M262 338H298" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="222" font-size="21">上下文</text><text x="198" y="397" font-size="21">动作建议</text><rect x="740" y="249" width="230" height="115" fill="white" stroke="#47515b" stroke-width="2"/><text x="855" y="289" font-size="25" text-anchor="middle" font-weight="bold">任务状态</text><text x="855" y="325" font-size="22" text-anchor="middle">事实  进度  待办</text><path d="M739 274H701" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><path d="M697 340H733" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="780" y="222" font-size="21">读取</text><text x="780" y="397" font-size="21">更新</text><path d="M500 374V426" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="432" width="440" height="75" fill="#fff" stroke="#47515b" stroke-width="2"/><text x="500" y="463" font-size="23" text-anchor="middle" font-weight="bold">执行前检查</text><text x="500" y="492" font-size="22" text-anchor="middle">参数  用户批准  服务权限  预算</text><path d="M500 509V550" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="556" width="320" height="70" fill="#edf2f6" stroke="#47515b" stroke-width="2"/><text x="500" y="599" font-size="24" text-anchor="middle" font-weight="bold">工具及服务接口</text><path d="M500 628V670" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="676" width="600" height="72" fill="white" stroke="#47515b" stroke-width="2"/><text x="500" y="718" font-size="23" text-anchor="middle">运行环境  文件  资料库  业务服务</text><path d="M800 710H985V205H715V304H701" fill="none" stroke="#303a43" stroke-width="2" marker-end="url(#arrow)"/><text x="824" y="558" font-size="22">观察结果</text><text x="824" y="591" font-size="22">返回并记录</text><text x="30" y="794" font-size="22">这是职责划分，不是部署图；服务端仍执行自身访问控制。</text></g></svg>