<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-labelledby="title desc"><title id="title">C55-A 模型 程序 工具与状态的关系</title><desc id="desc">用户目标和范围进入宿主程序。程序给模型信息并接收建议，读取更新状态，核对权限预算后调用工具。工具连接资料与业务环境，观察反馈给程序。写入结果未知时，恢复对照本地任务记录与外部事实；用证据决定交付等待或停止。这是职责图而不是部署图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42596a"/></marker></defs><rect width="1000" height="594" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="18" y="36" font-size="26" font-weight="bold">C55-A  模型 程序 工具与状态的关系</text><rect x="300" y="66" width="400" height="57" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="500" y="104" font-size="24" text-anchor="middle" font-weight="bold">用户目标与允许范围</text><path d="M500 125V162" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="171" width="202" height="100" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="119" y="211" font-size="25" text-anchor="middle" font-weight="bold">模型</text><text x="119" y="247" font-size="22" text-anchor="middle">提出下一步</text><rect x="307" y="169" width="386" height="113" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="500" y="206" font-size="25" text-anchor="middle" font-weight="bold">宿主程序</text><text x="500" y="239" font-size="23" text-anchor="middle">组织信息  核对和执行</text><text x="500" y="270" font-size="20" text-anchor="middle">权限与预算约束整个过程</text><rect x="780" y="171" width="202" height="100" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="881" y="211" font-size="25" text-anchor="middle" font-weight="bold">任务状态</text><text x="881" y="247" font-size="22" text-anchor="middle">事实与进度</text><path d="M306 190H225" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><path d="M222 253H300" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><text x="263" y="159" font-size="19" text-anchor="middle">信息</text><text x="263" y="289" font-size="19" text-anchor="middle">建议</text><path d="M778 190H699" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><path d="M695 253H773" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><text x="737" y="159" font-size="19" text-anchor="middle">读取</text><text x="737" y="289" font-size="19" text-anchor="middle">更新</text><path d="M500 284V322" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="353" y="328" width="294" height="57" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="500" y="366" font-size="23" text-anchor="middle" font-weight="bold">工具  连接具体操作</text><path d="M500 387V426" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="432" width="510" height="62" rx="5" fill="white" stroke="#667988" stroke-width="1.6"/><text x="500" y="471" font-size="23" text-anchor="middle">外部环境  资料库 文件 业务服务</text><path d="M757 462H960V318H708V219H698" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><text x="817" y="353" font-size="21">观察结果</text><text x="817" y="386" font-size="21">反馈给下一轮</text><text x="18" y="534" font-size="22">只读带回资料；写入还会改变外部事实。结果不明时，恢复需对照两边。</text><text x="18" y="574" font-size="22">用证据判断交付、等待或停止；模型说“完成”并不等于事情已经办成。</text></g></svg>