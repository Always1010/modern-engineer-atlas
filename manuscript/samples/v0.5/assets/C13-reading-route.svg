<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="198" viewBox="0 0 1000 198" role="img" aria-labelledby="title desc"><title id="title">C13-A1  本章从用法走向判断</title><desc id="desc">定义与选择之后，从第2节基本操作与存储，进入第3节修改与借用，再到第4、5节失败与成本，最终在第6、7节用于排障和追问。箭头表示讲解依赖，不是程序执行顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42596a"/></marker></defs><rect width="1000" height="198" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="18" y="36" font-size="26" font-weight="bold">C13-A1  本章从用法走向判断</text><rect x="18" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="107" y="98" font-size="23" text-anchor="middle" font-weight="bold">定位与选择</text><text x="107" y="132" font-size="21" text-anchor="middle">保存怎样的数据</text><text x="107" y="162" font-size="21" text-anchor="middle">本节</text><path d="M198 122H210" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="214" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="303" y="98" font-size="23" text-anchor="middle" font-weight="bold">用法与存储</text><text x="303" y="132" font-size="21" text-anchor="middle">操作 元素 容量</text><text x="303" y="162" font-size="21" text-anchor="middle">第 2 节</text><path d="M394 122H406" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="499" y="98" font-size="23" text-anchor="middle" font-weight="bold">修改与借用</text><text x="499" y="132" font-size="21" text-anchor="middle">原访问还能用吗</text><text x="499" y="162" font-size="21" text-anchor="middle">第 3 节</text><path d="M590 122H602" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="606" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" strok