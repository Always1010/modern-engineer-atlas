<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="198" viewBox="0 0 1000 198" role="img" aria-labelledby="title desc"><title id="title">C55-A1  本章先走通工作 再理解恢复</title><desc id="desc">第1节界定Agent与适用范围，第2节解释部件与循环，第3节只读核查，第4节加入外部写入与恢复，第5到8节沿此讨论边界协议排障和面试追问。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42596a"/></marker></defs><rect width="1000" height="198" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="18" y="36" font-size="26" font-weight="bold">C55-A1  本章先走通工作 再理解恢复</text><rect x="18" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="107" y="98" font-size="23" text-anchor="middle" font-weight="bold">定位与选择</text><text x="107" y="132" font-size="21" text-anchor="middle">什么任务需要它</text><text x="107" y="162" font-size="21" text-anchor="middle">第 1 节</text><path d="M198 122H210" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="214" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="303" y="98" font-size="23" text-anchor="middle" font-weight="bold">部件与循环</text><text x="303" y="132" font-size="21" text-anchor="middle">各部分怎样配合</text><text x="303" y="162" font-size="21" text-anchor="middle">第 2 节</text><path d="M394 122H406" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke-width="1.6"/><text x="499" y="98" font-size="23" text-anchor="middle" font-weight="bold">正常工作</text><text x="499" y="132" font-size="21" text-anchor="middle">只读资料核查</text><text x="499" y="162" font-size="21" text-anchor="middle">第 3 节</text><path d="M590 122H602" fill="none" stroke="#42596a" stroke-width="2" marker-end="url(#arrow)"/><rect x="606" y="64" width="178" height="115" rx="5" fill="#eef3f7" stroke="#667988" stroke