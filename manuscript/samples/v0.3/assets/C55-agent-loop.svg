<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img" aria-labelledby="title desc">
<title id="title">C55-A 一个有边界的 Agent 循环</title>
<desc id="desc">用户给出目标和约束。宿主程序把目标与当前状态交给模型，模型提出下一步。宿主程序核对权限、参数和预算后调用工具，再把工具结果写入状态并交给模型。也可以停止并回答、询问或报告阻塞。工具不能由模型文字直接执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs>
<rect width="1000" height="655" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#111">
<text x="30" y="42" font-size="25" font-weight="bold">C55-A  一个有边界的 Agent 循环</text>
<text x="30" y="80" font-size="22">程序控制执行；模型提出下一步，工具提供能力与结果。</text>
<rect x="30" y="160" width="940" height="411" rx="6" fill="#fafafa" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/>
<text x="51" y="194" font-size="22">宿主程序负责运行与记录</text>
<rect x="315" y="105" width="370" height="50" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="500" y="138" font-size="23" text-anchor="middle">用户目标与约束</text>
<path d="M500 156V212" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<g stroke="#222" stroke-width="2" fill="#e9eef2"><rect x="310" y="215" width="380" height="66"/><rect x="310" y="325" width="380" height="66"/><rect x="310" y="435" width="380" height="80"/></g>
<g font-size="22" text-anchor="middle"><text x="500" y="244">目标与当前状态</text><text x="500" y="270">包括已读材料和已获结果</text><text x="500" y="354">模型提出下一步</text><text x="500" y="380">工具请求或停止建议</text><text x="500" y="466">程序核对权限 参数与预算</text><text x="500" y="499">通过后才实际调用工具</text></g>
<path d="M500 283V318M500 393V428" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M308 475H125V250H302" stroke="#222" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<g font-size="22"><text x="144" y="366">工具结果</text><text x="144" y="395">写入状态</text></g>
<path d="M692 357H739" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="745" y="312" width="193" height="115" fill="white" stroke="#222" stroke-width="2"/>
<g font-size="22" text-anchor="middle"><text x="841" y="343">程序结束或暂停</text><text x="841" y="376">回答 询问</text><text x="841" y="409">报告阻塞</text></g>
<text x="52" y="546" font-size="21">校验不通过时不执行，可修正、询问或停止。</text>
<text x="30" y="614" font-size="22">图示只说明执行结构，不保证建议正确；循环必须有结束条件。</text>
</g></svg>
