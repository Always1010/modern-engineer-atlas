<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">C13-A 元素 容量与失效借用</title>
<desc id="desc">容量为六的存储区前部有三个元素，旧指针指向首元素。成功重新分配后，元素值在容量为十的新存储区内，旧借用失效。容量数字仅作示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#222"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#aaa" stroke-width="1"/></pattern></defs>
<rect width="1000" height="560" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#111">
<text x="32" y="42" font-size="25" font-weight="bold">C13-A  已有元素与预留容量</text>
<text x="32" y="80" font-size="22">概念模型：不规定对象内部布局，也不规定容量增长倍数。</text>
<text x="32" y="140" font-size="22">修改前</text><text x="32" y="169" font-size="22">size = 3</text><text x="32" y="196" font-size="22">capacity = 6</text>
<g stroke="#222" stroke-width="2"><rect x="235" y="125" width="210" height="74" fill="#ddd"/><path d="M305 125V199M375 125V199"/><rect x="445" y="125" width="210" height="74" fill="url(#hatch)" stroke-dasharray="7 4"/></g>
<g font-size="22" text-anchor="middle"><text x="270" y="170">10</text><text x="340" y="170">20</text><text x="410" y="170">30</text></g>
<text x="270" y="227" font-size="22">已有元素</text><text x="475" y="227" font-size="22">预留空间</text>
<text x="475" y="252" font-size="22">这里没有可下标访问的元素</text>
<path d="M180 292H215V165H231" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="299" font-size="22">旧指针 p</text>
<text x="415" y="295" font-size="22">成功重新分配</text><path d="M670 285V341" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="393" font-size="22">修改后</text><text x="32" y="423" font-size="22">size = 3</text><text x="32" y="451" font-size="22">capacity = 10</text>
<g stroke="#222" stroke-width="2"><rect x="235" y="365" width="210" height="74" fill="#ddd"/><path d="M305 365V439M375 365V439"/><rect x="445" y="365" width="490" height="74" fill="url(#hatch)" stroke-dasharray="7 4"/></g>
<g font-size="22" text-anchor="middle"><text x="270" y="410">10</text><text x="340" y="410">20</text><text x="410" y="410">30</text></g>
<text x="235" y="474" font-size="22">新存储区：应从当前容器重新取得位置。</text>
<text x="32" y="524" font-size="22" font-weight="bold">旧指针不会跟着值一起更新，不要再用它访问元素。</text>
</g></svg>
