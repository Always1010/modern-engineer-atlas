<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166B70"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="25" y="36" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#203B4A" text-anchor="start">单生产者 单消费者 空一槽队列</text>
<rect x="45" y="133" width="96" height="76" rx="8" fill="#F3F5F6" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="93.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">0</text>
<rect x="155" y="133" width="96" height="76" rx="8" fill="#F3F5F6" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="203.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">1</text>
<rect x="265" y="133" width="96" height="76" rx="8" fill="#CCE8E3" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="313.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">2</text>
<rect x="375" y="133" width="96" height="76" rx="8" fill="#CCE8E3" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="423.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">3</text>
<rect x="485" y="133" width="96" height="76" rx="8" fill="#CCE8E3" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="533.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">4</text>
<rect x="595" y="133" width="96" height="76" rx="8" fill="#CCE8E3" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="643.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">5</text>
<rect x="705" y="133" width="96" height="76" rx="8" fill="#F3F5F6" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="753.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">6</text>
<rect x="815" y="133" width="96" height="76" rx="8" fill="#F3F5F6" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="863.0" y="178.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="normal" fill="#203B4A" text-anchor="middle">7</text>
<text x="313" y="106" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">read = 2</text>
<line x1="313" y1="111" x2="313" y2="132" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<text x="753" y="83" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">write = 6</text>
<line x1="753" y1="89" x2="753" y2="132" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<text x="476" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">槽 2 至 5 已发布待消费；槽 6 是下次写入位置</text>
<rect x="25" y="294" width="435" height="152" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="242.5" y="349.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">生产者</text>
<text x="242.5" y="378.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">acquire 核对 read 有空位</text>
<text x="242.5" y="407.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">先写内容 再 release 发布 write</text>
<rect x="500" y="294" width="435" height="152" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="717.5" y="349.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">消费者</text>
<text x="717.5" y="378.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">acquire 读取 write 后取数据</text>
<text x="717.5" y="407.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">release 发布新的 read</text>
<text x="27" y="491" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="start">empty：write == read</text>
<text x="27" y="520" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="start">full：next(write) == read</text>
<text x="27" y="549" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="start">8 个槽的可用容量为 7；这是空一槽方案的约定</text>
<text x="27" y="599" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#B46627" text-anchor="start">只有一个生产者和一个消费者；此图没有把 DMA 当成普通 C++ 线程</text>
</svg>