<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166B70"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="25" y="36" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#203B4A" text-anchor="start">最后一次使用结束以后 才能复用存储</text>
<rect x="22" y="95" width="200" height="106" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="122.0" y="141.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">生产者</text>
<text x="122.0" y="170.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">构造批次</text>
<line x1="222" y1="148" x2="260" y2="148" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="260" y="95" width="200" height="106" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="360.0" y="141.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">拥有批次的消息</text>
<text x="360.0" y="170.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">明确交接责任</text>
<line x1="460" y1="148" x2="498" y2="148" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="498" y="95" width="200" height="106" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="598.0" y="141.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">消费者</text>
<text x="598.0" y="170.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">读取并完成</text>
<line x1="698" y1="148" x2="736" y2="148" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="736" y="95" width="200" height="106" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="836.0" y="141.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">释放或归还</text>
<text x="836.0" y="170.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">空间可复用</text>
<rect x="312" y="282" width="340" height="90" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="482.0" y="320.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">界面只取短快照</text>
<text x="482.0" y="349.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">显示不占用原批次到永久</text>
<path d="M 358 201 L 358 247 L 482 247 L 482 282" stroke="#166B70" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="28" y="439" width="326" height="65" rx="8" fill="#FFF4E9" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="191.0" y="478.5" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">错误：仅复制 span</text>
<rect x="591" y="439" width="342" height="65" rx="8" fill="#FFF4E9" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="762.0" y="478.5" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">生产者已覆盖原存储</text>
<line x1="354" y1="472" x2="591" y2="472" stroke="#B46627" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="7 5"/>
<line x1="449" y1="450" x2="491" y2="493" stroke="#B46627" stroke-width="4"/>
<line x1="449" y1="493" x2="491" y2="450" stroke="#B46627" stroke-width="4"/>
<text x="25" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#596770" text-anchor="start">减少复制不能取消所有权约定；span 只描述范围，不延长目标生命期</text>
</svg>