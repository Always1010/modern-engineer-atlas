<text x="479.5" y="152.5" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">candidate</text>
<text x="479.5" y="181.5" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">新版本 新限值</text>
<text x="479.5" y="210.5" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">尚未对外生效</text>
<rect x="676" y="112" width="254" height="123" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="803.0" y="180.5" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">验证所有条件</text>
