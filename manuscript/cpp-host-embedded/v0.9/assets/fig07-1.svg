<path d="M 480 411 L 480 480" stroke="#166B70" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="25" y="597" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#B46627" text-anchor="start">此图仅为内存配置的强保证设计；不包含设备写入或远端业务提交</text>
