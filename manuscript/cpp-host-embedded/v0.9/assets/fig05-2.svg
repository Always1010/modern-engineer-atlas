<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166B70"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="25" y="37" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#203B4A" text-anchor="start">交叉构建同时面对宿主和目标</text>
<rect x="27" y="88" width="428" height="262" rx="8" fill="#F5F8FA" stroke="#B6CCD4" stroke-width="1.5"/>
<rect x="505" y="88" width="428" height="262" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="51" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#203B4A" text-anchor="start">构建主机</text>
<text x="529" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#203B4A" text-anchor="start">目标材料</text>
<text x="57" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#203B4A" text-anchor="start">原始源文件</text>
<text x="57" y="233" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#203B4A" text-anchor="start">在主机运行的生成器</text>
<text x="57" y="285" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#203B4A" text-anchor="start">在主机运行的交叉编译器</text>
<text x="535" y="181" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#203B4A" text-anchor="start">目标库与 sysroot</text>
<text x="535" y="233" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#203B4A" text-anchor="start">或 MCU SDK 与启动文件</text>
<text x="535" y="285" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#203B4A" text-anchor="start">链接脚本与目标 ABI</text>
<rect x="327" y="420" width="317" height="85" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="485.5" y="469.5" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="normal" fill="#203B4A" text-anchor="middle">目标平台制品</text>
<path d="M 241 350 L 241 463 L 327 463" stroke="#166B70" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M 719 350 L 719 463 L 644 463" stroke="#166B70" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="326" y="549" width="318" height="64" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="485.0" y="588.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#203B4A" text-anchor="middle">在目标机装载或启动</text>
<line x1="485" y1="505" x2="485" y2="549" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<text x="27" y="642" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#B46627" text-anchor="start">主机工具不是目标程序；sysroot 是构建材料，不是一块硬件</text>
</svg>