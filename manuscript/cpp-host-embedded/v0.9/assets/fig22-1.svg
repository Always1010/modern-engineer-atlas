<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166B70"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="25" y="37" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#203B4A" text-anchor="start">read 取数据 poll 提示就绪</text>
<rect x="21" y="110" width="201" height="96" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="121.5" y="151.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">用户进程</text>
<text x="121.5" y="180.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">文件描述符 fd</text>
<line x1="222" y1="158" x2="260" y2="158" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="260" y="110" width="201" height="96" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="360.5" y="165.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">打开文件状态</text>
<line x1="461" y1="158" x2="499" y2="158" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="499" y="110" width="201" height="96" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="599.5" y="151.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">驱动缓冲</text>
<text x="599.5" y="180.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">等待队列</text>
<line x1="700" y1="158" x2="738" y2="158" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="738" y="110" width="201" height="96" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="838.5" y="151.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">设备</text>
<text x="838.5" y="180.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#203B4A" text-anchor="middle">IRQ / DMA</text>
<text x="285" y="91" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#203B4A" text-anchor="start">read 请求</text>
<path d="M 600 206 L 600 275 L 120 275 L 120 206" stroke="#166B70" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="7 5"/>
<text x="351" y="309" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">poll 就绪提示不等于已读出完整消息</text>
<text x="25" y="375" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" fill="#203B4A" text-anchor="start">热拔除与结束责任</text>
<rect x="22" y="404" width="201" height="90" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="122.5" y="456.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">拒绝新请求</text>
<line x1="223" y1="449" x2="261" y2="449" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="261" y="404" width="201" height="90" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="361.5" y="442.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">取消或排空</text>
<text x="361.5" y="471.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">在途活动</text>
<line x1="462" y1="449" x2="500" y2="449" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500" y="404" width="201" height="90" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="600.5" y="456.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">确认不再访问</text>
<line x1="701" y1="449" x2="739" y2="449" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="739" y="404" width="201" height="90" rx="8" fill="#EFF7F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="839.5" y="456.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">释放资源</text>
<text x="26" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#B46627" text-anchor="start">fd 仍存在不表示设备仍有效；close 不自动证明所有硬件活动已完成</text>
<text x="26" y="577" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#B46627" text-anchor="start">就绪与读取间状态仍可能变化，应用须处理返回值</text>
</svg>