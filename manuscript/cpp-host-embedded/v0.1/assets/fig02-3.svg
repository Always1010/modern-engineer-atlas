<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="400" viewBox="0 0 960 400"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166B70"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="25" y="35" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" fill="#203B4A" text-anchor="start">关闭的边界是 最后一次使用已经结束</text>
<rect x="20" y="85" width="173" height="60" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="106.5" y="122.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#203B4A" text-anchor="middle">拒绝新工作</text>
<rect x="202" y="85" width="173" height="60" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="288.5" y="122.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#203B4A" text-anchor="middle">请求停止</text>
<rect x="384" y="85" width="173" height="60" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="470.5" y="122.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#203B4A" text-anchor="middle">等待完成</text>
<rect x="566" y="85" width="173" height="60" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="652.5" y="122.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#203B4A" text-anchor="middle">释放句柄</text>
<rect x="748" y="85" width="173" height="60" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="834.5" y="122.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#203B4A" text-anchor="middle">结束运行环境</text>
<line x1="193" y1="115" x2="202" y2="115" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<line x1="375" y1="115" x2="384" y2="115" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<line x1="557" y1="115" x2="566" y2="115" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<line x1="739" y1="115" x2="748" y2="115" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<rect x="130" y="229" width="414" height="70" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="337.0" y="271.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#203B4A" text-anchor="middle">既有操作仍可能访问句柄或缓冲区</text>
<line x1="544" y1="263" x2="574" y2="263" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<text x="588" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#166B70" text-anchor="start">确认不再访问</text>
<path d="M 630 245 L 630 146" stroke="#166B70" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M 287 146 L 287 185 L 653 185" stroke="#B46627" stroke-width="2" fill="none"/>
<text x="286" y="213" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#B46627" text-anchor="start">请求一返回就释放：太早</text>
<text x="25" y="365" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#203B4A" text-anchor="start">请求停止与确认结束是不同事件。真实接口可以合并步骤，但必须明确承诺其语义</text>
</svg>