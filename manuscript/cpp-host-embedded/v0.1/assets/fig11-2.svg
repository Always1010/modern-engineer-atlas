<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166B70"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="100" y="35" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#203B4A" text-anchor="start">GUI / 控制器</text>
<text x="535" y="35" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#203B4A" text-anchor="start">Worker / 工作线程</text>
<line x1="185" y1="55" x2="185" y2="482" stroke="#AAB9C1" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="674" y1="55" x2="674" y2="482" stroke="#AAB9C1" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="30" y="68" width="315" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="187.5" y="102.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">拒绝新工作；保留窗口和控制器</text>
<rect x="493" y="68" width="407" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="696.5" y="102.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">排队 stop 请求</text>
<rect x="30" y="143" width="315" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="187.5" y="177.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">继续处理界面事件</text>
<rect x="493" y="143" width="407" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="696.5" y="177.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">停计时器、关闭串口、发 stopped</text>
<rect x="30" y="229" width="315" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="187.5" y="263.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">等待收尾通知</text>
<rect x="493" y="229" width="407" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="696.5" y="263.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">quit 后事件循环退出</text>
<rect x="30" y="306" width="315" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="187.5" y="340.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">接收 finished 通知</text>
<rect x="493" y="306" width="407" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="696.5" y="340.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">finished 触发 deleteLater</text>
<rect x="30" y="387" width="315" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="187.5" y="421.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">wait(0) 成功后销毁 QThread</text>
<rect x="493" y="387" width="407" height="54" rx="8" fill="#E9F1F5" stroke="#B6CCD4" stroke-width="1.5"/>
<text x="696.5" y="421.0" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#203B4A" text-anchor="middle">完成本例工作对象清理</text>
<line x1="345" y1="91" x2="492" y2="91" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<line x1="493" y1="329" x2="346" y2="329" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<line x1="493" y1="410" x2="346" y2="410" stroke="#166B70" stroke-width="2" marker-end="url(#arr)"/>
<text x="365" y="317" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#203B4A" text-anchor="start">通知</text>
<text x="360" y="396" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#203B4A" text-anchor="start">等待确认</text>
<text x="40" y="494" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#B46627" text-anchor="start">停止业务资源先于退出事件循环；finished 不是所有清理均已结束的证明</text>
<text x="40" y="523" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#B46627" text-anchor="start">wait(0) 未成功就保持关闭待定，稍后再检查，不忙等</text>
</svg>